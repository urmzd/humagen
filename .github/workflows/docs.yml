name: Documentation

# Builds the guide on pull requests that touch it, and on a push to main
# uploads it to S3 behind CloudFront at docs.withhumagen.com. The bucket,
# distribution and DOCS_AWS_* secrets come from urmzd/infra; the deploy is
# skipped until DOCS_AWS_ROLE_ARN exists.

on:
  pull_request:
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install zensical==0.1.2
      - run: zensical build --strict --clean
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site
          retention-days: 7
      # Secrets cannot be read in a job's `if`, so this step decides.
      - name: Deploy on this run?
        id: gate
        env:
          HAS_ROLE: ${{ secrets.DOCS_AWS_ROLE_ARN != '' }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/main ] && [ "$HAS_ROLE" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Not deploying: event ${{ github.event_name }}, ref ${{ github.ref }}, DOCS_AWS_ROLE_ARN set: $HAS_ROLE"
          fi

  deploy:
    name: Deploy documentation
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://docs.withhumagen.com
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    env:
      BUCKET: docs.withhumagen.com
      DOMAIN: docs.withhumagen.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DOCS_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DOCS_AWS_REGION }}
      # Zensical's hashed bundles (*.min.js, *.min.css) are immutable and go
      # first, so pages never reference a missing bundle. Everything else
      # (pages, the theme in brand/, images, search.json) keeps its name across
      # builds and must revalidate; that pass deletes what the build dropped.
      - name: Upload to S3
        working-directory: site
        run: |
          aws s3 sync . "s3://$BUCKET" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.min.js" --include "*.min.css"
          aws s3 sync . "s3://$BUCKET" --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*.min.js" --exclude "*.min.css"
      - name: Invalidate CloudFront
        run: |
          # JSON, not text: a JMESPath query runs per page, and text output
          # would join one "None" per page that has no match.
          id=$(aws cloudfront list-distributions --output json |
            jq -r --arg d "$DOMAIN" '[.DistributionList.Items[]? | select((.Aliases.Items // []) | index($d)) | .Id][0] // empty')
          if [ -z "$id" ]; then
            echo "::error::No CloudFront distribution has the alias $DOMAIN"
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$id" --paths "/*"
          echo "Deployed https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
