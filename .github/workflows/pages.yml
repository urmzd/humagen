name: Design boards

# Publishes docs/design/humagen-control-plane/boards to GitHub Pages so the
# design boards can be clicked through from a link. Needs Settings, Pages,
# Source set to GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - docs/design/humagen-control-plane/boards/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/design/humagen-control-plane/boards

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
