name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race

  js:
    name: UI, console and Slack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm --filter @warp/console build
      - run: pnpm --filter @warp/storybook build
      - name: Slack app against a real server
        run: |
          set -o pipefail
          pnpm test:server 2>&1 | tee server-test.log
          grep -q '^ℹ pass 4$' server-test.log
          ! grep -q '# SKIP' server-test.log

  screens:
    name: Console screens
    # On pull requests that change the console, the shared UI or this check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the pull request change the console?
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(apps/web|packages|scripts/screens)/'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.ui == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changed.outputs.ui == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner's own Chrome takes the screenshots: nothing is downloaded.
      - name: Capture every screen and check its layout
        if: steps.changed.outputs.ui == 'true'
        run: make screens
      - name: Upload the screenshots for review
        if: always() && steps.changed.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: console-screens
          path: .screens/
          if-no-files-found: ignore

  slack-blocks:
    name: Slack Block Kit (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:slack

  contract:
    name: API contract and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint the spec
        run: make spec-lint
      - name: Install oag (pinned, sha256 checked)
        run: |
          make oag-install OAG_DIR="$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Regenerate the client
        run: make client
      - name: Fail if the committed client is stale
        run: |
          if [ -n "$(git status --porcelain -- packages/client)" ]; then
            echo "packages/client differs from a fresh generation. Run 'make client' and commit the result."
            git status --porcelain -- packages/client
            git diff -- packages/client
            exit 1
          fi
      - name: Typecheck and test the client
        run: make client-check
