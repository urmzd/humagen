name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7

  test:
    name: Test
    runs-on: ubuntu-latest
    # The Postgres backends are held to the same suites as the in-memory
    # ones (pkg/state/statetest, fiber/pkg/*/postgres_test.go). The
    # image is the one `make integration` uses: the knowledge store needs
    # pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: humagen
          POSTGRES_PASSWORD: humagen
          POSTGRES_DB: humagen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humagen -d humagen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HUMAGEN_POSTGRES_TEST_URL: postgres://humagen:humagen@localhost:5432/humagen?sslmode=disable
      FIBER_POSTGRES_TEST_URL: postgres://humagen:humagen@localhost:5432/humagen?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test, with Postgres
        run: |
          set -o pipefail
          go test ./... -race -v 2>&1 | tee test.log | grep -vE '^(=== (RUN|PAUSE|CONT|NAME)|\s*--- PASS|PASS$)'
      # Each backend suite skips when its variable is unset, so a renamed
      # variable would turn them into silent passes. Fail on any such skip.
      # Suites that also need Redis are left out: no Redis runs here.
      - name: Fail if a Postgres suite skipped
        run: |
          if grep -nE 'set (HUMAGEN_POSTGRES_TEST_URL|FIBER_POSTGRES_TEST_URL)' test.log | grep -v FIBER_REDIS_ADDR; then
            echo "A Postgres suite skipped. Check the variable names above."
            exit 1
          fi

  image:
    name: Container image
    # On pull requests that change what the image is built from, and on every
    # push to main. Release calls this workflow too; it is checked once, by CI
    # itself. Nothing is pushed.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.workflow == 'CI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the change touch the image?
        id: changed
        # Everything but docs/ and Markdown counts; CHANGELOG.md is embedded.
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -vP '^docs/|^(?!CHANGELOG\.md$).*\.md$' | grep -q .; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.image == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build the image
        if: steps.changed.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: python3 -m pip install PyYAML==6.0.3
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - run: make chart-check

  js:
    name: UI, console and Slack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm --filter @humagen/console build
      - name: Slack app against a real server
        run: |
          set -o pipefail
          pnpm test:server 2>&1 | tee server-test.log
          grep -q '^ℹ pass 4$' server-test.log
          ! grep -q '# SKIP' server-test.log

  screens:
    name: Console screens
    # On pull requests that change the console, the shared UI or this check,
    # and on every push to main, so a break that lands is seen when it lands.
    # Release calls this workflow too; it is checked once, by CI itself.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.workflow == 'CI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the change touch the console?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(apps/web/|packages/|scripts/screens/|Makefile$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.ui == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changed.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changed.outputs.ui == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The runner's own Chrome takes the screenshots: nothing is downloaded.
      - name: Capture every screen and check its layout
        if: steps.changed.outputs.ui == 'true'
        run: make screens
      - name: Upload the screenshots for review
        if: always() && steps.changed.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: console-screens
          path: .screens/
          include-hidden-files: true
          if-no-files-found: ignore

  slack-blocks:
    name: Slack Block Kit (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:slack

  contract:
    name: API contract and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lint the spec
        run: make spec-lint
      - name: Install oag (pinned, sha256 checked)
        run: |
          make oag-install OAG_DIR="$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Regenerate the client
        run: make client
      - name: Fail if the committed client is stale
        run: |
          if [ -n "$(git status --porcelain -- packages/client)" ]; then
            echo "packages/client differs from a fresh generation. Run 'make client' and commit the result."
            git status --porcelain -- packages/client
            git diff -- packages/client
            exit 1
          fi
      - name: Typecheck and test the client
        run: make client-check
