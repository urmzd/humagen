# Run Storybook on loopback port 6006, then: teasr run -c teasr.storybook.toml
[output]
dir = "./.screens/storybook"
formats = [{ output_type = "png" }]

[[scenes]]
type = "web"
name = "workspace-dark"
uri = "http://127.0.0.1:6006/iframe.html?id=workspace-project-work--overview&viewMode=story&globals=theme:dark"
viewport = { width = 1440, height = 900 }
[[scenes.interactions]]
type = "wait"
duration = 2000
[[scenes.interactions]]
type = "snapshot"

[[scenes]]
type = "web"
name = "workspace-light"
uri = "http://127.0.0.1:6006/iframe.html?id=workspace-project-work--light&viewMode=story&globals=theme:light"
viewport = { width = 1440, height = 900 }
[[scenes.interactions]]
type = "wait"
duration = 1500
[[scenes.interactions]]
type = "snapshot"

[[scenes]]
type = "web"
name = "workspace-phone"
uri = "http://127.0.0.1:6006/iframe.html?id=workspace-project-work--phone&viewMode=story&globals=theme:light"
viewport = { width = 390, height = 844 }
[[scenes.interactions]]
type = "wait"
duration = 1500
[[scenes.interactions]]
type = "snapshot"

[[scenes]]
type = "web"
name = "workspace-failed"
uri = "http://127.0.0.1:6006/iframe.html?id=workspace-project-work--read-failed&viewMode=story&globals=theme:dark"
viewport = { width = 1280, height = 800 }
[[scenes.interactions]]
type = "wait"
duration = 1500
[[scenes.interactions]]
type = "snapshot"
