# The entry point: commit this file to the path your cluster's Flux already
# reconciles (for example clusters/prod/ in your fleet repository). It adds
# this repository as a source and applies deploy/flux/app from it.
#
# To change the values, copy deploy/flux/app into your fleet repository, edit
# values.yaml there, and point the second Kustomization at that copy.
#
# The objects keep the name warp they had before the product was renamed: the
# HelmRelease names this GitRepository, and the Kustomization prunes what it
# no longer applies. Only the url changed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: warp
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/urmzd/humagen
  # Pin a release tag in production rather than following main.
  ref:
    branch: main
  # Only what Flux needs: the chart and these manifests.
  ignore: |
    /*
    !/deploy/helm/
    !/deploy/flux/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: warp
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: warp
  path: ./deploy/flux/app
  prune: true
  wait: true
  timeout: 5m
  # The Secret named by existingSecret (warp-env) is yours to create. With
  # SOPS, commit it encrypted next to values.yaml and turn on decryption:
  # decryption:
  #   provider: sops
  #   secretRef:
  #     name: sops-age
