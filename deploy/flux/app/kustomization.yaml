# warp in its own namespace, its chart from the GitRepository in
# ../clusters/example/warp.yaml and its values from values.yaml here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: warp
resources:
  - namespace.yaml
  - helmrelease.yaml
configMapGenerator:
  # The hash suffix changes with the values, so an edit upgrades the release.
  - name: warp-values
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
