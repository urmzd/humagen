# Humagen in its own namespace, its chart from the GitRepository in
# ../clusters/example/humagen.yaml and its values from values.yaml here. The
# namespace keeps the name warp it had before the product was renamed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: warp
resources:
  - namespace.yaml
  - helmrelease.yaml
configMapGenerator:
  # The hash suffix changes with the values, so an edit upgrades the release.
  - name: humagen-values
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
