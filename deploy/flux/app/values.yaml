# Overrides for deploy/helm/humagen/values.yaml. Helm merges maps key by key
# and replaces lists, so only what differs from the chart's defaults belongs
# here. No secrets: the references below read the warp-env Secret's keys.

# The release was installed by the warp chart, before the product was renamed:
# keep its Deployment, Service, ConfigMap and volume names. A cluster that
# starts fresh from this example keeps them too, matching the namespace.
nameOverride: warp

image:
  # An image you built from the Dockerfile and pushed, from the same commit
  # as the chart: the chart writes a spec only images from that commit on read.
  repository: ghcr.io/your-org/humagen
  tag: "YOUR_TAG"

# The System document (docs/spec.md#system).
system:
  metadata:
    display_name: Acme
  spec:
    server:
      public_url: https://humagen.example.com
    auth:
      oidc:
        issuer: https://login.example.com
        client_id: humagen
        audience: humagen
      groups: {claim: groups, roles: {admin: [platform-admins], viewer: [staff]}}
    blobs:
      kind: s3
      s3:
        bucket: humagen-files
        region: us-east-1
        access_key: {ref: env:HUMAGEN_S3_ACCESS_KEY_ID}
        secret_key: {ref: env:HUMAGEN_S3_SECRET_ACCESS_KEY}

# One Platform document per workspace (docs/spec.md#platform).
platforms:
  - metadata:
      name: default
      display_name: Acme
    spec:
      models:
        - name: anthropic
          kind: anthropic
          anthropic: {key: {ref: env:ANTHROPIC_API_KEY}}
      agents:
        - spec:
            name: lead
            provider: anthropic
            model: YOUR_MODEL
            system_prompt: You coordinate work.

# Holds HUMAGEN_OIDC_CLIENT_SECRET, HUMAGEN_POSTGRES_URL, ANTHROPIC_API_KEY,
# HUMAGEN_S3_ACCESS_KEY_ID and HUMAGEN_S3_SECRET_ACCESS_KEY: every name a
# reference above, or in the chart's defaults, reads. Keys under the old WARP_
# names still work. The Secret keeps its name.
existingSecret: warp-env

persistence:
  size: 20Gi


ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: humagen.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: warp-tls
      hosts:
        - humagen.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
