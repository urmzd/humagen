# Overrides for deploy/helm/warp/values.yaml. Only what differs from the
# chart's defaults belongs here. No secrets: they are in the warp-env Secret.

image:
  # An image you built from the Dockerfile and pushed.
  repository: ghcr.io/your-org/warp
  tag: "0.9.0"

auth:
  mode: oidc
  publicURL: https://warp.example.com
  oidc:
    issuer: https://login.example.com
    clientID: warp
    audience: warp

# Holds WARP_OIDC_CLIENT_SECRET, WARP_POSTGRES_URL and a model key, and
# WARP_S3_ACCESS_KEY_ID / WARP_S3_SECRET_ACCESS_KEY for the bucket below.
existingSecret: warp-env

storage:
  kind: s3
  s3:
    bucket: warp-files
    region: us-east-1

persistence:
  size: 20Gi

config:
  # Inline files, mounted at /etc/warp and passed with their flags.
  providers: ""
  settings: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: warp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: warp-tls
      hosts:
        - warp.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
