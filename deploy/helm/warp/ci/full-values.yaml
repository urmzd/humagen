# Values for `helm lint`, `helm template` and `deploy/helm/check.sh`: every
# optional part on.
system:
  metadata:
    name: acme-warp
    display_name: Acme
  spec:
    server:
      public_url: https://warp.example.com
    auth:
      kind: oidc
      oidc:
        issuer: https://idp.example.com
        client_id: warp
        client_secret: {ref: env:WARP_OIDC_CLIENT_SECRET}
        audience: warp-api
      tenant: {fixed: default}
      groups: {claim: groups, roles: {admin: [platform-admins], viewer: [staff]}}
      policy_file: /etc/warp/policy.authz
    stores:
      kind: postgres
      postgres: {url: {ref: env:WARP_POSTGRES_URL}}
    bus:
      kind: redis
      redis: {url: {ref: env:WARP_REDIS_URL}}
    blobs:
      kind: s3
      s3:
        bucket: warp
        endpoint: http://minio.storage:9000
        path_style: true
        access_key: {ref: env:WARP_S3_ACCESS_KEY_ID}
        secret_key: {ref: env:WARP_S3_SECRET_ACCESS_KEY}
    execution:
      concurrency: 4
      max_depth: 4
      max_fan_out: 16
    secret_env:
      default: [WARP_SLACK_TOKEN]
platforms:
  - metadata:
      name: default
      display_name: Acme
    spec:
      workspace:
        agents: {enable: ["*"], default: lead}
      models:
        - name: anthropic
          kind: anthropic
          anthropic: {key: {ref: env:ANTHROPIC_API_KEY}}
      agents:
        - spec:
            name: lead
            provider: anthropic
            model: YOUR_MODEL
            system_prompt: You coordinate work.
        - file: /etc/warp/reviewer.json
files:
  policy.authz: |
    # policy
  reviewer.json: |
    {"name": "reviewer", "provider": "anthropic", "model": "YOUR_MODEL", "system_prompt": "Review."}
existingSecret: warp-env
webhooks:
  enabled: true
ingress:
  enabled: true
  className: nginx
  tls:
    - secretName: warp-tls
      hosts: [warp.example.com]
extraArgs: ["-seed=false"]
