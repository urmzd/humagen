{{- if ((.Values.tailscale | default dict).proxy | default dict).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "humagen.fullname" . }}-tailscale-proxy
  labels:
    {{- include "humagen.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.tailscale.proxy.files }}
  {{ $name }}: |
    {{- $body | trimSuffix "\n" | nindent 4 }}
  {{- end }}
{{- end }}
