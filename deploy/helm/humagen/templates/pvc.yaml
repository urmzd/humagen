{{- /* Only disk blobs need the volume to outlive the pod: with a bucket the
workspace is scratch, an emptyDir, and nothing pins the pod to one node. */}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (eq (include "humagen.blobsKind" .) "disk") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "humagen.fullname" . }}
  labels:
    {{- include "humagen.labels" . | nindent 4 }}
  annotations:
    # Keep the workspace when the release is uninstalled.
    helm.sh/resource-policy: keep
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
