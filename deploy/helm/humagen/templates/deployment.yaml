{{- include "humagen.keepOldNames" . -}}
{{- $fullname := include "humagen.fullname" . -}}
{{- $dev := ((.Values.development | default dict).loopback) | default false -}}
{{- $loopback := eq (include "humagen.loopback" .) "true" -}}
{{- $tailscale := ((.Values.tailscale | default dict).proxy | default dict).enabled | default false -}}
{{- if and $dev .Values.ingress.enabled }}
{{- fail "development.loopback listens on the pod's loopback only, for kubectl port-forward; it cannot sit behind an Ingress" }}
{{- end }}
{{- if and $tailscale .Values.ingress.enabled }}
{{- fail "tailscale sign-in is reached only through the Tailscale proxy container in the pod; an Ingress would bypass it" }}
{{- end }}
{{- $hpa := .Values.autoscaling | default dict -}}
{{- $many := or (gt (int .Values.replicaCount) 1) (and $hpa.enabled (gt (int $hpa.maxReplicas) 1)) -}}
{{- if $many }}
{{- if ne (include "humagen.storesKind" .) "postgres" }}
{{- fail "more than one server replica needs system.spec.stores.kind=postgres: replicas share the stores, the run queue and the bus through Postgres" }}
{{- end }}
{{- if eq (dig "spec" "bus" "kind" "" (.Values.system | default dict) | default "") "memory" }}
{{- fail "more than one server replica needs a bus the replicas share, and system.spec.bus.kind=memory keeps each pod's events to itself: set system.spec.bus.kind=postgres or leave it out, or run one replica (replicaCount and autoscaling.maxReplicas of 1)" }}
{{- end }}
{{- if has (include "humagen.blobsKind" .) (list "disk" "memory") }}
{{- fail "more than one server replica needs shared blobs (system.spec.blobs.kind s3 or gcs): each pod's disk is its own" }}
{{- end }}
{{- end }}
{{- $drainArgs := include "humagen.drainArgs" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "humagen.labels" . | nindent 4 }}
spec:
  {{- if not $hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # The stores read and write the database per request and take no lock, so
  # pods are replaced one at a time. By default none is added before one is
  # taken away: with disk blobs the workspace volume is ReadWriteOnce. With
  # object-store blobs, rollout.maxSurge 1 and maxUnavailable 0 keep the old
  # pod serving until the new one is ready.
  {{- $r := .Values.rollout | default dict }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $r.maxSurge | default 0 }}
      maxUnavailable: {{ if hasKey $r "maxUnavailable" }}{{ $r.maxUnavailable }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "humagen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "humagen.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "humagen.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Covers the preStop sleep, the drain and the HTTP shutdown; the chart
      # refuses a value that does not.
      terminationGracePeriodSeconds: {{ int .Values.terminationGracePeriodSeconds }}
      containers:
        # The old name for a release the warp chart installed, so patches
        # and `kubectl logs -c` keep working (humagen.containerName).
        - name: {{ include "humagen.containerName" . }}
          image: {{ include "humagen.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The spec is the file; the chart forces only the listener and the
          # console's directory, which are the image's, as flags that win.
          args:
            - serve
            - -f=/etc/warp/humagen.yaml
            {{- if $loopback }}
            # Only kubectl port-forward (development) or the Tailscale proxy
            # container (tailscale) reaches the pod's loopback.
            - -addr=127.0.0.1:8080
            {{- else }}
            - -addr=0.0.0.0:8080
            {{- end }}
            - -web=/usr/share/warp/web
            # On SIGTERM: stop taking work, let turns in flight finish, then
            # release their leases and shut the listener down.
            {{- $drainArgs | nindent 12 }}
            {{- if .Values.webhooks.enabled }}
            - -webhook-addr=0.0.0.0:{{ .Values.webhooks.port }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # The workspace lives under the user cache directory, on the volume.
            - name: HOME
              value: /var/lib/warp
            - name: XDG_CACHE_HOME
              value: /var/lib/warp/cache
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.existingSecret }}
          # The references in the spec ({ref: env:NAME}) read these.
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- if or (not $tailscale) .Values.webhooks.enabled }}
          ports:
            {{- if not $tailscale }}
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- end }}
            {{- if .Values.webhooks.enabled }}
            - name: webhooks
              containerPort: {{ .Values.webhooks.port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          {{- with (.Values.shutdown | default dict).preStopSleepSeconds }}
          # Give the Service and the load balancer time to stop sending new
          # requests before the drain starts.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int . }}
          {{- end }}
          {{- range $name, $probe := dict "startupProbe" .Values.startupProbe "livenessProbe" .Values.livenessProbe "readinessProbe" .Values.readinessProbe }}
          {{- with $probe }}
          {{ $name }}:
            {{- if $loopback }}
            {{- /* The kubelet cannot reach the pod's loopback, so the check runs inside it. */}}
            exec:
              command: [wget, -qO-, {{ printf "http://127.0.0.1:8080%s" (dig "httpGet" "path" "/healthz" .) | quote }}]
            {{- toYaml (omit . "httpGet" "tcpSocket" "grpc" "exec") | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/warp
            # A read-only root filesystem still needs somewhere for temp files.
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/warp
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if $tailscale }}
        {{- include "humagen.tailscaleProxy" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if and .Values.persistence.enabled (eq (include "humagen.blobsKind" .) "disk") }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}
          {{- else }}
          # Scratch: published files are in the bucket, not on this volume.
          {{- with .Values.persistence.scratchSizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        # humagen.yaml and the files beside it.
        - name: config
          configMap:
            name: {{ $fullname }}
        {{- if $tailscale }}
        - name: tailscale-proxy
          configMap:
            name: {{ $fullname }}-tailscale-proxy
        - name: tailscale-state
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
