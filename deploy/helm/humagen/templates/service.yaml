apiVersion: v1
kind: Service
metadata:
  name: {{ include "humagen.fullname" . }}
  labels:
    {{- include "humagen.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "humagen.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.webhooks.enabled }}
    - name: webhooks
      port: {{ .Values.webhooks.port }}
      targetPort: webhooks
      protocol: TCP
    {{- end }}
