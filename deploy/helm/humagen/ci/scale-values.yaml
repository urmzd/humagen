# Values for `helm lint`, `helm template` and `deploy/helm/check.sh`: the
# production parts on (worker, KEDA, the server's autoscaler held at one
# replica, disruption budgets, a bucket for blobs).
system:
  spec:
    server:
      public_url: https://humagen.example.com
    auth:
      oidc:
        issuer: https://idp.example.com
        client_id: humagen
        audience: humagen
    stores:
      kind: postgres
      postgres: {url: {ref: env:HUMAGEN_POSTGRES_URL}}
    # Keyless through Workload Identity: see serviceAccount.annotations.
    blobs:
      kind: gcs
      gcs:
        bucket: humagen-files
        prefix: prod/
existingSecret: humagen-env
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: humagen@example-project.iam.gserviceaccount.com
persistence:
  scratchSizeLimit: 10Gi
shutdown:
  drainGrace: 1m
  httpTimeout: 15s
  preStopSleepSeconds: 5
terminationGracePeriodSeconds: 90
podDisruptionBudget:
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  metrics:
    - type: Pods
      pods:
        metric: {name: humagen_runs_active}
        target: {type: AverageValue, averageValue: "8"}
worker:
  enabled: true
  podDisruptionBudget:
    enabled: true
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 8
