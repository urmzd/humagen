# Values for the humagen chart. Every key is documented where it is set.
#
# humagen is configured by the documents in docs/reference/spec.md. `system` and
# `platforms` below are rendered verbatim into one humagen.yaml the pod reads
# with `humagen serve -f`. Everything else is the chart's own: image, volume,
# Service, Ingress, probes.
#
# Secrets never go in this file. A credential in the spec is a reference,
# {ref: env:NAME}; name a Secret you created with `existingSecret`, and its
# keys become the container's environment, where the references read them.

# -- A local cluster for development only, such as the one `tilt up` drives
# (deploy/tilt). With loopback on, humagen listens on the pod's own loopback,
# which `kubectl port-forward` reaches and nothing else does, so dev and mock
# sign-in may be used; the probes check from inside the pod. An Ingress is
# refused with it. Never set it on a cluster other people use.
development:
  loopback: false

# -- One replica of the server. Keep it at one: humagen's stores are single-writer (the run
# index, the usage ledger, the admission lock and the schedules all assume one
# process owns them), and the workspace volume is ReadWriteOnce. A second
# replica would race the first, not share its load. To run turns on more
# pods, use `worker` below.
replicaCount: 1

image:
  # Releases do not publish an image yet: build one from the Dockerfile at the
  # repository root and push it here.
  repository: ghcr.io/urmzd/humagen
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
# -- Set to warp for a release installed by the warp chart, before the
# product was renamed, so the upgrade keeps its Deployment, Service, ConfigMap
# and volume. The chart refuses to upgrade such a release without it.
nameOverride: ""
fullnameOverride: ""

# -- The System document: how and where humagen runs (docs/reference/spec.md#system).
# Null store entries are omitted; other values are rendered as written.
# The chart passes -addr=0.0.0.0:8080 and
# -web=/usr/share/warp/web as flags, which win over server.addr and
# server.console. auth.kind must be oidc, or tailscale with tailscale.proxy
# on: dev, mock and tailscale trust loopback and refuse any other listen
# address, so tailscale listens on the pod's loopback behind the proxy
# container, and dev and mock only under development.loopback.
system:
  metadata:
    name: humagen
    display_name: Humagen
  spec:
    server:
      # Where browsers reach humagen. The OIDC redirect URI is this plus
      # /auth/callback.
      public_url: https://humagen.example.com
    auth:
      kind: oidc
      oidc:
        # All three required. Not secret, so set here.
        issuer: ""
        client_id: ""
        client_secret: {ref: env:HUMAGEN_OIDC_CLIENT_SECRET}
        audience: ""
      tenant: {fixed: default}
      groups: {claim: groups}
      # An authorization policy: put it in `files` and name it here, as
      # /etc/warp/policy.authz.
      # policy_file: /etc/warp/policy.authz
    # For memory, set kind: memory and postgres: null. Null store entries are
    # omitted from the spec, including when an upgrade reuses old values.
    stores:
      kind: postgres
      postgres: {url: {ref: env:HUMAGEN_POSTGRES_URL}}
    # The bus is left unset: the chart sets bus: {kind: postgres} when the
    # stores are on Postgres (events in a table on the same database), and
    # humagen defaults to memory otherwise. Set bus.kind to choose.
    # bus:
    #   kind: postgres
    # Where published files go. disk keeps them on the workspace volume, a
    # ReadWriteOnce claim that ties the pod to one node. With a bucket the
    # chart makes no claim and the workspace is an emptyDir, scratch.
    #
    # gcs, Google Cloud Storage, keyless with Application Default Credentials
    # (on GKE, Workload Identity: annotate the ServiceAccount with
    # iam.gke.io/gcp-service-account, see serviceAccount.annotations).
    # prefix is optional:
    #   kind: gcs
    #   gcs: {bucket: humagen-files, prefix: prod/}
    #
    # s3, fields bucket, region, endpoint, path_style, access_key, secret_key.
    # AWS (both keys left out means the AWS chain, such as IRSA):
    #   kind: s3
    #   s3: {bucket: humagen-files, region: us-east-1,
    #        access_key: {ref: env:HUMAGEN_S3_ACCESS_KEY_ID},
    #        secret_key: {ref: env:HUMAGEN_S3_SECRET_ACCESS_KEY}}
    # GCS through its S3-compatible endpoint, with an HMAC key:
    #   kind: s3
    #   s3: {bucket: humagen-files, region: auto,
    #        endpoint: https://storage.googleapis.com,
    #        access_key: {ref: env:HUMAGEN_S3_ACCESS_KEY_ID},
    #        secret_key: {ref: env:HUMAGEN_S3_SECRET_ACCESS_KEY}}
    # Cloudflare R2 or MinIO: endpoint set to the account's or the server's
    # URL (https://ACCOUNT.r2.cloudflarestorage.com, region: auto; or
    # http://minio.storage:9000 with path_style: true), keys as above.
    # The worker needs a bucket: its pods do not share the server's disk.
    blobs:
      kind: disk
    # The workspace defaults to the volume (the image points the user cache
    # directory into /var/lib/warp).
    execution:
      max_depth: 4
      max_fan_out: 16
    # Where a run's tools execute: the file tools, the shell and stdio MCP
    # servers (docs/reference/spec.md#sandbox). Set it on purpose:
    #   unisolated  tools run in this pod with humagen's privileges, as before
    #               the sandbox; the shell is refused. What this chart ships.
    #   docker      an instance per run, on runsc (gVisor), or runc only
    #               with insecure_development_runtime. The pod has no
    #               Docker socket: mounting the node's gives humagen root on
    #               the node, so do not. Set host and tls_dir to drive a
    #               daemon on a separate sandbox host over TLS instead.
    #   local       host processes in this pod, not isolated; development only.
    # A Kubernetes driver that runs each run's instance as its own pod is not
    # built yet.
    sandbox:
      kind: unisolated

# -- Platform documents, one per workspace (docs/reference/spec.md#platform). Each item
# is {metadata, spec} and is rendered with api_version and kind added;
# metadata.name is the workspace's tenant. An agent can come from `files`:
#   agents: [{file: /etc/warp/reviewer.json}]
platforms:
  - metadata:
      name: default
    spec: {}

# -- Further files beside humagen.yaml in /etc/warp, by name: an authorization
# policy, agent specs. The spec refers to them as /etc/warp/NAME. No secrets.
files: {}
#  policy.authz: |
#    ...
#  reviewer.json: |
#    {"name": "reviewer", ...}

# -- The Secret whose keys become environment variables (envFrom), for the
# references in `system` and `platforms` to read. Create it yourself, with
# kubectl, SOPS, External Secrets or sealed-secrets. With the defaults:
#   HUMAGEN_OIDC_CLIENT_SECRET, HUMAGEN_POSTGRES_URL
# and whatever else the documents name, such as ANTHROPIC_API_KEY or
# SLACK_BOT_TOKEN. A reference to an unset variable stops humagen at start.
existingSecret: ""

# -- The workspace volume: agents' files and, with blobs.kind=disk,
# published files. Mounted at /var/lib/warp. The chart creates the claim only
# for blobs.kind=disk; with a bucket the volume is an emptyDir.
persistence:
  enabled: true
  # Use a claim you made instead of creating one. It is used whatever the
  # blobs kind.
  existingClaim: ""
  # The emptyDir's size limit when there is no claim, such as 10Gi. Empty
  # means none.
  scratchSizeLimit: ""
  # Empty means the cluster's default class.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

# -- A second listener exposing only signed connector webhooks (Slack,
# GitHub), so the API need not be public for them. Off means the webhooks are
# on the main port under /connectors. Passed as -webhook-addr, which wins over
# system.spec.server.webhook_addr.
webhooks:
  enabled: false
  port: 8090

# -- Further flags for `humagen serve`, appended last.
extraArgs: []
# -- Further environment variables, as container env entries.
extraEnv: []
# -- Further volumes and mounts, for example for a stdio MCP server's files.
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # The event stream is server-sent events: a proxy that buffers or times out
  # short-lived requests will cut it. For ingress-nginx, for example:
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: humagen.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: humagen-tls
  #    hosts:
  #      - humagen.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # humagen does not call the Kubernetes API.
  automountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# No CPU limit: throttling stalls the event stream; the request reserves what
# a turn needs and the memory limit bounds a runaway.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# /healthz is liveness: the process answers. /readyz is readiness: the
# database and bus answer, the platform finished starting, and the process is
# not draining, so a draining pod leaves the Service's endpoints. The startup
# probe allows two minutes, since migrations run at start. Under
# development.loopback or tailscale the chart runs each check inside the pod
# with wget against its own path. /readyz needs a humagen release that serves
# it.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 4
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 60

# -- Graceful shutdown, passed as `humagen serve` (and `humagen worker`) flags
# -drain-grace and -shutdown-timeout, which need a release that has them. On
# SIGTERM humagen stops claiming work and reports not ready, lets turns in
# flight finish for drainGrace, releases the leases of those still running so
# another replica resumes them, then shuts the HTTP server down within
# httpTimeout. Go durations in whole h, m and s.
shutdown:
  drainGrace: 25s
  httpTimeout: 10s
  # A preStop sleep before SIGTERM, so the endpoint is gone from the Service
  # and load balancers before draining starts. 0 turns it off. Uses the
  # kubelet's sleep action (Kubernetes 1.30 or later).
  preStopSleepSeconds: 5

# -- Must exceed preStopSleepSeconds + drainGrace + httpTimeout (40 seconds
# with the defaults); the chart refuses a value that does not.
terminationGracePeriodSeconds: 45

# -- A PodDisruptionBudget for the server (and one for the worker, under
# worker.podDisruptionBudget). maxUnavailable: 1, not minAvailable: 1, because
# with one replica minAvailable would block every node drain; maxUnavailable
# lets the drain evict the pod and limits evictions once there are more. Set
# minAvailable instead to require that many stay up.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  minAvailable: ""

# -- A HorizontalPodAutoscaler for the server. The Deployment then omits
# replicas. maxReplicas above 1 is refused while the stores are single-writer
# (see replicaCount); scale turns out with the worker instead.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""
  # Further metrics (Pods, Object, External), appended as written.
  metrics: []
  behavior: {}

# -- Worker pods that run `humagen worker -f /etc/warp/humagen.yaml`: they
# claim turns from the Postgres queue and run them, with no API and no
# Service. Needs a humagen release with the `humagen worker` command, Postgres
# stores and a bucket for blobs (s3 or gcs). Same image, spec, Secret,
# volumes and security context as the server; the workspace is an emptyDir.
worker:
  enabled: false
  # Ignored when keda is on: KEDA sets the count.
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Further flags for `humagen worker`, appended last.
  extraArgs: []
  # No probes until the worker serves health; set any as for the server.
  startupProbe: {}
  livenessProbe: {}
  readinessProbe: {}
  # Empty means the server's.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    minAvailable: ""
  # A KEDA ScaledObject that scales the worker on the queue: KEDA runs
  # `query` against Postgres and keeps about one worker per targetQueryValue
  # rows. Needs KEDA in the cluster and existingSecret, whose
  # connectionSecretKey KEDA reads through a TriggerAuthentication.
  keda:
    enabled: false
    minReplicaCount: 0
    maxReplicaCount: 4
    pollingInterval: 15
    cooldownPeriod: 300
    # Rows per worker: set it to execution.concurrency, the turns one
    # process runs at once.
    targetQueryValue: 4
    connectionSecretKey: HUMAGEN_POSTGRES_URL
    # Runs due to be claimed (ready_at reached, or a lease that lapsed) plus
    # runs a live lease holds, so busy workers are not scaled away.
    query: >-
      SELECT count(*) FROM fiber_run_queue
      WHERE (ready_at IS NOT NULL AND ready_at <= now())
      OR lease_until IS NOT NULL

# -- Tailscale sign-in (system.spec.auth.kind: tailscale) in a pod. humagen
# then listens on 127.0.0.1:8080 and trusts the Tailscale-User-Login and
# Tailscale-User-Name headers a loopback caller sets, so a trusted Tailscale
# proxy must run in the same pod: this container, such as Caddy built with
# the caddy-tailscale plugin, which joins the tailnet and reverse-proxies to
# 127.0.0.1:8080. It is the only way in: the chart refuses an Ingress and the
# Service exposes no humagen port. The Tailscale Kubernetes operator's
# ingress proxies to the pod IP, not its loopback, so it cannot front this
# listener. Never expose the pod any other way. public_url must be the
# proxy's https tailnet URL, and auth.oidc must be null.
tailscale:
  proxy:
    enabled: false
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    command: []
    # For example: [run, --config, /etc/tailscale-proxy/Caddyfile]
    args: []
    # The auth key comes from a Secret, for example:
    #   - secretRef: {name: humagen-tailscale}   # holds TS_AUTHKEY
    envFrom: []
    env: []
    # Files mounted at /etc/tailscale-proxy, such as a Caddyfile. A sketch
    # for caddy-tailscale (check the plugin's README for your version):
    #   Caddyfile: |
    #     { tailscale { state_dir /var/lib/tailscale-proxy } }
    #     https://humagen.TAILNET.ts.net {
    #       bind tailscale/humagen
    #       tailscale_auth
    #       reverse_proxy 127.0.0.1:8080 {
    #         header_up Tailscale-User-Login {http.auth.user.tailscale_login}
    #         header_up Tailscale-User-Name {http.auth.user.tailscale_name}
    #       }
    #     }
    files: {}
    # An emptyDir for the proxy's tailnet state: use an ephemeral auth key,
    # or mount a volume here to keep the node across restarts.
    stateDir: /var/lib/tailscale-proxy
    volumeMounts: []
    # Empty means the chart's securityContext.
    securityContext: {}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
