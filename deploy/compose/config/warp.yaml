# The spec the compose stack's warp reads (docs/reference/spec.md). Mounted at
# /etc/warp, read with `humagen serve -f /etc/warp`. Edit the names and URLs here;
# credentials are references to variables set in .env, never values.
# Check it with: go run ./cmd/humagen config check -f deploy/compose/config
api_version: warp/v1
kind: System
metadata:
  name: warp
  display_name: Warp
spec:
  server:
    # Where browsers reach warp. The OIDC redirect URI is this plus
    # /auth/callback. The listen address and the console's directory are
    # flags in compose.yaml.
    public_url: http://localhost:8080
  auth:
    kind: oidc
    oidc:
      issuer: https://login.example.com
      client_id: warp
      client_secret: {ref: env:WARP_OIDC_CLIENT_SECRET}
      audience: warp
    tenant: {fixed: default}
    groups: {claim: groups}
    # An authorization policy, a file beside this one:
    # policy_file: /etc/warp/policy.authz
  stores:
    kind: postgres
    # compose.yaml points this at the bundled Postgres unless .env says otherwise.
    postgres: {url: {ref: env:WARP_POSTGRES_URL}}
  bus:
    # On the stores' database: events in a table, readers woken by
    # LISTEN/NOTIFY. Leaving bus out picks this whenever stores is postgres.
    kind: postgres
  blobs:
    # In the warp-data volume.
    kind: disk
    # With the s3 profile (MinIO):
    # kind: s3
    # s3:
    #   bucket: warp
    #   endpoint: http://minio:9000
    #   path_style: true
    #   access_key: {ref: env:WARP_S3_ACCESS_KEY_ID}
    #   secret_key: {ref: env:WARP_S3_SECRET_ACCESS_KEY}
  sandbox:
    # Where a run's tools execute: the file tools, the shell and stdio MCP
    # servers (docs/reference/spec.md#sandbox). Set it on purpose:
    #   unisolated  tools run in this container with humagen's privileges, as
    #               before the sandbox; the shell is refused. What this stack
    #               ships.
    #   docker      an instance per run, on runsc (gVisor), or runc only
    #               with insecure_development_runtime. The container has
    #               no Docker socket, so here every file tool and stdio
    #               server would refuse. Mounting /var/run/docker.sock gives
    #               humagen root on this host: instead set host and tls_dir
    #               to drive a daemon on a separate sandbox host over TLS.
    #   local       host processes in this container, not isolated; development only.
    kind: unisolated
---
api_version: warp/v1
kind: Platform
metadata:
  name: default
spec: {}
  # A model and an agent on it, for example:
  # models:
  #   - name: anthropic
  #     kind: anthropic
  #     anthropic: {key: {ref: env:ANTHROPIC_API_KEY}}
  # agents:
  #   - spec: {name: lead, provider: anthropic, model: YOUR_MODEL, system_prompt: You coordinate work.}
