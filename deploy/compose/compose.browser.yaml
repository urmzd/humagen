# A browser for agents, beside compose.yaml:
#
#   docker compose -f compose.yaml -f compose.browser.yaml up -d --build
#
# One container with Chromium and the Playwright MCP server (deploy/browser),
# with no published port. It is on a network of its own that only the server
# joins, so it reaches the server and the internet and not Postgres or MinIO.
# A page an agent opens is not trusted: the server's API is still within its
# reach, which is one reason the server signs people in with OIDC.
#
# Add the tool server to your Platform document with endpoint
# http://browser:8931/mcp and grant an agent mcp:browser:write
# (docs/guides/browser.md#run-the-bundled-browser-image).
#
# Not with compose.dev.yaml: its server is on the host's network, which
# cannot be joined to this one. For development, run the image by hand with
# a published port, as the guide shows.

services:
  warp:
    # The browser's network too, so the server reaches the browser.
    networks: ["default", "browser"]

  browser:
    build:
      context: ../browser
    image: ${HUMAGEN_BROWSER_IMAGE:-humagen-browser:local}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: ["browser"]
    environment:
      # The name and port the server reaches it by: any other Host is refused.
      HUMAGEN_BROWSER_ALLOWED_HOSTS: browser:8931
    tmpfs:
      - /tmp
      # The profile (its sign-ins), gone with the container.
      - /home/browser:uid=10001,gid=10001
    volumes:
      - browser-output:/var/lib/humagen-browser

networks:
  # The browser and the server, and nothing else.
  browser: {}

volumes:
  browser-output:
