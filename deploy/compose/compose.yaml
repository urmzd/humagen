# Humagen with Postgres, and optional MinIO (S3).
#
#   cp .env.example .env                       # the secrets config/warp.yaml names
#   $EDITOR config/warp.yaml                   # the identity provider, public URL
#   docker compose up -d --build               # Humagen and Postgres
#   docker compose --profile s3 up -d --build   # and MinIO
#
# `make up` and `make down` at the repository root wrap these, and take the
# profiles from COMPOSE_PROFILES in .env. See docs/guides/deploy.md.
#
# The project, service, volume and Postgres names stay warp, as before the
# product was renamed: the volumes are named for the project, and Postgres
# creates its user and database only on first start. Each HUMAGEN_ variable
# below falls back to its old WARP_ name.

name: warp

services:
  warp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${HUMAGEN_IMAGE:-${WARP_IMAGE:-humagen:local}}
    restart: unless-stopped
    # One server per database: the stores are single-writer. The spec in
    # ./config says the rest; these flags win over it for what belongs to the
    # container: the listen address and the console's directory.
    command: serve -f /etc/warp -addr 0.0.0.0:8080 -web /usr/share/warp/web ${HUMAGEN_EXTRA_ARGS:-${WARP_EXTRA_ARGS:-}}
    ports:
      - "${HUMAGEN_BIND:-${WARP_BIND:-127.0.0.1}}:${HUMAGEN_PORT:-${WARP_PORT:-8080}}:8080"
    # The variables the spec's references name ({ref: env:NAME}), such as
    # HUMAGEN_OIDC_CLIENT_SECRET or ANTHROPIC_API_KEY. A reference to an unset
    # variable stops the server at start.
    env_file:
      - path: .env
        required: false
    environment:
      HUMAGEN_POSTGRES_URL: ${HUMAGEN_POSTGRES_URL:-${WARP_POSTGRES_URL:-postgres://warp:${POSTGRES_PASSWORD:-warp}@postgres:5432/warp?sslmode=disable}}
      # The same, under the old name config/warp.yaml and images from before
      # the rename read, so rolling back to one still finds the database.
      WARP_POSTGRES_URL: ${HUMAGEN_POSTGRES_URL:-${WARP_POSTGRES_URL:-postgres://warp:${POSTGRES_PASSWORD:-warp}@postgres:5432/warp?sslmode=disable}}
    volumes:
      # The workspace: agents' files and, with blobs.kind=disk, published files.
      - warp-data:/var/lib/warp
      # The spec and any file it names (a policy, agent specs), read-only.
      - ./config:/etc/warp:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Only waited for when their profile is on.
      minio-bucket:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warp}
      POSTGRES_DB: warp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warp -d warp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for published files. Use with blobs.kind s3. The
  # root user and password are HUMAGEN_S3_ACCESS_KEY_ID and
  # HUMAGEN_S3_SECRET_ACCESS_KEY, so the server signs in with the same pair.
  minio:
    profiles: ["s3"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${HUMAGEN_S3_ACCESS_KEY_ID:-${WARP_S3_ACCESS_KEY_ID:-warp}}
      MINIO_ROOT_PASSWORD: ${HUMAGEN_S3_SECRET_ACCESS_KEY:-${WARP_S3_SECRET_ACCESS_KEY:-change-me-please}}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once MinIO is up, then exits. Uses the mc that ships in
  # the MinIO image.
  minio-bucket:
    profiles: ["s3"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/${HUMAGEN_S3_BUCKET:-${WARP_S3_BUCKET:-warp}}
    environment:
      MINIO_ROOT_USER: ${HUMAGEN_S3_ACCESS_KEY_ID:-${WARP_S3_ACCESS_KEY_ID:-warp}}
      MINIO_ROOT_PASSWORD: ${HUMAGEN_S3_SECRET_ACCESS_KEY:-${WARP_S3_SECRET_ACCESS_KEY:-change-me-please}}

  # The backend fiber's conformance suites run against: Postgres with
  # pgvector, which the knowledge store needs. Only started with the
  # integration profile; `make integration` uses it.
  fiber-postgres:
    profiles: ["integration"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fiber
      POSTGRES_PASSWORD: fiber
      POSTGRES_DB: fiber
    ports:
      - "127.0.0.1:${FIBER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - fiber-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiber -d fiber"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  warp-data:
  postgres-data:
  minio-data:
  fiber-postgres-data:
