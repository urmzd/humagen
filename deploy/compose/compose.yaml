# warp with Postgres, and optional MinIO (S3) and Redis.
#
#   cp .env.example .env                       # the secrets config/warp.yaml names
#   $EDITOR config/warp.yaml                   # the identity provider, public URL
#   docker compose up -d --build               # warp and Postgres
#   docker compose --profile s3 --profile redis up -d --build   # and MinIO, Redis
#
# `make up` and `make down` at the repository root wrap these, and take the
# profiles from COMPOSE_PROFILES in .env. See docs/deploy.md.

name: warp

services:
  warp:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${WARP_IMAGE:-warp:local}
    restart: unless-stopped
    # One warp per database: the stores are single-writer. The spec in
    # ./config says the rest; these flags win over it for what belongs to the
    # container: the listen address and the console's directory.
    command: serve -f /etc/warp -addr 0.0.0.0:8080 -web /usr/share/warp/web ${WARP_EXTRA_ARGS:-}
    ports:
      - "${WARP_BIND:-127.0.0.1}:${WARP_PORT:-8080}:8080"
    # The variables the spec's references name ({ref: env:NAME}), such as
    # WARP_OIDC_CLIENT_SECRET or ANTHROPIC_API_KEY. A reference to an unset
    # variable stops warp at start.
    env_file:
      - path: .env
        required: false
    environment:
      WARP_POSTGRES_URL: ${WARP_POSTGRES_URL:-postgres://warp:${POSTGRES_PASSWORD:-warp}@postgres:5432/warp?sslmode=disable}
    volumes:
      # The workspace: agents' files and, with blobs.kind=disk, published files.
      - warp-data:/var/lib/warp
      # warp.yaml and any file it names (a policy, agent specs), read-only.
      - ./config:/etc/warp:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Only waited for when their profile is on.
      minio-bucket:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warp}
      POSTGRES_DB: warp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warp -d warp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for published files. Use with WARP_STORAGE=s3. The
  # root user and password are WARP_S3_ACCESS_KEY_ID and
  # WARP_S3_SECRET_ACCESS_KEY, so warp signs in with the same pair.
  minio:
    profiles: ["s3"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${WARP_S3_ACCESS_KEY_ID:-warp}
      MINIO_ROOT_PASSWORD: ${WARP_S3_SECRET_ACCESS_KEY:-change-me-please}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once MinIO is up, then exits. Uses the mc that ships in
  # the MinIO image.
  minio-bucket:
    profiles: ["s3"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/${WARP_S3_BUCKET:-warp}
    environment:
      MINIO_ROOT_USER: ${WARP_S3_ACCESS_KEY_ID:-warp}
      MINIO_ROOT_PASSWORD: ${WARP_S3_SECRET_ACCESS_KEY:-change-me-please}

  # The event bus. Use with WARP_REDIS_URL=redis://redis:6379/0.
  redis:
    profiles: ["redis"]
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  warp-data:
  postgres-data:
  minio-data:
  redis-data:
