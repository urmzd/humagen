<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fork a conversation</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1000px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Conversation -->
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF; border-right: 1px solid #E2E2DE">
    <header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 20px; height: 60px; border-bottom: 1px solid #E2E2DE">
      <div style="font-size: 13px; color: #5F6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Spring Launch / # launch-ops</div>
      <h1 style="margin: 0; font-size: 15px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw">Supplier delay - launch impact</h1>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px">
        <a href="Context.html" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #E2E2DE; text-decoration: none; color: #1B1C1E; font-size: 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>
          Context 5
        </a>
        <button type="button" aria-label="People and agents" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1B1C1E; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>
        </button>
        <a href="Activity.html" aria-label="Conversation settings and Activity" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E2E2DE; color: #1B1C1E">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
        </a>
      </div>
    </header>

    <div style="flex: 1 1 auto; padding: 28px 20px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 22px">

        <!-- Recommendation (compact) -->
        <article style="display: flex; gap: 12px">
          <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">LP</div>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap"><span style="font-weight: 600">Launch Planner</span><span style="font-size: 12px; color: #5F6168">9:51</span></div>
            <div style="border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
              <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Recommendation</div>
              <div style="font-size: 16px; font-weight: 600">Move the launch from Nov 12 to Nov 19.</div>
              <div style="color: #3A3C41; font-size: 13px">Packaging arrives Nov 8, four days late.</div>
            </div>
          </div>
        </article>

        <!-- Message actions appear on hover, keyboard focus, or touch. -->
        <article class="board-message" tabindex="0" aria-label="Message from Mira K." style="display: flex; gap: 12px; position: relative; padding: 10px; margin: -10px; border-radius: 10px; background: #FAFAF8">
          <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #D9C7B4; color: #1B1C1E; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">MK</div>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 600">Mira K.</span><span style="font-size: 12px; color: #5F6168">9:58</span></div>
            <div>Can we keep the press embargo on the 12th and just shift retail availability?</div>
          </div>
          <div class="board-message-actions" role="group" aria-label="Message actions" style="position: absolute; right: 8px; top: -18px; display: flex; align-items: center; gap: 2px; padding: 3px; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 10px">
            <a href="#fork-title" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: #E3E8EE; color: #1F4166; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
              Fork from here
            </a>
            <button type="button" aria-label="Reply" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
            </button>
            <button type="button" aria-label="More actions" style="width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
            </button>
          </div>
        </article>

        <!-- After fork: lineage marker -->
        <sc-if value="{{ created }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px dashed #C9D5E2; border-radius: 10px; background: #F3F6FA; font-size: 13px; flex-wrap: wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E5B88" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
            <span style="flex: 1 1 240px">Forked → <a href="#" style="font-weight: 600; text-decoration: none">{{ forkName }}</a> <span style="color: #3A3C41">Launch Planner working</span></span>
            <span style="font-size: 12px; color: #5F6168">by Avery Park 10:02</span>
          </div>

          <section aria-label="Compare original and fork" style="border: 1px solid #E2E2DE; border-radius: 12px; overflow: hidden">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
              <div style="padding: 12px 14px; border-right: 1px solid #E2E2DE; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Original</span>
                <span style="font-weight: 500">Move launch to Nov 19</span>
                <span style="font-size: 12px; color: #3A3C41">Embargo, retail and paid media all shift one week</span>
              </div>
              <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Fork</span>
                <span style="font-weight: 500">Hold Nov 12, retail Nov 19</span>
                <span style="font-size: 12px; color: #3A3C41">Announcement says “available Nov 19”</span>
              </div>
            </div>
            <div style="border-top: 1px solid #E2E2DE; background: #FAFAF8; padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
              <span style="flex: 1 1 220px; font-size: 13px; color: #3A3C41">{{ bringText }}</span>
              <sc-if value="{{ notBrought }}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{ bringBack }}" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #2E5B88; color: #FFFFFF; font-weight: 600; cursor: pointer">Bring back result</button>
              </sc-if>
            </div>
          </section>

          <sc-if value="{{ brought }}" hint-placeholder-val="{{ false }}">
            <article style="display: flex; gap: 12px">
              <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">LP</div>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap"><span style="font-weight: 600">Launch Planner</span><span style="font-size: 12px; color: #2E5B88; background: #E3E8EE; padding: 1px 6px; border-radius: 4px">From fork Option B</span><span style="font-size: 12px; color: #5F6168">10:14</span></div>
                <div style="border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
                  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Option B result</div>
                  <div style="font-size: 16px; font-weight: 600">Embargo can hold Nov 12 with retail on Nov 19.</div>
                  <div style="color: #3A3C41; font-size: 13px">Paid media shifts one week; 2 retailer pages need a “coming Nov 19” banner. Plan v4b attached.</div>
                </div>
              </div>
            </article>
          </sc-if>
        </sc-if>
      </div>
    </div>
  </main>

  <!-- Fork panel -->
  <aside aria-labelledby="fork-title" style="flex: 1 1 380px; min-width: 0; max-width: 100%; background: #FFFFFF; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="padding: 18px 22px 14px; border-bottom: 1px solid #E2E2DE; display: flex; flex-direction: column; gap: 4px">
      <h2 id="fork-title" tabindex="-1" style="margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
        Fork from Mira’s message 9:58
      </h2>
      <span style="font-size: 13px; color: #5F6168">Explore another option without changing this conversation.</span>
    </div>

    <div style="flex: 1 1 auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 18px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Name</span>
        <input type="text" value="Option B: hold embargo Nov 12" style="height: 38px; padding: 0 10px; border: 1px solid #D5D5D0; border-radius: 8px; font: inherit; color: #1B1C1E">
      </label>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <legend style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 0 6px">Where it lives</legend>
        <sc-for list="{{ places }}" as="p" hint-placeholder-count="3">
          <label style="{{ p.style }}">
            <input type="radio" name="place" checked="{{ p.on }}" onChange="{{ p.pick }}" style="accent-color: #2E5B88">
            <span style="flex: 1 1 auto">{{ p.label }}</span>
            <span style="font-size: 12px; color: #5F6168">{{ p.note }}</span>
          </label>
        </sc-for>
      </fieldset>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">What it carries</h3>
        <div style="border: 1px solid #E2E2DE; border-radius: 10px; display: flex; flex-direction: column; font-size: 13px">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #F0F0ED">
            <input type="checkbox" checked disabled aria-label="History up to 9:58" style="accent-color: #2E5B88">
            <span style="flex: 1 1 auto">History up to 9:58 <span style="color: #5F6168">14 messages, read-only</span></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          </div>
          <div style="padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: #5F6168">Agents</div>
          <sc-for list="{{ agents }}" as="a" hint-placeholder-count="2">
            <label style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer">
              <input type="checkbox" checked="{{ a.on }}" onChange="{{ a.toggle }}" style="accent-color: #2E5B88">
              <span style="width: 22px; height: 22px; border-radius: 6px; background: #E3E8EE; color: #2E5B88; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ a.initials }}</span>
              <span style="flex: 1 1 auto">{{ a.name }}</span>
              <span style="font-size: 12px; color: #5F6168">{{ a.note }}</span>
            </label>
          </sc-for>
          <div style="padding: 10px 12px 4px; font-size: 11px; font-weight: 600; color: #5F6168; border-top: 1px solid #F0F0ED; margin-top: 6px">Sources</div>
          <label style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer">
            <input type="checkbox" checked style="accent-color: #2E5B88">
            <span style="flex: 1 1 auto">Supplier ETA</span>
            <span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #E6F2EC; color: #1F6B45">Indexed live</span>
          </label>
          <label style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer">
            <input type="checkbox" checked style="accent-color: #2E5B88">
            <span style="flex: 1 1 auto">Retail calendar</span>
            <span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #E3E8EE; color: #2E5B88">Live search</span>
          </label>
          <label style="display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer">
            <input type="checkbox" checked style="accent-color: #2E5B88">
            <span style="flex: 1 1 auto">Launch plan v4 (draft)</span>
            <span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">Snapshot copy</span>
          </label>
          <div style="padding: 10px 12px 4px; font-size: 11px; font-weight: 600; color: #5F6168; border-top: 1px solid #F0F0ED; margin-top: 6px">Skills</div>
          <label style="display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px; cursor: pointer">
            <input type="checkbox" checked style="accent-color: #2E5B88">
            <span style="width: 22px; height: 22px; border-radius: 6px; background: #ECE6F4; color: #563A80; display: inline-flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
            </span>
            <span style="flex: 1 1 auto">Assess launch impact <span style="color: #5F6168">v3</span></span>
          </label>
        </div>
      </section>

      <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #3A3C41; padding: 10px 12px; border-radius: 10px; background: #FAFAF8; border: 1px solid #E2E2DE">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>Nothing in the fork changes the original. Agent actions in the fork start at Ask. Results come back only when you choose “Bring back result”.</span>
      </div>
    </div>

    <div style="padding: 14px 22px; border-top: 1px solid #E2E2DE; display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
      <span style="flex: 1 1 auto; font-size: 12px; color: #5F6168">{{ footer }}</span>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-weight: 500; cursor: pointer">Cancel</button>
      <button type="button" onClick="{{ create }}" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #1B1C1E; color: #FFFFFF; font-weight: 600; cursor: pointer">{{ createLabel }}</button>
    </div>
  </aside>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { created: false, brought: false, place: 'same', agents: { LP: true, OA: false } };
  }
  renderVals() {
    const s = this.state;
    const placeDefs = [
      ['same', '# launch-ops (same channel)', 'same audience'],
      ['other', 'Another project or channel…', 'choose'],
      ['private', 'Private', 'only you']
    ];
    const places = placeDefs.map(([id, label, note]) => {
      const on = s.place === id;
      return { label, note, on, pick: () => this.setState({ place: id }),
        style: 'display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; border: ' + (on ? '1.5px solid #2E5B88; background: #F3F6FA' : '1px solid #E2E2DE; background: #FFFFFF') };
    });
    const agentDefs = [['LP', 'Launch Planner', 'will work the fork'], ['OA', 'Ops Agent', 'stays on original']];
    const agents = agentDefs.map(([id, name, note]) => ({
      initials: id, name, note: s.agents[id] ? 'will work the fork' : note === 'will work the fork' ? 'not included' : note,
      on: !!s.agents[id],
      toggle: () => this.setState({ agents: { ...s.agents, [id]: !s.agents[id] } })
    }));
    const n = Object.values(s.agents).filter(Boolean).length;
    return {
      places, agents,
      created: s.created,
      brought: s.brought,
      notBrought: !s.brought,
      forkName: 'Option B: hold embargo Nov 12',
      bringText: s.brought ? 'Result posted here as an outcome card from the fork.' : 'Fork finished. Post its outcome card here so the team can compare.',
      bringBack: () => this.setState({ brought: true }),
      footer: s.created ? 'Fork created linked both ways' : n + ' agent' + (n === 1 ? '' : 's') + ', 3 sources, 1 skill',
      createLabel: s.created ? 'Open fork' : 'Create fork',
      create: () => this.setState({ created: true })
    };
  }
}
</script>
</body>
</html>
