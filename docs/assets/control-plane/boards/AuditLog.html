        action: 'Changed a policy for Spring Launch', detail: 'Message people outside the project → Ask',
        object: 'External messages', objKind: 'Policy', icon: 'policy', tint: 'neutral', scope: 'Spring Launch', scopeKind: 'project',
        before: 'Allow (workspace default)', after: 'Ask applies to all 4 project agents',
        why: 'Vendor communication during launch week.', href: 'Policies.dc.html', linkLabel: 'View policy' },
      { id: 'fail', time: '8:10', who: 'agent', initials: 'MD', actor: 'Media Analyst', type: 'agent',
        action: 'Run failed', detail: 'Source access expired stopped by policy',
        object: 'Paid media pacing check', objKind: 'Run', icon: 'run', tint: 'neutral', scope: 'Spring Launch', scopeKind: 'project',
        before: 'Running', after: 'Stopped retried 2 times flagged in Needs you',
        why: 'A source it relies on could not sync.', href: 'OpsAgents.dc.html', linkLabel: 'Open agent' }
    ];
    const s = this.state;
    const pill = (on) => 'height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; cursor: pointer; border: 1px solid ' + (on ? '#1B1C1E' : '#D5D5D0') + '; background: ' + (on ? '#1B1C1E' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#1B1C1E');
    const mk = (defs, key) => defs.map(([id, label]) => {
      const on = s[key] === id;
      return { label, pressed: on ? 'true' : 'false', style: pill(on), pick: () => this.setState({ [key]: id }) };
    });
    const actorFilters = mk([['all', 'All'], ['person', 'People'], ['agent', 'Agents']], 'actor');
    const typeFilters = mk([['all', 'All'], ['decisions', 'Decisions'], ['permissions', 'Permissions'], ['moves', 'Moves'], ['context', 'Context'], ['policy', 'Policy'], ['skills', 'Memory & skills'], ['agent', 'Agent work']], 'type');
    const rows = all
      .filter((r) => (s.actor === 'all' || r.who === s.actor) && (s.type === 'all' || r.type === s.type))
      .map((r, i) => {
        const open = s.open === r.id;
        const isAgent = r.who === 'agent';
        return { ...r,
          open, openStr: open ? 'true' : 'false',
          toggleLabel: (open ? 'Hide' : 'Show') + ' details: ' + r.action,
          toggle: () => this.setState({ open: open ? null : r.id }),
          chevStyle: 'transform: rotate(' + (open ? 180 : 0) + 'deg)',
          wrapStyle: 'border-top: ' + (i === 0 ? '0' : '1px solid #F0F0ED') + '; background: ' + (open ? '#FCFCFB' : '#FFFFFF'),
          avatarStyle: 'flex: 0 0 auto; width: 26px; height: 26px; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; ' +
            (isAgent ? 'border-radius: 7px; background: #E3E8EE; color: #2E5B88; font-weight: 700' : 'border-radius: 50%; color: #1B1C1E; font-weight: 600; background: ' + people[r.initials]),
          objBadgeStyle: 'flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; ' + badge[r.tint],
          objIcon: I[r.icon],
          scopeIcon: S[r.scopeKind]
        };
      });
    return { actorFilters, typeFilters, rows, count: rows.length, empty: rows.length === 0 };
  }
}
