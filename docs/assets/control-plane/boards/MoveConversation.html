<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add conversation to a project</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body class="board-fixed">
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div role="dialog" aria-labelledby="mv-title" style="width: 560px; height: 760px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 16px; display: flex; flex-direction: column; font-size: 14px; line-height: 1.45; overflow: hidden">

  <div style="padding: 20px 24px 16px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid #E2E2DE">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
      <h2 id="mv-title" style="margin: 0; font-size: 17px; font-weight: 600">Add to a project</h2>
      <div style="color: #5F6168; font-size: 13px">“Pricing memo draft” 14 messages started privately Oct 21</div>
    </div>
    <button type="button" aria-label="Close" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="flex: 1 1 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; overflow: auto">

    <!-- Destination -->
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 0 8px">Destination</legend>
      <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #E2E2DE; border-radius: 10px; cursor: pointer">
        <input type="radio" name="dest" style="accent-color: #2E5B88">
        <span style="flex: 1 1 auto">Spring Launch <span style="color: #5F6168"> / # planning</span></span>
        <span style="font-size: 12px; color: #5F6168">12 members</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid #2E5B88; background: #F3F6FA; border-radius: 10px; cursor: pointer">
        <input type="radio" name="dest" checked style="accent-color: #2E5B88">
        <span style="flex: 1 1 auto; font-weight: 500">Spring Launch <span style="color: #3A3C41"> / # pricing</span></span>
        <span style="font-size: 12px; color: #3A3C41">8 members</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #E2E2DE; border-radius: 10px; cursor: pointer">
        <input type="radio" name="dest" style="accent-color: #2E5B88">
        <span style="flex: 1 1 auto">Q4 Research <span style="color: #5F6168"> / # general</span></span>
        <span style="font-size: 12px; color: #5F6168">5 members</span>
      </label>
    </fieldset>

    <!-- Audience change -->
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Who will see it</h3>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 14px; border-radius: 10px; background: #FAFAF8; border: 1px solid #E2E2DE">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; color: #5F6168">Now</span>
          <span style="font-weight: 500">Only you + Research Analyst</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; color: #5F6168">After</span>
          <span style="font-weight: 500">8 people + 2 project agents</span>
        </div>
      </div>
      <div style="font-size: 13px; color: #3A3C41">Project agents (Launch Planner, Ops Agent) will be able to read and use this conversation as context.</div>
    </section>

    <!-- What comes along -->
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Moves with it</h3>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border: 1px solid #E2E2DE; border-radius: 10px">
        <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #E2E2DE">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          <span style="flex: 1 1 auto">14 messages and 1 deliverable</span>
        </li>
        <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #E2E2DE">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          <span style="flex: 1 1 auto">2 agent runs and their Activity</span>
          <span style="font-size: 12px; color: #5F6168">Research Analyst</span>
        </li>
        <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          <span style="flex: 1 1 auto">2 context sources</span>
          <span style="font-size: 12px; color: #5F6168">Competitor pricing live</span>
        </li>
      </ul>
    </section>

    <!-- Attention item -->
    <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: #FBF3E4; border: 1px solid #EED9B3">
      <div style="display: flex; align-items: flex-start; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A5300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17.5v.5"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 600; color: #6B4100">1 private source will become visible</span>
          <span style="font-size: 13px; color: #4A3A20">“Customer emails - pricing” is a snapshot from your inbox (imported Oct 21).</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; padding-left: 28px">
        <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer"><input type="radio" name="private" checked style="accent-color: #2E5B88">Keep it private, share a summary</label>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer"><input type="radio" name="private" style="accent-color: #2E5B88">Share with project</label>
      </div>
    </section>
  </div>

  <div style="padding: 16px 24px; border-top: 1px solid #E2E2DE; display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
    <span style="flex: 1 1 auto; font-size: 12px; color: #5F6168">You can move it again later.</span>
    <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-weight: 500; cursor: pointer">Cancel</button>
    <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #2E5B88; color: #FFFFFF; font-weight: 600; cursor: pointer">Move to # pricing</button>
  </div>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
