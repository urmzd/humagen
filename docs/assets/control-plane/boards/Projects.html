<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All projects</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1120px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Workspace nav -->
  <nav aria-label="Workspace" style="flex: 1 1 220px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>
      <a href="Projects.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E; background: #FFFFFF; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="5" rx="1"></rect><rect x="15" y="10" width="6" height="5" rx="1"></rect><rect x="15" y="17" width="6" height="5" rx="1"></rect><path d="M6 8v11h9M6 12.5h9"></path></svg>
        All projects
      </a>
      <a href="Initiative.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
        Spring 2027 GTM
      </a>
      <a href="Main.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 30px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        Spring Launch
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 30px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        Q4 Research
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        Onboarding Revamp
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Library</div>
      <a href="Skills.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
        Skills
      </a>
      <a href="Memory.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
        Memory
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Operations</div>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 2h6l1-2h5"></path></svg>
        Needs you <span style="margin-left: auto; font-size: 12px; font-weight: 600; background: #2E5B88; color: #FFFFFF; border-radius: 999px; padding: 0 7px">3</span>
      </a>
      <a href="OpsAgents.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>
        Agents
      </a>
      <a href="AgentComms.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        Agent network
      </a>
      <a href="OpsContext.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>
        Context health <span style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #B86E00" aria-label="issues"></span>
      </a>
      <a href="Integrations.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5M15 3v5"></path><path d="M6 8h12v3a6 6 0 0 1-12 0z"></path><path d="M12 17v4"></path></svg>
        Integrations
      </a>
      <a href="Policies.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>
        Policies
      </a>
      <a href="Usage.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17V4"></path></svg>
        Usage
      </a>
      <a href="AuditLog.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>
        Audit log
      </a>
    </div>
    <a href="UserSettings.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #C9C3DD; color: #1B1C1E; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">AP</span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 500">Avery Park</span><span style="font-size: 12px; color: #5F6168">Your settings</span></span>
    </a>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">All projects</h1>
        <div style="color: #3A3C41">Initiatives group projects; projects can hold sub-projects. Parents pass rules and context down, children roll status up.</div>
      </div>
      <div style="position: relative">
        <button type="button" onClick="{{ toggleNew }}" aria-expanded="{{ newOpenStr }}" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #1B1C1E; color: #FFFFFF; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          New project
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <sc-if value="{{ newOpen }}" hint-placeholder-val="{{ false }}">
          <div role="menu" aria-label="New project" style="position: absolute; right: 0; top: 46px; z-index: 5; width: 280px; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(27,28,30,0.10)">
            <a role="menuitem" href="#" style="display: flex; gap: 10px; padding: 10px; border-radius: 8px; text-decoration: none; color: #1B1C1E">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Blank project</span><span style="font-size: 12px; color: #5F6168">Start with one channel</span></span>
            </a>
            <a role="menuitem" href="#" style="display: flex; gap: 10px; padding: 10px; border-radius: 8px; text-decoration: none; color: #1B1C1E">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5"></path></svg>
              <span style="display: flex; flex-direction: column"><span style="font-weight: 500">From template</span><span style="font-size: 12px; color: #5F6168">Channels, agents and skills ready</span></span>
            </a>
            <a role="menuitem" href="ForkProject.html" style="display: flex; gap: 10px; padding: 10px; border-radius: 8px; text-decoration: none; color: #1B1C1E">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
              <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Fork an existing project</span><span style="font-size: 12px; color: #5F6168">Copy its setup, not its conversations</span></span>
            </a>
            <a role="menuitem" href="Initiative.html" style="display: flex; gap: 10px; padding: 10px; border-radius: 8px; text-decoration: none; color: #1B1C1E">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
              <span style="display: flex; flex-direction: column"><span style="font-weight: 500">Under an initiative</span><span style="font-size: 12px; color: #5F6168">Inherits its rules and shared context</span></span>
            </a>
          </div>
        </sc-if>
      </div>
    </div>

    <!-- Toolbar -->
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #D5D5D0; border-radius: 8px; padding: 0 10px; height: 38px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" placeholder="Search projects, owners, linked repos or channels" aria-label="Search projects" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; width: 100%; color: #1B1C1E">
      </label>
      <div role="group" aria-label="Show" style="display: flex; gap: 6px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="{{ f.style }}">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start">

      <!-- Tree -->
      <div style="flex: 999 1 600px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; overflow-x: auto">
        <div role="treegrid" aria-label="Projects" style="min-width: 860px; font-size: 13px">
          <div role="row" style="display: grid; grid-template-columns: minmax(250px, 2.4fr) minmax(90px, 1fr) minmax(130px, 1.2fr) minmax(110px, 1fr) minmax(150px, 1.3fr) minmax(80px, 0.7fr); align-items: center; color: #5F6168; font-size: 12px; border-bottom: 1px solid #E2E2DE">
            <span role="columnheader" style="padding: 10px 16px">Name</span>
            <span role="columnheader" style="padding: 10px 8px">Owner</span>
            <span role="columnheader" style="padding: 10px 8px">Members</span>
            <span role="columnheader" style="padding: 10px 8px">Linked</span>
            <span role="columnheader" style="padding: 10px 8px">Status</span>
            <span role="columnheader" style="padding: 10px 16px 10px 8px">Last activity</span>
          </div>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
            <div role="row" aria-level="{{ r.level }}" aria-expanded="{{ r.expandedStr }}" aria-selected="{{ r.selectedStr }}" style="{{ r.rowStyle }}">
              <span role="gridcell" style="{{ r.nameCellStyle }}">
                <sc-if value="{{ r.hasKids }}" hint-placeholder-val="{{ true }}">
                  <button type="button" onClick="{{ r.toggle }}" aria-label="{{ r.toggleLabel }}" style="flex: 0 0 auto; width: 28px; height: 28px; border: 0; background: transparent; border-radius: 6px; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ r.chevStyle }}"><path d="M9 6l6 6-6 6"></path></svg>
                  </button>
                </sc-if>
                <sc-if value="{{ r.noKids }}" hint-placeholder-val="{{ false }}">
                  <span style="flex: 0 0 auto; width: 28px"></span>
                </sc-if>
                <sc-if value="{{ r.isInitiative }}" hint-placeholder-val="{{ false }}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Initiative" role="img" style="flex: 0 0 auto"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
                </sc-if>
                <sc-if value="{{ r.isProject }}" hint-placeholder-val="{{ true }}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Project" role="img" style="flex: 0 0 auto"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </sc-if>
                <button type="button" onClick="{{ r.pick }}" style="border: 0; background: transparent; padding: 4px 0; text-align: left; cursor: pointer; color: #1B1C1E; font-size: 13px; display: flex; flex-direction: column; min-width: 0">
                  <span style="{{ r.nameStyle }}">{{ r.name }}</span>
                  <span style="font-size: 12px; color: #5F6168">{{ r.kindLabel }}</span>
                </button>
              </span>
              <span role="gridcell" style="padding: 10px 8px; color: #3A3C41">{{ r.owner }}</span>
              <span role="gridcell" style="padding: 10px 8px; display: flex; align-items: center; gap: 0">
                <sc-for list="{{ r.people }}" as="p" hint-placeholder-count="2">
                  <span title="{{ p.name }}" style="{{ p.style }}">{{ p.initials }}</span>
                </sc-for>
                <sc-if value="{{ r.hasAgents }}" hint-placeholder-val="{{ true }}">
                  <span title="Agents" style="margin-left: 6px; height: 22px; padding: 0 6px; border-radius: 6px; background: #E3E8EE; color: #2E5B88; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>
                    {{ r.agents }}
                  </span>
                </sc-if>
              </span>
              <span role="gridcell" style="padding: 10px 8px; display: flex; gap: 4px; flex-wrap: wrap">
                <sc-for list="{{ r.systems }}" as="s" hint-placeholder-count="2">
                  <span title="{{ s.name }}" style="width: 24px; height: 24px; border-radius: 6px; background: #EEEEEB; color: #3A3C41; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ s.code }}</span>
                </sc-for>
              </span>
              <span role="gridcell" style="padding: 10px 8px"><span style="{{ r.statusStyle }}"><span style="{{ r.dotStyle }}"></span>{{ r.status }}</span></span>
              <span role="gridcell" style="padding: 10px 16px 10px 8px; color: #5F6168; white-space: nowrap">{{ r.last }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
            <div style="padding: 24px 16px; color: #5F6168">No projects match this filter.</div>
          </sc-if>
        </div>
      </div>

      <!-- Side column -->
      <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

        <aside aria-label="Selected project" style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">{{ sel.kindLabel }}</span>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600">{{ sel.name }}</h2>
            <span style="font-size: 13px; color: #3A3C41">Parent: {{ sel.parentName }}</span>
          </div>

          <sc-if value="{{ sel.hasLineage }}" hint-placeholder-val="{{ false }}">
            <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; font-size: 12px; color: #3A3C41; border: 1px solid #E2E2DE; border-radius: 6px; padding: 3px 8px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
              {{ sel.lineage }}
            </div>
          </sc-if>
