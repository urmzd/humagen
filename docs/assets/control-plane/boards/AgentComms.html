<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent network - Spring Launch</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1120px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Canonical workspace nav -->
  <nav aria-label="Workspace" style="flex: 1 1 220px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>
      <a href="Main.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Spring Launch</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Q4 Research</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Onboarding Revamp</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Library</div>
      <a href="Skills.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>Skills</a>
      <a href="Memory.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Memory</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Operations</div>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 2h6l1-2h5"></path></svg>Needs you<span style="margin-left: auto; font-size: 12px; font-weight: 600; background: #2E5B88; color: #FFFFFF; border-radius: 999px; padding: 0 7px">3</span></a>
      <a href="OpsAgents.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>Agents</a>
      <a href="AgentComms.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none; background: #FFFFFF; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>Agent network</a>
      <a href="OpsContext.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Context health<span style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #B86E00" aria-label="issues"></span></a>
      <a href="Policies.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>Policies</a>
      <a href="Usage.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17V4"></path></svg>Usage</a>
      <a href="AuditLog.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>Audit log</a>
    </div>
    <a href="UserSettings.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; color: #1B1C1E; text-decoration: none">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #C9C3DD; color: #1B1C1E; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">AP</span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600; font-size: 13px">Avery Park</span><span style="font-size: 12px; color: #5F6168">Your settings</span></span>
    </a>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; color: #5F6168">Spring Launch</div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Agent network</h1>
        <div style="color: #3A3C41">How agents hand work to each other, where it waits, and where a person decides.</div>
      </div>
      <div role="group" aria-label="Time range" style="display: flex; border: 1px solid #D5D5D0; border-radius: 8px; overflow: hidden; background: #FFFFFF">
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 0; background: #FFFFFF; color: #3A3C41; font-size: 13px; cursor: pointer">Today</button>
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; background: #1B1C1E; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">This week</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 0; background: #FFFFFF; color: #3A3C41; font-size: 13px; cursor: pointer">30 days</button>
      </div>
    </div>

    <!-- (a) Coordination map -->
    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #E2E2DE; flex-wrap: wrap">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168; flex: 1 1 auto">Coordination map this week</h2>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #3A3C41"><span style="width: 18px; height: 0; border-top: 1.5px solid #8A8C92"></span>handoff</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #3A3C41"><span style="width: 18px; height: 0; border-top: 1.5px dashed #A33A2B"></span>blocked</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #3A3C41"><span style="width: 18px; height: 0; border-top: 1.5px solid #2E5B88"></span>needs a person</span>
      </div>
      <div style="overflow-x: auto; padding: 20px 18px">
        <div role="img" aria-label="Monitor Agent hands off to Launch Planner 4 times; Launch Planner hands off to Ops Agent 3 times and to Media Analyst once, which is blocked; Ops Agent needs a decision from Avery Park" style="position: relative; width: 920px; height: 260px; margin: 0 auto">
          <svg width="920" height="260" viewBox="0 0 920 260" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
            <defs>
              <marker id="ac-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8C92"></path></marker>
              <marker id="ac-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A33A2B"></path></marker>
              <marker id="ac-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E5B88"></path></marker>
            </defs>
            <path d="M190 130 H 262" stroke="#8A8C92" stroke-width="1.5" marker-end="url(#ac-arrow)"></path>
            <path d="M440 118 C 480 118, 480 62, 518 62" stroke="#8A8C92" stroke-width="1.5" marker-end="url(#ac-arrow)"></path>
            <path d="M440 142 C 480 142, 480 198, 518 198" stroke="#A33A2B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ac-arrow-red)"></path>
            <path d="M696 62 H 770" stroke="#2E5B88" stroke-width="1.5" marker-end="url(#ac-arrow-blue)"></path>
          </svg>

          <!-- Monitor Agent -->
          <div style="position: absolute; left: 10px; top: 102px; width: 180px; height: 56px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 12px">
            <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">MA</span>
            <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600; font-size: 13px">Monitor Agent</span><span style="font-size: 12px; color: #5F6168">Watches 6 sources</span></span>
          </div>
          <!-- Launch Planner -->
          <div style="position: absolute; left: 264px; top: 96px; width: 176px; height: 68px; box-sizing: border-box; background: #FFFFFF; border: 1.5px solid #1B1C1E; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 12px">
            <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">LP</span>
            <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600; font-size: 13px">Launch Planner</span><span style="font-size: 12px; color: #5F6168">Plan owner hub</span></span>
          </div>
          <!-- Ops Agent -->
          <div style="position: absolute; left: 520px; top: 34px; width: 176px; height: 56px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 12px">
            <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">OA</span>
            <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600; font-size: 13px">Ops Agent</span><span style="font-size: 12px; color: #6B4100">Holding 4 notices</span></span>
          </div>
          <!-- Media Analyst -->
          <div style="position: absolute; left: 520px; top: 170px; width: 176px; height: 56px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E8C4BC; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 12px">
            <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">MD</span>
            <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600; font-size: 13px">Media Analyst</span><span style="font-size: 12px; color: #8C2F22">Blocked source</span></span>
          </div>
          <!-- Avery (person, decision point) -->
          <div style="position: absolute; left: 772px; top: 26px; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
            <span style="width: 44px; height: 44px; border-radius: 50%; background: #C9C3DD; color: #1B1C1E; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #2E5B88">AP</span>
            <span style="font-size: 12px; line-height: 1.3"><strong style="font-weight: 600">Avery Park</strong><br><span style="color: #2E5B88">Decision: approve Nov 19</span></span>
          </div>

          <!-- Edge labels -->
          <span style="position: absolute; left: 196px; top: 104px; font-size: 12px; font-weight: 600; color: #3A3C41">4 handoffs</span>
          <span style="position: absolute; left: 448px; top: 54px; font-size: 12px; font-weight: 600; color: #3A3C41">3</span>
          <span style="position: absolute; left: 448px; top: 192px; font-size: 12px; font-weight: 600; color: #8C2F22">1 blocked 2 h</span>
          <span style="position: absolute; left: 704px; top: 36px; font-size: 12px; font-weight: 600; color: #2E5B88">waiting 1 h</span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid #E2E2DE; font-size: 13px">
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #F4E6CC; color: #6B4100; font-weight: 600">Bottleneck Launch Planner handles 8 of 9 handoffs</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">No loops this week</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">Median wait on a person 52 min</span>
      </div>
    </section>

    <!-- (b) Coordination threads -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Coordination threads</h2>
      <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start">

        <ul style="flex: 1 1 300px; margin: 0; padding: 0; list-style: none; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden">
          <sc-for list="{{ threads }}" as="t" hint-placeholder-count="3">
            <li style="border-bottom: 1px solid #F0F0ED">
              <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="{{ t.rowStyle }}">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5F6168">
                  <span style="width: 20px; height: 20px; border-radius: 5px; background: #E3E8EE; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ t.fromI }}</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                  <span style="width: 20px; height: 20px; border-radius: 5px; background: #E3E8EE; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ t.toI }}</span>
                  <span>{{ t.time }}</span>
                </span>
                <span style="font-weight: 600; font-size: 14px; color: #1B1C1E">{{ t.title }}</span>
                <span style="{{ t.statusStyle }}">{{ t.status }}</span>
              </button>
            </li>
          </sc-for>
        </ul>

        <article aria-label="Thread detail" style="flex: 999 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; display: flex; flex-direction: column">
          <header style="padding: 16px 18px; border-bottom: 1px solid #E2E2DE; display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
            <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 2px">
              <h3 style="margin: 0; font-size: 16px; font-weight: 600">{{ sel.title }}</h3>
              <span style="font-size: 12px; color: #5F6168">{{ sel.from }} → {{ sel.to }} in {{ sel.where }}</span>
            </div>
            <span style="{{ sel.statusStyle }}">{{ sel.status }}</span>
          </header>
          <ol style="margin: 0; padding: 16px 18px; list-style: none; display: flex; flex-direction: column; gap: 14px">
            <sc-for list="{{ sel.msgs }}" as="m" hint-placeholder-count="4">
              <li style="display: flex; gap: 12px">
                <span style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; background: #E3E8EE; color: #2E5B88; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ m.who }}</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                  <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                    <span style="{{ m.kindStyle }}">{{ m.kind }}</span>
                    <span style="font-size: 12px; color: #5F6168">{{ m.name }} {{ m.time }}</span>
                  </div>
                  <div style="color: #1B1C1E">{{ m.text }}</div>
                  <sc-if value="{{ m.hasContract }}" hint-placeholder-val="{{ false }}">
                    <dl style="margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; padding: 12px 14px; background: #FAFAF8; border: 1px solid #E2E2DE; border-radius: 10px; font-size: 13px">
                      <sc-for list="{{ m.contract }}" as="c" hint-placeholder-count="4">
                        <dt style="color: #5F6168">{{ c.k }}</dt>
                        <dd style="margin: 0; color: #1B1C1E">{{ c.v }}</dd>
                      </sc-for>
                    </dl>
                  </sc-if>
                  <sc-if value="{{ m.hasAction }}" hint-placeholder-val="{{ false }}">
                    <a href="{{ m.actionHref }}" style="align-self: flex-start; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">{{ m.action }}</a>
                  </sc-if>
                </div>
              </li>
            </sc-for>
          </ol>
        </article>
      </div>
    </section>

    <!-- (c) Where this shows up + (d) rules -->
    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: stretch">
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Where this shows up</h2>
