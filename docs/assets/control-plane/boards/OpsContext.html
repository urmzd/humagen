<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operations - Context health</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1040px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Workspace nav -->
  <nav aria-label="Workspace" style="flex: 1 1 220px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>
      <a href="Main.html" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Spring Launch</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Q4 Research</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Onboarding Revamp</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Operations</div>
      <a href="#" style="display: flex; align-items: center; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Needs you <span style="margin-left: auto; font-size: 12px; font-weight: 600; background: #2E5B88; color: #FFFFFF; border-radius: 999px; padding: 0 7px">3</span></a>
      <a href="OpsAgents.html" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Agents</a>
      <a href="OpsContext.html" aria-current="page" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E; background: #FFFFFF; font-weight: 600">Context health</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Policies</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Usage</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Audit log</a>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Context health</h1>
        <div style="color: #3A3C41">Every source agents rely on: where it comes from, how fresh it is, and who depends on it.</div>
      </div>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #1B1C1E; color: #FFFFFF; font-weight: 600; cursor: pointer">Connect source</button>
    </div>

    <!-- Lifecycle summary -->
    <ol aria-label="Sources by lifecycle stage" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
      <li style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5F6168">Importing</span><span style="font-size: 22px; font-weight: 600">0</span></li>
      <li style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5F6168">Indexing</span><span style="font-size: 22px; font-weight: 600">1</span></li>
      <li style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5F6168">Live in sync</span><span style="font-size: 22px; font-weight: 600">4</span></li>
      <li style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5F6168">Snapshots</span><span style="font-size: 22px; font-weight: 600">2</span></li>
      <li style="background: #FFFBF3; border: 1px solid #EED9B3; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #6B4100">Needs attention</span><span style="font-size: 22px; font-weight: 600; color: #6B4100">1</span></li>
    </ol>

    <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start">

      <!-- Sources table -->
      <div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; overflow-x: auto">
        <div role="table" aria-label="Sources" style="min-width: 640px; font-size: 13px">
          <div role="row" style="display: grid; grid-template-columns: 2fr 1.2fr 1.4fr 2fr 1.2fr; text-align: left; color: #5F6168; font-size: 12px; border-bottom: 1px solid #E2E2DE">
            <span role="columnheader" style="padding: 10px 16px">Source</span>
            <span role="columnheader" style="padding: 10px 12px">Mode</span>
            <span role="columnheader" style="padding: 10px 12px">Last good sync</span>
            <span role="columnheader" style="padding: 10px 12px">Used by</span>
            <span role="columnheader" style="padding: 10px 16px 10px 12px">Status</span>
          </div>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
            <div role="row" style="{{ r.rowStyle }}">
              <span role="cell" style="padding: 12px 16px">
                <button type="button" onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; color: #1B1C1E; font-size: 13px">
                  <span style="font-weight: 600">{{ r.name }}</span>
                  <span style="font-size: 12px; color: #5F6168">{{ r.origin }}</span>
                </button>
              </span>
              <span role="cell" style="padding: 12px; color: #3A3C41">{{ r.mode }}</span>
              <span role="cell" style="padding: 12px; color: #3A3C41">{{ r.synced }}</span>
              <span role="cell" style="padding: 12px; color: #3A3C41">{{ r.usedBy }}</span>
              <span role="cell" style="padding: 12px 16px 12px 12px"><span style="{{ r.statusStyle }}">{{ r.status }}</span></span>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- Selected source detail -->
      <aside aria-label="Source detail" style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{ sel.name }}</h2>
          <span style="font-size: 12px; color: #5F6168">{{ sel.origin }} {{ sel.owner }}</span>
        </div>
        <div style="{{ sel.bannerStyle }}">{{ sel.banner }}</div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Lifecycle</h3>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
            <sc-for list="{{ sel.events }}" as="e" hint-placeholder-count="4">
              <li style="display: flex; gap: 10px; align-items: flex-start">
                <span style="{{ e.dotStyle }}"></span>
                <span style="flex: 1 1 auto; color: #1B1C1E">{{ e.text }}</span>
                <span style="color: #5F6168; white-space: nowrap; font-size: 12px">{{ e.time }}</span>
              </li>
            </sc-for>
          </ol>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Depends on it</h3>
          <div style="font-size: 13px; color: #3A3C41">{{ sel.deps }}</div>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #1B1C1E; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{ sel.primary }}</button>
          <button type="button" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-size: 13px; cursor: pointer">Sync settings</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: 'media' };
  }
  renderVals() {
    const tone = {
      ok:    'background: #E6F2EC; color: #1F6B45',
      warn:  'background: #F4E6CC; color: #6B4100',
      busy:  'background: #E3E8EE; color: #2E5B88',
      quiet: 'background: #EEEEEB; color: #3A3C41'
    };
    const dot = (c) => 'flex: 0 0 auto; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: ' + c;
    const G = '#1F7A4D', A = '#B86E00', B = '#2E5B88', N = '#8A8C92';
    const sources = [
      { id: 'media', name: 'Media buy tracker', origin: 'Google Sheets', owner: 'added by Jon T.', mode: 'Live hourly', synced: 'Oct 22, 6:04 pm', usedBy: 'Media Analyst, Launch Planner', status: 'Access expired', t: 'warn',
        banner: 'Sync failing since 8:10. Agents are reading the last good copy (Oct 22, 6:04 pm). Media Analyst has stopped by policy.',
        events: [['Sync failed: access expired (3rd attempt)', '9:10', A], ['Sync failed: access expired', '8:10', A], ['Synced 2 rows changed', 'Oct 22, 6:04 pm', G], ['Connected and indexed', 'Oct 3', G]],
        deps: '2 agents 3 conversations in Spring Launch Launch plan v4 cites it', primary: 'Reconnect' },
      { id: 'brand', name: 'Brand guidelines folder', origin: 'Google Drive 340 files', owner: 'added by Mira K.', mode: 'Live daily', synced: 'Indexing 120/340', usedBy: 'Not yet available', status: 'Indexing', t: 'busy',
        banner: 'Agents can use it once indexing finishes, in about 6 minutes.',
        events: [['Indexing 120 of 340 files', 'now', B], ['Imported 340 files 2 skipped (unsupported)', '9:24', G], ['Connected', '9:20', G]],
        deps: 'Will be available to Spring Launch', primary: 'View skipped files' },
      { id: 'eta', name: 'Supplier ETA', origin: 'Google Sheets', owner: 'added by Jon T.', mode: 'Live on change', synced: '9:42 today', usedBy: 'Monitor Agent, Launch Planner', status: 'In sync', t: 'ok',
        banner: 'In sync. Last change at 9:41 triggered a handoff to Launch Planner.',
        events: [['Synced packaging ETA changed', '9:42', G], ['Synced no changes', '8:42', G], ['Connected and indexed', 'Sep 29', G]],
        deps: '2 agents 2 conversations 1 standing assignment', primary: 'Sync now' },
      { id: 'cal', name: 'Retail calendar', origin: 'Notion', owner: 'project source', mode: 'Live 15 min', synced: '9:30 today', usedBy: 'Launch Planner', status: 'In sync', t: 'ok',
        banner: 'In sync on schedule.',
        events: [['Synced no changes', '9:30', G], ['Synced 1 page changed', '9:15', G], ['Connected and indexed', 'Sep 29', G]],
        deps: '1 agent 1 conversation', primary: 'Sync now' },
      { id: 'comp', name: 'Competitor pricing', origin: 'Web 12 pages', owner: 'added by Research Analyst', mode: 'Live daily', synced: '7:00 today', usedBy: 'Research Analyst', status: 'In sync', t: 'ok',
        banner: 'In sync. 1 page returned the same content as yesterday.',
        events: [['Synced 3 pages changed', '7:00', G], ['Connected and indexed', 'Oct 21', G]],
        deps: '1 agent Pricing memo draft (private)', primary: 'Sync now' },
      { id: 'plan', name: 'Launch plan v3.pdf', origin: 'Upload', owner: 'uploaded by Mira K.', mode: 'Snapshot', synced: 'Imported Oct 18', usedBy: 'Launch Planner', status: 'Snapshot', t: 'quiet',
        banner: 'Snapshot - will not update. A newer version (v4 draft) exists in this project.',
        events: [['Imported and indexed 24 pages', 'Oct 18', N]],
        deps: '1 agent 2 conversations', primary: 'Replace with v4' },
      { id: 'mail', name: 'Customer emails - pricing', origin: 'Gmail 9 threads', owner: 'private to you', mode: 'Snapshot', synced: 'Imported Oct 21', usedBy: 'Research Analyst', status: 'Snapshot', t: 'quiet',
        banner: 'Snapshot of 9 threads. Private - only shared as a summary if its conversation moves to a project.',
        events: [['Imported and indexed 9 threads', 'Oct 21', N]],
        deps: 'Pricing memo draft (private)', primary: 'Re-import' }
    ];
    const selId = this.state.selected;
    const rows = sources.map((s) => ({
      ...s,
      pressed: s.id === selId ? 'true' : 'false',
      pick: () => this.setState({ selected: s.id }),
      rowStyle: 'display: grid; grid-template-columns: 2fr 1.2fr 1.4fr 2fr 1.2fr; align-items: center; border-bottom: 1px solid #F0F0ED; background: ' + (s.id === selId ? '#F3F6FA' : 'transparent'),
      statusStyle: 'display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; ' + tone[s.t]
    }));
    const s = sources.find((x) => x.id === selId) || sources[0];
    const bannerTone = { warn: 'background: #FBF3E4; color: #4A3A20', busy: 'background: #F3F6FA; color: #1F3F60', ok: 'background: #EEF6F1; color: #1A4A33', quiet: 'background: #F4F4F1; color: #3A3C41' };
    const sel = {
      ...s,
      bannerStyle: 'padding: 10px 12px; border-radius: 10px; font-size: 13px; ' + bannerTone[s.t],
      events: s.events.map(([text, time, c]) => ({ text, time, dotStyle: dot(c) }))
    };
    return { rows, sel };
  }
}
</script>
</body>
</html>
