<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operations - Usage</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1080px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Workspace nav -->
  <nav aria-label="Workspace" style="flex: 1 1 220px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>
      <a href="Main.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Spring Launch</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Q4 Research</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Onboarding Revamp</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Library</div>
      <a href="Skills.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>Skills</a>
      <a href="Memory.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Memory</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Operations</div>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 2h6l1-2h5"></path></svg>Needs you<span style="margin-left: auto; font-size: 12px; font-weight: 600; background: #2E5B88; color: #FFFFFF; border-radius: 999px; padding: 0 7px">3</span></a>
      <a href="OpsAgents.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>Agents</a>
      <a href="AgentComms.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>Agent network</a>
      <a href="OpsContext.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Context health<span style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #B86E00" aria-label="1 source needs attention"></span></a>
      <a href="Policies.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>Policies</a>
      <a href="Usage.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none; background: #FFFFFF; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17V4"></path></svg>Usage</a>
      <a href="AuditLog.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>Audit log</a>
    </div>
    <a href="UserSettings.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; color: #1B1C1E; text-decoration: none">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #C9C3DD; color: #1B1C1E; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">AP</span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600; font-size: 13px">Avery Park</span><span style="font-size: 12px; color: #5F6168">Your settings</span></span>
    </a>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Usage</h1>
        <div style="color: #3A3C41">How much agent work ran, how often it finished without a person, and where budgets stand.</div>
      </div>
      <div role="group" aria-label="Period" style="display: flex; border: 1px solid #D5D5D0; border-radius: 8px; overflow: hidden; background: #FFFFFF">
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; background: #FFFFFF; color: #3A3C41; font-size: 13px; cursor: pointer">7 days</button>
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; background: #1B1C1E; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">14 days</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; background: #FFFFFF; color: #3A3C41; font-size: 13px; cursor: pointer">30 days</button>
      </div>
    </div>

    <!-- Stat tiles -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Agent runs</span><span style="font-size: 22px; font-weight: 600">314</span><span style="font-size: 12px; color: #5F6168">Oct 10 – Oct 23</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Completed without help</span><span style="font-size: 22px; font-weight: 600">263</span><span style="font-size: 12px; color: #5F6168">84% of runs</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Needed a person</span><span style="font-size: 22px; font-weight: 600">47</span><span style="font-size: 12px; color: #5F6168">Decisions and permissions</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Failed</span><span style="font-size: 22px; font-weight: 600; color: #8C2F22">4</span><span style="font-size: 12px; color: #5F6168">3 from one expired source</span>
      </div>
    </div>

    <!-- Runs per day chart -->
    <section aria-labelledby="runs-title" style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap">
        <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 2px">
          <h2 id="runs-title" style="margin: 0; font-size: 15px; font-weight: 600">Runs per day</h2>
          <span style="font-size: 13px; color: #3A3C41">Weekday work is steady; people were needed on 1 run in 6.</span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: #3A3C41">
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2A62A8"></span>Completed without help</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #C77A2E"></span>Needed a person</span>
        </div>
        <button type="button" onClick="{{ toggleTable }}" aria-pressed="{{ tableStr }}" style="height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-size: 12px; cursor: pointer">{{ tableLabel }}</button>
      </div>

      <!-- Readout (hover / focus a day) -->
      <div aria-live="polite" style="font-size: 13px; color: #1B1C1E; min-height: 20px"><strong style="font-weight: 600">{{ readout.date }}</strong><span style="color: #3A3C41"> {{ readout.total }} runs {{ readout.done }} completed without help {{ readout.need }} needed a person</span></div>

      <sc-if value="{{ showChart }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; gap: 8px">
          <!-- y axis -->
          <div aria-hidden="true" style="position: relative; width: 24px; height: 200px; font-size: 11px; color: #5F6168; flex: 0 0 auto">
            <span style="position: absolute; right: 0; bottom: 192px">40</span>
            <span style="position: absolute; right: 0; bottom: 142px">30</span>
            <span style="position: absolute; right: 0; bottom: 92px">20</span>
            <span style="position: absolute; right: 0; bottom: 42px">10</span>
            <span style="position: absolute; right: 0; bottom: -8px">0</span>
          </div>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="position: relative; height: 200px">
              <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 200px; height: 1px; background: #F0F0ED"></div>
              <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 150px; height: 1px; background: #F0F0ED"></div>
              <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 100px; height: 1px; background: #F0F0ED"></div>
              <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 50px; height: 1px; background: #F0F0ED"></div>
              <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: #D5D5D0"></div>
              <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); align-items: end">
                <sc-for list="{{ days }}" as="d" hint-placeholder-count="14">
                  <button type="button" aria-label="{{ d.aria }}" onMouseEnter="{{ d.pick }}" onFocus="{{ d.pick }}" onClick="{{ d.pick }}" style="{{ d.colStyle }}">
                    <span style="{{ d.needStyle }}"></span>
                    <span style="{{ d.doneStyle }}"></span>
                  </button>
                </sc-for>
              </div>
            </div>
            <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); font-size: 11px; color: #5F6168; text-align: center">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="14">
                <span style="{{ d.labelStyle }}">{{ d.short }}</span>
              </sc-for>
            </div>
            <div style="font-size: 11px; color: #5F6168; text-align: center">October weekends shaded lighter</div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ showTable }}" hint-placeholder-val="{{ false }}">
        <div role="table" aria-label="Runs per day" style="border: 1px solid #E2E2DE; border-radius: 8px; overflow-x: auto; font-size: 13px">
          <div role="row" style="display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); min-width: 460px; color: #5F6168; font-size: 12px; border-bottom: 1px solid #E2E2DE">
            <span role="columnheader" style="padding: 8px 12px">Day</span><span role="columnheader" style="padding: 8px 12px">Runs</span><span role="columnheader" style="padding: 8px 12px">Completed without help</span><span role="columnheader" style="padding: 8px 12px">Needed a person</span>
          </div>
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="14">
            <div role="row" style="display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); min-width: 460px; border-bottom: 1px solid #F0F0ED">
              <span role="cell" style="padding: 8px 12px">{{ d.date }}</span><span role="cell" style="padding: 8px 12px">{{ d.total }}</span><span role="cell" style="padding: 8px 12px">{{ d.done }}</span><span role="cell" style="padding: 8px 12px">{{ d.need }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <div style="font-size: 12px; color: #5F6168">Failed runs (4) are left out of the bars and listed per agent below.</div>
    </section>

    <!-- Budgets by project -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Run budgets October to date</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
        <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="font-weight: 600; flex: 1 1 auto">Spring Launch</span><span style="font-size: 13px; color: #3A3C41">412 of 600</span></div>
          <div role="meter" aria-label="Spring Launch runs used" aria-valuemin="0" aria-valuemax="600" aria-valuenow="412" style="height: 8px; border-radius: 4px; background: #EEEEEB; overflow: hidden"><div style="width: 69%; height: 100%; border-radius: 4px; background: #2A62A8"></div></div>
          <span style="font-size: 12px; color: #6B4100">69% used with 8 days left on pace to reach 100% Oct 29</span>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="font-weight: 600; flex: 1 1 auto">Q4 Research</span><span style="font-size: 13px; color: #3A3C41">138 of 300</span></div>
          <div role="meter" aria-label="Q4 Research runs used" aria-valuemin="0" aria-valuemax="300" aria-valuenow="138" style="height: 8px; border-radius: 4px; background: #EEEEEB; overflow: hidden"><div style="width: 46%; height: 100%; border-radius: 4px; background: #2A62A8"></div></div>
          <span style="font-size: 12px; color: #5F6168">46% used on track</span>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span style="font-weight: 600; flex: 1 1 auto">Onboarding Revamp</span><span style="font-size: 13px; color: #3A3C41">51 of 200</span></div>
          <div role="meter" aria-label="Onboarding Revamp runs used" aria-valuemin="0" aria-valuemax="200" aria-valuenow="51" style="height: 8px; border-radius: 4px; background: #EEEEEB; overflow: hidden"><div style="width: 26%; height: 100%; border-radius: 4px; background: #2A62A8"></div></div>
          <span style="font-size: 12px; color: #5F6168">26% used agent paused until Oct 28</span>
        </div>
      </div>
    </section>

    <!-- By agent -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">By agent last 14 days</h2>
      <div role="table" aria-label="Usage by agent" style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; overflow-x: auto; font-size: 13px">
        <div role="row" style="display: grid; grid-template-columns: minmax(200px, 2fr) repeat(5, minmax(100px, 1fr)); min-width: 820px; color: #5F6168; font-size: 12px; border-bottom: 1px solid #E2E2DE">
          <span role="columnheader" style="padding: 10px 16px">Agent</span>
          <span role="columnheader" style="padding: 10px 12px; text-align: right">Runs</span>
          <span role="columnheader" style="padding: 10px 12px; text-align: right">Completed alone</span>
          <span role="columnheader" style="padding: 10px 12px; text-align: right">Avg run time</span>
          <span role="columnheader" style="padding: 10px 12px; text-align: right">Handoffs out</span>
          <span role="columnheader" style="padding: 10px 16px 10px 12px">Last failure</span>
        </div>
        <sc-for list="{{ agents }}" as="a" hint-placeholder-count="6">
          <div role="row" style="display: grid; grid-template-columns: minmax(200px, 2fr) repeat(5, minmax(100px, 1fr)); min-width: 820px; align-items: center; border-bottom: 1px solid #F0F0ED">
            <span role="cell" style="padding: 10px 16px">
              <a href="AgentDetail.html" style="display: inline-flex; align-items: center; gap: 10px; color: #1B1C1E; text-decoration: none">
                <span style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 7px; background: #E3E8EE; color: #2E5B88; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ a.initials }}</span>
                <span style="font-weight: 600">{{ a.name }}</span>
              </a>
            </span>
            <span role="cell" style="padding: 10px 12px; text-align: right; font-variant-numeric: tabular-nums">{{ a.runs }}</span>
            <span role="cell" style="padding: 10px 12px; text-align: right; font-variant-numeric: tabular-nums">{{ a.alone }}</span>
            <span role="cell" style="padding: 10px 12px; text-align: right; font-variant-numeric: tabular-nums">{{ a.avg }}</span>
            <span role="cell" style="padding: 10px 12px; text-align: right; font-variant-numeric: tabular-nums">{{ a.handoffs }}</span>
            <span role="cell" style="{{ a.failStyle }}">{{ a.fail }}</span>
          </div>
        </sc-for>
      </div>
    </section>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hover: 12, table: false };
  }
  renderVals() {
    const PX = 5; // 5px per run, 200px = 40 runs
    const raw = [
      [10, 6, 1, true], [11, 5, 0, true], [12, 22, 4, false], [13, 24, 3, false], [14, 21, 5, false],
      [15, 26, 4, false], [16, 23, 3, false], [17, 7, 1, true], [18, 6, 0, true], [19, 25, 5, false],
      [20, 27, 4, false], [21, 24, 6, false], [22, 28, 5, false], [23, 19, 6, false]
    ];
    const blue = '#2A62A8', orange = '#C77A2E';
    const h = this.state.hover;
    const days = raw.map(([day, done, need, weekend], i) => {
      const on = i === h;
      const op = weekend ? 0.55 : 1;
      return {
        date: 'Oct ' + day, short: String(day), done, need, total: done + need,
        aria: 'Oct ' + day + ': ' + done + ' completed without help, ' + need + ' needed a person',
        pick: () => this.setState({ hover: i }),
        colStyle: 'height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: ' + (need ? 2 : 0) + 'px; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 6px 6px 0 0; background: ' + (on ? '#F3F6FA' : 'transparent'),
        needStyle: 'display: block; width: 55%; max-width: 30px; height: ' + (need * PX) + 'px; border-radius: 4px 4px 0 0; background: ' + orange + '; opacity: ' + op,
        doneStyle: 'display: block; width: 55%; max-width: 30px; height: ' + (done * PX) + 'px; border-radius: ' + (need ? '0' : '4px 4px 0 0') + '; background: ' + blue + '; opacity: ' + op,
        labelStyle: 'font-weight: ' + (on ? '600' : '400') + '; color: ' + (on ? '#1B1C1E' : '#5F6168')
      };
    });
    const r = days[h];
    const agents = [
      { initials: 'MA', name: 'Monitor Agent', runs: 128, alone: '98%', avg: '12 s', handoffs: 9, fail: 'None', bad: false },
      { initials: 'LP', name: 'Launch Planner', runs: 62, alone: '69%', avg: '3 m 40 s', handoffs: 6, fail: 'None', bad: false },
      { initials: 'RA', name: 'Research Analyst', runs: 47, alone: '89%', avg: '6 m 10 s', handoffs: 1, fail: 'Oct 16 page timed out', bad: false },
      { initials: 'OA', name: 'Ops Agent', runs: 41, alone: '61%', avg: '1 m 55 s', handoffs: 0, fail: 'None', bad: false },
      { initials: 'MD', name: 'Media Analyst', runs: 22, alone: '73%', avg: '2 m 05 s', handoffs: 0, fail: 'Today 8:10 source access expired (3)', bad: true },
      { initials: 'OB', name: 'Onboarding Guide', runs: 14, alone: '86%', avg: '4 m 30 s', handoffs: 0, fail: 'None', bad: false }
    ].map((a) => ({ ...a, failStyle: 'padding: 10px 16px 10px 12px; font-size: 12px; color: ' + (a.bad ? '#8C2F22' : '#5F6168') + '; font-weight: ' + (a.bad ? '600' : '400') }));
    const t = this.state.table;
    return {
      days, agents,
      readout: { date: r.date, total: r.total, done: r.done, need: r.need },
      showChart: !t, showTable: t,
      tableStr: t ? 'true' : 'false',
      tableLabel: t ? 'Show chart' : 'Show as table',
      toggleTable: () => this.setState({ table: !t })
    };
  }
}
</script>
