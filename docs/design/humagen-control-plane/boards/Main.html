<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Humagen - Launch impact conversation</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 980px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- LEFT: project navigation -->
  <nav aria-label="Projects" style="flex: 1 1 260px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>

    <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 8px; padding: 0 10px; height: 36px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="Search projects and conversations" aria-label="Search" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 13px; width: 100%; color: #1B1C1E">
    </label>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>

      <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        Spring Launch
        <span style="margin-left: auto; font-size: 12px; font-weight: 500; color: #5F6168">8 people · 4 agents</span>
      </a>
      <div style="display: flex; flex-direction: column; gap: 1px; padding-left: 22px">
        <a href="#" style="padding: 6px 8px; border-radius: 6px; text-decoration: none; color: #3A3C41"># planning</a>
        <a href="#" style="padding: 6px 8px; border-radius: 6px; text-decoration: none; color: #3A3C41"># pricing</a>
        <a href="#" aria-current="page" style="padding: 6px 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E; background: #FFFFFF; font-weight: 600"># launch-ops</a>

        <!-- conversations in the subchannel, with participating agents -->
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px 0 6px 12px; border-left: 1px solid #DADAD5; margin-left: 10px">
          <a href="#" style="display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E; background: #E3E8EE">
            <span style="font-weight: 600; font-size: 13px">Supplier delay - launch impact</span>
            <span style="display: flex; align-items: center; gap: 4px">
              <span title="Monitor Agent" style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #C9D5E2">MA</span>
              <span title="Launch Planner" style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #C9D5E2">LP</span>
              <span title="Ops Agent" style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #C9D5E2">OA</span>
              <span style="font-size: 12px; color: #3A3C41; margin-left: 4px">Needs your decision</span>
            </span>
          </a>
          <a href="#" style="display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
            <span style="font-size: 13px">Vendor notice templates</span>
            <span style="display: flex; align-items: center; gap: 4px">
              <span title="Ops Agent" style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #C9D5E2">OA</span>
              <span style="font-size: 12px; color: #5F6168; margin-left: 4px">Drafted · yesterday</span>
            </span>
          </a>
          <a href="#" style="display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
            <span style="font-size: 13px">Warehouse capacity check</span>
            <span style="display: flex; align-items: center; gap: 4px">
              <span style="font-size: 12px; color: #5F6168">People only · Oct 20</span>
            </span>
          </a>
        </div>
      </div>

      <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        Q4 Research
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        Onboarding Revamp
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Private</div>
      <a href="#" style="display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">
        <span style="font-size: 13px">Pricing memo draft</span>
        <span style="display: flex; align-items: center; gap: 4px">
          <span title="Research Analyst" style="width: 18px; height: 18px; border-radius: 5px; background: #FFFFFF; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #C9D5E2">RA</span>
          <span style="font-size: 12px; color: #5F6168; margin-left: 4px">Only you · Add to project</span>
        </span>
      </a>
    </div>

    <button type="button" style="margin-top: auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border: 1px dashed #C8C8C2; border-radius: 8px; background: transparent; color: #3A3C41; font-size: 13px; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New conversation
    </button>
  </nav>

  <!-- MAIN -->
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #FFFFFF">

    <!-- Header: breadcrumb left, title centered, controls right -->
    <header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 20px; height: 60px; border-bottom: 1px solid #E2E2DE">
      <div style="font-size: 13px; color: #5F6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Spring Launch / # launch-ops</div>
      <h1 style="margin: 0; font-size: 15px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw">Supplier delay - launch impact</h1>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px">
        <a href="Context.html" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #E2E2DE; text-decoration: none; color: #1B1C1E; font-size: 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
          Context 5
          <span style="width: 7px; height: 7px; border-radius: 50%; background: #B86E00" aria-label="1 source needs attention"></span>
        </a>
        <button type="button" aria-label="People and agents: 3 people, 3 agents" style="display: inline-flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 8px; border: 1px solid #E2E2DE; background: #FFFFFF; cursor: pointer">
          <span style="width: 22px; height: 22px; border-radius: 50%; background: #D9C7B4; color: #1B1C1E; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">MK</span>
          <span style="width: 22px; height: 22px; border-radius: 50%; background: #BFD3C6; color: #1B1C1E; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -6px">JT</span>
          <span style="width: 22px; height: 22px; border-radius: 6px; background: #E3E8EE; color: #2E5B88; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF; margin-left: -6px">+4</span>
        </button>
        <a href="Activity.html" aria-label="Conversation settings and Activity" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E2E2DE; color: #1B1C1E">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </a>
      </div>
    </header>

    <!-- Thread -->
    <div style="flex: 1 1 auto; padding: 28px 20px 16px; display: flex; flex-direction: column; align-items: center">
      <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 24px">

        <!-- source-change event -->
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5F6168">
          <span style="flex: 1 1 auto; height: 1px; background: #E2E2DE"></span>
          <span style="display: inline-flex; align-items: center; gap: 6px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
            Supplier ETA sheet changed · live sync 9:42
          </span>
          <span style="flex: 1 1 auto; height: 1px; background: #E2E2DE"></span>
        </div>

        <!-- Agent message: outcome first -->
        <article style="display: flex; gap: 12px">
          <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">LP</div>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
              <span style="font-weight: 600">Launch Planner</span>
              <span style="font-size: 12px; color: #2E5B88; background: #E3E8EE; padding: 1px 6px; border-radius: 4px">Agent · Plan owner</span>
              <span style="font-size: 12px; color: #5F6168">9:51 · with Monitor Agent</span>
            </div>

            <div style="border: 1px solid #E2E2DE; border-radius: 12px; overflow: hidden">
              <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
                <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Recommendation</div>
                <div style="font-size: 17px; font-weight: 600; line-height: 1.35">Move the launch from Nov 12 to Nov 19.</div>
                <div style="color: #3A3C41">Packaging now arrives Nov 8, four days late. That leaves no buffer for retail fulfilment; the press embargo and paid media can still hold, with one change.</div>
              </div>

              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #E2E2DE">
                <div style="padding: 14px 18px; border-right: 1px solid #E2E2DE; display: flex; flex-direction: column; gap: 6px">
                  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Deliverables</div>
                  <a href="#" style="display: flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 500">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5"></path></svg>
                    Launch plan v4 (draft)
                  </a>
                  <a href="#" style="display: flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 500">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2"></circle><circle cx="18" cy="6" r="2"></circle><circle cx="12" cy="18" r="2"></circle><path d="M7.5 7.5l3.5 9M16.5 7.5l-3.5 9"></path></svg>
                    Dependency map · 5 affected
                  </a>
                </div>
                <div style="padding: 14px 18px; display: flex; flex-direction: column; gap: 6px">
                  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Next action</div>
                  <div>Ops Agent sends vendor notices once the new date is approved.</div>
                </div>
              </div>

              <!-- Decision -->
              <div style="border-top: 1px solid #E2E2DE; background: #FAFAF8; padding: 14px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
                <sc-if value="{{ notApproved }}" hint-placeholder-val="{{ true }}">
                  <div style="flex: 1 1 220px; font-weight: 500">Decision needed from you: approve Nov 19?</div>
                  <div style="display: flex; gap: 8px">
                    <button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-weight: 500; cursor: pointer">Redirect</button>
                    <button type="button" onClick="{{ approve }}" style="height: 36px; padding: 0 16px; border-radius: 8px; border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 600; cursor: pointer">Approve date</button>
                  </div>
                </sc-if>
                <sc-if value="{{ approved }}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; align-items: center; gap: 8px; color: #1F6B45; font-weight: 500">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
                    You approved Nov 19 · Ops Agent is preparing vendor notices
                  </div>
                </sc-if>
              </div>

              <!-- Evidence + expandable steps -->
              <div style="border-top: 1px solid #E2E2DE; padding: 12px 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px">
                <span style="color: #5F6168">Evidence</span>
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1F7A4D"></span>Supplier ETA · live 9:42</span>
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">Launch plan v3 · snapshot Oct 18</span>
                <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">Retail calendar · live 9:30</span>
                <button type="button" onClick="{{ toggleSteps }}" aria-expanded="{{ stepsOpenStr }}" style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px; border: 0; background: transparent; color: #2E5B88; font-size: 12px; font-weight: 600; cursor: pointer">
                  {{ stepsLabel }}
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                </button>
              </div>

              <sc-if value="{{ stepsOpen }}" hint-placeholder-val="{{ false }}">
                <ol style="margin: 0; padding: 4px 18px 16px 40px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #3A3C41; border-top: 1px solid #F0F0ED">
                  <li><strong style="color: #1B1C1E">Monitor Agent</strong> detected ETA change for packaging (Nov 4 → Nov 8).</li>
                  <li>Handed off to <strong style="color: #1B1C1E">Launch Planner</strong> with the diff and affected SKUs.</li>
                  <li>Checked 5 dependencies against the retail calendar and launch plan v3.</li>
                  <li>Compared two options: hold Nov 12 with partial stock, or move to Nov 19.</li>
                  <li>Asked <strong style="color: #1B1C1E">Ops Agent</strong> to draft vendor notices (held for approval).</li>
                  <li>Wrote launch plan v4 and this recommendation. <a href="Activity.html">Full Activity</a></li>
                </ol>
              </sc-if>
            </div>
          </div>
        </article>

        <!-- Person reply -->
        <article style="display: flex; gap: 12px">
          <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #D9C7B4; color: #1B1C1E; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">MK</div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-weight: 600">Mira K.</span><span style="font-size: 12px; color: #5F6168">9:58</span></div>
            <div>Can we keep the press embargo on the 12th and just shift retail availability?</div>
          </div>
        </article>

        <!-- Agent short answer -->
        <article style="display: flex; gap: 12px">
          <div style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">LP</div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap"><span style="font-weight: 600">Launch Planner</span><span style="font-size: 12px; color: #5F6168">9:59</span></div>
            <div>Yes. Embargo can hold on Nov 12 if the announcement says “available Nov 19”. I’ve added that as option B in plan v4 - paid media would shift by one week.</div>
          </div>
        </article>
      </div>
    </div>

    <!-- Compact composer -->
    <div style="padding: 12px 20px 20px; display: flex; justify-content: center">
      <form style="width: 100%; max-width: 760px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border: 1px solid #D5D5D0; border-radius: 12px; padding: 6px 6px 6px 12px; background: #FFFFFF">
        <label for="composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
        <input id="composer" type="text" placeholder="Reply, or @mention an agent to assign work" style="flex: 1 1 200px; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 14px; height: 36px; color: #1B1C1E; background: transparent">
        <div style="display: flex; align-items: center; gap: 2px; margin-left: auto">
          <button type="button" aria-label="Attach context" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.8a1.7 1.7 0 0 1-2.4-2.4l8-8"></path></svg>
          </button>
          <button type="button" aria-label="Mention an agent" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path></svg>
          </button>
          <button type="submit" aria-label="Send" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
