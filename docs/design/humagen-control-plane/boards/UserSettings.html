<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your settings - Avery Park</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1160px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Canonical workspace nav -->
  <nav aria-label="Workspace" style="flex: 1 1 220px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>
      <a href="Main.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Spring Launch</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Q4 Research</a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Onboarding Revamp</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Library</div>
      <a href="Skills.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>Skills</a>
      <a href="Memory.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Memory</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Operations</div>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 2h6l1-2h5"></path></svg>Needs you<span style="margin-left: auto; font-size: 12px; font-weight: 600; background: #2E5B88; color: #FFFFFF; border-radius: 999px; padding: 0 7px">3</span></a>
      <a href="OpsAgents.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>Agents</a>
      <a href="AgentComms.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>Agent network</a>
      <a href="OpsContext.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Context health<span style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #B86E00" aria-label="issues"></span></a>
      <a href="Policies.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>Policies</a>
      <a href="Usage.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 17v-5M11 17V7M16 17v-8M21 17V4"></path></svg>Usage</a>
      <a href="AuditLog.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; color: #1B1C1E; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>Audit log</a>
    </div>
    <a href="UserSettings.html" aria-current="page" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; background: #FFFFFF; color: #1B1C1E; text-decoration: none">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #C9C3DD; color: #1B1C1E; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">AP</span>
      <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 600">Avery Park</span><span style="font-size: 12px; color: #5F6168">Your settings</span></span>
    </a>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
      <span style="width: 48px; height: 48px; border-radius: 50%; background: #C9C3DD; color: #1B1C1E; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">AP</span>
      <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">You · Avery Park</h1>
        <div style="color: #3A3C41">Settings that follow you into every project. Project and workspace policies still apply on top.</div>
      </div>
      <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41; background: #FFFFFF">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Personal · only you
      </span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <!-- Settings sub-nav -->
      <div role="tablist" aria-label="Settings sections" aria-orientation="vertical" style="flex: 1 1 200px; max-width: 100%; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
          <button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
        </sc-for>
      </div>

      <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

        <!-- PROFILE -->
        <sc-if value="{{ show.profile }}" hint-placeholder-val="{{ true }}">
          <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600">Profile</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3A3C41">Name<input type="text" value="Avery Park" style="height: 38px; border: 1px solid #D5D5D0; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; color: #1B1C1E"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3A3C41">Role<input type="text" value="Product lead, Spring Launch" style="height: 38px; border: 1px solid #D5D5D0; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; color: #1B1C1E"></label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #3A3C41">How agents should brief you
              <textarea rows="3" style="border: 1px solid #D5D5D0; border-radius: 8px; padding: 10px; font: inherit; font-size: 14px; color: #1B1C1E; resize: vertical">Lead with the recommendation and the decision you need from me. Keep steps behind a toggle. Cite sources with their sync time.</textarea>
            </label>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 13px; color: #3A3C41">Default detail level</span>
              <div role="radiogroup" aria-label="Default detail level" style="display: flex; border: 1px solid #D5D5D0; border-radius: 8px; overflow: hidden; align-self: flex-start">
                <sc-for list="{{ detail }}" as="o" hint-placeholder-count="3">
                  <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
                </sc-for>
              </div>
            </div>
          </section>
        </sc-if>

        <!-- NOTIFICATIONS -->
        <sc-if value="{{ show.notifications }}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">Notifications</h2>
              <span style="font-size: 13px; color: #5F6168">What reaches you, and when. Everything else waits in Needs you.</span>
            </div>
            <div style="border: 1px solid #E2E2DE; border-radius: 10px; display: flex; flex-direction: column">
              <sc-for list="{{ notif }}" as="n" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; flex-wrap: wrap">
                  <div style="flex: 1 1 220px; display: flex; flex-direction: column"><span style="font-weight: 500">{{ n.label }}</span><span style="font-size: 12px; color: #5F6168">{{ n.hint }}</span></div>
                  <div role="radiogroup" aria-label="{{ n.label }}" style="display: flex; border: 1px solid #D5D5D0; border-radius: 8px; overflow: hidden">
                    <sc-for list="{{ n.opts }}" as="o" hint-placeholder-count="3">
                      <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
              <div style="border: 1px solid #E2E2DE; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                <span style="flex: 1 1 auto"><span style="font-weight: 500">Quiet hours</span><br><span style="font-size: 12px; color: #5F6168">7:00 pm – 8:00 am · decisions queue until morning</span></span>
                <button type="button" role="switch" aria-checked="{{ sw.quiet.on }}" aria-label="Quiet hours" onClick="{{ sw.quiet.flip }}" style="{{ sw.quiet.track }}"><span style="{{ sw.quiet.knob }}"></span></button>
              </div>
              <div style="border: 1px solid #E2E2DE; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>
                <span style="flex: 1 1 auto"><span style="font-weight: 500">Also send by email</span><br><span style="font-size: 12px; color: #5F6168">In-app always on · email for Immediately items</span></span>
                <button type="button" role="switch" aria-checked="{{ sw.email.on }}" aria-label="Also send by email" onClick="{{ sw.email.flip }}" style="{{ sw.email.track }}"><span style="{{ sw.email.knob }}"></span></button>
              </div>
            </div>
          </section>
        </sc-if>

        <!-- MY AGENTS -->
        <sc-if value="{{ show.agents }}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
              <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px">
                <h2 style="margin: 0; font-size: 16px; font-weight: 600">My agents</h2>
                <span style="font-size: 13px; color: #5F6168">Agents that work only for you. Add one to a project to share it with the team.</span>
              </div>
              <a href="CreateAgent.html" style="height: 36px; padding: 0 14px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New personal agent</a>
            </div>
            <sc-for list="{{ myAgents }}" as="a" hint-placeholder-count="2">
              <div style="border: 1px solid #E2E2DE; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
                  <span style="width: 36px; height: 36px; border-radius: 9px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ a.initials }}</span>
                  <div style="flex: 1 1 200px; display: flex; flex-direction: column"><span style="font-weight: 600">{{ a.name }}</span><span style="font-size: 12px; color: #5F6168">{{ a.role }}</span></div>
                  <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41; background: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Personal</span>
                  <span style="{{ a.statusStyle }}">{{ a.status }}</span>
                </div>
                <div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 13px">
                  <span style="color: #5F6168">Working on</span><span>{{ a.now }}</span>
                  <span style="color: #5F6168">Autonomy</span><span>{{ a.autonomy }}</span>
                  <span style="color: #5F6168">Uses</span><span>{{ a.uses }}</span>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap">
                  <button type="button" onClick="{{ a.toggle }}" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-size: 13px; cursor: pointer">{{ a.toggleLabel }}</button>
                  <a href="MoveConversation.html" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center">Add to a project</a>
                  <a href="AgentDetail.html" style="height: 34px; padding: 0 8px; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center">Settings</a>
                </div>
              </div>
            </sc-for>
          </section>
        </sc-if>

        <!-- SKILLS & MEMORY -->
        <sc-if value="{{ show.skills }}" hint-placeholder-val="{{ false }}">
          <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600">Skills &amp; memory</h2>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: center"><h3 style="margin: 0; flex: 1 1 auto; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Personal skills</h3><a href="Skills.html" style="font-size: 13px; font-weight: 600; text-decoration: none">Open library</a></div>
              <div style="border: 1px solid #E2E2DE; border-radius: 10px; display: flex; flex-direction: column">
                <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #F0F0ED">
                  <span style="width: 28px; height: 28px; border-radius: 7px; background: #ECE6F4; color: #563A80; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg></span>
                  <span style="flex: 1 1 auto"><span style="font-weight: 500">Write my weekly update</span><br><span style="font-size: 12px; color: #5F6168">My format: outcomes, risks, asks · used by Research Analyst</span></span>
                  <span style="font-size: 12px; color: #5F6168">v3</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px">
                  <span style="width: 28px; height: 28px; border-radius: 7px; background: #ECE6F4; color: #563A80; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg></span>
                  <span style="flex: 1 1 auto"><span style="font-weight: 500">Competitor price scan</span><br><span style="font-size: 12px; color: #5F6168">12 pages, table + changes since last run · used by Research Analyst</span></span>
                  <span style="font-size: 12px; color: #5F6168">v1</span>
                </div>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px">
              <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Memory</h3>
              <div style="border: 1px solid #E2E2DE; border-radius: 10px; display: flex; flex-direction: column">
                <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED">
                  <span style="flex: 1 1 auto"><span style="font-weight: 500">Let agents remember how I work</span><br><span style="font-size: 12px; color: #5F6168">Preferences and corrections you give become personal memories you can review</span></span>
                  <button type="button" role="switch" aria-checked="{{ sw.remember.on }}" aria-label="Let agents remember how I work" onClick="{{ sw.remember.flip }}" style="{{ sw.remember.track }}"><span style="{{ sw.remember.knob }}"></span></button>
                </div>
                <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED">

            <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
              <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px">
                <h2 style="margin: 0; font-size: 16px; font-weight: 600">Connected accounts</h2>

              <div style="border: 1px solid #E2E2DE; border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
                <span style="width: 32px; height: 32px; border-radius: 8px; background: #EEEEEB; color: #3A3C41; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span>

                  <span style="font-size: 12px; color: #3A3C41">Access: {{ c.scope }}</span>
                  <span style="font-size: 12px; color: #5F6168">{{ c.last }}</span>
                </div>
                <span style="{{ c.statusStyle }}">{{ c.status }}</span>
                <button type="button" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-size: 13px; cursor: pointer">{{ c.action }}</button>

        <sc-if value="{{ show.privacy }}" hint-placeholder-val="{{ false }}">

            <div style="border: 1px solid #E2E2DE; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              <span style="flex: 1 1 auto"><span style="font-weight: 500">New conversations start private</span><br><span style="font-size: 12px; color: #5F6168">Only you and the agents you invite, until you add it to a project</span></span>
              <button type="button" role="switch" aria-checked="{{ sw.private.on }}" aria-label="New conversations start private" onClick="{{ sw.private.flip }}" style="{{ sw.private.track }}"><span style="{{ sw.private.knob }}"></span></button>

              <legend style="padding: 0 4px; font-size: 13px; font-weight: 500">When a private conversation joins a project, my private sources…</legend>

              <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Default autonomy for my personal agents</h3>
              <div style="border: 1px solid #E2E2DE; border-radius: 10px; display: flex; flex-direction: column">
                <sc-for list="{{ perms }}" as="p" hint-placeholder-count="4">
                  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #F0F0ED; flex-wrap: wrap">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1160}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'profile',
      detail: 'brief',
      notif: { decisions: 'now', mentions: 'now', failures: 'digest', done: 'off' },
      sw: { quiet: true, email: false, remember: true, isolate: true, private: true },
      share: 'summary',
      paused: {},
      perms: { read: 'auto', draft: 'auto', msgs: 'ask', spend: 'never' }
    };
  }
  seg(on, disabled) {
    return 'height: 32px; min-width: 64px; padding: 0 10px; border: 0; font-size: 12px; cursor: ' + (disabled ? 'not-allowed' : 'pointer') + '; background: ' + (on ? '#1B1C1E' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : (disabled ? '#8A8C92' : '#3A3C41')) + '; font-weight: ' + (on ? '600' : '400');
  }
  renderVals() {
    const s = this.state;
    const tabDefs = [['profile', 'Profile'], ['notifications', 'Notifications'], ['agents', 'My agents'], ['skills', 'Skills & memory'], ['accounts', 'Connected accounts'], ['privacy', 'Privacy & defaults']];
    const tabs = tabDefs.map(([id, label]) => {
      const on = s.tab === id;
      return { label, selected: on ? 'true' : 'false', pick: () => this.setState({ tab: id }),
        style: 'text-align: left; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; color: #1B1C1E; background: ' + (on ? '#FFFFFF' : 'transparent') + '; font-weight: ' + (on ? '600' : '400') + '; box-shadow: ' + (on ? 'inset 0 0 0 1px #E2E2DE' : 'none') };
    });
    const show = {};
    tabDefs.forEach(([id]) => { show[id] = s.tab === id; });

    const detail = [['brief', 'Brief'], ['standard', 'Standard'], ['full', 'Full steps']].map(([v, l]) => ({
      label: l, checked: s.detail === v ? 'true' : 'false', pick: () => this.setState({ detail: v }), style: this.seg(s.detail === v)
    }));

    const nOpts = [['now', 'Immediately'], ['digest', 'Daily digest'], ['off', 'Off']];
    const nRows = [
      ['decisions', 'Decisions for you', 'Approvals, redirects and choices agents can’t make'],
      ['mentions', 'Mentions', 'People or agents @mentioning you'],
      ['failures', 'Agent failures in my projects', 'Failed runs and stale sources that stop work'],
      ['done', 'Finished assignments', 'An agent completed something you assigned']
    ];
    const notif = nRows.map(([k, label, hint]) => ({
      label, hint,
      opts: nOpts.map(([v, l]) => ({ label: l, checked: s.notif[k] === v ? 'true' : 'false',
        pick: () => this.setState({ notif: { ...s.notif, [k]: v } }), style: this.seg(s.notif[k] === v) }))
    }));

    const sw = {};
    Object.keys(s.sw).forEach((k) => {
      const on = s.sw[k];
      sw[k] = {
        on: on ? 'true' : 'false',
        flip: () => this.setState({ sw: { ...s.sw, [k]: !on } }),
        track: 'flex: 0 0 auto; width: 44px; height: 26px; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; display: inline-flex; background: ' + (on ? '#2E5B88' : '#C8C8C2') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start'),
        knob: 'width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; display: block'
      };
    });

    const agentDefs = [
      { id: 'ra', initials: 'RA', name: 'Research Analyst', role: 'Pricing and market research', now: 'Summarising 12 competitor pages for Pricing memo draft', autonomy: 'Drafts freely · asks before messaging anyone', uses: 'Competitor pricing (live) · Customer emails (snapshot) · 2 personal skills' },
      { id: 'ib', initials: 'IB', name: 'Inbox Briefer', role: 'Morning brief from my email and calendar', now: 'Next run tomorrow 7:30 am', autonomy: 'Read-only', uses: 'Gmail · Google Calendar · Write my weekly update' }
    ];
    const myAgents = agentDefs.map((a) => {
      const p = !!s.paused[a.id];
      const working = a.id === 'ra' && !p;
      return { ...a,
        status: p ? 'Paused' : (working ? 'Working' : 'Scheduled'),
        statusStyle: 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; ' + (p ? 'background: #EEEEEB; color: #3A3C41' : (working ? 'background: #E3E8EE; color: #2E5B88' : 'background: #EEEEEB; color: #3A3C41')),
        toggleLabel: p ? 'Resume' : 'Pause',
        toggle: () => this.setState({ paused: { ...s.paused, [a.id]: !p } }) };
    });

    const ok = 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45';
    const warn = 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F4E6CC; color: #6B4100';
    const accounts = [
      { name: 'Gmail', scope: 'read messages you pick · draft replies (never sends)', last: 'Last used by Research Analyst · Oct 21, imported 9 threads', status: 'Connected', statusStyle: ok, action: 'Disconnect' },
      { name: 'Google Drive', scope: 'read files and folders you share', last: 'Last used by Monitor Agent · today 9:24 (Brand guidelines folder)', status: 'Connected', statusStyle: ok, action: 'Disconnect' },
      { name: 'Notion', scope: 'read pages in Launch workspace', last: 'Access expires in 3 days · Retail calendar depends on it', status: 'Expires soon', statusStyle: warn, action: 'Renew' }
    ];

    const shareDefs = [
      ['summary', 'Share a summary, keep the source private', 'Project agents see what the source said, not the source'],
      ['ask', 'Ask me each time', 'You choose per source when moving a conversation'],
      ['share', 'Share the source with the project', 'Members and project agents can open it']
    ];
    const share = shareDefs.map(([v, label, hint]) => {
      const on = s.share === v;
      return { label, hint, checked: on ? 'true' : 'false', pick: () => this.setState({ share: v }),
        style: 'display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 8px; border-radius: 8px; border: 0; cursor: pointer; font-size: 14px; color: #1B1C1E; background: ' + (on ? '#F3F6FA' : 'transparent'),
        dot: 'flex: 0 0 auto; margin-top: 3px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; border: ' + (on ? '4px solid #2E5B88' : '1.5px solid #8A8C92') };
    });

    const pRows = [['read', 'Read my connected sources', false], ['draft', 'Draft documents and replies', false], ['msgs', 'Send messages on my behalf', false], ['spend', 'Spend or commit budget', true]];
    const pOpts = [['auto', 'Allow'], ['ask', 'Ask'], ['never', 'Never']];
    const perms = pRows.map(([k, label, locked]) => ({
      label, locked,
      opts: pOpts.map(([v, l]) => {
        const on = s.perms[k] === v;
        const disabled = locked && v !== 'never';
        return { label: l, checked: on ? 'true' : 'false', disabled: disabled ? 'true' : 'false',
          pick: () => { if (!disabled) this.setState({ perms: { ...s.perms, [k]: v } }); },
          style: this.seg(on, disabled) };
      })
    }));

    return { tabs, show, detail, notif, sw, myAgents, accounts, share, perms };
  }
}
</script>
