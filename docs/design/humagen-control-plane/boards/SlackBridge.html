<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Integrations - Slack channel bridge</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1000px; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 20px; font-size: 14px; line-height: 1.45">

  <!-- Header -->
  <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
    <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 4px">
      <a href="Integrations.html" style="font-size: 13px; text-decoration: none">← Integrations</a>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 32px; height: 32px; border-radius: 8px; background: #EEEEEB; color: #3A3C41; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">SL</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Slack #launch-ops ↔ # launch-ops</h1>
      </div>
      <div style="color: #3A3C41">One conversation, two places. People keep working in Slack; Humagen keeps the outcome, the decisions and the agents.</div>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1F7A4D"></span>Bridge active · {{ dirShort }}</span>
  </div>

  <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start">

    <!-- Slack side (neutral mock) -->
    <section aria-label="Slack side" style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
      <div style="padding: 12px 16px; border-bottom: 1px solid #E2E2DE; display: flex; align-items: center; gap: 8px; background: #FAFAF8">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; flex: 1 1 auto">In Slack</span>
        <span style="font-weight: 600">#launch-ops</span>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 6px; background: #D9C7B4; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">MK</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span><strong>Mira K.</strong> <span style="font-size: 12px; color: #5F6168">9:40</span></span><span>Anyone seen the new packaging ETA?</span></div>
        </div>

        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 6px; background: #1B1C1E; color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">H</span>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span><strong>Humagen</strong> <span style="font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: #EEEEEB; color: #3A3C41">APP</span> <span style="font-size: 12px; color: #5F6168">9:51</span></span>
            <div style="border: 1px solid #E2E2DE; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; color: #5F6168">Launch Planner · recommendation</span>
              <span style="font-weight: 600">Move the launch from Nov 12 to Nov 19.</span>
              <span style="font-size: 13px; color: #3A3C41">Packaging arrives Nov 8, four days late. Plan v4 drafted; Ops Agent is holding 4 vendor notices.</span>
              <span style="font-size: 12px; color: #5F6168">Decision needed: Avery Park</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px">
                <button type="button" onClick="{{ approve }}" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 0; background: #1B1C1E; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{ approveLabel }}</button>
                <a href="Main.html" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid #D5D5D0; color: #1B1C1E; font-size: 13px; display: inline-flex; align-items: center; text-decoration: none">Open in Humagen</a>
              </div>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 6px; background: #D9C7B4; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">MK</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span><strong>Mira K.</strong> <span style="font-size: 12px; color: #5F6168">9:58</span></span><span>Can we keep the press embargo on the 12th?</span></div>
        </div>

        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 6px; background: #E2CFC0; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">DL</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span><strong>Dana L.</strong> <span style="font-size: 12px; color: #5F6168">10:04 · external</span></span><span>We can do Nov 19 on our side.</span></div>
        </div>
      </div>
    </section>

    <!-- Bridge arrow -->
    <div aria-hidden="true" style="flex: 0 0 auto; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #5F6168; font-size: 12px; padding: 0 4px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
      <span>{{ dirArrow }}</span>
    </div>

    <!-- Humagen side -->
    <section aria-label="Humagen side" style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
      <div style="padding: 12px 16px; border-bottom: 1px solid #E2E2DE; display: flex; align-items: center; gap: 8px; background: #FAFAF8">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; flex: 1 1 auto">In Humagen</span>
        <span style="font-weight: 600">Spring Launch / # launch-ops</span>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #D9C7B4; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">MK</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><strong>Mira K.</strong><span style="font-size: 12px; color: #5F6168">9:40</span><span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41">via Slack</span></span><span>Anyone seen the new packaging ETA?</span></div>
        </div>

        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">LP</span>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><strong>Launch Planner</strong><span style="font-size: 12px; color: #5F6168">9:51</span><span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41">Posted to Slack</span></span>
            <div style="border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Recommendation</span>
              <span style="font-weight: 600; font-size: 15px">Move the launch from Nov 12 to Nov 19.</span>
              <span style="font-size: 12px; color: #5F6168">Outcome only crosses to Slack · 6 steps stay in Activity</span>
              <sc-if value="{{ approved }}" hint-placeholder-val="{{ false }}">
                <span style="display: flex; align-items: center; gap: 6px; color: #1F6B45; font-weight: 500; font-size: 13px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
                  Avery approved from Slack · logged here
                </span>
              </sc-if>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #D9C7B4; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">MK</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><strong>Mira K.</strong><span style="font-size: 12px; color: #5F6168">9:58</span><span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41">via Slack</span></span><span>Can we keep the press embargo on the 12th?</span></div>
        </div>

        <div style="display: flex; gap: 10px">
          <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; border: 1.5px dashed #8A8C92; box-sizing: border-box; font-size: 12px; font-weight: 600; color: #3A3C41; display: inline-flex; align-items: center; justify-content: center">DL</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><strong>Dana L.</strong><span style="font-size: 12px; color: #5F6168">10:04</span><span style="font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: #EEEEEB; color: #3A3C41">Guest · from Slack</span></span><span>We can do Nov 19 on our side.</span></div>
        </div>
      </div>
    </section>
  </div>

  <!-- Settings -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Direction</h2>
      <div role="radiogroup" aria-label="Bridge direction" style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ dirs }}" as="d" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{ d.checked }}" onClick="{{ d.pick }}" style="{{ d.style }}">
            <span style="{{ d.radioStyle }}"></span>
            <span style="display: flex; flex-direction: column; text-align: left"><span style="font-weight: 600; font-size: 13px">{{ d.name }}</span><span style="font-size: 12px; color: #5F6168">{{ d.desc }}</span></span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">What crosses</h2>
      <sc-for list="{{ crosses }}" as="c" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px">
          <span style="{{ c.markStyle }}">{{ c.mark }}</span>
          <span style="flex: 1 1 auto">{{ c.name }}</span>
          <span style="font-size: 12px; color: #5F6168">{{ c.note }}</span>
        </div>
      </sc-for>
      <div style="font-size: 12px; color: #3A3C41; border-top: 1px solid #F0F0ED; padding-top: 10px">Activity steps and private sources never cross. Agent posts to Slack follow the policy “Message people outside the project”.</div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Threads and mentions</h2>
      <div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 13px">
        <span style="color: #5F6168">Threads</span><span>Each Slack thread ↔ one Humagen conversation</span>
        <span style="color: #5F6168">New top-level</span><span>Starts a conversation in # launch-ops</span>
        <span style="color: #5F6168">Agents may @</span><span>Members of Spring Launch only · never guests</span>
        <span style="color: #5F6168">Decisions</span><span>Approve in either place · logged once</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #FAFAF8; border: 1px solid #E2E2DE; font-size: 13px; flex-wrap: wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3C41" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"></path><circle cx="18" cy="7" r="2"></circle><circle cx="15" cy="17" r="2"></circle></svg>
        <span style="flex: 1 1 auto">Rule: channels starting <strong>#launch-</strong> → Spring Launch</span>
        <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E3E8EE; color: #2E5B88">Suggest</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">People</h2>
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px">
          <span style="flex: 1 1 auto">{{ p.slack }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="flex: 1 1 auto">{{ p.hg }}</span>
          <span style="{{ p.tagStyle }}">{{ p.tag }}</span>
        </div>
      </sc-for>
      <div style="font-size: 12px; color: #3A3C41; border-top: 1px solid #F0F0ED; padding-top: 10px">Matched by work email. Guests can read and reply in Slack; they can’t approve decisions or see project context.</div>
    </section>
  </div>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dir: 'two', approved: false };
  }
  renderVals() {
    const s = this.state;
    const DIRS = {
      two: { name: 'Two-way', desc: 'Messages flow both ways; outcomes and decisions post to Slack', short: 'two-way', arrow: 'two-way' },
      in: { name: 'Slack → Humagen only', desc: 'Slack messages become context; nothing posts back', short: 'Slack in', arrow: 'Slack in' },
      out: { name: 'Humagen → Slack, outcomes only', desc: 'Only outcome cards and decisions post to Slack', short: 'outcomes out', arrow: 'outcomes out' }
    };
    const radio = (on) => 'flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; border: ' + (on ? '5px solid #2E5B88' : '1.5px solid #8A8C92') + '; background: #FFFFFF';
    const dirs = Object.keys(DIRS).map((k) => {
      const on = s.dir === k;
      return { ...DIRS[k], checked: on ? 'true' : 'false', radioStyle: radio(on), pick: () => this.setState({ dir: k }),
        style: 'display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: #1B1C1E; background: ' + (on ? '#F3F6FA' : '#FFFFFF') + '; border: ' + (on ? '1.5px solid #2E5B88' : '1px solid #E2E2DE') };
    });
    const yes = 'width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #E6F2EC; color: #1F6B45';
    const no = 'width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #EEEEEB; color: #3A3C41';
    const inOn = s.dir !== 'out', outMsgs = s.dir === 'two', outOutcomes = s.dir !== 'in';
    const row = (name, on, note) => ({ name, note, mark: on ? '✓' : '–', markStyle: on ? yes : no });
    const crosses = [
      row('Human messages, Slack → Humagen', inOn, inOn ? 'as context' : 'off'),
      row('Human messages, Humagen → Slack', outMsgs, outMsgs ? 'members only' : 'off'),
      row('Agent outcome cards', outOutcomes, outOutcomes ? 'summary + link' : 'off'),
      row('Decisions (approve / redirect)', outOutcomes, outOutcomes ? 'both places' : 'off'),
      row('Activity steps and tool calls', false, 'never'),
      row('Private sources', false, 'never')
    ];
    const ok = 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: #E6F2EC; color: #1F6B45';
    const guest = 'font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: #EEEEEB; color: #3A3C41';
    const people = [
      { slack: '@mira', hg: 'Mira K.', tag: 'Matched', tagStyle: ok },
      { slack: '@avery', hg: 'Avery Park', tag: 'Matched', tagStyle: ok },
      { slack: '@jon.t', hg: 'Jon T.', tag: 'Matched', tagStyle: ok },
      { slack: '@dana (vendor)', hg: 'Dana L.', tag: 'Guest · from Slack', tagStyle: guest }
    ];
    return {
      dirs, crosses, people,
      dirShort: DIRS[s.dir].short, dirArrow: DIRS[s.dir].arrow,
      approved: s.approved,
      approveLabel: s.approved ? 'Approved' : 'Approve Nov 19',
      approve: () => this.setState({ approved: true })
    };
  }
}
</script>
</body>
</html>
