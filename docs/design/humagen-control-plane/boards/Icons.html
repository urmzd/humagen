<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Identity and icons</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body class="board-fixed">
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5B88}a:hover{color:#1F4166}
</style>
</helmet>
<div style="width: 1440px; height: 1240px; box-sizing: border-box; padding: 56px; background: #F6F6F4; font-family: Inter, system-ui, sans-serif; color: #1B1C1E; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; gap: 28px">

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600">Identity &amp; icons</h1>
    <div style="color: #3A3C41">Every object has one shape, one icon and one tint, everywhere. Scope is always said in words, not colour.</div>
  </div>

  <!-- (a) Object identity -->
  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Object identity</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #D9C7B4; color: #1B1C1E; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">MK</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; display: inline-flex; gap: 6px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Person</span><span style="font-size: 12px; color: #3A3C41">Circle avatar, warm tint. Only people are round.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">LP</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; display: inline-flex; gap: 6px; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>Agent</span><span style="font-size: 12px; color: #3A3C41">Rounded square, blue tint, initials. Role shown beside the name.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #ECE6F4; color: #563A80; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Skill</span><span style="font-size: 12px; color: #3A3C41">A reusable way of doing a job. Wrench, violet tint.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E0EFEC; color: #1E5A52; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Memory</span><span style="font-size: 12px; color: #3A3C41">Something kept for later, with where it came from. Bookmark, teal tint.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #EEEEEB; color: #3A3C41; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Source</span><span style="font-size: 12px; color: #3A3C41">Context from outside. Always paired with Live or Snapshot.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Decision</span><span style="font-size: 12px; color: #3A3C41">Owned by a named person. The only thing that uses the accent fill.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: #F1ECE4; color: #6B4E2E; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Handoff</span><span style="font-size: 12px; color: #3A3C41">Work passed between agents, with its note. From → to, always.</span></div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <span style="flex: 0 0 auto; display: inline-flex; gap: 4px; color: #3A3C41">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 3L8 21M16 3l-2 18"></path></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Project Channel Conversation</span><span style="font-size: 12px; color: #3A3C41">Places, not things. Icon only, no tint.</span></div>
      </div>
    </div>
  </section>

  <!-- (b)(c)(e) -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Scope chips</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41; background: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Workspace</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41; background: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Project Spring Launch</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41; background: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>Agent Launch Planner</span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; border: 1px solid #E2E2DE; color: #3A3C41; background: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Personal Only you</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
        <span style="font-size: 12px; color: #5F6168">Settings inherit, widest first</span>
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 500">
          <span style="padding: 6px 10px; border-radius: 8px; background: #FAFAF8; border: 1px solid #E2E2DE">Workspace</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="padding: 6px 10px; border-radius: 8px; background: #FAFAF8; border: 1px solid #E2E2DE">Project</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="padding: 6px 10px; border-radius: 8px; background: #FAFAF8; border: 1px solid #E2E2DE">Agent</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="padding: 6px 10px; border-radius: 8px; background: #FAFAF8; border: 1px solid #E2E2DE">Personal</span>
        </div>
        <span style="font-size: 13px; color: #3A3C41">Narrower can tighten, never loosen. A workspace “Never” stays “Never” everywhere.</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Status pills</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; align-items: center; font-size: 12px">
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1F7A4D"></span>Live</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">Snapshot</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45">In sync</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E3E8EE; color: #2E5B88"><span style="width: 6px; height: 6px; border-radius: 50%; background: #2E5B88"></span>Working</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F4E6CC; color: #6B4100"><span style="width: 6px; height: 6px; border-radius: 50%; background: #B86E00"></span>Waiting on you</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F4E6CC; color: #6B4100">Needs attention</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F7E3DF; color: #8C2F22"><span style="width: 6px; height: 6px; border-radius: 50%; background: #A33A2B"></span>Failed</span>
        <span style="justify-self: start; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #EEEEEB; color: #3A3C41"><span style="width: 6px; height: 6px; border-radius: 50%; background: #8A8C92"></span>Paused</span>
      </div>
      <span style="font-size: 13px; color: #3A3C41">Every pill has words. Colour repeats the meaning; it never carries it alone.</span>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Sizes and rules</h2>
      <div style="display: flex; align-items: flex-end; gap: 20px; color: #1B1C1E">
        <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #5F6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>16 dense</span>
        <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #5F6168"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>18 buttons</span>
        <span style="display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: #5F6168"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1C1E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>20 nav</span>
        <span style="font-size: 12px; color: #3A3C41; margin-left: auto">24 grid stroke 1.75 round caps</span>
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
        <li style="display: flex; gap: 8px"><span style="color: #1F6B45; font-weight: 600; width: 40px; flex: 0 0 auto">Do</span><span>Pair an icon with its word in nav and buttons.</span></li>
        <li style="display: flex; gap: 8px"><span style="color: #1F6B45; font-weight: 600; width: 40px; flex: 0 0 auto">Do</span><span>Use one icon per meaning; never reuse the bot for “automation”.</span></li>
        <li style="display: flex; gap: 8px"><span style="color: #8C2F22; font-weight: 600; width: 40px; flex: 0 0 auto">Don’t</span><span>Fill icons, mix stroke widths, or use emoji or sparkles for agents.</span></li>
      </ul>
    </section>
  </div>

  <!-- (d) Icon grid -->
  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Icon set 40</h2>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="font-size: 12px; font-weight: 600">search</span><span style="font-size: 11px; color: #5F6168">Find</span></div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span style="font-size: 12px; font-weight: 600">plus</span><span style="font-size: 11px; color: #5F6168">Create, add</span></div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg><span style="font-size: 12px; font-weight: 600">close</span><span style="font-size: 11px; color: #5F6168">Dismiss</span></div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><span style="font-size: 12px; font-weight: 600">chevron-down</span><span style="font-size: 11px; color: #5F6168">Expand</span></div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span style="font-size: 12px; font-weight: 600">chevron-right</span><span style="font-size: 11px; color: #5F6168">Open, collapsed</span></div>
