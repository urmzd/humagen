<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operations - Agents</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body>
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F4}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #F6F6F4; width: 100%; min-height: 1040px; display: flex; flex-wrap: wrap; font-size: 14px; line-height: 1.45">

  <!-- Workspace nav -->
  <nav aria-label="Workspace" style="flex: 1 1 220px; max-width: 100%; background: #EFEFEC; border-right: 1px solid #E2E2DE; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">H</div>
      <div style="font-weight: 600; font-size: 15px">Humagen</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Projects</div>
      <a href="Main.html" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Spring Launch</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Q4 Research</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Onboarding Revamp</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; padding: 0 8px 6px">Operations</div>
      <a href="#" style="display: flex; align-items: center; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Needs you <span style="margin-left: auto; font-size: 12px; font-weight: 600; background: #2E5B88; color: #FFFFFF; border-radius: 999px; padding: 0 7px">3</span></a>
      <a href="OpsAgents.html" aria-current="page" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E; background: #FFFFFF; font-weight: 600">Agents</a>
      <a href="OpsContext.html" style="display: flex; align-items: center; padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Context health <span style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #B86E00" aria-label="issues"></span></a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Policies</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Usage</a>
      <a href="#" style="padding: 8px; border-radius: 6px; text-decoration: none; color: #1B1C1E">Audit log</a>
    </div>
  </nav>

  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600">Agents</h1>
        <div style="color: #3A3C41">What each agent is responsible for, what it is doing now, and how much it may do without asking.</div>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-weight: 500; cursor: pointer">Pause all</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #1B1C1E; color: #FFFFFF; font-weight: 600; cursor: pointer">New agent</button>
    </div>

    <!-- Status strip -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Working now</span><span style="font-size: 22px; font-weight: 600">2</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Waiting on people</span><span style="font-size: 22px; font-weight: 600">2</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Watching sources</span><span style="font-size: 22px; font-weight: 600">6</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5F6168">Failed runs · 24h</span><span style="font-size: 22px; font-weight: 600; color: #A33A2B">1</span>
      </div>
    </div>

    <!-- Needs you -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168">Needs you</h2>
      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #E2E2DE; flex-wrap: wrap">
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E3E8EE; color: #2E5B88">Decision</span>
          <span style="flex: 1 1 280px">Approve launch date Nov 19 <span style="color: #5F6168">· Launch Planner · Spring Launch</span></span>
          <a href="Main.html" style="font-weight: 600; text-decoration: none">Open</a>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #E2E2DE; flex-wrap: wrap">
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F4E6CC; color: #6B4100">Permission</span>
          <span style="flex: 1 1 280px">Ops Agent wants to email 4 vendors <span style="color: #5F6168">· policy: ask before external messages</span></span>
          <a href="#" style="font-weight: 600; text-decoration: none">Review drafts</a>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap">
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F7E3DF; color: #8C2F22">Failed run</span>
          <span style="flex: 1 1 280px">Media Analyst stopped: Media buy tracker access expired</span>
          <a href="OpsContext.html" style="font-weight: 600; text-decoration: none">Fix source</a>
        </div>
      </div>
    </section>

    <!-- Roster -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5F6168; flex: 1 1 auto">Roster</h2>
        <div role="group" aria-label="Filter agents" style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
            <button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="{{ f.style }}">{{ f.label }}</button>
          </sc-for>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 12px; overflow-x: auto">
        <div role="table" aria-label="Agents" style="min-width: 900px; font-size: 13px">
          <div role="row" style="display: grid; grid-template-columns: 2fr 1.3fr 2fr 1.2fr 2fr 1fr; text-align: left; color: #5F6168; font-size: 12px; border-bottom: 1px solid #E2E2DE">
            <span role="columnheader" style="padding: 10px 16px">Agent</span>
            <span role="columnheader" style="padding: 10px 12px">Projects</span>
            <span role="columnheader" style="padding: 10px 12px">Now</span>
            <span role="columnheader" style="padding: 10px 12px">Status</span>
            <span role="columnheader" style="padding: 10px 12px">Autonomy</span>
            <span role="columnheader" style="padding: 10px 16px 10px 12px">Last run</span>
          </div>
          <sc-for list="{{ rows }}" as="a" hint-placeholder-count="6">
            <div role="row" style="display: grid; grid-template-columns: 2fr 1.3fr 2fr 1.2fr 2fr 1fr; align-items: center; border-bottom: 1px solid #F0F0ED">
              <span role="cell" style="padding: 12px 16px">
                <a href="AgentDetail.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1B1C1E">
                  <span style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; background: #E3E8EE; color: #2E5B88; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ a.initials }}</span>
                  <span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{ a.name }}</span><span style="font-size: 12px; color: #5F6168">{{ a.role }}</span></span>
                </a>
              </span>
              <span role="cell" style="padding: 12px; color: #3A3C41">{{ a.projects }}</span>
              <span role="cell" style="padding: 12px; color: #3A3C41">{{ a.now }}</span>
              <span role="cell" style="padding: 12px"><span style="{{ a.statusStyle }}"><span style="{{ a.dotStyle }}"></span>{{ a.status }}</span></span>
              <span role="cell" style="padding: 12px; color: #3A3C41">{{ a.autonomy }}</span>
              <span role="cell" style="padding: 12px 16px 12px 12px; color: #5F6168; white-space: nowrap">{{ a.last }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const tones = {
      work:  { bg: '#E3E8EE', fg: '#2E5B88', dot: '#2E5B88' },
      wait:  { bg: '#F4E6CC', fg: '#6B4100', dot: '#B86E00' },
      idle:  { bg: '#EEEEEB', fg: '#3A3C41', dot: '#8A8C92' },
      error: { bg: '#F7E3DF', fg: '#8C2F22', dot: '#A33A2B' }
    };
    const all = [
      { initials: 'LP', name: 'Launch Planner', role: 'Plan owner', projects: 'Spring Launch', now: 'Waiting for approval of Nov 19', status: 'Waiting on you', tone: 'wait', group: 'needs', autonomy: 'Drafts freely · asks to change dates', last: '9:51 · done' },
      { initials: 'OA', name: 'Ops Agent', role: 'Vendor & logistics', projects: 'Spring Launch', now: 'Holding 4 vendor notices', status: 'Needs permission', tone: 'wait', group: 'needs', autonomy: 'Asks before external messages', last: '9:51 · paused' },
      { initials: 'MA', name: 'Monitor Agent', role: 'Watches sources', projects: 'All projects', now: 'Watching 6 sources', status: 'Working', tone: 'work', group: 'running', autonomy: 'Read-only · hands off changes', last: '9:42 · done' },
      { initials: 'RA', name: 'Research Analyst', role: 'Pricing research', projects: 'Q4 Research · Private', now: 'Summarising 12 competitor pages', status: 'Working', tone: 'work', group: 'running', autonomy: 'Drafts freely', last: 'Running · 3 min' },
      { initials: 'MD', name: 'Media Analyst', role: 'Paid media pacing', projects: 'Spring Launch', now: 'Stopped: source access expired', status: 'Failed', tone: 'error', group: 'needs', autonomy: 'Read-only', last: '8:10 · failed' },
      { initials: 'OB', name: 'Onboarding Guide', role: 'Docs upkeep', projects: 'Onboarding Revamp', now: 'Paused by Jon T. until Oct 28', status: 'Paused', tone: 'idle', group: 'paused', autonomy: 'Drafts freely', last: 'Oct 21 · done' }
    ];
    const f = this.state.filter;
    const rows = all.filter((a) => f === 'all' || a.group === f).map((a) => {
      const t = tones[a.tone];
      return { ...a,
        statusStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: ' + t.bg + '; color: ' + t.fg,
        dotStyle: 'width: 6px; height: 6px; border-radius: 50%; background: ' + t.dot };
    });
    const defs = [['all', 'All 6'], ['needs', 'Needs attention'], ['running', 'Working'], ['paused', 'Paused']];
    const filters = defs.map(([id, label]) => {
      const on = f === id;
      return { label, pressed: on ? 'true' : 'false', pick: () => this.setState({ filter: id }),
        style: 'height: 32px; padding: 0 12px; border-radius: 999px; font-size: 12px; cursor: pointer; border: 1px solid ' + (on ? '#1B1C1E' : '#D5D5D0') + '; background: ' + (on ? '#1B1C1E' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#1B1C1E') };
    });
    return { rows, filters };
  }
}
</script>
</body>
</html>
