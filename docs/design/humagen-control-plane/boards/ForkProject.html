<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fork a project</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body class="board-fixed">
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div role="dialog" aria-labelledby="fp-title" style="width: 640px; height: 900px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 16px; display: flex; flex-direction: column; font-size: 14px; line-height: 1.45; overflow: hidden">

  <div style="padding: 20px 24px 16px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid #E2E2DE">
    <div style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 9px; background: #EEEEEB; color: #3A3C41; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
      <h2 id="fp-title" style="margin: 0; font-size: 17px; font-weight: 600">Fork Spring Launch</h2>
      <span style="font-size: 13px; color: #5F6168">Start a new project from this one’s setup. The original is not changed.</span>
    </div>
    <button type="button" aria-label="Close" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5F6168; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="flex: 1 1 auto; overflow: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">New project name</span>
        <input type="text" value="Fall Launch" style="height: 38px; padding: 0 10px; border: 1px solid #D5D5D0; border-radius: 8px; font: inherit; color: #1B1C1E">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">Parent</span>
        <select style="height: 38px; padding: 0 8px; border: 1px solid #D5D5D0; border-radius: 8px; font: inherit; color: #1B1C1E; background: #FFFFFF">
          <option>Spring 2027 GTM (initiative)</option>
          <option selected>Fall 2027 GTM (initiative)</option>
          <option>No parent top level</option>
        </select>
      </label>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">What carries over</h3>
      <div style="border: 1px solid #E2E2DE; border-radius: 12px; display: flex; flex-direction: column">

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M5 9h14M5 15h14M10 3L8 21M16 3l-2 18"></path></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Structure</span><span style="font-size: 12px; color: #3A3C41">Copies 4 channels and 2 subchannels, empty.</span></div>
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45">Copy</span>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 7V4M9 12v1M15 12v1"></path></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Agents</span><span style="font-size: 12px; color: #3A3C41">4 agents with roles, assignments and autonomy. No run history.</span></div>
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45">Copy configs</span>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start; flex-wrap: wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#563A80" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
          <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Skills</span><span style="font-size: 12px; color: #3A3C41">{{ skillNote }}</span></div>
          <div role="radiogroup" aria-label="Skills" style="display: flex; border: 1px solid #D5D5D0; border-radius: 8px; overflow: hidden">
            <sc-for list="{{ skillOpts }}" as="o" hint-placeholder-count="2">
              <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Policies</span><span style="font-size: 12px; color: #3A3C41">Inherits from Fall 2027 GTM, then copies Spring Launch’s 2 project overrides (only if still tighter).</span></div>
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E6F2EC; color: #1F6B45">Inherit + copy</span>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start; flex-wrap: wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5A52" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
          <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Memory</span><span style="font-size: 12px; color: #3A3C41">{{ memNote }}</span></div>
          <div role="radiogroup" aria-label="Memory" style="display: flex; border: 1px solid #D5D5D0; border-radius: 8px; overflow: hidden">
            <sc-for list="{{ memOpts }}" as="o" hint-placeholder-count="2">
              <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600">Sources</span>
            <span style="font-size: 12px; color: #3A3C41">3 live sources re-linked after an access check. 2 snapshots copied as they are.</span>
            <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #F4E6CC; color: #6B4100"><span style="width: 6px; height: 6px; border-radius: 50%; background: #B86E00"></span>Media buy tracker: you don’t have access</span>
          </div>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #F0F0ED; align-items: flex-start">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M9 3v5M15 3v5"></path><path d="M6 8h12v3a6 6 0 0 1-12 0z"></path><path d="M12 17v4"></path></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Integration rules</span><span style="font-size: 12px; color: #3A3C41">2 auto-link rules (GitHub topic, Slack #launch-) copied but off until you review them, so Spring Launch’s repos aren’t pulled in twice.</span></div>
          <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #EEEEEB; color: #3A3C41">Copy, off</span>
        </div>

        <div style="display: flex; gap: 12px; padding: 12px 14px; align-items: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6168" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">Conversations</span><span style="font-size: 12px; color: #3A3C41">{{ convNote }}</span></div>
          <button type="button" role="switch" aria-checked="{{ convOnStr }}" aria-label="Copy conversations as read-only archive" onClick="{{ toggleConv }}" style="{{ switchStyle }}"><span style="{{ knobStyle }}"></span></button>
        </div>
      </div>
    </section>
  </div>

  <div style="padding: 14px 24px 18px; border-top: 1px solid #E2E2DE; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; color: #1B1C1E">{{ summary }}</div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F6168">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="18" cy="5" r="2"></circle><circle cx="12" cy="19" r="2"></circle><path d="M6 7v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7M12 12v5"></path></svg>
      Fall Launch will show “Forked from Spring Launch Oct 23”.
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-weight: 500; cursor: pointer">Cancel</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #1B1C1E; color: #FFFFFF; font-weight: 600; cursor: pointer">Fork project</button>
    </div>
  </div>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { skills: 'link', memory: 'snapshot', conv: false };
  }
  seg(opts, cur, key) {
    return opts.map(([v, l]) => {
      const on = cur === v;
      return { label: l, checked: on ? 'true' : 'false', pick: () => this.setState({ [key]: v }),
        style: 'height: 32px; padding: 0 12px; border: 0; font-size: 12px; cursor: pointer; background: ' + (on ? '#1B1C1E' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#3A3C41') + '; font-weight: ' + (on ? '600' : '400') };
    });
  }
  renderVals() {
    const s = this.state;
    const skillsLink = s.skills === 'link';
    const memSnap = s.memory === 'snapshot';
    const parts = ['Creates 4 channels, 4 agents', (skillsLink ? 'links' : 'copies') + ' 3 skills', 're-links 3 sources'];
    if (memSnap) parts.push('copies 41 confirmed memories');
    if (s.conv) parts.push('archives 23 conversations read-only');
    return {
      skillOpts: this.seg([['link', 'Link'], ['copy', 'Copy']], s.skills, 'skills'),
      memOpts: this.seg([['none', 'None'], ['snapshot', 'Confirmed only']], s.memory, 'memory'),
      skillNote: skillsLink ? '3 skills stay linked: updates in Spring Launch reach Fall Launch.' : '3 skills copied as v1 in Fall Launch; they change independently.',
      memNote: memSnap ? 'Snapshot of 41 confirmed memories, each marked “from Spring Launch”. Suggested ones are left behind.' : 'Starts with no project memory. Parent initiative memory still applies.',
      convOnStr: s.conv ? 'true' : 'false',
      toggleConv: () => this.setState({ conv: !s.conv }),
      convNote: s.conv ? '23 conversations copied as a read-only archive.' : 'Not copied. Fall Launch starts with a clean slate.',
      switchStyle: 'flex: 0 0 auto; width: 44px; height: 26px; border-radius: 999px; border: 0; padding: 3px; cursor: pointer; display: flex; justify-content: ' + (s.conv ? 'flex-end' : 'flex-start') + '; background: ' + (s.conv ? '#2E5B88' : '#D5D5D0'),
      knobStyle: 'width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF',
      summary: parts.join(', ') + '.'
    };
  }
}
</script>
</body>
</html>
