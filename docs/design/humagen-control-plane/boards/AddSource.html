<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add context to Spring Launch</title>
<link rel="stylesheet" href="assets/boards.css">
<script src="assets/boards.js" defer></script>
</head>
<body class="board-fixed">
<template data-board>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E5B88}a:hover{color:#1F4166}
button{font-family:inherit}
</style>
</helmet>
<div role="dialog" aria-labelledby="as-title" style="width: 900px; height: 1040px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #1B1C1E; background: #FFFFFF; border: 1px solid #E2E2DE; border-radius: 16px; display: flex; flex-direction: column; font-size: 14px; line-height: 1.45; overflow: hidden">

  <div style="padding: 20px 24px 16px; display: flex; align-items: flex-start; gap: 12px; border-bottom: 1px solid #E2E2DE">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
      <h2 id="as-title" style="margin: 0; font-size: 17px; font-weight: 600">Add context to Spring Launch</h2>
      <div style="color: #5F6168; font-size: 13px">Choose a system, what to bring in, and how agents should read it.</div>
    </div>
    <a href="Context.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 8px; color: #5F6168; display: inline-flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="flex: 1 1 auto; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 24px">

    <!-- Step 1 -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">1 System</h3>
      <div role="radiogroup" aria-label="System" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ systems }}" as="s" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{ s.checked }}" onClick="{{ s.pick }}" style="{{ s.style }}">
            <span style="width: 32px; height: 32px; border-radius: 8px; background: #EEEEEB; color: #3A3C41; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ s.mono }}</span>
            <span style="font-size: 13px; font-weight: 500">{{ s.name }}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <!-- Step 2 -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">2 What to bring in</h3>
      <div style="border: 1px solid #E2E2DE; border-radius: 10px; display: flex; flex-direction: column">
        <sc-for list="{{ resources }}" as="r" hint-placeholder-count="3">
          <button type="button" role="checkbox" aria-checked="{{ r.checked }}" onClick="{{ r.toggle }}" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; border-bottom: 1px solid #F0F0ED; background: transparent; text-align: left; cursor: pointer; color: #1B1C1E; font-size: 13px">
            <span style="{{ r.boxStyle }}">
              <sc-if value="{{ r.on }}" hint-placeholder-val="{{ true }}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
              </sc-if>
            </span>
            <span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-weight: 600">{{ r.name }}</span><span style="font-size: 12px; color: #5F6168">{{ r.meta }}</span></span>
          </button>
        </sc-for>
      </div>
    </section>

    <!-- Step 3 -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
        <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168; flex: 1 1 auto">3 How agents read it</h3>
        <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #E3E8EE; color: #2E5B88">Recommended for {{ sysName }}: {{ recName }}</span>
      </div>
      <div role="radiogroup" aria-label="Access mode" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{ m.checked }}" onClick="{{ m.pick }}" style="{{ m.style }}">
            <span style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px">
              <span style="{{ m.radioStyle }}"></span>{{ m.name }}
            </span>
            <span style="font-size: 12px; color: #3A3C41">{{ m.what }}</span>
            <span style="display: flex; flex-direction: column; gap: 4px; font-size: 12px">
              <span style="color: #1F6B45">+ {{ m.pro1 }}</span>
              <span style="color: #1F6B45">+ {{ m.pro2 }}</span>
              <span style="color: #8C2F22">− {{ m.con1 }}</span>
              <span style="color: #8C2F22">− {{ m.con2 }}</span>
            </span>
            <span style="font-size: 12px; color: #5F6168; border-top: 1px solid #F0F0ED; padding-top: 8px">Best for {{ m.best }}</span>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{ isHybrid }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #FAFAF8; border: 1px solid #E2E2DE; font-size: 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A3C41" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
          <span style="flex: 1 1 auto"><strong>24 pages pinned</strong> to the index everything else searched live</span>
          <a href="#" style="font-weight: 600; text-decoration: none">Choose pages</a>
        </div>
      </sc-if>
    </section>

    <!-- Step 4 -->
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h3 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">4 Where it applies</h3>
      <div role="radiogroup" aria-label="Scope" style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{ scopes }}" as="sc" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{ sc.checked }}" onClick="{{ sc.pick }}" style="{{ sc.style }}">
            <span style="{{ sc.radioStyle }}"></span>
            <span style="flex: 1 1 auto; display: flex; flex-direction: column; text-align: left"><span style="font-weight: 600; font-size: 13px">{{ sc.name }}</span><span style="font-size: 12px; color: #5F6168">{{ sc.who }}</span></span>
          </button>
        </sc-for>
      </div>
      <div style="font-size: 12px; color: #3A3C41">Live search always uses the permissions of the person or agent asking. Indexed content is visible to everyone in the chosen scope.</div>
    </section>
  </div>

  <!-- Preview + footer -->
  <div style="border-top: 1px solid #E2E2DE; background: #FAFAF8; padding: 14px 24px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6168">How it will appear</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid #E2E2DE; border-radius: 12px; background: #FFFFFF; flex-wrap: wrap">
      <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #EEEEEB; color: #3A3C41; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ sysMono }}</span>
      <span style="flex: 1 1 200px; display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">{{ previewName }}</span><span style="font-size: 12px; color: #5F6168">{{ sysName }} added by Avery Park {{ scopeName }}</span></span>
      <span style="{{ chipStyle }}">{{ previewChip }}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
      <span style="flex: 1 1 auto; font-size: 12px; color: #5F6168">{{ footNote }}</span>
      <a href="Context.html" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #D5D5D0; background: #FFFFFF; color: #1B1C1E; font-weight: 500; display: inline-flex; align-items: center; text-decoration: none">Cancel</a>
      <a href="Context.html" style="height: 40px; padding: 0 16px; border-radius: 8px; background: #1B1C1E; color: #FFFFFF; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">Add {{ count }} to Spring Launch</a>
    </div>
  </div>
</div>
</template>
<a class="board-back" href="index.html">All screens</a>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sys: 'notion', mode: 'live', scope: 'project', picked: { 'Launch HQ': true } };
  }
  renderVals() {
    const s = this.state;
    const SYS = {
      drive:  { name: 'Google Drive', mono: 'GD', rec: 'indexed', res: [['Brand guidelines', 'Folder 340 files'], ['Launch assets', 'Folder 86 files'], ['Packaging specs.pdf', 'File 2.1 MB']] },
      notion: { name: 'Notion', mono: 'NO', rec: 'live', res: [['Launch HQ', 'Page tree 1,280 pages'], ['Retail calendar', 'Database 412 rows'], ['Company wiki', 'Workspace 9,400 pages']] },
      github: { name: 'GitHub', mono: 'GH', rec: 'hybrid', res: [['acme/launch-site', 'Repo README, issues, PRs'], ['acme/checkout', 'Repo issues labeled spring-launch'], ['Launch milestone', 'Milestone 38 issues']] },
      slack:  { name: 'Slack', mono: 'SL', rec: 'live', res: [['#launch-ops', 'Channel bridged'], ['#vendors-ext', 'Shared channel 3 guests'], ['#marketing', 'Channel 41 members']] },
      upload: { name: 'Upload', mono: 'UP', rec: 'indexed', res: [['Launch plan v3.pdf', 'File 24 pages'], ['Media plan.xlsx', 'File 3 sheets'], ['Kickoff notes.docx', 'File 6 pages']] }
    };
    const MODES = {
      indexed: { name: 'Indexed', what: 'A copy is imported and indexed.', pro1: 'Fast answers', pro2: 'Works when the source is down', con1: 'Can go stale between syncs', con2: 'Uses storage', best: 'folders of documents', chip: 'Indexed syncs hourly', tone: 'background: #E6F2EC; color: #1F6B45' },
      live: { name: 'Live search', what: 'Nothing is copied. Queried when an agent asks, with the asker’s permissions.', pro1: 'Always current', pro2: 'Respects source permissions', con1: 'Slower answers', con2: 'Unavailable if the source is down', best: 'large wikis like Notion', chip: 'Live search queried when needed', tone: 'background: #E3E8EE; color: #2E5B88' },
      hybrid: { name: 'Hybrid', what: 'Key pages pinned to the index; everything else searched live.', pro1: 'Fast on what matters most', pro2: 'Current on the long tail', con1: 'Pinned set needs upkeep', con2: 'Two freshness signals', best: 'repos and big trees with a core set', chip: 'Hybrid 24 pinned, rest live', tone: 'background: #ECE6F4; color: #563A80' }
    };
    const SCOPES = {
      channel: { name: 'This channel # launch-ops', who: '6 people, 3 agents' },
      project: { name: 'Whole project Spring Launch', who: '8 people, 4 agents, all channels' },
      initiative: { name: 'Initiative Spring 2027 GTM', who: 'Flows down to Spring Launch and Q4 Research' }
    };
    const sys = SYS[s.sys];
    const radio = (on) => 'flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; border: ' + (on ? '5px solid #2E5B88' : '1.5px solid #8A8C92') + '; background: #FFFFFF';
    const systems = Object.keys(SYS).map((k) => {
      const on = s.sys === k;
      return { name: SYS[k].name, mono: SYS[k].mono, checked: on ? 'true' : 'false',
        pick: () => this.setState({ sys: k, mode: SYS[k].rec, picked: { [SYS[k].res[0][0]]: true } }),
        style: 'display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 10px; cursor: pointer; color: #1B1C1E; background: ' + (on ? '#F3F6FA' : '#FFFFFF') + '; border: ' + (on ? '1.5px solid #2E5B88' : '1px solid #E2E2DE') };
    });
    const resources = sys.res.map(([name, meta]) => {
      const on = !!s.picked[name];
      return { name, meta, on, checked: on ? 'true' : 'false',
        toggle: () => this.setState({ picked: { ...s.picked, [name]: !on } }),
        boxStyle: 'flex: 0 0 auto; width: 18px; height: 18px; border-radius: 5px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; background: ' + (on ? '#2E5B88' : '#FFFFFF') + '; border: ' + (on ? '0' : '1.5px solid #8A8C92') };
    });
    const modes = Object.keys(MODES).map((k) => {
      const on = s.mode === k;
      return { ...MODES[k], checked: on ? 'true' : 'false', pick: () => this.setState({ mode: k }), radioStyle: radio(on),
        style: 'display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; text-align: left; cursor: pointer; color: #1B1C1E; background: ' + (on ? '#F3F6FA' : '#FFFFFF') + '; border: ' + (on ? '1.5px solid #2E5B88' : '1px solid #E2E2DE') };
    });
    const scopes = Object.keys(SCOPES).map((k) => {
      const on = s.scope === k;
      return { ...SCOPES[k], checked: on ? 'true' : 'false', pick: () => this.setState({ scope: k }), radioStyle: radio(on),
        style: 'display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; cursor: pointer; color: #1B1C1E; background: ' + (on ? '#F3F6FA' : '#FFFFFF') + '; border: ' + (on ? '1.5px solid #2E5B88' : '1px solid #E2E2DE') };
    });
    const pickedNames = sys.res.map((r) => r[0]).filter((n) => s.picked[n]);
    const m = MODES[s.mode];
    const notes = {
      indexed: 'Import starts now; agents can use it once indexing finishes. Freshness shows on every citation.',
      live: 'Nothing is copied. If the source is unreachable, agents say so instead of guessing.',
      hybrid: 'Pinned pages are indexed now; the rest is searched live when asked.'
    };
    return {
      systems, resources, modes, scopes,
      sysName: sys.name, sysMono: sys.mono, recName: MODES[sys.rec].name,
      isHybrid: s.mode === 'hybrid',
      previewName: pickedNames.length ? pickedNames.join(', ') : 'Nothing selected',
      previewChip: m.chip,
      chipStyle: 'flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; ' + m.tone,
      scopeName: SCOPES[s.scope].name,
      count: pickedNames.length === 1 ? '1 source' : pickedNames.length + ' sources',
      footNote: notes[s.mode]
    };
  }
}
</script>
</body>
</html>
