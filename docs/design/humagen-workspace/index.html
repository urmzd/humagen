<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Humagen · Conversations, work, and artifacts</title>
  <style>
    :root { color-scheme: light; --bg:#fff; --side:#f2f2ef; --surface:#fafaf8; --hover:#e9ecef; --ink:#1b1c1e; --muted:#5f6168; --line:#e2e2de; --accent:#2e5b88; --soft:#e3e8ee; --good:#1f6b45; --warn:#6b4100; --shadow:0 16px 55px #242a231b; font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:14px; }
    [data-theme="dark"] { color-scheme:dark; --bg:#191d22; --side:#15191e; --surface:#20262e; --hover:#2c3541; --ink:#e5e9ef; --muted:#acb6c4; --line:#343d49; --accent:#a8c5e4; --soft:#283c52; --good:#a1d2b4; --warn:#e9c38a; --shadow:0 16px 55px #0005; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); }
    button,input,textarea { font:inherit; color:inherit; }
    button { border:0; background:none; cursor:pointer; min-height:28px; }
    button:disabled { cursor:default; opacity:.55; }
    button,input,textarea,a { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    input:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
    button svg { flex-shrink:0; }
    svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
    [hidden] { display:none !important; }
    .app { height:100dvh; display:grid; grid-template-columns:248px minmax(0,1fr); overflow:clip; }
    .sidebar { background:var(--side); border-right:1px solid var(--line); display:flex; min-height:0; flex-direction:column; padding:0 14px; }
    .brand { height:76px; display:flex; align-items:center; gap:10px; padding:0 8px; font-size:18px; font-weight:650; letter-spacing:-.7px; }
    .brand-mark { display:grid; grid-template-columns:7px 7px; gap:3px; transform:rotate(-8deg); }
    .brand-mark i { width:7px; height:7px; background:var(--ink); border-radius:2px; }
    .brand small { margin-left:auto; color:var(--muted); font-size:11px; font-weight:450; letter-spacing:0; }
    .search { height:36px; display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:0 10px; color:var(--muted); }
    .search svg { width:15px; }
    .search input { width:100%; min-width:0; background:none; border:0; font-size:12px; outline:none; }
    .search kbd { font:10px inherit; white-space:nowrap; }
    .nav-top { padding:16px 0; display:grid; gap:3px; }
    .nav { display:flex; align-items:center; gap:10px; width:100%; min-height:35px; padding:8px 9px; text-align:left; border-radius:6px; color:var(--muted); font-size:12px; }
    .nav:hover,.nav[aria-current="page"],.conversation-row:hover { background:var(--hover); color:var(--ink); }
    .nav .count { margin-left:auto; min-width:19px; text-align:center; font-size:10px; color:var(--ink); background:var(--hover); border-radius:4px; padding:2px 4px; }
    .nav-scroll { flex:1; min-height:0; overflow:auto; padding-bottom:20px; }
    .nav-label { display:flex; align-items:center; justify-content:space-between; margin:17px 9px 8px; font-size:10px; color:var(--muted); font-weight:550; letter-spacing:.04em; }
    .project-button { font-weight:550; color:var(--ink); }
    .project-button .chevron { margin-left:auto; width:12px; transition:transform .15s; }
    .project-button[aria-expanded="false"] .chevron { transform:rotate(-90deg); }
    .project-children { margin:3px 0 10px 17px; padding-left:9px; border-left:1px solid var(--line); }
    .conversation-row { display:flex; gap:8px; width:100%; align-items:flex-start; border-radius:6px; padding:9px 8px; text-align:left; min-width:0; }
    .conversation-row[aria-current="page"] { background:var(--hover); }
    .conversation-copy { flex:1; min-width:0; }
    .conversation-copy strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:450; font-size:11.5px; }
    .conversation-copy small { display:flex; align-items:center; gap:4px; margin-top:5px; color:var(--muted); font-size:10px; min-width:0; }
    .conversation-copy small span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .conversation-row>svg { width:13px; height:16px; margin-top:0; color:var(--muted); }
    .agent-dot { display:inline-block; flex-shrink:0; width:7px; height:7px; border-radius:50%; background:#9678aa; }
    .agent-dot.writer { background:#668b8c; }
    .agent-dot.builder { background:#bb8b5f; }
    .sidebar-bottom { border-top:1px solid var(--line); padding:12px 6px 14px; display:flex; gap:9px; align-items:center; }
    .person { width:28px; height:28px; display:grid; place-items:center; background:#e7dfd1; color:#6b5a40; border-radius:50%; font-size:10px; font-weight:600; flex-shrink:0; }
    .sidebar-bottom .name { font-size:11px; flex:1; }
    .sidebar-bottom .name small { display:block; font-size:9px; color:var(--muted); margin-top:3px; }
    .icon-button { min-width:32px; height:32px; display:inline-flex; justify-content:center; align-items:center; gap:6px; border-radius:6px; color:var(--muted); }
    .icon-button:hover,.icon-button[aria-expanded="true"] { background:var(--hover); color:var(--ink); }
    .workspace { min-width:0; display:flex; flex-direction:column; min-height:0; position:relative; }
    .conversation-header { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr); gap:12px; align-items:center; min-height:76px; padding:14px 28px; border-bottom:1px solid var(--line); flex-shrink:0; }
    .header-left { display:flex; align-items:center; min-width:0; gap:8px; }
    .project-trigger { display:flex; align-items:center; gap:7px; min-width:0; max-width:100%; padding:7px 3px; color:var(--muted); font-size:11px; }
    .project-trigger span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .project-trigger svg { width:15px; height:15px; }
    .project-trigger .down { width:11px; }
    .header-title { min-width:0; text-align:center; }
    h1 { font-size:14px; line-height:1.5; font-weight:600; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.2px; }
    .header-title small { display:block; margin-top:2px; color:var(--muted); font-size:10px; }
    .header-right { display:flex; justify-content:flex-end; align-items:center; gap:7px; min-width:0; }
    .context-trigger { display:flex; align-items:center; gap:6px; font-size:11px; padding:7px 9px; border-radius:6px; color:var(--muted); white-space:nowrap; }
    .context-trigger:hover,.context-trigger[aria-expanded="true"] { background:var(--hover); color:var(--ink); }
    .context-trigger svg { width:15px; }
    .context-trigger .number { font-size:9px; background:var(--hover); border-radius:4px; padding:2px 4px; }
    .mobile-nav { display:none; }
    .body { display:flex; flex:1; min-height:0; min-width:0; }
    .main { min-width:0; flex:1; display:flex; flex-direction:column; }
    .thread { flex:1; min-height:0; overflow:auto; scroll-behavior:smooth; }
    .thread-inner { max-width:790px; padding:32px 46px 24px; margin:0 auto; }
    .date-line { display:flex; align-items:center; gap:15px; color:var(--muted); font-size:10px; margin:0 0 30px; }
    .date-line::before,.date-line::after { content:""; height:1px; background:var(--line); flex:1; }
    .message { margin-bottom:29px; font-size:12.5px; line-height:1.8; overflow-wrap:anywhere; }
    .message-head { display:flex; gap:8px; align-items:center; margin-bottom:8px; font-size:11px; }
    .message-head strong { font-weight:600; }
    .message-head time { font-size:9px; color:var(--muted); }
    .message-head .agent-dot { width:11px; height:11px; }
    .message-body { padding-left:19px; }
    .message-body p { margin:0 0 12px; }
    .human .message-body { background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:13px 17px; margin-left:19px; }
    .human .person { width:20px; height:20px; font-size:8px; }
    .mention { color:var(--accent); background:var(--soft); padding:1px 3px; border-radius:3px; }
    .work-summary { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; margin:8px 0 14px; padding:0; }
    .work-summary svg { width:12px; height:12px; }
    .answer-title { font-size:19px; font-weight:550; letter-spacing:-.6px; line-height:1.4; margin:12px 0; }
    .status-line { display:inline-flex; align-items:center; gap:6px; font-size:10px; color:var(--good); }
    .status-line::before { content:""; width:5px; height:5px; background:currentColor; border-radius:50%; }
    .deliverables { border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:18px 0 15px; }
    .deliverable { display:grid; grid-template-columns:minmax(0,1fr) 85px 60px; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:11px; }
    .deliverable:last-child { border:0; }
    .deliverable span:nth-child(2) { color:var(--muted); font-size:10px; }
    .deliverable .ready { color:var(--good); font-size:10px; text-align:right; }
    .deliverable .waiting { color:var(--warn); font-size:10px; text-align:right; }
    .citations { display:flex; flex-wrap:wrap; gap:6px; margin-top:15px; }
    .citation { display:inline-flex; align-items:center; gap:5px; font-size:9px; line-height:1.4; padding:5px 7px; border:1px solid var(--line); border-radius:5px; color:var(--muted); max-width:100%; text-align:left; }
    .citation:hover { background:var(--surface); color:var(--ink); }
    .citation svg { width:11px; height:11px; }
    .reply-note { font-size:10px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-top:14px; }
    .reply-note svg { width:12px; height:12px; }
    .composer-wrap { flex-shrink:0; padding:0 34px 17px; }
    .composer { max-width:698px; margin:auto; border:1px solid #d9ddd3; border-radius:11px; padding:14px 14px 10px; background:var(--bg); box-shadow:0 2px 7px #25282305; position:relative; }
    [data-theme="dark"] .composer { border-color:var(--line); }
    .composer:focus-within { border-color:var(--accent); }
    .composer textarea { width:100%; border:0; outline:none; resize:none; background:none; min-height:42px; max-height:130px; font-size:12px; line-height:1.7; padding:0; }
    .composer textarea:focus-visible { outline:none; }
    .composer-bottom { display:flex; align-items:center; gap:7px; min-width:0; }
    .composer-place { color:var(--muted); font-size:10px; display:flex; align-items:center; gap:5px; min-width:0; }
    .composer-place span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .composer-place svg { width:12px; height:12px; }
    .composer-agents { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); margin-left:auto; min-width:0; }
    .composer-agents span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .send { margin-left:3px; width:28px; height:28px; display:grid; place-items:center; border-radius:7px; color:var(--bg); background:var(--ink); flex-shrink:0; }
    .send svg { width:14px; }
    .composer-hint { max-width:698px; margin:9px auto 0; color:var(--muted); text-align:center; font-size:9px; }
    .panel { width:330px; max-width:100%; min-width:0; flex-shrink:0; border-left:1px solid var(--line); background:var(--surface); overflow:auto; }
    .panel-header { height:57px; padding:12px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
    .panel-header h2 { font-size:13px; font-weight:600; margin:0; }
    .panel-content { padding:20px 19px 30px; }
    .eyebrow { margin:0 0 7px; color:var(--muted); font-size:9px; letter-spacing:.06em; text-transform:uppercase; font-weight:550; }
    .panel-title { margin:0 0 6px; font-size:18px; font-weight:550; letter-spacing:-.45px; }
    .muted { color:var(--muted); }
    .panel p { font-size:11px; line-height:1.7; }
    .panel-tabs { display:flex; border-bottom:1px solid var(--line); gap:20px; margin:17px 0 20px; }
    .panel-tabs button { font-size:10px; color:var(--muted); padding:0 0 10px; border-bottom:2px solid transparent; }
    .panel-tabs button[aria-pressed="true"] { color:var(--ink); border-color:var(--ink); }
    .source-card { width:100%; display:flex; align-items:flex-start; gap:10px; text-align:left; padding:13px 0; border-bottom:1px solid var(--line); }
    .source-icon { width:28px; height:28px; border:1px solid var(--line); background:var(--bg); border-radius:7px; display:grid; place-items:center; flex-shrink:0; color:var(--muted); }
    .source-icon svg { width:14px; height:14px; }
    .source-copy { flex:1; min-width:0; }
    .source-card strong { display:block; font-size:11px; font-weight:550; }
    .source-card .origin { display:block; font-size:9px; color:var(--muted); margin:4px 0 7px; overflow-wrap:anywhere; }
    .source-card .freshness { display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:9px; color:var(--muted); }
    .mode { display:inline-flex; align-items:center; gap:4px; color:var(--good); background:var(--soft); padding:2px 5px; border-radius:4px; font-size:9px; line-height:1.4; }
    .mode.snapshot { color:var(--muted); background:var(--hover); }
    .mode.attention { color:var(--warn); background:var(--hover); }
    .source-card>svg { width:12px; margin-top:4px; color:var(--muted); }
    .section-heading { font-size:11px; font-weight:600; margin:23px 0 10px; }
    .pipeline { list-style:none; padding:0; margin:0; }
    .pipeline li { position:relative; display:flex; align-items:flex-start; gap:10px; padding:0 0 21px; font-size:10px; }
    .pipeline li:not(:last-child)::after { content:""; width:1px; position:absolute; background:var(--line); left:8px; top:19px; bottom:3px; }
    .step { width:17px; height:17px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; color:var(--good); background:var(--bg); flex-shrink:0; }
    .step svg { width:10px; height:10px; }
    .pipeline strong { font-size:10px; font-weight:550; display:block; line-height:1.6; }
    .pipeline small { display:block; font-size:9px; color:var(--muted); margin-top:3px; line-height:1.6; }
    .detail-grid { margin:20px 0; display:grid; grid-template-columns:80px minmax(0,1fr); gap:12px; font-size:10px; line-height:1.6; overflow-wrap:anywhere; }
    .detail-grid dt { color:var(--muted); }
    .detail-grid dd { margin:0; }
    .subtle-button { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:10px; display:inline-flex; gap:6px; align-items:center; }
    .subtle-button:hover { background:var(--hover); }
    .subtle-button svg { width:12px; height:12px; }
    .back-button { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); padding:0; margin-bottom:21px; }
    .back-button svg { width:11px; height:11px; }
    .activity-card { padding:16px 0; border-bottom:1px solid var(--line); }
    .activity-card .who { display:flex; gap:7px; align-items:center; font-size:11px; font-weight:550; }
    .activity-card .who time { margin-left:auto; color:var(--muted); font-size:9px; font-weight:400; }
    .activity-card p { margin:8px 0; font-size:10px; }
    .activity-steps { margin:11px 0 0 14px; padding:0; list-style:none; border-left:1px solid var(--line); }
    .activity-steps li { position:relative; padding:5px 0 5px 13px; color:var(--muted); font-size:9px; }
    .activity-steps li::before { content:""; width:5px; height:5px; background:var(--line); position:absolute; left:-3px; top:9px; border-radius:50%; }
    .popover { position:absolute; z-index:30; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:6px; width:210px; box-shadow:var(--shadow); }
    #settings-menu { top:62px; right:24px; }
    #compose-menu { bottom:52px; left:10px; }
    .menu-label { color:var(--muted); font-size:9px; padding:8px 9px; }
    .menu-item { display:flex; align-items:center; gap:9px; min-height:36px; width:100%; text-align:left; padding:8px 9px; border-radius:5px; font-size:11px; }
    .menu-item:hover { background:var(--hover); }
    .menu-item svg { width:14px; height:14px; color:var(--muted); }
    .menu-item small { margin-left:auto; font-size:9px; color:var(--muted); }
    .menu-rule { height:1px; background:var(--line); margin:5px; }
    .list-view { flex:1; min-height:0; overflow:auto; padding:35px 38px; }
    .list-inner { max-width:850px; margin:auto; }
    .list-heading { margin:0 0 7px; font-size:25px; font-weight:550; letter-spacing:-1px; }
    .list-description { color:var(--muted); margin:0 0 26px; font-size:12px; line-height:1.7; }
    .list-row { display:grid; grid-template-columns:minmax(0,1fr) 130px 110px 42px; gap:15px; padding:17px 4px; width:100%; border-bottom:1px solid var(--line); text-align:left; align-items:center; font-size:11px; }
    .list-row:hover { background:var(--surface); }
    .list-row strong { display:block; font-size:12px; font-weight:550; }
    .list-row .preview { display:block; color:var(--muted); margin-top:6px; font-size:10px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .list-row .agent-list { display:flex; flex-wrap:wrap; gap:5px; align-items:center; font-size:10px; color:var(--muted); }
    .list-row .place,.list-row time { font-size:10px; color:var(--muted); }
    .list-row time { text-align:right; }
    dialog { width:min(470px,calc(100vw - 32px)); max-height:calc(100dvh - 48px); overflow:auto; padding:25px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); }
    dialog::backdrop { background:#161c194d; }
    .dialog-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:8px; }
    dialog h2 { font-size:21px; font-weight:550; letter-spacing:-.7px; margin:4px 0; }
    dialog p { margin:0 0 18px; color:var(--muted); font-size:11px; line-height:1.8; }
    .dialog-project { width:100%; display:flex; align-items:center; gap:10px; padding:13px 10px; border:1px solid var(--line); border-radius:8px; text-align:left; margin-bottom:8px; }
    .dialog-project:hover,.dialog-project[aria-pressed="true"] { border-color:var(--accent); background:var(--surface); }
    .dialog-project strong { display:block; font-size:12px; font-weight:550; }
    .dialog-project small { display:block; font-size:10px; color:var(--muted); margin-top:5px; }
    .dialog-project>span { min-width:0; flex:1; overflow-wrap:anywhere; }
    .dialog-project>svg:last-child { width:14px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--line); margin-top:21px; padding-top:18px; }
    .primary { background:var(--ink); color:var(--bg); border-radius:7px; padding:10px 14px; font-size:11px; font-weight:550; }
    .secondary { border:1px solid var(--line); padding:9px 13px; border-radius:7px; font-size:11px; }
    .visibility { margin:17px 0; border:1px solid var(--line); border-radius:8px; padding:13px; }
    .visibility legend { font-size:10px; color:var(--muted); padding:0 5px; }
    .visibility label { display:flex; align-items:flex-start; gap:8px; padding:8px 0; font-size:11px; line-height:1.6; }
    .visibility label small { display:block; color:var(--muted); font-size:10px; }
    .visibility input { accent-color:var(--accent); }
    .review-card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; margin:15px 0; }
    .review-card .detail-grid { margin:0; }
    .toast { position:fixed; z-index:90; left:50%; bottom:24px; transform:translateX(-50%); padding:12px 17px; border:1px solid var(--line); border-radius:9px; background:var(--ink); color:var(--bg); box-shadow:var(--shadow); font-size:11px; max-width:calc(100vw - 32px); line-height:1.6; width:max-content; }
    .empty { padding:25px 0; color:var(--muted); font-size:12px; line-height:1.8; }
    .concept-note { border:1px solid var(--line); padding:13px; border-radius:7px; font-size:10px; line-height:1.8; margin-bottom:20px; }
    .concept-note strong { font-weight:600; }
    .note-list { padding-left:16px; font-size:11px; line-height:1.8; }
    .note-list li { margin-bottom:10px; }
    .scrim { display:none; }
    .preview-badge { font-size:9px; border:1px solid var(--line); color:var(--muted); border-radius:4px; padding:3px 5px; letter-spacing:0; font-weight:450; }
    .message { font-size:14px; line-height:1.7; }
    .message-head { font-size:12px; }
    .nav { font-size:12px; }
    .conversation-copy strong { font-size:12px; }
    .conversation-header h1 { font-size:15px; }
    .work-card { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0 0 18px; background:var(--bg); }
    .work-top { padding:16px 18px; }
    .work-top h2 { font-size:19px; line-height:1.45; margin:6px 0 10px; letter-spacing:-.4px; font-weight:600; }
    .work-top p { font-size:13px; margin:0; }

ner, trigger, completion criteria, and current state. Agent runs remain its execution history.</p><p>Dialog headers, scrollable bodies, and footers occupy separate layout rows. Required choices remain reachable on narrow screens.</p><p>Reading mode, update cadence, and health are separate fields. Live search reports when it queried; it does not promise “always current.”</p><p>Personal and agent restrictions combine with project policies. Personal is not a child below an agent in the project tree.</p><h3 class="section-heading">System work needed to ship</h3><p>Use Humagen’s existing calls, approvals, budgets, memory review, and context composition. Add durable assignment instances, authoritative conversation placement, source lifecycle records, and dependency tracking.</p><p>Historical accounting stays fixed when a conversation moves. Moving a conversation does not grant access to its original private sources. Audit events should exist from the first release.</p><h3 class="section-heading">Review boundary</h3><p>The PDFs provide 25 static boards. Keyboard, responsive, and interactive behavior of their original code was not available to inspect. This standalone concept demonstrates the merged core flows; it does not recreate all administration screens.</p>`;

    function renderSlide(index=delivery.slide) {
      const deck=currentDeck();const slide=deck.slides[index];
      return `<div class="slide-frame"><section class="slide-canvas ${slide.kind}" aria-label="Slide ${index+1} of ${deck.slides.length}: ${escapeHtml(slide.title)}"><div class="slide-brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>humagen / Spring Launch</div><div class="slide-kicker">${slide.kicker}</div><h4>${slide.title}</h4><p class="slide-subtitle">${slide.subtitle}</p>${slide.timeline?`<div class="slide-timeline">${slide.timeline.map(m=>`<div class="slide-milestone"><strong>${m.date}</strong>${m.label}</div>`).join('')}</div>`:slide.items.length?`<div class="slide-content">${slide.items.map(item=>`<div class="slide-item"><i></i><span>${item}</span></div>`).join('')}</div>`:''}<div class="slide-footer"><span>Internal draft · ${deck.audience}</span><span>${index+1} / ${deck.slides.length}</span></div></section></div>`;
    }
    function renderDocument() {
      return `<article class="document-page"><p class="eyebrow">SPRING LAUNCH · DRAFT · VERSION 4</p><h4>Launch plan</h4><p>Move retail availability to <strong>November 19</strong>. Keep the press embargo on <strong>November 12</strong>.</p><h5>Why this changes</h5><p>Packaging now arrives November 8, four days later than planned. The revised retail date restores the fulfilment buffer.</p><h5>Milestones</h5><ul><li>November 8: packaging arrives.</li><li>November 12: press embargo, with the retail date stated clearly.</li><li>November 19: retail availability.</li></ul><h5>Decisions and boundaries</h5><p>Jamie Davis reviews the proposed date. Four vendor notices require a separate review and delivery approval.</p><h5>Owners</h5><p>Launch Planner owns the plan. Ops prepares notices. Jon T. restores the media source.</p><h5>Evidence used</h5><p>Supplier ETA indexed October 23 at 09:42. Retail calendar searched as Jamie at 09:47. Plan v3 imported October 18.</p></article>`;
    }
    function renderDataTable() {
      return `<div class="artifact-table-wrap"><table class="artifact-table"><thead><tr>${dependencyRows[0].map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${dependencyRows.slice(1).map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="delivery-note">Snapshot produced by Launch Planner. The date is a recommendation pending approval.</p>`;
    }
    function renderArtifact() {
      const a=artifactById(delivery.artifact)??artifacts[0];
      delivery.artifact=a.id;
      const locked=a.id==='briefing'&&!delivery.question.answer;
      const tab=delivery.artifactTab;
      $('panel-heading').textContent=a.type==='presentation'?'Presentation':a.type==='table'?'Table':'Document';
      let preview='';
      if(tab==='sources') {
        preview=`<p class="delivery-note">Evidence pinned to this version. A source’s current state is shown separately from the data used when the artifact was created.</p>${a.sources.map(id=>{const src=sources.find(s=>s.id===id);return `<button class="source-card" data-source="${id}"><span class="source-icon">${icon(src.icon)}</span><span class="source-copy"><strong>${src.title}</strong><span class="origin">${src.mode} · ${src.cadence}</span><span class="origin">${src.freshness}</span></span>${icon('chevron')}</button>`;}).join('')}`;
      } else if(tab==='versions') {
        preview=`<div class="source-card"><span class="source-copy"><strong>v${a.version} · ${artifactState(a)}</strong><span class="origin">${a.agent} · Supplier delay conversation</span><span class="origin">${a.id==='briefing'?(locked?'Waiting for the audience to be clarified':currentDeck().audience+' briefing'):'Recommendation and evidence preserved in this version'}</span></span><span class="mode snapshot">Current</span></div>${a.id==='plan'?'<button class="source-card" data-source="plan"><span class="source-copy"><strong>v3 · original source snapshot</strong><span class="origin">Imported by Mira K. · Oct 18 · remains unchanged</span></span>'+icon('chevron')+'</button>':''}<p class="delivery-note">A revision request stays attached to its version. A new version appears when the agent delivers the revised result.</p>`;
      } else if(locked) {
        preview=`<div class="question-card"><p class="eyebrow">NEEDS ONE CLARIFICATION</p><h3>Choose the briefing audience.</h3><p>The six-slide structure is ready. Writer is waiting to tailor the detail and the next action.</p><button class="primary" data-go-clarification>Answer in Conversation</button></div>`;
      } else if(a.type==='presentation') {
        preview=`${renderSlide()}<div class="slide-controls"><button class="icon-button" data-slide-step="-1" aria-label="Previous slide" ${delivery.slide===0?'disabled':''}>${icon('back')}</button><span id="slide-position">Slide ${delivery.slide+1} of 6</span><button class="icon-button" data-slide-step="1" aria-label="Next slide" ${delivery.slide===5?'disabled':''}>${icon('chevron')}</button></div><div class="slide-thumbnails" aria-label="Slides">${currentDeck().slides.map((s,i)=>`<button class="slide-thumb" data-slide="${i}" aria-current="${delivery.slide===i}" aria-label="Slide ${i+1}: ${escapeHtml(s.title)}">${i+1}</button>`).join('')}</div><details class="speaker-notes" style="margin-top:15px"><summary>Speaker notes</summary><p>${currentDeck().slides[delivery.slide].notes}</p></details>`;
      } else preview=a.type==='document'?renderDocument():renderDataTable();
      const downloads=a.type==='presentation'?`<button class="subtle-button" data-present-deck ${locked?'disabled':''}>${icon('expand')}Present</button><button class="subtle-button" data-download="deck-pptx" ${locked?'disabled':''}>${icon('download')}PPTX</button><button class="subtle-button" data-download="deck-pdf" ${locked?'disabled':''}>${icon('download')}PDF</button>`:a.type==='document'?`<button class="subtle-button" data-download="plan-pdf">${icon('download')}PDF</button><button class="subtle-button" data-download="plan-docx">${icon('download')}DOCX</button>`:`<button class="subtle-button" data-download="dependencies">${icon('download')}Download CSV</button>`;
      $('panel-content').innerHTML=`<div class="artifact-title"><span class="artifact-type ${a.type}">${icon(artifactIcon(a.type))}</span><div><h3>${a.title}</h3><div class="artifact-meta"><span>v${a.version}</span><span>${artifactState(a)}</span><span class="artifact-scope">Project · Spring Launch</span></div></div></div><p class="delivery-note">Created by ${a.agent} · <button class="back-button" data-artifact-conversation style="display:inline-flex;margin:0">Supplier delay conversation${icon('chevron')}</button></p><div class="artifact-toolbar">${downloads}</div><div class="panel-tabs artifact-tabs"><button data-artifact-tab="preview" aria-pressed="${tab==='preview'}">Preview</button><button data-artifact-tab="versions" aria-pressed="${tab==='versions'}">Versions</button><button data-artifact-tab="sources" aria-pressed="${tab==='sources'}">Sources <span class="muted">${a.sources.length}</span></button></div><div id="artifact-body">${preview}</div>${!locked?`<div class="artifact-feedback"><p>Keep feedback attached to ${a.type==='presentation'?'this slide and version':'this artifact and version'}.</p><button class="subtle-button" data-request-change="${a.id}">${icon('reply')}Request Changes</button></div>`:''}`;
    }
    function renderDeliverables() {
      const filters=[['all','All'],['document','Documents'],['presentation','Presentations'],['table','Tables']];
      const selected=artifacts.filter(a=>delivery.filter==='all'||a.type===delivery.filter);
      $('list-view').innerHTML=`<div class="list-inner"><p class="eyebrow">PROJECT · SPRING LAUNCH</p><h2 class="list-heading">The work has somewhere to land.</h2><p class="list-description">Documents, presentations, and tables stay with their conversation, author, versions, and evidence.</p><div class="panel-tabs" aria-label="Deliverable types">${filters.map(([id,label])=>`<button data-delivery-filter="${id}" aria-pressed="${delivery.filter===id}">${label}</button>`).join('')}</div><div class="deliverable-grid">${selected.map(a=>`<button class="deliverable-tile" data-open-artifact="${a.id}"><span class="artifact-type ${a.type}">${icon(artifactIcon(a.type))}</span><strong>${a.title}</strong><p>${a.description}</p><span class="tile-meta"><span>v${a.version}</span><span>${a.agent}</span><span class="mode snapshot">${artifactState(a)}</span></span></button>`).join('')}</div><p class="delivery-note">Every item here is an internal draft. Downloading a file does not publish it or send it to anyone.</p></div>`;
    }
    function openArtifact(id) {
      if(!artifactById(id))return;
      delivery.artifact=id;delivery.artifactTab='preview';delivery.slide=0;
      const path=view==='deliverables'?'/deliverables/'+id:'/conversations/'+active.id+'/artifact/'+id;
      if(location.hash==='#'+path)openPanel('artifact');else location.hash=path;
    }
    function renderComposerContext() {
      const context=delivery.composerContext;
      $('composer-reference').hidden=!context;
      $('composer-reference').innerHTML=context?`${icon(context.type==='artifact'?artifactIcon(artifactById(context.artifact).type):'reply')}<span>${escapeHtml(context.label)}</span><button type="button" class="icon-button" data-clear-reference aria-label="Remove reply context">${icon('x')}</button>`:'';
    }
    function focusComposer(context,text) {
      delivery.composerContext=context?{...context,threadId:view==='conversation'?active.id:'launch-readiness'}:null;
      selectedAgents=context?.agent?[context.agent]:[];
      const go=()=>{selectedAgents=context?.agent?[context.agent]:[];if(innerWidth<=700)closePanel(false);renderComposerContext();renderHeader();$('message-input').value=text;delivery.drafts.set(active.id,text);$('send').disabled=!text.trim();$('message-input').focus();};
      if(view!=='conversation') {location.hash='/conversations/launch-readiness';setTimeout(go,60);} else go();
    }
    function requestArtifactChange(id) {
      const a=artifactById(id);
      const isDeck=a.type==='presentation';
      const label=`${a.title} · v${a.version}${isDeck?' · Slide '+(delivery.slide+1):''}`;
      focusComposer({type:'artifact',artifact:id,version:a.version,slide:isDeck?delivery.slide+1:null,label,agent:a.agent},'@'+a.agent+' please revise '+(isDeck?'this slide':'this artifact')+': ');
    }
    function openPresentation() {
      if(!delivery.question.answer)return;
      renderPresentation();$('presentation-dialog').showModal();
    }
    function renderPresentation() {
      $('presentation-dialog').innerHTML=`<div class="presentation-top"><span id="presentation-title">Launch briefing · ${currentDeck().audience} · Internal draft</span><button class="icon-button" data-close-presentation aria-label="Exit presentation">${icon('x')}</button></div><div class="presentation-stage">${renderSlide()}</div><div class="presentation-bottom"><button class="icon-button" data-present-step="-1" aria-label="Previous slide" ${delivery.slide===0?'disabled':''}>${icon('back')}</button><span>Slide ${delivery.slide+1} of 6</span><button class="icon-button" data-present-step="1" aria-label="Next slide" ${delivery.slide===5?'disabled':''}>${icon('chevron')}</button></div>`;
    }
    function moveSlide(step,present=false) {
      delivery.slide=Math.max(0,Math.min(5,delivery.slide+step));
      if(present){renderPresentation();$('presentation-dialog').querySelector('[data-close-presentation]').focus();}
      else renderArtifact();
    }
    function downloadArtifact(type) {
      let name;
      const audience=delivery.question.answer;
      if(type.startsWith('deck-')) {if(!audience)return;name='Launch-briefing-'+audience+'.'+(type==='deck-pptx'?'pptx':'pdf');}
      else name=({'plan-pdf':'Launch-plan-v4.pdf','plan-docx':'Launch-plan-v4.docx',dependencies:'Launch-dependencies.csv'})[type];
      const data=downloadData[name];if(!data)return;
      const raw=atob(data);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
      const mime=name.endsWith('.pdf')?'application/pdf':name.endsWith('.pptx')?'application/vnd.openxmlformats-officedocument.presentationml.presentation':name.endsWith('.docx')?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'text/csv';
      const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([bytes],{type:mime}));link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500);notify('Downloaded '+name+'. The artifact remains an internal draft.');
    }
    function renderNeedsYou() {
      const count=(work.state==='completed'?1:2)+(delivery.question.answer?0:1);
      $('panel-content').innerHTML=`<p class="eyebrow">ACROSS YOUR PROJECTS</p><h3 class="panel-title">${count} thing${count===1?'':'s'} need${count===1?'s':''} you.</h3>${!delivery.question.answer?`<button class="source-card" data-go-clarification><span class="source-copy"><strong>Who is the briefing for?</strong><span class="origin">Clarification · Writer · Holds only the briefing</span></span>${icon('chevron')}</button>`:''}${work.state!=='completed'?`<button class="source-card" data-open-launch><span class="source-copy"><strong>${work.state==='needs_decision'?'Approve the launch date':'Review four vendor notices'}</strong><span class="origin">Approval · Spring Launch · Today</span></span>${icon('chevron')}</button>`:''}<button class="source-card" data-source="media"><span class="source-copy"><strong>Restore access to the media tracker</strong><span class="origin">Source issue · Owner: Jon T. · One blocked assignment</span></span>${icon('chevron')}</button><p class="muted">Questions clarify intent. Approvals authorize an action. Source issues go to their owner. Each keeps its own state.</p>`;
    }
    async function copyMessage(article) {
      const clone=article.querySelector('.message-body').cloneNode(true);clone.querySelectorAll('button,summary').forEach(e=>e.remove());
      const value=clone.textContent.replace(/\s+/g,' ').trim();
      try {await navigator.clipboard.writeText(value);notify('Copied this message.');}
      catch {notify('Clipboard access is unavailable. You can select and copy the message text.');}
    }
    $('deliverables-button').onclick=()=>{location.hash='/deliverables';closeNavigation();};
    $('message-input').oninput=()=>{delivery.drafts.set(active.id,$('message-input').value);$('send').disabled=!$('message-input').value.trim();};
    $('composer').onsubmit=e=>{
      e.preventDefault();const text=$('message-input').value.trim();if(!text)return;
      const context=delivery.composerContext?structuredClone(delivery.composerContext):null;
      const items=additions.get(active.id)??[];items.push({text,context});additions.set(active.id,items);
      if(context?.type==='artifact')artifactById(context.artifact).state='Changes requested';
      if(active.title==='New conversation'){active.title=text.slice(0,60);active.preview=text;}
      delivery.drafts.delete(active.id);delivery.composerContext=null;$('message-input').value='';$('send').disabled=true;
      render();if(panelKind==='artifact')renderArtifact();$('thread').scrollTop=$('thread').scrollHeight;
      notify(context?.type==='artifact'?'Revision request captured with its artifact, version, and slide. Agent execution is simulated.':'Message added to this preview. Agent execution is simulated.');
    };
    document.addEventListener('change',e=>{
      if(e.target.name==='briefing-audience') {delivery.question.choice=e.target.value;const button=document.querySelector('[data-answer-briefing]');if(button)button.disabled=false;}
    });
    document.addEventListener('toggle',e=>{if(e.target.id==='launch-tools')delivery.toolsExpanded=e.target.open;},true);
    document.addEventListener('click',e=>{
      if(e.target.closest('[data-return-artifact]')){delivery.artifact=delivery.returnArtifact;openPanel('artifact');}
      const artifact=e.target.closest('[data-open-artifact]');if(artifact)openArtifact(artifact.dataset.openArtifact);
      const tool=e.target.closest('[data-tool]');if(tool){delivery.tool=tool.dataset.tool;delivery.toolTab='summary';openPanel('tool');}
      const toolTab=e.target.closest('[data-tool-tab]');if(toolTab){delivery.toolTab=toolTab.dataset.toolTab;renderToolDetail();}
      if(e.target.closest('[data-answer-briefing]')&&delivery.question.choice) {
        delivery.question.answer=delivery.question.choice;artifactById('briefing').state='Ready to review';
        render();if(panelKind==='artifact')renderArtifact();document.querySelector('#briefing-answer')?.scrollIntoView({block:'center'});document.querySelector('[data-change-briefing]')?.focus();
        notify('Audience clarified. The briefing draft is ready; no publication was approved.');
      }
      if(e.target.closest('[data-change-briefing]')){const a=artifactById('briefing');focusComposer({type:'artifact',artifact:a.id,version:a.version,slide:null,label:`${a.title} · v${a.version} · Audience`,agent:a.agent},'@Writer please adapt the briefing for this audience: ');}
      if(e.target.closest('[data-go-clarification]')) {
        location.hash='/conversations/launch-readiness';closePanel(false);
        setTimeout(()=>{document.getElementById('briefing-question')?.scrollIntoView({block:'center'});document.querySelector('input[name=briefing-audience]')?.focus();},70);
      }
      const tab=e.target.closest('[data-artifact-tab]');if(tab){delivery.artifactTab=tab.dataset.artifactTab;renderArtifact();}
      const next=e.target.closest('[data-slide-step]');if(next)moveSlide(Number(next.dataset.slideStep));
      const thumb=e.target.closest('[data-slide]');if(thumb){delivery.slide=Number(thumb.dataset.slide);renderArtifact();}
      const presentNext=e.target.closest('[data-present-step]');if(presentNext)moveSlide(Number(presentNext.dataset.presentStep),true);
      if(e.target.closest('[data-present-deck]'))openPresentation();
      if(e.target.closest('[data-close-presentation]'))$('presentation-dialog').close();
      const filter=e.target.closest('[data-delivery-filter]');if(filter){delivery.filter=filter.dataset.deliveryFilter;renderDeliverables();}
      const download=e.target.closest('[data-download]');if(download)downloadArtifact(download.dataset.download);
      const change=e.target.closest('[data-request-change]');if(change)requestArtifactChange(change.dataset.requestChange);
      if(e.target.closest('[data-artifact-conversation]')){showConversation('launch-readiness');closePanel(false);}
      if(e.target.closest('[data-clear-reference]')){delivery.composerContext=null;renderComposerContext();$('message-input').focus();}
      const ask=e.target.closest('[data-ask-agent]');if(ask)focusComposer({type:'agent',label:'To '+ask.dataset.askAgent,agent:ask.dataset.askAgent},'@'+ask.dataset.askAgent+' ');
      const reply=e.target.closest('[data-reply-message]');if(reply){const article=reply.closest('.message');const clone=article.querySelector('.message-body').cloneNode(true);clone.querySelectorAll('button,summary').forEach(e=>e.remove());focusComposer({type:'message',message:article.dataset.messageId,label:'Reply to '+article.dataset.speaker,excerpt:clone.textContent.replace(/\s+/g,' ').trim().slice(0,160),agent:article.dataset.speaker==='You'?null:article.dataset.speaker},'');}
      const copy=e.target.closest('[data-copy-message]');if(copy)void copyMessage(copy.closest('.message'));
    });
    $('presentation-dialog').addEventListener('close',()=>{renderArtifact();document.querySelector('[data-present-deck]')?.focus();});
    document.addEventListener('keydown',e=>{
      if($('presentation-dialog').open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();moveSlide(e.key==='ArrowRight'?1:-1,true);}
    });

    function sizeNavigation(){if(innerWidth>700){$('sidebar').inert=false;$('app').classList.remove('nav-open');}else $('sidebar').inert=!$('app').classList.contains('nav-open');syncPanelAccess();}
    addEventListener('resize',sizeNavigation);addEventListener('hashchange',route);
    sizeNavigation();route();
  </script>
</body>
</html>
