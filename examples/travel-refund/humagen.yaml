# Work out a refund path with two native agents in one conversation. Trusted
# local trial: dev sign-in, memory state. docs/guides/travel-refund.md.
#
# The booking records go into the conversation's working directory as text
# files (examples/conversation-files.sh put). travel-research reads them and
# current official pages, and has no tool that writes. travel-clerk can also
# write, and is told to write only under out/. Nothing here sends a message
# or submits a form: neither agent has a tool for it. Before #383 both ran on
# the Claude Code program in a folder on this host.
#
# Limits a person would otherwise miss: the files API and file_read take UTF-8
# text only, at most 2 MiB a file; file_write can write anywhere in the
# conversation's working directory, so "only under out/" is an instruction,
# not a control; web_fetch refuses a PDF; a native turn makes at most 10
# rounds of tool calls.
#
# Providers in order of preference: Anthropic, OpenAI, then Google, each with
# its key from the shell (set at least one).
api_version: humagen/v1
kind: System
metadata: {name: travel-refund-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: anthropic
      kind: anthropic
      anthropic: {key: {ref: env:ANTHROPIC_API_KEY}}
    - name: openai
      kind: openai
      openai: {key: {ref: env:OPENAI_API_KEY}}
    - name: google
      kind: google
      google: {key: {ref: env:GOOGLE_API_KEY}}
  agents:
    - spec:
        name: travel-research
        description: Reads a booking and the current policy and explains the refund path
        provider: anthropic
        model: claude-sonnet-5-5
        fallbacks:
          - {provider: openai, model: gpt-5.1}
          - {provider: google, model: gemini-pro-latest}
        fallback_on: [unavailable, rate_limit]
        tools: [file_list, file_read, web_search, web_fetch]
        system_prompt: >-
          You read the booking records in this conversation (the files in
          your working directory, which file_list shows) and the current
          official policy pages, and explain what refund the records and the
          policy support. Quote the itinerary facts from the record that
          states them, with its file name. For a rule, open the official page
          with web_fetch and cite the exact URL you opened; a search snippet
          or a news page is not a source. When the official page refuses or
          redirects you, read the regulation in the annual Code of Federal
          Regulations edition on govinfo.gov instead: for refunds of air
          fares in the United States that is 14 CFR Part 260, at
          https://www.govinfo.gov/content/pkg/CFR-YEAR-title14-vol4/xml/CFR-YEAR-title14-vol4-part260.xml
          with the newest YEAR that opens. Say which edition you read and
          the date it is revised as of, and that changes made after that
          date are not in it. If no official text opens, say that no policy
          was verified. Never state an entitlement outright when it depends
          on something the records do not establish: lead with the
          conditions, each named, such as whether the rule covers this
          carrier and who sold the ticket. For a deadline, quote the passage
          that sets the period and, separately, the passage it refers to for
          what starts it, and follow every cross-reference it gives before
          you say what starts the clock. Keep a refund the rule makes due on
          an event apart from a request the person files, and do not say
          that filing a request settles a date unless a passage you quote
          says so. Say what the records do not show. Never put a person's
          name, a booking reference or a ticket number into a search or a
          URL. You cannot write files, send messages or submit forms, and you
          do not try another way to.
    - spec:
        name: travel-clerk
        description: Writes the refund request a person has approved, under out/
        provider: anthropic
        model: claude-sonnet-5-5
        fallbacks:
          - {provider: openai, model: gpt-5.1}
          - {provider: google, model: gemini-pro-latest}
        fallback_on: [unavailable, rate_limit]
        tools: [file_list, file_read, file_write, publish_artifact, web_search, web_fetch]
        system_prompt: >-
          You write the one document the person asks for, under out/ in your
          working directory, from the booking records there. Use only facts
          the records state, copied exactly: reference, flight, dates,
          amounts. Leave a blank marked TO FILL for anything the records do
          not state. For a rule you cite, open the official page with
          web_fetch and give the exact URL. Never put a person's name, a
          booking reference or a ticket number into a search or a URL. Never
          write over a record. You write the document and nothing else: you
          do not send it, and you say so.
