# Build a sourced chronology from records with a native agent. Trusted local
# trial: dev sign-in, memory state. docs/guides/records-research.md.
#
# The records go into the conversation's working directory as text files
# (examples/conversation-files.sh put), or are attached to a message. The
# agent reads them with file_list and file_read, opens official pages with
# web_search and web_fetch, and writes out/chronology.csv and out/unknowns.md
# with file_write. Before #383 this profile ran on the Claude Code program and
# read a folder on this host in place. No confined way does that now: only the
# local sandbox kind's shell could, unconfined and with the server's
# privileges, which is why the local-files example was removed, not ported.
#
# Limits a person would otherwise miss: the files API and file_read take UTF-8
# text only, at most 2 MiB a file, so a scan, photo or PDF record is not read
# this way (attach it to a message instead, for a model that reads it);
# file_write can write anywhere in the conversation's working directory, so
# "only under out/" is an instruction, not a control; a native turn makes at
# most 10 rounds of tool calls, so a large record set needs more than one turn.
#
# Providers in order of preference: Anthropic, OpenAI, then Google, each with
# its key from the shell (set at least one).
api_version: humagen/v1
kind: System
metadata: {name: records-research-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: anthropic
      kind: anthropic
      anthropic: {key: {ref: env:ANTHROPIC_API_KEY}}
    - name: openai
      kind: openai
      openai: {key: {ref: env:OPENAI_API_KEY}}
    - name: google
      kind: google
      google: {key: {ref: env:GOOGLE_API_KEY}}
  agents:
    - spec:
        name: records
        description: Builds a sourced chronology from the records in its conversation
        provider: anthropic
        model: claude-sonnet-5-5
        fallbacks:
          - {provider: openai, model: gpt-5.1}
          - {provider: google, model: gemini-pro-latest}
        fallback_on: [unavailable, rate_limit]
        tools: [file_list, file_read, file_write, publish_artifact, web_search, web_fetch]
        system_prompt: >-
          You build chronologies from the records in this conversation (the
          files in your working directory, which file_list shows, and any
          attached to a message) and from current official pages. Read every
          record before you answer. Every dated event cites the record's file
          name and quotes the words that carry the date, exactly as written. A
          row's date is only what its own quote states: YYYY-MM-DD when the
          quote gives the day, month and year; ????-MM-DD when it gives a day
          and month and no year; the word unknown when it gives no date. Never
          fill in a year or a day from another record, however likely: say in
          the event text what the other record suggests. Where two records
          disagree, give both and say so. For a current rule, fee or policy,
          open the official page with web_fetch and cite the exact URL you
          opened; a search snippet is not a source. Never put a person's name,
          a case or receipt number, or any other identifier from the records
          into a search or a URL. Write only under out/, never over a record.
          Say which records you could not read. You are not a lawyer: report
          what the records and pages say, and give no advice.
