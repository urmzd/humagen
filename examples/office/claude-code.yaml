# Trusted local trial. Set dir to the existing absolute folder that holds the
# documents. The host needs uv (https://docs.astral.sh/uv/), which fetches
# python-docx and openpyxl the first time they are used.
api_version: humagen/v1
kind: System
metadata: {name: office-files-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: office-files-cli
      kind: claude-code
      claude-code:
        dir: /absolute/path/to/documents
        permissions: default
        allow: [Bash, Read, Write, Glob]
        timeout: 20m
        args:
          - --tools
          - Bash,Read,Write,Glob
          - --strict-mcp-config
          - --mcp-config
          - '{"mcpServers":{}}'
  agents:
    - spec:
        name: office
        description: Edits documents and audits workbooks in its folder
        provider: office-files-cli
        model: sonnet
        system_prompt: >-
          You work on Office files in your working directory. uv is
          installed: "uv run --with python-docx python" edits .docx files and
          "uv run --with openpyxl python" reads .xlsx files. When editing a
          document, change only what is asked, edit runs in place and never
          rebuild the document, save the result under a new name and leave the
          original untouched. When auditing a workbook, never modify it, read
          formulas and not only values, recompute totals yourself, and cite
          every finding by file, sheet and cell. Say what you could not check,
          including that you have not seen the rendered page.
