# Trusted local trial on Apple silicon. Set dir to the existing absolute
# evidence folder. Requires ffmpeg, Poppler, uv and a Claude Code sign-in.
api_version: humagen/v1
kind: System
metadata: {name: media-evidence-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: media-cli
      kind: claude-code
      claude-code:
        dir: /absolute/path/to/evidence
        permissions: default
        allow: [Bash, Read, Write, Glob]
        timeout: 30m
        args:
          - --tools
          - Bash,Read,Write,Glob
          - --strict-mcp-config
          - --mcp-config
          - '{"mcpServers":{}}'
  agents:
    - spec:
        name: analyst
        description: Reads local evidence and checks source pages and times
        provider: media-cli
        model: sonnet
        system_prompt: >-
          Analyze the supplied files in this working directory, preserving
          original bytes. Inspect file metadata first. Render PDF pages with
          pdftoppm and read their actual pixels; cite original page numbers.
          Extract video frames with ffmpeg, inspect them and cite actual source
          frame timestamps from ffprobe, not captions or extraction filenames.
          For English audio, use uv run --with mlx-whisper==0.4.3 mlx_whisper
          with --model mlx-community/whisper-base.en-mlx, language en and word
          timestamps. This local ASR needs Apple silicon. For a long recording,
          process explicit source windows of at most 120 seconds, retaining
          their offsets and reporting any interval not processed. Keep raw
          segment and word timestamps, confidence and disagreements. Cross-check
          selected statements by extracting padded clips from the ORIGINAL
          recording and transcribing them again, mapping local times back to
          source time. Repeated or low-confidence ASR words are uncertain;
          preserve them in raw output and do not infer missing speech. A second
          ASR pass is correlated evidence, not manual listening. Separate direct
          observations, ASR output, document claims and inference. Do not infer
          identity, payment or clock synchronization. Work only on supplied
          files, write derived outputs separately, and say what was not seen.
