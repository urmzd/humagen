# Read mixed evidence that a person attaches to a message, with a native
# agent. Trusted local trial: dev sign-in, memory state.
# docs/guides/media-evidence.md.
#
# What the model reads is what the person attaches: at most five files and
# 25 MiB in all a message. Gemini reads PDF pages and images (PNG, JPEG,
# GIF, WebP) and hears MP3 and WAV. An M4A (audio/mp4) attachment does not
# reach it as audio, because saige's model catalog lists only audio/mpeg and
# audio/wav as audio Gemini takes. The catalog also lists MP4 video for
# Gemini; that was not exercised. Anthropic and OpenAI models hear no audio.
#
# So the agent runs on Gemini only, with a second Gemini model as its one
# fallback: a fallback chain accepts only the media types every member
# accepts, so one Anthropic or OpenAI member would turn every audio and video
# attachment into a note (TestMediaEvidenceAgentHearsAudio holds this).
#
# What is gone with #383: the local Whisper transcription (mlx-whisper), the
# PDF page rendering and the video frame extraction that ran in the Claude
# Code program's shell. Humagen has no local transcription. file_read and the
# shell return text only, so a model cannot look at a frame or page it
# extracts itself; this profile grants neither, and its unisolated sandbox
# refuses the shell anyway. Times a model gave for speech were unreliable in
# an earlier live check on another setup: check every time it gives against
# the original. This profile has not been run with a live model.
#
# The one transcription path left is a cloud speech provider: uncomment the
# speech slot below (and set GROQ_API_KEY), or set up Workspace settings >
# Voice. Then every audio attachment on a message, M4A included, and every
# MP4 or WebM video, is transcribed before the run by that provider's model
# (Whisper by default) and put into the message's text, marked
# [Voice note, <language>]. It keeps the words only: no word or segment
# timestamps. At most four recordings a message are heard, and the message
# with its transcripts is cut at 8,000 characters. The audio is sent to that
# provider.
#
# Provider: Google (Gemini), with GOOGLE_API_KEY from the shell.
api_version: humagen/v1
kind: System
metadata: {name: media-evidence-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
  # speech: {kind: groq}   # transcribes audio attachments with GROQ_API_KEY; see above
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: google
      kind: google
      google: {key: {ref: env:GOOGLE_API_KEY}}
  agents:
    - spec:
        name: analyst
        description: Reads attached evidence and separates what it saw from what it infers
        provider: google
        model: gemini-pro-latest
        fallbacks:
          - {provider: google, model: gemini-flash-latest}
        fallback_on: [unavailable, rate_limit]
        tools: [file_write, publish_artifact]
        system_prompt: >-
          Analyze only the files attached to this conversation. List every
          attachment first, with what you could read of it: say plainly when
          one reached you only as a note that it could not be read, and do not
          describe a file you did not receive. Cite original PDF page numbers.
          For audio and video, give times only as approximate and say they
          are your estimate, not measured; never present them as exact
          source timestamps. A transcript marked [Voice note] came from a
          speech service, not from your own listening: label it as such and
          treat its words as uncertain. Do not infer missing speech. Separate
          direct observations, transcripts, document claims and inference. Do
          not infer identity, payment or clock synchronization. When asked,
          write evidence.md with file_write and publish it. Say exactly which
          pages, frames and audio intervals you did not inspect.
