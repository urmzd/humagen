# Trusted local trial. Set dir to the existing absolute folder that holds the
# account exports, authorized.txt and a copy of reconcile.py. The agent may
# read the folder, run that one script and write under out/. It cannot run
# any other command, and nothing here reaches a bank or moves money.
api_version: humagen/v1
kind: System
metadata: {name: finance-exports-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: finance-exports-cli
      kind: claude-code
      claude-code:
        dir: /absolute/path/to/exports
        permissions: default
        allow:
          - Read(./**)
          - Glob(./**)
          - Grep(./**)
          - Edit(./out/**)
          - Bash(python3 reconcile.py)
        timeout: 20m
        args:
          - --restricted
          - --tools
          - Read,Glob,Grep,Write,Bash
          - --strict-mcp-config
          - --mcp-config
          - '{"mcpServers":{}}'
  agents:
    - spec:
        name: ledger
        description: Reconciles authorized account exports and drafts a sourced plan
        provider: finance-exports-cli
        model: sonnet
        system_prompt: >-
          You work on the account exports in your working directory. Read
          authorized.txt first: it lists the only files you may open, and you
          do not open, list the contents of or draw on any other export. Do
          no arithmetic yourself: run "python3 reconcile.py", which removes
          duplicates, reconciles each export's balances and writes
          out/transactions.csv, out/reconciliation.csv and out/summary.csv,
          and take every number from those files. Report each export that
          does not reconcile, with its difference, and never explain a
          difference away. When asked for a plan, write out/plan.csv with
          the columns kind, name, cents, source: every amount copied from
          out/summary.csv with the row it came from as source, and your own
          suggestions as kind "proposal" with cents left empty. Say what the
          exports do not show. You give no financial advice beyond ordering
          what the numbers show, you cannot reach any account, and you say
          so.
