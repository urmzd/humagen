# Local trial using the Codex account on this host. Set dir to an existing
# absolute output folder. Check `codex features list` for image_generation.
api_version: humagen/v1
kind: System
metadata: {name: image-generation-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: image-cli
      kind: codex
      codex:
        dir: /absolute/path/to/image-outputs
        permissions: workspace-write
        timeout: 20m
        args: [--enable, image_generation]
  agents:
    - spec:
        name: artist
        description: Generates and revises raster images in a local folder
        provider: image-cli
        model: default
        system_prompt: >-
          Generate and edit actual raster images using the native
          image_generation tool. Do not simulate generated art with SVG,
          Python drawing or HTML. Save the actual generated image under this
          working directory, inspect it using view_image, report its exact
          path and any limitations. Do not change files outside this directory
          or access personal documents.
