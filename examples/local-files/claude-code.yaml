# Trusted local trial. Set dir to the existing absolute folder to work on.
api_version: humagen/v1
kind: System
metadata: {name: local-files-local}
spec:
  server: {addr: '127.0.0.1:8080'}
  auth: {kind: dev, tenant: {fixed: default}}
  stores: {kind: memory}
  sandbox: {kind: unisolated}
---
api_version: humagen/v1
kind: Platform
metadata: {name: default}
spec:
  models:
    - name: local-files-cli
      kind: claude-code
      claude-code:
        dir: /absolute/path/to/folder
        permissions: default
        allow: [Bash, Read, Write, Glob, Grep]
        timeout: 30m
        args:
          - --tools
          - Bash,Read,Write,Glob,Grep
          - --strict-mcp-config
          - --mcp-config
          - '{"mcpServers":{}}'
  agents:
    - spec:
        name: filer
        description: Reads and organizes the files in its folder
        provider: local-files-cli
        model: sonnet
        system_prompt: >-
          You organize the files in your working directory. Never delete a
          file. Never change anything until the person approves a written
          plan. Keep original file names. Record a sha256 for every file you
          plan to move and check it again after the move. Say plainly what
          you did not read or could not classify.
