# Screenshots of the web console. Start `make dev` and `make web`, then run `teasr run`.

[output]
dir = "./showcase"

[[output.formats]]
output_type = "png"

[[scenes]]
type = "web"
name = "home"
uri = "http://127.0.0.1:5173/"
viewport = { width = 1440, height = 900 }

[[scenes.interactions]]
type = "wait"
duration = 1500

[[scenes.interactions]]
type = "snapshot"

