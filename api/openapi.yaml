components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OIDC access token issued for the API audience, sent as
        `Authorization: Bearer <token>`. A machine uses a client-credentials
        token and is granted exactly the scopes on it that are named
        `humagen:<permission>`, for example `humagen:runs:write`, or
        `warp:<permission>`, the old prefix from before the product was
        renamed, which is still honoured. A person
        using a CLI sends an access token too, and gets roles from its groups
        claim. An ID token is not an API credential and is refused. There is
        no revocation check beyond expiry.
    sessionCookie:
      type: apiKey
      in: cookie
      name: humagen_session
      description: |
        The opaque, HttpOnly cookie a browser is given by `/auth/callback`. It
        is named `__Host-humagen_session` when the server is reached over
        https. A browser never holds a token. Under development auth
        (`-auth=dev`, loopback only) every request is the same admin and no
        credential is needed.
  parameters:
    ActAsClient:
      name: act_as_client
      in: query
      description: |
        With `act_as_user`, read for a person of this client: only the
        credential the client names as its `slack.machine` may, and the
        person, mapped through the client's people, must hold the route's
        permission themselves (`runs:read` for the inbox, `projects:read`
        for projects). Another caller is told the client is not found.
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,39}$"}
    ActAsUser:
      name: act_as_user
      in: query
      description: The Slack user id of the person, with `act_as_client`.
      schema: {type: string, maxLength: 32}
    ProviderName:
      name: provider
      in: path
      required: true
      description: The tool provider's name, as an agent grants it in `mcp:<name>`.
      schema: {type: string}
    AgentName:
      name: name
      in: path
      required: true
      description: The agent's name.
      schema: {type: string}
    RunID:
      name: id
      in: path
      required: true
      description: The run's id, as the platform returned it. It is derived from the workspace and the trigger's id, `r` and 32 hex digits, and is not the trigger's id.
      schema: {type: string}
    ScheduleName:
      name: name
      in: path
      required: true
      description: The schedule's name.
      schema: {type: string}
    MessageID:
      name: id
      in: path
      required: true
      description: The inbox message's id.
      schema: {type: string}
    ArtifactID:
      name: id
      in: path
      required: true
      description: The artifact's id.
      schema: {type: string}
    SuiteName:
      name: name
      in: path
      required: true
      description: The eval suite's name.
      schema: {type: string}
    SourceName:
      name: name
      in: path
      required: true
      description: The knowledge source's name.
      schema: {type: string}
    DocumentID:
      name: id
      in: path
      required: true
      description: The document's id.
      schema: {type: string}
    ProjectName:
      name: name
      in: path
      required: true
      description: The project's name, or `~` for the workspace itself. A name never starts with `~`.
      schema: {type: string, maxLength: 63}
    ChannelName:
      name: channel
      in: path
      required: true
      description: The channel's name within its project.
      schema: {type: string, maxLength: 40}
    ThreadID:
      name: id
      in: path
      required: true
      description: The thread's id, `th-` and 16 hex digits, or for a conversation from before threads the id of the run that started it.
      schema: {type: string}
    PersonHandle:
      name: handle
      in: path
      required: true
      description: The person's handle, as the directory lists it.
      schema: {type: string, maxLength: 32}
    ClientID:
      name: id
      in: path
      required: true
      description: The client's id.
      schema: {type: string}
    Window:
      name: window
      in: query
      description: How far back to look, as a Go duration up to `720h`, such as `1h` or `24h`. Defaults to `1h`.
      schema: {type: string}
  responses:
    ServerError:
      description: An error on the server's side. It is logged and reported without detail.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    TooLarge:
      description: The request body is over 1 MiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    BadRequest:
      description: The request is not valid. The message says why.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Unauthorized:
      description: No credential, or one that does not verify.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Forbidden:
      description: The caller lacks the permission, or a rule refuses the action. The message names what is needed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    NotFound:
      description: No such object in the caller's workspace. Another workspace's object answers the same.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Conflict:
      description: The object already exists, was changed by someone else, is busy, or is managed by the server.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    TooMany:
      description: A cap on how many may exist, or on how fast they may be made, was reached.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Refused:
      description: |
        A limit refused the run. 429 for a count limit (runs in the period,
        runs in flight, or tokens in the period), 402 for a money limit (spend
        in the period, which is enforced, or a call's lease). A scope whose
        spend has reached its limit, to the micro-dollar, refuses every new
        run. The body names the limit, what was left, the policy and its
        version that set it, and when the count starts again.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Refusal"}
  schemas:
    InboxOperationPart:
      description: A durable assignment or handoff needing a person, without asserting that its run failed.
      type: object
      additionalProperties: false
      required: [kind, id, reason]
      properties:
        kind: {type: string, enum: [assignment, handoff]}
        id: {type: string}
        reason: {type: string}
    HandoffUpdate:
      type: object
      additionalProperties: false
      required: [version, state, owner, blocker, due_at]
      properties:
        version: {type: integer, minimum: 1}
        state: {type: string, enum: [accepted, blocked, needs_person, result]}
        owner: {type: string}
        blocker: {type: string, maxLength: 4000}
        due_at: {type: string, format: date-time}
    HandoffTerms:
      type: object
      additionalProperties: false
      required: [goal, done_when, due_at]
      properties:
        goal: {type: string, minLength: 1, maxLength: 8000}
        done_when: {type: string, minLength: 1, maxLength: 4000}
        due_at: {type: string, format: date-time}
    AgentControl:
      type: object
      properties:
        state: {type: string, enum: [ready, working, waiting_on_people, watching, paused, failed]}
        effective_paused: {type: boolean}
        manager_name: {type: string}
        last_run: {type: string}
        last_run_at: {type: string, format: date-time}
        last_run_status: {$ref: "#/components/schemas/RunStatus"}
        agent:
          type: string
        paused:
          type: boolean
        manager:
          type: string
        stop_rules:
          type: string
        version:
          type: integer
          minimum: 0
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
      - paused
      - version
      - updated_by
      - updated_at
      additionalProperties: false
    AgentControlInput:
      type: object
      properties:
        paused:
          type: boolean
        manager:
          type: string
        stop_rules:
          type: string
        version:
          type: integer
          minimum: 0
      required:
      - paused
      - version
      additionalProperties: false
    ActionPolicy:
      type: object
      properties:
        scope:
          type: object
          properties:
            kind:
              type: string
              enum:
              - workspace
              - project
              - agent
              - personal
            name:
              type: string
          required:
          - kind
          additionalProperties: false
        rules:
          type: object
          additionalProperties:
            type: string
            enum:
            - allow
            - ask
            - never
          propertyNames:
            type: string
            enum:
            - read_context
            - write_files
            - publish_artifacts
            - external_messages
            - call_agents
            - other
        version:
          type: integer
          minimum: 0
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
      - scope
      - rules
      - version
      - updated_by
      - updated_at
      additionalProperties: false
    ActionPolicyInput:
      type: object
      properties:
        rules:
          type: object
          additionalProperties:
            type: string
            enum:
            - allow
            - ask
            - never
          propertyNames:
            type: string
            enum:
            - read_context
            - write_files
            - publish_artifacts
            - external_messages
            - call_agents
            - other
        version:
          type: integer
          minimum: 0
      required:
      - rules
      - version
      additionalProperties: false
    Assignment:
      type: object
      properties:
        owner_name: {type: string}
        source_version: {type: integer, format: int64, minimum: 0}
        tag_id: {type: string}
        trigger: {type: string, enum: [manual, cron, source_change]}
        source: {type: string}
        id:
          type: string
        agent:
          type: string
        project:
          type: string
        thread:
          type: string
        owner:
          type: string
        goal:
          type: string
        done_when:
          type: string
        due_at:
          type: string
          format: date-time
        schedule:
          type: string
        cron:
          type: string
        state:
          type: string
          enum:
          - requested
          - accepted
          - in_progress
          - watching
          - result
          - blocked
          - needs_person
          - cancelled
        blocker:
          type: string
        run_id:
          type: string
        version:
          type: integer
          minimum: 0
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - agent
      - project
      - owner
      - goal
      - done_when
      - state
      - version
      - updated_by
      - created_at
      - updated_at
      additionalProperties: false
    AssignmentInput:
      type: object
      properties:
        trigger: {type: string, enum: [manual, cron, source_change]}
        source: {type: string}
        id:
          type: string
        agent:
          type: string
        project:
          type: string
        thread:
          type: string
        owner:
          type: string
        goal:
          type: string
        done_when:
          type: string
        due_at:
          type: string
          format: date-time
        cron:
          type: string
        state:
          type: string
          enum:
          - requested
          - accepted
          - in_progress
          - watching
          - result
          - blocked
          - needs_person
          - cancelled
        blocker:
          type: string
        version:
          type: integer
          minimum: 0
      required:
      - id
      - agent
      - project
      - owner
      - goal
      - done_when
      - state
      - version
      additionalProperties: false
    HandoffContract:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        project:
          type: string
        thread:
          type: string
        owner:
          type: string
        goal:
          type: string
        done_when:
          type: string
        inputs:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - run
                - artifact
                - thread
                - text
              reference:
                type: string
            required:
            - type
            - reference
