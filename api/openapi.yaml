          type: array
          items:
            "$ref": "#/components/schemas/AgentNetworkEdge"
        truncated:
          type: boolean
      required:
      - edges
      - truncated
      additionalProperties: false
    ErrorBody:
      description: What every failure answers with.
      type: object
      required: [error]
      properties:
        error:
          description: What went wrong, in words a person can be shown.
          type: string
    Refusal:
      description: Why a limit refused a run.
      type: object
      required: [error, limit, remaining]
      properties:
        error: {type: string}
        limit: {$ref: "#/components/schemas/PolicyLimit"}
        remaining:
          description: What was left of the limit when the run was refused.
          type: integer
          format: int64
        policy:
          description: The policy that refused, when one did.
          type: object
          required: [scope, version, period]
          properties:
            scope: {$ref: "#/components/schemas/PolicyScope"}
            version: {type: integer}
            period: {$ref: "#/components/schemas/PolicyPeriod"}
        resets_at:
          description: When the count starts again. Present for the `runs`, `spend` and `tokens` limits, which count over a period.
          type: string
          format: date-time

    Permission:
      type: string
      enum:
        - agents:read
        - agents:write
        - runs:read
        - runs:write
        - schedules:read
        - schedules:write
        - alerts:read
        - alerts:write
        - knowledge:read
        - knowledge:write
        - evals:read
        - evals:write
        - billing:read
        - billing:write
        - artifacts:read
        - artifacts:write
        - clients:read
        - clients:write
        - projects:read
        - projects:write
        - projects:govern
        - people:read
    Principal:
      description: An authenticated caller. The tenant is the workspace everything they touch is confined to.
      type: object
      required: [subject, tenant, kind]
      properties:
        subject: {type: string}
        tenant: {type: string}
        kind: {type: string, enum: [user, machine]}
        name: {type: string}
        email: {type: string}
        roles:
          type: array
          items: {type: string, enum: [viewer, operator, manager, admin]}
        scopes:
          description: A machine's permissions, from its token.
          type: array
          items: {$ref: "#/components/schemas/Permission"}
    AccessDecision:
      description: Why the caller may or may not do one thing.
      type: object
      required: [permission, allowed, outcome, held]
      properties:
        permission: {$ref: "#/components/schemas/Permission"}
        allowed: {type: boolean}
        outcome:
          description: >-
            allowed; denied, when a rule denies it, which beats every allow;
            no match, when no rule in the roles held mentions it and the
            default is deny; scope, when a machine's token scope decided.
          type: string
          enum: [allowed, denied, no match, scope]
        role:
          description: The held role the deciding rule reached the caller through.
          type: string
        path:
          description: From role to the role that declares the rule.
          type: array
          items: {type: string}
        rule:
          description: The deciding rule, as the policy writes it.
          type: string
        grant:
          description: The grant that gave the role, when the sign-in kept it.
          type: string
        held:
          description: Every role the decision considered.
          type: array
          items: {$ref: "#/components/schemas/AccessHeldRole"}
        unknown:
          description: Roles the caller holds that the policy does not declare. They grant nothing.
          type: array
          items: {type: string}
    AccessHeldRole:
      type: object
      required: [role]
      properties:
        role: {type: string}
        grant:
          description: The grant that gave the role, as the policy writes it, when known.
          type: string
        group:
          description: The group the grant names, when it names one.
          type: string
    Me:
      type: object
      required: [principal, permissions, first_admin]
      properties:
        principal: {$ref: "#/components/schemas/Principal"}
        permissions:
          description: Everything the caller may do. Null, not an empty list, for a caller with no permission at all.
          type: [array, "null"]
          items: {$ref: "#/components/schemas/Permission"}
        welcome_announcement:
          description: Retained Company welcome announcement ID, absent when the caller cannot read inbox announcements.
          type: string
        personal_project:
          description: The signed-in human's private project address, absent for machines.
          type: string
        first_admin:
          description: The caller is an admin in a workspace nobody has set up yet.
          type: boolean
        handle:
          description: |
            How the platform names the caller elsewhere, as a thread's
            `created_by` and its participants name people: their handle, or
            their subject when they have none and it holds no address. Empty
            when neither.
          type: string

    AgentSource:
      type: object
      required: [name, uri]
      properties:
        name: {type: string}
        uri: {type: string}
        options:
          type: object
          additionalProperties: {type: string}
    AgentAccess:
      type: object
      properties:
        spawn:
          description: |
            The agents this one may call. An agent that lives in a project the
            caller may not read is left out. Written, each must be an agent
            that exists and that the caller may read, or one this list already
            names that they are shown: any other, in any spelling, is 400 in
            the words for an agent that does not exist. The ones left out are
            kept.
          type: array
          items: {type: string}
        workspace_areas:
          type: array
          items: {type: string}
    AgentSpec:
      description: An agent's definition.
      type: object
      required: [name, model, provider, system_prompt]
      properties:
        name: {type: string}
        description: {type: string}
        model: {type: string}
        provider:
          description: A model provider, or `policy` to run on the workspace model policy named by `model`.
          type: string
        fallbacks:
          description: |
            Models tried in order when the primary fails with an error another
            model could get past (an outage, a rate limit, an exhausted retry).
            An invalid request or a cancellation is not retried elsewhere. At
            most 4, none repeating the primary or each other.
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/ModelRef"}
        fallback_on:
          description: When a call moves to the next fallback. Empty means any error another model could get past. Needs at least one fallback.
          type: array
          items: {$ref: "#/components/schemas/FallbackCondition"}
        system_prompt: {type: string}
        tools:
          type: array
          items: {type: string}
        sources:
          type: array
          items: {$ref: "#/components/schemas/AgentSource"}
        access: {$ref: "#/components/schemas/AgentAccess"}
        approvals:
          description: |
            Tools whose every call waits for a person to approve it. Each is a
            tool the agent is granted. `ask_person` in `tools` lets the agent
            ask a person to choose or reply. The approval of a call to an agent
            left out of `access.spawn` (`tag_<agent>`) is left out too, and
            kept. When every approval is left out, so are `approvers` and
            `self_approval`, which apply only to approvals, and a spec written
            with no approvals or approvers of its own keeps them.
          type: array
          items: {type: string}
        approvers:
          description: |
            When set, the only people who may answer an approval: principals by
            subject, or this workspace's roles as `role:<name>`. Empty lets
            anyone in the workspace approve, except the person who asked.
          type: array
          items: {type: string}
        self_approval:
          description: Lets the person whose request raised a call approve it. Off by default.
          type: boolean
        answerers:
          description: When set, the only people who may answer a choice or a reply, named as approvers are.
          type: array
          items: {type: string}
    FallbackCondition:
      description: A class of model error that moves a call on to the next model. `any` cannot be combined with another.
      type: string
      enum: [any, unavailable, rate_limit, transient, auth, context_length, content_filter]
    ModelPolicy:
      description: A workspace's named, ordered list of models. The first answers; the rest are fallbacks.
      type: object
      required: [name, models]
      properties:
        name: {type: string}
        description: {type: string}
        models:
          type: array
          minItems: 1
          maxItems: 5
          items: {$ref: "#/components/schemas/ModelRef"}
        fallback_on:
          description: When a call moves to the next model. Empty means any error another model could get past.
          type: array
          items: {$ref: "#/components/schemas/FallbackCondition"}
    ModelRef:
      description: One model, named by its provider.
      type: object
      required: [provider, model]
      properties:
        provider: {type: string}
        model: {type: string}
    Revision:
      description: One immutable revision of an agent.
      type: object
      required: [spec, rev, hash, created_at, created_by]
      properties:
        spec: {$ref: "#/components/schemas/AgentSpec"}
        rev: {type: integer}
        hash:
          description: The hash of the definition, or when an agent is left out of `spec` for the caller, the hash of what they are shown.
          type: string
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        created_by_name:
          description: What whoever saved it is called, their name, else their handle, never a subject that holds an address. `created_by` is the subject.
          type: string
    Choice:
      description: Which agent @auto would pick for a message, and why.
      type: object
      required: [agent, reason]
      properties:
        agent: {type: string}
        reason:
          description: 'A sentence a person reads, such as "Picked by @auto: matched billing."'
          type: string
        matched:
          type: array
          items: {type: string}

    Note:
      description: One thing an agent or a project remembers.
      type: object
      required: [id, text, source, status, at]
      properties:
        id: {type: string}
        text: {type: string}
        source: {type: string, enum: [person, consolidated]}
        status:
          description: A pending note is a proposal, not used until a person approves it.
          type: string
          enum: [approved, pending]
        by: {type: string}
        by_name:
          description: What the person who wrote it is called, their name, else their handle, never a subject that holds an address. `by` is the subject.
          type: string
        at: {type: string, format: date-time}
    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items: {$ref: "#/components/schemas/Note"}
    NoteInput:
      type: object
      required: [text]
      properties:
        text: {type: string}
    NoteSelection:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: string}
    Approved:
      type: object
      required: [approved]
      properties:
        approved: {type: integer}
    MemoryProposal:
      description: A proposed note, for an agent or for a project.
      type: object
      required: [note]
      properties:
        agent: {type: string}
        project:
          description: The project the note is for, `~` for the workspace's own.
          type: string
        note: {$ref: "#/components/schemas/Note"}

    Actor:
      description: The person or system that raised a run.
      type: object
      required: [id]
      properties:
        id: {type: string}
        display: {type: string}
        bot: {type: boolean}
        user:
          description: >-
            The person the run acts for, by their subject in this workspace:
            the person signed in, the person a surface asked for (`act_as`),
            or the person a Slack client maps the Slack user to. Its tools
            that act as a person use this person's own credentials. Absent
            when the run acts for nobody.
          type: string
    ToolCredentials:
      description: The workspace's tools that act as the caller, how the caller stands with each, and what the workspace lets people give.
      type: object
      required: [providers, values, references]
      properties:
        providers:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/ToolCredential"}
        values:
          description: Whether this workspace lets people store a credential's value with Humagen. Off, people give only a reference to where it is kept.
          type: boolean
        references:
          description: How the references the caller may give start, their own under each start the operator listed, with the caller's subject in place of `{subject}`. A start the caller's subject cannot be written in is left out, and a machine gets none. Empty means no reference can be given.
          type: array
          items: {type: string}
    ToolCredential:
      description: A tool provider that is reached with each person's own credential, and whether the caller has connected one. A value is never shown.
      type: object
      required: [provider, transport, tools, connected]
      properties:
        provider: {type: string}
        transport: {type: string, enum: [http, stdio]}
        endpoint:
          description: Where an http provider is reached, so a person sees where their credential is sent. A stdio provider runs on the server and has none.
          type: string
        tools:
          description: How many tools the workspace accepted from the provider.
          type: integer
        connected: {type: boolean}
        kind: {$ref: "#/components/schemas/CredentialKind"}
        ref:
          description: The reference, when the credential is one. It names where the secret is kept, never the secret.
          type: string
        updated_at: {type: string, format: date-time}
    CredentialKind:
      description: How a credential is held. A `reference` is a name, and only the name is stored; a `value` is the secret itself, stored in the secrets store client secrets are kept in.
      type: string
      enum: [reference, value]
    ToolCredentialInput:
      description: A reference (`env:NAME`, `keychain:SERVICE[/ACCOUNT]` or `op://VAULT/ITEM/FIELD`) or a value, exactly one. A value is stored and never answered back.
      type: object
      properties:
        ref: {type: string, maxLength: 512}
        value: {type: string, maxLength: 8192, writeOnly: true}
    RunStatus:
      description: Where a run stands. `completed`, `failed` and `stopped` are final.
      type: string
      enum: [accepted, running, parked, completed, failed, stopped]
    CallMode:
      description: How one agent calls another. A subagent is attached to its caller. A handoff or a delegate is independent.
      type: string
      enum: [subagent, handoff, delegate]
    RunFeedback:
      description: |
        Feedback metadata only. The referenced run owns the prompt, answer and
        conversation links. A rater is named as the platform calls them, by
        handle and by name, never by the subject they sign in with, which may
        hold an address.
      type: object
      required: [run, by, by_name, mine, rating, updated_at]
      properties:
        run: {type: string}
        by:
          description: The rater's handle, else their subject when it holds no address (a machine's), else "".
          type: string
        by_name:
          description: What the rater is called, their name, else their handle, else their subject when it holds no address, else "someone". Never an address.
          type: string
        mine:
          description: Whether this is the rating of the person asking.
          type: boolean
        rating: {type: string, enum: [up, down]}
        reason: {type: string}
        comment: {type: string}
        updated_at: {type: string, format: date-time}
    Run:
      description: One run and its place in the call tree and in its conversation.
      type: object
      required: [citations, id, tag_id, tenant, agent, rev, origin, text, root, depth, thread, lease, granted, spent, calls, status, created_at, updated_at]
      properties:
        citations:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/RunCitation"}
        id:
          description: The run's id, `r` and 32 hex digits, derived from the workspace and the trigger's id.
          type: string
        tag_id:
          description: |
            The trigger's id the run was accepted with: an event id, or for a
            run started through the API with an `Idempotency-Key`,
            `api-<length of subject in bytes>-<subject>-<key>`, which is
            unambiguous. A run started without a key has `api-r-<random>`.
            The run's `id` is derived from it and the workspace, and cannot be
            turned back into it.
          type: string
        tenant: {type: string}
        agent: {type: string}
        rev:
          description: The agent revision the run is pinned to.
          type: integer
        origin:
          description: The trigger that raised the run, such as `api`, `slack`, `github`, `cron`, `manual`, `agent` or `system`.
          type: string
        text:
          description: What the run was asked.
          type: string
        input: {$ref: "#/components/schemas/PreparedCallInput"}
        actor: {$ref: "#/components/schemas/Actor"}
        root:
          description: The run at the top of the call tree. A run nobody called is its own root.
          type: string
        parent: {type: string}
        depth: {type: integer}
        mode: {$ref: "#/components/schemas/CallMode"}
        lifecycle:
          description: Set on a run another run called. An attached run ends with its caller. A delegated one does not.
          type: string
          enum: [attached, delegated]
        schedule:
          description: The schedule that raised the run, if one did.
          type: string
        thread:
          description: The conversation the run belongs to. A run that starts a conversation is its own thread.
          type: string
        prev:
          description: The turn this one follows. Two runs with the same `prev` are branches.
          type: string
        picked:
          description: Why the agent was chosen, when the caller left it to the platform.
          type: string
        routed:
          description: |
            Set when the run was started by its thread's selected agents, and
            how: `best_fit`, the one that fit best (`picked` says why), or
            `all`, one of each selected agent. Absent for a run a tag, a
            default or anything else started, and kept whatever the
            selection becomes later.
          type: string
          enum: [best_fit, all]
        project: {type: string}
        within:
          description: |
            The project's ancestors, nearest first and the workspace left out,
            pinned when the run was admitted: what it counts toward besides
            its project. A run an agent called has its root's.
          type: array
          maxItems: 3
          items: {type: string}
        client:
          description: The Slack app or GitHub installation that raised the run.
          type: string
        channel:
          description: The project's channel the conversation is in. Absent is `general`. A called run has its root's.
          type: string
        message:
          description: |
            The person's message in a shared thread that the run answers, such
            as `m-3`. Runs that answer one message answer it side by side and
            are not branches.
          type: string
        lease:
          description: The run's budget in micro-USD. Zero means unmetered.
          type: integer
          format: int64
        granted:
          description: |
            The budget the run has leased to calls that have not ended, in
            micro-USD. When a call ends its lease is released here and what it
            spent is added to `spent`.
          type: integer
          format: int64
        spent:
          description: |
            What the run has spent, in micro-USD priced in US dollars: its own
            model calls as they are reported, and the whole spend of each call
            it made once that call has ended. Its lease is held against this
            plus `granted`. Calls with no price, or priced in another currency,
            add nothing here; `usage` counts them.
          type: integer
          format: int64
        usage:
          description: |
            What the run used, as the runtime counts it: its own model calls,
            the attached runs it rolled up, and how full its context was at its
            latest model call. While the run works it is the calls reported so
            far; once it has ended it is the runtime's record. Absent until the
            first model call. A delegated run is not in its caller's usage.
          $ref: "#/components/schemas/RunUsage"
        calls: {type: integer}
        status: {$ref: "#/components/schemas/RunStatus"}
        answer:
          description: |
            The final text of a completed run. On a stopped run it is the
            partial answer, what the agent had said when it stopped, which may
            be empty. It is never the whole answer when `status` is `stopped`.
          type: string
        error: {type: string}
        reason:
          description: What a parked run is waiting for.
          type: string
        question:
          description: What a parked run is waiting on a person for. Absent once it resumes or ends.
          $ref: "#/components/schemas/Question"
        cause:
          description: Why a stopped run was stopped, as the runtime reported it, such as `Stopped by ada`.
          type: string
        stopping:
          description: The run was asked to stop and has not ended yet. It starts no further calls. Absent once the run has ended, however it ended.
          type: boolean
        stop_requested_at:
          description: When the run was first asked to stop. Absent once the run has ended.
          type: string
          format: date-time
        finishing:
          description: The run has its answer and is held open by attached runs still working.
          type: boolean
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {$ref: "#/components/schemas/Run"}
    CreateRunRequest:
      type: object
      required: [text]
      properties:
        agent:
          description: |
            Who should answer: an agent, or `auto` for `@auto`, which picks
            among the agents available where the conversation is filed. Left
            out, the default the conversation's place inherits answers: the
            thread's, the acting client's, the channel's, then the project
            chain's and the workspace's.
          type: string
        text:
          description: The message. It must not be blank.
          type: string
        after:
          description: |
            The id of the turn this message follows. Empty starts a
            conversation. Naming a turn that already has a reply starts a
            branch from that point.
          type: string
        project:
          description: Files a new conversation under a project. A follow-up keeps its conversation's project.
          type: string
        act_as:
          description: |
            The person a surface asks for, such as a Slack user its client
            maps. The run's actor is that person, so they do not approve its
            calls. Only the credential the client names may send it.
          $ref: "#/components/schemas/ActAs"
    ActAs:
      description: A person a surface authenticated itself, named by the surface's client and the surface's own user id.
      type: object
      required: [client, user]
      properties:
        client: {type: string}
        user: {type: string}
    AgentCallInput:
      description: Explicit helper context and its return contract. Agent rules remain pinned.
      type: object
      required: [messages, response_format]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/AgentCallMessage"}
        response_format: {$ref: "#/components/schemas/AgentCallResponseFormat"}
    AgentCallMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: "#/components/schemas/AgentCallPart"}
    AgentCallPart:
      description: Inline text or a reference resolved within the caller's workspace.
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: {type: string, enum: [text]}
            text: {type: string}
        - type: object
          required: [type, thread, from, through]
          properties:
            type: {type: string, enum: [conversation_range]}
            thread: {type: string}
            from: {type: string}
            through: {type: string}
        - type: object
          required: [type, id, version]
          properties:
            type: {type: string, enum: [artifact]}
            id: {type: string}
            version: {type: integer}
        - type: object
          required: [type, run]
          properties:
            type: {type: string, enum: [run_result]}
            run: {type: string}
    AgentCallResponseFormat:
      description: Validated helper output, independent of delivery and permissions.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [text]}
            max_chars: {type: integer, minimum: 0, maximum: 64000}
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [summary]}
            max_words: {type: integer, minimum: 0, maximum: 2000}
        - type: object
          required: [type, schema]
          properties:
            type: {type: string, enum: [json_schema]}
            schema:
              description: A JSON Schema object or boolean schema.
              oneOf:
                - {type: object, additionalProperties: true}
                - {type: boolean}
    PreparedCallInput:
      description: Original references plus the exact resolved messages used on replay.
      type: object
      required: [input, messages]
      properties:
        input: {$ref: "#/components/schemas/AgentCallInput"}
        messages:
          type: array
          items:
            type: object
            required: [role, text]
            properties:
              role: {type: string, enum: [user, assistant]}
              text: {type: string}
    CreateCallRequest:
      type: object
      required: [key, agent, mode]
      properties:
        contract: {$ref: "#/components/schemas/HandoffTerms"}
        key:
          description: Identifies the call within the caller's run. The same key joins the child it already started.
          type: string
        agent: {type: string}
        text:
          description: Plain text shorthand. Supply text or input, never both.
          type: string
        input: {$ref: "#/components/schemas/AgentCallInput"}
        mode: {$ref: "#/components/schemas/CallMode"}
        lease:
          description: The budget granted to the child, in micro-USD.
          type: integer
          format: int64
    ThreadSummary:
      description: |
        One conversation: what its runs say, with what its record adds. A
        thread people started that no agent has answered yet is one too.
      type: object
      required: [id, title, named, origin, channel, agents, people, turns, branches, active, failed, created_at, updated_at, visibility, messages]
      properties:
        id: {type: string}
        title: {type: string}
        named:
          description: The title is a name, not just the first message.
          type: boolean
        origin: {type: string}
        project: {type: string}
        channel:
          description: The project's channel it is in, `general` when its runs name none.
          type: string
        agents:
          description: The agents whose runs answered in it. A run names the agent that ran it, even one that lives since in a project the caller may not read.
          type: array
          items: {type: string}
        people:
          description: The people who asked or posted in it, by handle. A run counts as asked by the person it acted for, so a connector's run names the person its user is mapped to, never that user, and a run that acted for nobody names nobody. Someone the directory cannot name, and whose subject holds an address, is left out.
          type: array
          items: {type: string}
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        messages:
          description: How many messages people have posted in it.
          type: integer
        turns: {type: integer}
        branches: {type: integer}
        active:
          description: How many of its runs are in flight.
          type: integer
        failed: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ThreadVisibility:
      description: |
        Who reads a thread. `shared` is everyone who can see its project.
        `private` is its participants only, and `projects:govern`.
      type: string
      enum: [shared, private]
    ThreadParticipant:
      description: |
        A person or an agent taking part in a thread. A thread names a
        person by their handle, and is sent one by handle: a subject, the key
        a person signs in with, can hold an address and is never shown. A
        person with no handle, whose subject holds no address, is named by
        their subject; one with neither reads as empty.
      type: object
      required: [kind, name, at]
      properties:
        kind: {type: string, enum: [person, agent]}
        name:
          description: A person's handle or an agent's name.
          type: string
          maxLength: 200
        owner:
          description: The person who started the thread.
          type: boolean
        added_by:
          description: The handle of the person who added them.
          type: string
        at: {type: string, format: date-time}
    Thread:
      description: |
        A shared thread's record: the channel it is in, who takes part, its
        visibility and an optional default agent. Its turns are its people's
        messages and its agents' runs.
      type: object
      required: [id, project, channel, visibility, participants, version, created_by, created_at, updated_at]
      properties:
        moves:
          description: Number of committed placement changes, without former audience identities.
          type: integer
          minimum: 0
          maximum: 100
        id:
          description: "`th-` and 16 hex digits, or for a conversation from before threads the id of the run that started it."
          type: string
        project:
          description: The project it is filed in. Empty is the workspace itself.
          type: string
        channel: {type: string}
        title: {type: string, maxLength: 200}
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        participants:
          description: Who takes part. An agent that lives in a project the caller may not read is left out unless it answered in the thread, as its runs there name it. The caller adds people and agents up to 50 they are shown; with the ones they are not shown, and the people who post and the agents who answer, who join on their own, the record holds at most 100.
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ThreadParticipant"}
        default:
          description: Answers an untagged message here, an agent or `auto`. Absent inherits from the channel. One naming an agent that lives in a project the caller may not read reads as absent, and is passed over for them, so `answers` and what their messages do are as if it were not set.
          type: string
        agents:
          description: |
            The agents selected to answer the untagged messages people post in
            the thread as themselves (the console), at most 5; a client's
            messages from Slack or GitHub keep the defaults. A message that
            tags an agent is answered by the agents it tags instead. An agent the caller may not read is left out, as if
            not selected. Absent when none is selected.
          type: array
          maxItems: 5
          items: {type: string}
        mode: {$ref: "#/components/schemas/ThreadMode"}
        surface: {$ref: "#/components/schemas/ThreadSurface"}
        announcement:
          description: The inbox id of the announcement the thread was started from, a reply to its post on the thread's surface. It never changes, and the thread's turns start with it.
          type: string
        version:
          description: Counts edits to the record, from 1. A conversation from before threads reads 0 until its record is written.
          type: integer
        created_by:
          description: The handle of the person who started it, the first person to ask or post in it.
          type: string
        created_at: {type: string, format: date-time}
        updated_at:
          description: When anything last happened in it.
          type: string
          format: date-time
    ThreadMention:
      description: One tag in a message, and what it came to.
      type: object
      required: [kind, name]
      properties:
        kind:
          description: |
            `agent`, `person` and `sme` as tagged; `skill` for `$<name>` and
            `@skill:<name>`, which the runs the message starts are told to
            use; `role` for the people holding a role, through a mention kind
            that resolves roles. A mention kind the workspace declares is
            recorded as what it resolves to.
          type: string
          enum: [agent, person, sme, skill, role]
        name:
          description: The agent (`auto` for @auto, which a message that names a skill and tags no agent starts), the person's handle (as written, when nobody goes by it), the experts' topic (empty for every expert), the skill, or the role. A tag of an agent that lives in a project the reader may not read and that started no run reads as one of a person nobody goes by, as a tag of an agent that does not exist does. One that started a run is kept, as the run names its agent.
          type: string
        run:
          description: The run an agent's tag started.
          type: string
        refused:
          description: Why the tag started or notified nothing.
          type: string
    ThreadAnswerRef:
      description: The question a message answers.
      type: object
      additionalProperties: false
      required: [run, question]
      properties:
        run: {type: string}
        question: {type: string}
    Attachment:
      type: object
      required: [digest, media_type, size]
      properties:
        digest: {type: string}
        media_type: {type: string}
        size: {type: integer, format: int64}
        name: {type: string}
        alt: {type: string}
        origin: {type: string}
        unread: {type: string}
    ThreadMessage:
      description: A person's turn in a thread. It starts no run of its own. Its author is always a person.
      type: object
      required: [id, thread, by, name, text, mentions, via, at]
      properties:
        attachments:
          type: array
          items: {$ref: "#/components/schemas/Attachment"}
        id:
          description: "`m-` and its place in the thread, from 1."
          type: string
        thread: {type: string}
        prev:
          description: The turn it follows. Absent for the first.
          type: string
        by:
          description: The handle of the person who posted it.
          type: string
        name:
          description: What they are called, their name in the directory or else their handle. Never an address.
          type: string
        text: {type: string, maxLength: 8000}
        mentions:
          type: array
          maxItems: 10
          items: {$ref: "#/components/schemas/ThreadMention"}
        answers: {$ref: "#/components/schemas/ThreadAnswerRef"}
        via:
          description: "`console`, or the id of the client it came through."
          type: string
        surface_id: {type: string}
        at: {type: string, format: date-time}
    ThreadAnnouncement:
      description: |
        The announcement a thread was started from, as it stands when the
        thread is read: who posted it and what it says. It is the inbox's,
        never a message of the thread, so it is from whoever posted it, a
        person, the agent a schedule ran, or Humagen itself for a release's
        notes, and never from the person whose reply started the thread. A
        withdrawn one says nothing more.
      type: object
      required: [id, kind, by, at]
      properties:
        id:
          description: The announcement's inbox id.
          type: string
        kind:
          description: Who posted it. `system` is Humagen itself, as for a release's notes.
          type: string
          enum: [person, agent, system]
        by:
          description: The person's handle, the agent's name, or `humagen` for what Humagen posted itself (`warp` in records written before the rename).
          type: string
        name:
          description: What the person is called. Absent for an agent and for Humagen itself (`system`).
          type: string
        subject: {type: string, maxLength: 150}
        text: {type: string, maxLength: 4000}
        withdrawn:
          description: Withdrawn for everyone. Its subject and text are then absent.
          type: boolean
        at: {type: string, format: date-time}
    ThreadTurn:
      description: One turn of a thread, a person's message, an agent's run, or the announcement the thread was started from, which comes first.
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [message, run, announcement]}
        message: {$ref: "#/components/schemas/ThreadMessage"}
        run: {$ref: "#/components/schemas/Run"}
        announcement: {$ref: "#/components/schemas/ThreadAnnouncement"}
        ask: {$ref: "#/components/schemas/ThreadAsk"}
    ThreadAsk:
      description: |
        The question a parked run waits on, as the reader stands to it, on a
        run turn whose run is parked on a question a person answers. `yours`
        says the reader may answer it, as answering would check them: it is
        addressed to them, they hold `runs:write`, and nothing else refuses
        them, such as approving a call their own request raised. `for` says
        whom it is for: `anyone` who may resume runs, one `person` (the
        person the run acts for, by handle, when an answer may reach their
        own credential), the `experts` on `topic` in the run's project (every
        expert when `topic` is absent), the `answerers` its agent's rules
        name or it asked, the `owners` of the nearest project on the run's
        chain that names any, when it asked the experts and there are none
        (`owners_of` is what that project is called), or `nobody`, when the
        rules cannot be read. It names nobody, and no project, the reader may
        not see. The runtime still has the last
        word when an answer is given.
      type: object
      required: [question, yours, for]
      properties:
        question:
          description: The question's id, `question.id` on the run.
          type: string
        yours: {type: boolean}
        for:
          type: string
          enum: [anyone, person, experts, answerers, owners, nobody]
        topic: {type: string}
        person:
          description: The handle of the person it is for, with `for` of `person`.
          type: string
        owners_of:
          description: |
            With `for` of `owners`, what the project whose owners it is for is
            called: its title, else its name. Absent for the workspace, and
            for a project the reader may not see.
          type: string
    ThreadAnswers:
      description: |
        Who answers an untagged message in a place, and where that is set:
        `thread`, `client`, `channel`, or `project:<name>` (`project:~` for
        the workspace). An empty agent is nobody. `unavailable` says why the
        default cannot answer, when it has stopped being available. A
        thread's, a client's or a channel's default naming an agent that
        lives in a project the reader may not read is passed over for them,
        as if it were not set, so this is the next default along: such an
        agent is never available where they read.
      type: object
      required: [agent, from]
      properties:
        agent: {type: string}
        from: {type: string}
        unavailable: {type: string}
    ThreadPage:
      description: A thread and one page of its turns, oldest first.
      type: object
      required: [thread, turns, next, answers]
      properties:
        thread: {$ref: "#/components/schemas/Thread"}
        turns:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/ThreadTurn"}
        next:
          description: The cursor for the turns before these, null at the start.
          type: [string, "null"]
        answers: {$ref: "#/components/schemas/ThreadAnswers"}
    ThreadInput:
      description: |
        A new thread and its first message. `visibility` left out is
        `private` for a person posting as themselves, and required with
        `act_as` and no `surface`. With `surface` the platform files the thread, and project,
        channel, visibility and default are left out.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        project:
          description: Where it is filed. Empty or `~` is the workspace itself.
          type: string
          maxLength: 63
        channel:
          description: The project's channel. Empty is `general`.
          type: string
          maxLength: 40
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        title: {type: string, maxLength: 200}
        default:
          description: Answers untagged messages in the thread, an agent available in the project or `auto`.
          type: string
        agents:
          description: Agents selected to answer the untagged messages people post in the thread as themselves (the console), at most 5, each available in the project (400; one the caller may not read is as one that does not exist). `all` takes at most 3.
          type: array
          maxItems: 5
          items: {type: string}
        mode: {$ref: "#/components/schemas/ThreadMode"}
        text: {type: string, maxLength: 8000}
        post_only:
          description: Post without any agent answering, unless the message tags one. In the console this is what an untagged message does anyway.
          type: boolean
        act_as: {$ref: "#/components/schemas/ActAs"}
        surface: {$ref: "#/components/schemas/SurfaceRef"}
    HelpSuggestion:
      type: object
      required: [project, title, agent, reason]
      properties:
        project: {type: string}
        title: {type: string}
        agent: {type: string}
        reason: {type: string}
    PlacementPreview:
      type: object
      required: [thread, project, channel, audience, runs, token, exclusions]
      properties:
        summary_required:
          description: Raw private-source history cannot move; publish only a person-reviewed summary copy.
          type: boolean
        thread: {type: string}
        project: {type: string}
        channel: {type: string}
        audience: {type: string}
        runs: {type: integer, minimum: 0}
        token: {type: string}
        exclusions:
          type: array
          items: {type: string}
    ThreadShare:
      description: Where a conversation is shared, and the people to add to it.
      type: object
      additionalProperties: false
      properties:
        placement_token:
          description: Required to move a conversation with completed runs, from its current placement preview.
          type: string
          maxLength: 64
        project:
          description: The project it is shared in. Empty keeps the thread's own; `~` is the workspace.
          type: string
          maxLength: 63
        channel:
          description: The project's channel. Empty keeps the thread's own in its own project, and is `general` in another.
          type: string
          maxLength: 40
        add:
          description: People to add as participants, by handle.
          type: array
          maxItems: 50
          items: {type: string, maxLength: 200}
    ThreadShared:
      description: A thread as `getThread` reads it, after a share, and the people the share named who were not added.
      allOf:
        - {$ref: "#/components/schemas/ThreadPage"}
        - type: object
          required: [not_added]
          properties:
            not_added:
              type: array
              maxItems: 50
              items: {$ref: "#/components/schemas/ThreadNotAdded"}
    ThreadNotAdded:
      description: A person a share named who was not added, by handle, and why, in words that say nothing the sharer may not see.
      type: object
      required: [handle, reason]
      properties:
        handle: {type: string}
        reason: {type: string}
    ThreadMessageInput:
      description: A message posted in a thread.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, maxLength: 8000}
        after:
          description: The turn it follows. Empty follows the latest.
          type: string
        post_only: {type: boolean}
        answers: {$ref: "#/components/schemas/ThreadAnswerRef"}
        act_as: {$ref: "#/components/schemas/ActAs"}
        surface: {$ref: "#/components/schemas/SurfaceRef"}
    ThreadMode:
      description: |
        How a thread's selected agents answer an untagged message a person
        posts as themselves (the console):
        `best_fit`, the one of them that fits it best, picked as `@auto`
        picks among them alone (the run's `picked` says why), or `all`, each
        of them side by side, at most 3. Absent with fewer than two agents
        selected; `best_fit` when two or more are selected and none is named.
      type: string
      enum: [best_fit, all]
    ThreadUpdate:
      description: |
        A thread's title, visibility, default and selected agents, as a
        whole, and where a private conversation is. Changing only `agents` and
        `mode` takes anyone who may post in the thread; anything else,
        moving it included, takes whoever started it, while a member, or an
        owner of its project. The selected agents and default must be able
        to answer where the thread is after the change.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        placement_token:
          description: Explicit consent to publish completed private work, from its current placement preview.
          type: string
          maxLength: 64
        version: {type: integer}
        title: {type: string, maxLength: 200}
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        default:
          description: Empty keeps a default the caller was not shown, one naming an agent that lives in a project they may not read.
          type: string
        agents:
          description: The selected agents, as a whole; a selected agent the caller was not shown is kept. Each must be an agent available in the thread's project (400; one the caller may not read is as one that does not exist).
          type: array
          maxItems: 5
          items: {type: string}
        mode: {$ref: "#/components/schemas/ThreadMode"}
        project:
          description: |
            Moves a private conversation to this project, `~` the workspace;
            empty keeps its own. It stays private (`shareThread` shares one).
            Takes what sharing it takes: whoever started it, while a member,
            or an owner of its project, and a member of the project it goes
            to (403; one the caller cannot see is 404), and is refused
            once a run has been filed in it (409, "a conversation that has
            runs stays in its project"). A shared thread, or one on a
            surface, does not move here (400).
          type: string
          maxLength: 63
        channel:
          description: The channel it moves to, by the same rule; empty keeps its own in its own project, and is `general` in another. An archived channel is 400, one the project does not have 404.
          type: string
          maxLength: 40
    ThreadParticipantsUpdate:
      description: People and agents to add to a thread and to remove from it.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer}
        add:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ThreadParticipant"}
        remove:
          description: People by handle and agents by name, which no person and agent share. An agent the caller was not shown is not removed, as one that is not there.
          type: array
          maxItems: 50
          items: {type: string}
    ThreadRule:
      description: |
        The rule that decided what a message starts, the first that applies:
        `tagged` (the agents it tags answer), `people` (it tags only people
        or experts), `reply` (it answers a question or replies to a
        mention), `post_only`, `routed` (it tags no agent, and the thread's
        selected agents answer it, see `ThreadMode`), `untagged` (posted by
        a person as themselves, as the console does, and it tags no agent,
        so nothing runs), or `default` (the inherited default answers, if
        there is one).
      type: string
      enum: [tagged, people, reply, post_only, routed, untagged, default]
    ThreadPosted:
      description: What posting a message did.
      type: object
      required: [thread, message, runs, notified, refused, rule]
      properties:
        thread: {$ref: "#/components/schemas/Thread"}
        message: {$ref: "#/components/schemas/ThreadMessage"}
        runs:
          description: The runs it started, at most 3.
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/Run"}
        notified:
          description: Who it was sent to, people and experts by handle and the experts a role names as `role:<name>`.
          type: array
          items: {type: string}
        refused:
          description: Its tags that started or notified nothing, each saying why.
          type: array
          items: {$ref: "#/components/schemas/ThreadMention"}
        rule: {$ref: "#/components/schemas/ThreadRule"}
        reason:
          description: Why no agent answers, when none does. It never names an agent the poster may not read.
          type: string
        repeated:
          description: The message was posted before, by its surface's id. This is what it did then; nothing was started again.
          type: boolean
    ThreadNotice:
      description: Says that something happened in a thread, and nothing about what. Fetch the thread to see it.
      type: object
      required: [id, at]
      properties:
        id: {type: string}
        message:
          description: The message posted or settled, if one was.
          type: string
        at: {type: string, format: date-time}
    Channel:
      description: |
        One place in a project where threads live. Its name is its identity
        in the project and never changes. A channel has its project's
        visibility. `general` is in every project and reads as version 0
        until it is first written.
      type: object
      required: [project, name, version, created_at, updated_at]
      properties:
        project:
          description: The project it is in. Empty is the workspace itself.
          type: string
        name: {type: string, maxLength: 40}
        title: {type: string, maxLength: 80}
        purpose:
          description: Sent to every agent answering in the channel.
          type: string
          maxLength: 200
        default:
          description: Answers untagged messages here, an agent or `auto`. Absent inherits from the project. One naming an agent that lives in a project the reader may not read reads as absent, here and in the project's history.
          type: string
        slack: {$ref: "#/components/schemas/SlackBinding"}
        bound_at:
          description: |
            When `slack` was bound as it stands: set when a binding is made
            or moved, kept while it holds. Absent while unbound, and on a
            binding made before Humagen kept the time, which the client's
            bindings then read as bound at the channel's last change.
          type: string
          format: date-time
        archived:
          description: It and its threads stay, and it takes no new threads.
          type: boolean
        managed:
          description: "`file` when the platform file declares the channel."
          type: string
        version: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    ChannelView:
      description: A channel, and who answers an untagged message in it.
      allOf:
        - {$ref: "#/components/schemas/Channel"}
        - type: object
          required: [answers]
          properties:
            answers: {$ref: "#/components/schemas/ThreadAnswers"}
    ChannelInput:
      description: A new channel.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: Lower case letters, digits and dashes, at most 40. It cannot change later.
          type: string
          maxLength: 40
        title: {type: string, maxLength: 80}
        purpose: {type: string, maxLength: 200}
        default: {type: string}
        slack: {$ref: "#/components/schemas/SlackBinding"}
    ChannelUpdate:
      description: A channel's title, purpose, default and Slack binding, as a whole.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer}
        title: {type: string, maxLength: 80}
        purpose: {type: string, maxLength: 200}
        default: {type: string}
        slack: {$ref: "#/components/schemas/SlackBinding"}
    SlackBinding:
      description: |
        The Slack channel a channel is bound to: a Slack thread there is a
        shared thread here. The client is a Slack client of the workspace,
        whose bot must already be in the channel, so no scope widens. One
        Slack channel is bound to at most one channel of the workspace, and
        a direct message is never bound. Archiving a channel unbinds it.
        Binding one, or binding a channel elsewhere, takes `clients:write`
        besides owning the project (403 without): which of a client's Slack
        channels a project answers in is the client's admins' to decide, as
        every new thread there is filed in the project. Keeping a binding
        as it is, or removing it, takes only the owner.
      type: object
      additionalProperties: false
      required: [client, channel]
      properties:
        client:
          description: The Slack client's id.
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
        channel:
          description: The Slack channel's id, public (C) or private (G).
          type: string
          pattern: "^[CG][A-Z0-9]{2,31}$"
    ClientBinding:
      description: One Slack channel a client is bound to, and the channel it is bound to here.
      type: object
      required: [slack_channel, project, channel]
      properties:
        slack_channel: {type: string}
        project:
          description: The project. Empty is the workspace itself.
          type: string
        channel: {type: string}
        bound_at:
          description: |
            When the Slack channel was bound to this channel. The client's
            app catches up on nothing announced before it: what was
            announced before the binding, or while the channel was unbound,
            never reached the Slack channel and is not news there now.
            Present for every binding; a binding made before Humagen kept the
            time reads as bound at its channel's last change.
          type: string
          format: date-time
    SurfaceRef:
      description: |
        Where on a client's surface a message was posted: for Slack, the
        channel, the thread's ts and the message's own. Only the credential
        the client names as its `slack.machine` sends one, with `act_as` of
        that client. The thread is found by its surface, or started and filed
        where the platform says: the channel the Slack channel is bound to,
        shared, or else the client's home, private for a direct message or
        the assistant pane. The text is Slack's own: the app's mention is
        dropped, a mapped bot or person is their tag, and anyone else is
        plain and refused. A thread under an announcement the client posted
        is seeded with it (see `startThread`).
      type: object
      additionalProperties: false
      required: [client, channel, ts]
      properties:
        files:
          type: boolean
          description: Ingest files from the verified Slack message as agent attachments.
        client: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,39}$"}
        channel: {type: string, maxLength: 100}
        ts:
          description: The thread's, the ts of its first message.
          type: string
          maxLength: 100
        message:
          description: The message's own ts, which makes a second post of it change nothing. Absent is `ts`.
          type: string
          maxLength: 64
        app_user:
          description: The app's own bot user id, whose mention is not a tag.
          type: string
          maxLength: 32
    ThreadSurface:
      description: The thread on a client's surface this thread is. It never changes.
      type: object
      required: [client, channel, ts]
      properties:
        client: {type: string}
        channel: {type: string}
        ts: {type: string}
    ProjectExpert:
      description: Who answers for some topics in a project, a person by subject or `role:<name>`.
      type: object
      additionalProperties: false
      required: [who, topics]
      properties:
        who: {type: string, maxLength: 200}
        topics:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: string, maxLength: 32}
    ProjectExperts:
      description: Deprecated expert metadata retained for historical human questions. New routing uses Find Help.
      type: object
      additionalProperties: false
      required: [version, experts]
      properties:
        version: {type: integer}
        experts:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ProjectExpert"}
    ProjectKnowledgeSource:
      description: A knowledge source a run filed in a project is grounded in, and the project that names it.
      type: object
      additionalProperties: false
      required: [name, from]
      properties:
        name: {type: string, maxLength: 63}
        from:
          description: The project that names it, the nearest when more than one does. Empty for the workspace.
          type: string
          maxLength: 63
    ProjectContext:
      type: object
      additionalProperties: false
      required: [layers]
      properties:
        layers:
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/ContextLayer"}
    ContextLayer:
      type: object
      additionalProperties: false
      required: [kind, from, text, budget, used, omitted, preview_omitted, sent, unit]
      properties:
        kind: {type: string}
        from: {type: string}
        text: {type: string}
        budget: {type: integer, minimum: 0}
        used: {type: integer, minimum: 0}
        omitted: {type: integer, minimum: 0}
        preview_omitted:
          description: Content shortened only in this preview, using the layer's unit. Runtime composition is unchanged.
          type: integer
          minimum: 0
        sent: {type: boolean}
        unit: {type: string, enum: [characters, items]}

    ProjectKnowledge:
      description: The knowledge sources a project names, at the project's version, and what a run filed in it is grounded in.
      type: object
      additionalProperties: false
      required: [version, knowledge, given]
      properties:
        version: {type: integer}
        knowledge:
          description: The sources the project names itself, in its order. Empty for a caller without `knowledge:read`.
          type: array
          maxItems: 8
          items: {type: string, maxLength: 63}
        given:
          description: |
            What a run filed here is grounded in besides its agent's own: the
            project's sources, then each project's above it, nearest first,
            each once. Empty for a caller without `knowledge:read`.
          type: array
          maxItems: 16
          items: {$ref: "#/components/schemas/ProjectKnowledgeSource"}
    ProjectKnowledgeInput:
      description: The knowledge sources a project names, as a whole, from the version read.
      type: object
      additionalProperties: false
      required: [version, knowledge]
      properties:
        version:
          description: The version the caller read.
          type: integer
        knowledge:
          description: Knowledge sources of the workspace, each once; `[]` for none.
          type: array
          maxItems: 8
          items: {type: string, maxLength: 63}

    ProjectSkill:
      description: Named instructions an agent can be told to use, as a project declares them. Its name and description are ones a SKILL.md takes.
      type: object
      additionalProperties: false
      required: [name, description, instructions]
      properties:
        name:
          description: Lower case letters and digits in words joined by single dashes, starting with a letter.
          type: string
          pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
          maxLength: 64
        description: {type: string, maxLength: 1024}
        argument_hint:
          description: What the skill takes after its name, as the console shows it.
          type: string
          maxLength: 100
        instructions: {type: string, maxLength: 8000}
    ProjectSkillBrief:
      description: A skill a project declares, without its instructions, as a project and its history show it.
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: {type: string, maxLength: 64}
        description: {type: string, maxLength: 1024}
        argument_hint: {type: string, maxLength: 100}
    ProjectSkillRef:
      description: A skill a message posted in a project can name, without its instructions, and the project that declares it.
      type: object
      additionalProperties: false
      required: [name, description, argument_hint, from]
      properties:
        name: {type: string, maxLength: 64}
        description: {type: string, maxLength: 1024}
        argument_hint: {type: string, maxLength: 100}
        from:
          description: The project that declares it, the nearest when more than one does. Empty for the workspace.
          type: string
          maxLength: 63
    ProjectSkills:
      description: The skills a project declares, at the project's version, and what a message posted in it can name.
      type: object
      additionalProperties: false
      required: [version, skills, offered]
      properties:
        version: {type: integer}
        skills:
          description: The skills the project declares itself, in its order, with their instructions.
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/ProjectSkill"}
        offered:
          description: What a message posted here can name, the project's own first, then each project's above it, nearest first, each name once.
          type: array
          maxItems: 128
          items: {$ref: "#/components/schemas/ProjectSkillRef"}
    ProjectSkillsInput:
      description: The skills a project declares, as a whole, from the version read.
      type: object
      additionalProperties: false
      required: [version, skills]
      properties:
        version:
          description: The version the caller read.
          type: integer
        skills:
          description: The skills, each name once; `[]` for none.
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/ProjectSkill"}
    MentionKind:
      description: A kind of `@<kind>:<name>`, and what its items resolve to.
      type: object
      additionalProperties: false
      required: [kind, title, resolves]
      properties:
        kind: {type: string, pattern: "^[a-z][a-z0-9-]{0,31}$"}
        title: {type: string, maxLength: 40}
        resolves:
          description: "`experts` (as `@sme:<topic>`), `skills` (as `$<name>`), `role` (the people holding the role) or `people` (a person, by handle)."
          type: string
          enum: [experts, skills, role, people]
    MentionItem:
      description: An item a mention kind completes to.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: What follows the colon.
          type: string
        description:
          description: A line about it, such as a skill's description or a person's name.
          type: string

    ProjectKind:
      description: |
        What a project is for. `company` is company-wide: it sits under the
        workspace or another company project, and is created and changed only
        with `projects:govern`; a workspace has at most 10. `team` is the
        default and sits anywhere. `account` is a customer account, never
        under another account. The workspace itself is `company`. Any other
        value is one of the workspace's own kinds, which behaves as `team`
        or `account`.
      type: string
      pattern: "^[a-z][a-z0-9-]{0,31}$"
      maxLength: 32
    ProjectRole:
      description: |
        What a member may do in a project, each including the one before:
        `viewer` sees it, its inbox, its context and its people; `member`
        works in it, creates projects under it and proposes notes; `owner`
        changes it and everything below it. A role only narrows what a
        permission allows: an owner without `projects:write` still cannot
        write.
      type: string
      enum: [viewer, member, owner]
    ProjectEntry:
      description: One member of a project and the role it grants.
      type: object
      required: [who, role]
      properties:
        who:
          description: "`*`, `role:<name>`, or a subject."
          type: string
          maxLength: 255
        role: {$ref: "#/components/schemas/ProjectRole"}
    ProjectKindSpec:
      description: A workspace's own kind, a label over a built-in behavior.
      type: object
      required: [name, like]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
          maxLength: 32
        title: {type: string, maxLength: 40}
        like:
          description: The built-in kind it behaves as.
          type: string
          enum: [team, account]
    ProjectAccount:
      description: What an account project records about its customer.
      type: object
      properties:
        customer: {type: string, maxLength: 120}
        external_id:
          description: The customer's id in another system, such as a CRM.
          type: string
          maxLength: 120
        url:
          description: An https link to the customer's record.
          type: string
          maxLength: 500
    Project:
      description: |
        One place in the tree. `name` is the identity: unique ignoring case,
        never changed. The workspace itself is the project named `""` (`~` in
        a path), which has no title, parent or account: show the workspace's
        name for it. It reads as version 0 until it is first changed.
      type: object
      required: [name, kind, experts, members, agents, version, created_at, updated_at]
      properties:
        personal_owner:
          description: Immutable human subject for a server-provisioned personal project.
          type: string
        name: {type: string, maxLength: 63}
        title:
          description: What people see. Shown instead of the name when set.
          type: string
          maxLength: 80
        description: {type: string, maxLength: 500}
        kind: {$ref: "#/components/schemas/ProjectKind"}
        parent:
          description: The project it sits under, fixed when it was created. Absent for the top level.
          type: string
          maxLength: 63
        account: {$ref: "#/components/schemas/ProjectAccount"}
        instructions:
          description: |
            Sent to every agent answering here and below, after the
            instructions of the projects above. The agent's own instructions
            win over them.
          type: string
          maxLength: 4000
        agent_posts:
          description: |
            What a scheduled agent's announcement here does: `publish` posts it,
            `review` holds it as a draft for the project's owners. Absent
            inherits the default: review at the workspace and in company
            projects, which everyone reads, and publish in team and account
            projects.
          type: string
          enum: [publish, review]
        members:
          description: |
            Who holds a role here. `*` is everyone who can see the parent (at
            the workspace, everyone holding `projects:read`), `role:<name>`
            the holders of a policy role, anything else a subject. An owner
            here owns everything below. A project with no `*` entry is
            members only: read by its members alone. A new account project
            is members only unless everyone owns a project above it.
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ProjectEntry"}
        kinds:
          description: The workspace's own kinds, each a label over `team` or `account`. Only the workspace carries them.
          type: array
          maxItems: 16
          items: {$ref: "#/components/schemas/ProjectKindSpec"}
        experts:
          description: Who answers for some topics here and below. Set with `PUT /api/projects/{name}/experts`.
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ProjectExpert"}
        agents: {$ref: "#/components/schemas/ProjectAgents"}
        knowledge:
          description: |
            The knowledge sources every run filed here and below is grounded
            in, besides its agent's own. Set with `PUT
            /api/projects/{name}/knowledge`. Absent when it names none, and
            for a caller without `knowledge:read`.
          type: array
          maxItems: 8
          items: {type: string, maxLength: 63}
        skills:
          description: |
            Named instructions a message posted here and below can tell an
            agent to use, by writing `$<name>`, without their instructions,
            which `GET /api/projects/{name}/skills` reads. Set with `PUT
            /api/projects/{name}/skills`. Absent when it declares none. A
            change in the project's history records them the same way.
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/ProjectSkillBrief"}
        archived:
          description: An archived project takes no new sub-projects and nothing moves under it. The workspace is never archived.
          type: boolean
        announce:
          description: The lowest role that may post an announcement here. Absent reads as owner.
          type: string
          enum: [viewer, member, owner]
        managed:
          description: "`file` when the platform file declares the project, and absent otherwise. The fields the file sets answer 409 here, and the project cannot be deleted here."
          type: string
        version:
          description: Counts writes, from 1. A change names the version it read.
          type: integer
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_by: {type: string}
        updated_at:
          description: When the record last changed. What happened in it is `active_at` on a view.
          type: string
          format: date-time
    ProjectStep:
      description: One project on the way down to another.
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        title: {type: string}
        kind: {$ref: "#/components/schemas/ProjectKind"}
    ProjectView:
      description: A project, where it sits, and what is in it.
      allOf:
        - {$ref: "#/components/schemas/Project"}
        - type: object
          required: [depth, path, children, conversations, active, schedules, notes, proposed, access, actions, mine, unread, row_agents]
          properties:
            unread:
              description: Unread open messages and announcements in the caller's own inbox filed directly in this project, excluding every message the reader cannot see.
              type: integer
              minimum: 0
            row_agents:
              description: Up to eight agents that live directly in this project and that the caller may read, sorted by name.
              type: array
              maxItems: 8
              items: {type: string}
            depth:
              description: How many levels below the workspace it sits, 1 to 4. The workspace itself is 0.
              type: integer
              minimum: 0
              maximum: 4
            path:
              description: The projects from the top level down to this one, the workspace left out, so it is as long as `depth`.
              type: array
              maxItems: 4
              items: {$ref: "#/components/schemas/ProjectStep"}
            children:
              description: How many sub-projects it has that the caller may see.
              type: integer
            conversations:
              description: How many conversations are filed in it that the caller may read, its sub-projects' not counted. A private thread the caller takes no part in is not counted, nor its runs below.
              type: integer
            active:
              description: How many runs in those conversations are in flight.
              type: integer
            active_at:
              description: When a run in one of them last changed. Absent when nothing has been filed in it.
              type: string
              format: date-time
            schedules:
              description: How many schedules file their runs in it.
              type: integer
            notes:
              description: How many shared notes are in use.
              type: integer
            proposed:
              description: How many notes wait for someone to approve them.
              type: integer
            access: {$ref: "#/components/schemas/ProjectAccess"}
            actions:
              description: |
                What the caller may do here, their permission and their role
                together: `create` a project under it, `propose` a note,
                decide its `notes`, `edit` it (its record, members and who
                may announce), `move`, `archive` or `delete` it, set
                tighten-only `limits` on it as an owner above, and `announce`
                in its inbox.
              type: array
              items:
                type: string
                enum: [create, propose, notes, edit, move, archive, delete, limits, announce]
            mine:
              description: |
                Whether the project names the caller: they are a member or an
                owner through an entry for their subject or a `role:` they
                hold, on this project or as an owner of a project above it.
                A role reached only through `*`, or only through
                `projects:govern`, does not name them. Home lists these as
                the caller's own projects.
              type: boolean
    ProjectLimit:
      description: |
        A limit a run filed in the project falls under for being there, and
        the project it is set on. What the limit allows is read from
        `GET /api/policies`, which needs `billing:read`.
      type: object
      required: [scope, from]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        from:
          description: The project the limit is set on, this one or one above it, or `""` for the workspace's own.
          type: string
    ProjectDetail:
      description: One project, the projects above and below it, and the limits that hold it.
      type: object
      required: [project, ancestors, children, limits]
      properties:
        project: {$ref: "#/components/schemas/ProjectView"}
        ancestors:
          description: The projects above it, the workspace first, so they read as a breadcrumb. Empty for the workspace.
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/ProjectView"}
        children:
          description: Its sub-projects, by name ignoring case.
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ProjectView"}
        limits:
          description: Its own limit, each ancestor's nearest first, then the workspace's. The strictest of them refuses a run.
          type: array
          maxItems: 5
          items: {$ref: "#/components/schemas/ProjectLimit"}
    ProjectInput:
      description: A new project. `kind` defaults to `team` and `parent` to the top level.
      type: object
      required: [name]
      properties:
        name:
          description: The identity, never changed. Letters, digits, spaces, dashes and underscores, starting with a letter or digit.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,62}$"
          maxLength: 63
        title: {type: string, maxLength: 80}
        description: {type: string, maxLength: 500}
        kind: {$ref: "#/components/schemas/ProjectKind"}
        parent:
          description: The project to put it under. Empty or `~` is the top level. At most four levels.
          type: string
          maxLength: 63
        account: {$ref: "#/components/schemas/ProjectAccount"}
        instructions: {type: string, maxLength: 4000}
        members:
          description: |
            Who holds a role in it. Left out, everyone (`*`) is a member, or
            a viewer of an account, and the creator its owner, no more open
            than the parent allows.
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ProjectEntry"}
    ProjectUpdate:
      description: |
        What an owner may change on a project. Title, description, account
        and instructions are replaced as a whole: one left out is cleared.
        `kind`, `archived`, `announce`, `kinds` and `agent_posts` change only
        when given.
      type: object
      required: [version]
      properties:
        version:
          description: The version the caller read.
          type: integer
        title: {type: string, maxLength: 80}
        description: {type: string, maxLength: 500}
        account: {$ref: "#/components/schemas/ProjectAccount"}
        instructions: {type: string, maxLength: 4000}
        kind:
          description: A built-in kind or one the workspace defines. To or from `company` needs `projects:govern`.
          type: string
          maxLength: 32
        archived:
          description: Archives the project, or brings it back. An archived project takes no new sub-projects.
          type: boolean
        announce:
          description: The lowest role that may post an announcement. Empty reads as owner.
          type: string
          enum: ["", viewer, member, owner]
        kinds:
          description: The workspace's own kinds, on the workspace only. A kind a project still has cannot be removed (409).
          type: array
          maxItems: 16
          items: {$ref: "#/components/schemas/ProjectKindSpec"}
        agent_posts:
          description: What a scheduled agent's announcement here does, `publish` or `review`. Empty takes the kind's default.
          type: string
          enum: ["", publish, review]
    ProjectAccess:
      description: A caller's role in a project, where it comes from, and the entry or rule that gave it.
      type: object
      required: [role, from, via]
      properties:
        role:
          description: Empty is no role.
          type: string
          enum: ["", viewer, member, owner]
        from:
          description: The project whose entry gave it, `""` for the workspace.
          type: string
        via:
          description: The entry's `who`, `owner above` for owning a project above, or `projects:govern`.
          type: string
    ProjectInheritedOwner:
      description: An owner entry of a project above, which owns this one too.
      type: object
      required: [who, from]
      properties:
        who: {type: string}
        name:
          description: What the person `who` names is called, their name, else their handle, never a subject that holds an address. Absent on `*` and `role:<name>`.
          type: string
        from:
          description: The project above whose entry it is, `""` for the workspace.
          type: string
    ProjectMember:
      description: One member of a project, the role it grants, and what a person it names is called.
      type: object
      required: [who, role]
      properties:
        who:
          description: "`*`, `role:<name>`, or a subject: the key a change sends back."
          type: string
          maxLength: 255
        role: {$ref: "#/components/schemas/ProjectRole"}
        name:
          description: What the person `who` names is called, their name, else their handle, never a subject that holds an address. Absent on `*` and `role:<name>`.
          type: string
    ProjectMembers:
      description: Who holds a role in a project, and who owns it from above.
      type: object
      required: [version, members, inherited]
      properties:
        version:
          description: The project's version, to name when changing them.
          type: integer
        members:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ProjectMember"}
        inherited:
          description: The owner entries of the projects above, nearest first.
          type: array
          items: {$ref: "#/components/schemas/ProjectInheritedOwner"}
    ProjectMembersInput:
      description: A project's new members, as a whole.
      type: object
      required: [version, members]
      properties:
        version:
          description: The version the caller read.
          type: integer
        members:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ProjectEntry"}
    ProjectMove:
      description: Where a project goes.
      type: object
      required: [version, parent]
      properties:
        version:
          description: The version the caller read.
          type: integer
        parent:
          description: The new parent. Empty or `~` is the top level.
          type: string
          maxLength: 63
    ProjectLimitInput:
      description: A tighten-only limit an owner of a project above sets. A zero limit sets none.
      type: object
      required: [period]
      properties:
        period: {type: string, enum: [day, month]}
        max_runs: {type: integer, minimum: 0}
        max_concurrent: {type: integer, minimum: 0}
        spend_limit:
          description: Micro-USD a period.
          type: integer
          format: int64
          minimum: 0
        max_lease:
          type: integer
          format: int64
          minimum: 0
        max_storage:
          type: integer
          format: int64
          minimum: 0
        max_tokens:
          type: integer
          format: int64
          minimum: 0
        warn_at: {type: integer, minimum: 0, maximum: 100}
        action: {type: string, enum: [block]}
    ProjectChange:
      description: One entry of the record of what changed on a project.
      type: object
      required: [seq, at, by, project, what]
      properties:
        seq:
          description: Opaque project-scoped history identifier. It reveals no workspace-global sequence.
          type: string
        at: {type: string, format: date-time}
        by:
          description: Who made the change. `migration` for projects moved out of settings.
          type: string
        by_name:
          description: What whoever made the change is called, their name, else their handle, never a subject that holds an address.
          type: string
        project: {type: string}
        what:
          description: |
            `managed` is the platform file taking the project over or letting
            it go, `moved` a new parent, `archived` archiving or bringing it
            back, and `members` a change to who holds a role and nothing
            else. `agents` is a change to what the project turns on. `home`
            is an agent coming to live in the project, or leaving it: `agent`
            names it and `note` says which. `experts` is a change to who the
            project names as experts, `knowledge` to the knowledge sources it
            names, and `channel` to one of its channels, which `channel`
            holds before and after.
          type: string
          enum: [created, updated, deleted, managed, moved, archived, members, agents, home, experts, knowledge, skills, channel]
        agent:
          description: The agent a `home` change is about. Absent when it lives in a project the caller may not read.
          type: string
        note:
          description: Says more, such as that a project created under a deleted name adopts its old conversations.
          type: string
        before: {$ref: "#/components/schemas/Project"}
        after: {$ref: "#/components/schemas/Project"}
        channel:
          description: The channel before and after, on a change to one of the project's channels.
          type: object
          properties:
            before: {$ref: "#/components/schemas/Channel"}
            after: {$ref: "#/components/schemas/Channel"}
    ProjectAgents:
      description: |
        What a project turns on. An agent is available in a project when
        something on its chain offers it (an `enable` list, `*` for every
        platform agent, or the agent living there or above) and every `allow`
        list on the chain permits it. The zero value adds nothing. Every
        agent that lives in a project the caller may not read is left out of
        each list and of `default`, as if it were not there.
      type: object
      required: [enable]
      properties:
        enable:
          description: Platform agents available here and below. `*` alone is every platform agent.
          type: array
          maxItems: 64
          items: {type: string}
        allow:
          description: |
            When set, the only agents that may run here and below. Absent
            narrows nothing. Empty only when every agent it names lives in a
            project the caller may not read.
          type: array
          maxItems: 64
          items: {type: string}
        default:
          description: Answers a message that tags no agent, here and below. An agent or `auto`. Absent inherits.
          type: string
    AgentAvailability:
      description: Which agents may run in a project.
      type: object
      required: [all, names]
      properties:
        all:
          description: Every platform agent, because `*` is enabled on the chain and no allow list narrows it.
          type: boolean
        names:
          description: With `all`, the agents living on the chain, which `*` never reaches; without, every agent available.
          type: array
          items: {type: string}
    AgentOffer:
      description: One agent available in a project, and where it comes from.
      type: object
      required: [agent, from]
      properties:
        agent:
          description: The agent, or `*` for every platform agent.
          type: string
        from:
          description: The nearest project on the chain that enables it, or the one it lives in. `~` is the workspace.
          type: string
        home:
          description: Set when the agent lives in `from`.
          type: boolean
    DefaultResolved:
      description: Who answers a message that tags no agent, and where that default is set.
      type: object
      required: [agent, from]
      properties:
        agent:
          description: An agent, or `auto`.
          type: string
        from:
          description: "`project:<name>`, or `project:~` for the workspace."
          type: string
    ProjectAgentsView:
      description: A project's agents as a person reads them.
      type: object
      required: [version, enable, available, offers, homes, default_resolved]
      properties:
        version:
          description: The project's version, which a change names.
          type: integer
        enable:
          description: As in ProjectAgents, leaving out every agent that lives in a project the caller may not read.
          type: array
          maxItems: 64
          items: {type: string}
        allow:
          description: As in ProjectAgents. Empty only when every agent it names lives in a project the caller may not read.
          type: array
          maxItems: 64
          items: {type: string}
        default: {type: string}
        available: {$ref: "#/components/schemas/AgentAvailability"}
        offers:
          description: Each available agent and where it comes from, `*` first when every platform agent is.
          type: array
          items: {$ref: "#/components/schemas/AgentOffer"}
        homes:
          description: The agents that live here.
          type: array
          items: {type: string}
        default_resolved:
          description: Who answers an untagged message here, or null when nothing does.
          oneOf:
            - {$ref: "#/components/schemas/DefaultResolved"}
            - {type: "null"}
    ProjectAgentsInput:
      description: What a project turns on, as a whole. A list left out is cleared.
      type: object
      required: [version]
      properties:
        version:
          description: The version the caller read.
          type: integer
        enable:
          type: array
          maxItems: 64
          items: {type: string}
        allow:
          description: |
            The names the caller is not shown are kept, so a caller shown an
            empty list sends one back. Otherwise it names at least one agent.
          type: array
          maxItems: 64
          items: {type: string}
        default: {type: string}
    AgentPlace:
      description: Where an agent lives and which projects enable it.
      type: object
      required: [enabled_in]
      properties:
        home:
          description: The project it lives in. Absent for a platform agent.
          type: string
        enabled_in:
          description: The projects whose enable list names it, or holds `*` for a platform agent. `~` is the workspace.
          type: array
          items: {type: string}
    AgentHome:
      description: Where an agent now lives.
      allOf:
        - type: object
          required: [agent]
          properties:
            agent: {type: string}
        - {$ref: "#/components/schemas/AgentPlace"}
    Person:
      description: |
        One person in the directory. No email address is shown: a subject
        that holds one, as a Tailscale login does, is left out.
      type: object
      required: [handle, roles, picture]
      properties:
        subject:
          description: |
            Who they are to the identity provider, which member entries and
            grants name. Absent when it holds an email address.
          type: string
        name:
          description: The name they chose for themselves, or signed in with. Absent until one is known.
          type: string
        handle:
          description: How they are tagged, unique in the workspace across people and agents.
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,31}$"
        roles:
          description: The workspace roles they held when last seen.
          type: array
          items: {type: string}
        picture:
          description: Where their own photo is served, or null without one.
          type: [string, "null"]
        seen_at:
          description: When they last signed in. Absent for someone who never has.
          type: string
          format: date-time
        projects:
          description: |
            Their own projects, in tree order: each project where an entry
            naming their subject, or a role they held when last seen, makes
            them a member or an owner, there or as an owner above. One reached
            only through everyone is not theirs. Only projects the reader may
            see are named, and none without `projects:read`. At most 20;
            absent when there are none.
          type: array
          maxItems: 20
          items: {$ref: "#/components/schemas/PersonProject"}
        projects_more:
          description: How many more of their projects the reader may see than are listed. Absent when none.
          type: integer
          minimum: 0
    PersonProject:
      description: One of a person's own projects.
      type: object
      required: [name, role]
      properties:
        name: {type: string}
        title: {type: string}
        role:
          description: Their role there.
          type: string
          enum: [member, owner]
    Settings:
      description: |
        Workspace settings. The workspace default agent, which answers a
        message that tags none, is the root's `default`
        (`GET /api/projects/~/agents`).
      type: object
      required: [history, history_limit, title_agent, memory_agent, memory_auto_approve, workspace_name, model_policies]
      properties:
        history:
          description: Whether an agent is sent the conversation so far.
          type: string
          enum: [recent, none]
        history_limit: {type: integer}
        title_agent:
          description: Names conversations after their first turn. Empty when none is set, or when it lives in a project the caller may not read.
          type: string
        memory_agent:
          description: Writes notes after a turn. Empty as `title_agent` is.
          type: string
        memory_auto_approve: {type: boolean}
        workspace_name: {type: string}
        model_policies:
          description: |
            Named, ordered lists of models with the errors that move a call from
            one to the next. An agent runs on one by naming the provider
            `policy` and the policy's name as its model; the policy is read as
            it stands when each call starts. A policy an agent still runs on
            cannot be removed (409).
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/ModelPolicy"}
        setup_at:
          description: Set once by the server when an admin first saves settings.
          type: string
          format: date-time
        setup_by: {type: string}
    Theme:
      type: string
      enum: [system, light, dark]
    Preferences:
      description: A person's own settings.
      type: object
      required: [display_name, theme, accent, has_photo, photo_version, pinned, muted]
      properties:
        display_name: {type: string}
        theme: {$ref: "#/components/schemas/Theme"}
        accent: {type: string}
        has_photo: {type: boolean}
        photo_version: {type: integer}
        onboarded_at:
          description: When the person finished or skipped the first-run questions.
          type: string
          format: date-time
        pinned:
          description: Conversations kept at the top of the person's sidebar, most recently pinned first.
          type: array
          items: {type: string}
        muted:
          description: Projects whose announcements are left out of the person's own inbox. They stay in each project's inbox, and the workspace itself is never muted.
          type: array
          maxItems: 100
          items: {type: string}

    Schedule:
      description: A cron schedule as a caller writes it.
      type: object
      required: [name, expression, agent, text]
      properties:
        name: {type: string}
        expression:
          description: A cron expression.
          type: string
        agent: {type: string}
        text: {type: string}
        project:
          description: Files every run the schedule raises under a project.
          type: string
        description:
          description: What the schedule is for, at most 500 characters. The agent is not shown it.
          type: string
          maxLength: 500
        deliver:
          description: |
            Where the answer of each run goes. Left out, it stays on the run.
            `inbox` sends it to the schedule's creator as a result. `project`
            posts it in the schedule's project as an announcement from the
            agent, its first line the subject: it needs a project (`~` for
            the workspace) where the agent is available (400 without one). A
            project whose `agent_posts` is `review` holds it as a draft for
            its owners instead. An answer of NONE goes nowhere.
          type: string
          enum: [inbox, project]
    ScheduleView:
      description: A schedule with whether it is running, when it fires next, and how its recent occurrences went.
      type: object
      required: [name, expression, agent, text, paused, next, recent]
      properties:
        name: {type: string}
        expression: {type: string}
        agent: {type: string}
        text: {type: string}
        project: {type: string}
        description: {type: string}
        deliver:
          description: Where the answer of each run goes. Absent when it stays on the run.
          type: string
          enum: [inbox, project]
        paused: {type: boolean}
        managed:
          description: "`file` while the platform file declares the schedule: it can be paused, resumed and run here, and changing or deleting it answers 409."
          type: string
          enum: [file]
        created_by: {type: string}
        created_by_name:
          description: What the person who made it is called, their name, else their handle, never a subject that holds an address. `created_by` is the subject.
          type: string
        updated_by:
          description: Who last changed the schedule. Absent until it is changed.
          type: string
        updated_at: {type: string, format: date-time}
        next:
          description: The next three fires. Empty while paused.
          type: array
          items: {type: string, format: date-time}
        recent:
          description: "Up to 20 recent runs the caller may read, newest first. A schedule's runs are found by its name, so they are those of every schedule that has had it, each where it was filed: one moved out of a project, or a name used again, lists only those the caller may read where they live."
          type: array
          items: {$ref: "#/components/schemas/Run"}

    AnnouncementInput:
      description: An announcement to post.
      type: object
      required: [subject, text]
      properties:
        subject:
          description: One line.
          type: string
          minLength: 1
          maxLength: 150
        text:
          type: string
          minLength: 1
          maxLength: 4000
        severity:
          description: "`info` when left out."
          type: string
          enum: [info, warning]
    InboxCounts:
      description: What a reader's inbox holds open.
      type: object
      required: [open, unread, updates]
      properties:
        open:
          description: Open messages that may need the reader.
          type: integer
        unread:
          description: Of those, the ones the reader has not read.
          type: integer
        updates:
          description: Announcements open for the reader that they have not read.
          type: integer
    InboxKind:
      description: |
        What a message is about. `approval` and `clarification` are questions
        a run is waiting on. `result` is the answer of a run nobody was
        waiting on, and `artifact` a file that was published or revised.
        `mention` is a message in a shared thread that tags the reader, and
        `announcement` news posted in a project, which reaches the members
        of that project and of every project below it, or an agent's post
        held as a draft for the project's owners.
      type: string
      enum: [alert, failure, memory, budget, approval, clarification, result, artifact, mention, announcement, source, operation]
    InboxState:
      type: string
      enum: [open, resolved, dismissed, snoozed]
    InboxSeverity:
      type: string
      enum: [info, warning, critical]
    InboxNotice:
      description: Says that an inbox message changed, and nothing about what is in it.
      type: object
      required: [id, kind, state, updated_at]
      properties:
        id: {type: string}
        kind: {$ref: "#/components/schemas/InboxKind"}
        state: {$ref: "#/components/schemas/InboxState"}
        updated_at: {type: string, format: date-time}
        for:
          description: |
            To a client's machine only: the person it maps whom a mention or a
            question is addressed to, by subject or by a role they hold, so it
            reads the message for them (`act_as_client`, `act_as_user`) and
            tells them in Slack. A message to several people it maps, such as
            experts named by a role, is one notice for each, at most 20.
          allOf:
            - {$ref: "#/components/schemas/ActAs"}
    InboxFrom:
      type: object
      required: [kind, name]
      properties:
        kind:
          description: What sent the message, such as `agent`, `rule`, `system` or `person`.
          type: string
        name:
          description: The agent, the rule or the part of the system, and a person's subject. A mention, a thread's artefact, names its poster as threads do, by handle, and never by subject.
          type: string
        display:
          description: What a person who sent it is called, their name, else their handle, never a subject that holds an address. Set on a person's, and to `Humagen` on what the product posted itself (a `system` sender named `humagen`, or `warp` in records written before the rename). A mention's poster is called what their message is called now.
          type: string
        approved_by:
          description: The person who published an agent's draft, by subject. Absent on what an agent posted itself.
          type: string
    CallPolicyInput:
      description: Which agents may call an agent, and which of those calls a person approves.
      type: object
      additionalProperties: false
      required: [callers, approval]
      properties:
        callers:
          description: "`anyone` its spec allows, only the `listed` agents in `allow`, or `none`."
          type: string
          enum: [anyone, listed, none]
        allow:
          description: The callers admitted when `callers` is `listed`.
          type: array
          maxItems: 100
          items: {type: string}
        approval:
          description: "`never`, `always`, or for every caller not in `trusted` when `unlisted`."
          type: string
          enum: [never, always, unlisted]
        trusted:
          description: Callers whose calls skip approval when `approval` is `unlisted`.
          type: array
          maxItems: 100
          items: {type: string}
        approvers:
          description: |
            Who may approve a held call: subjects, and this workspace's roles
            as `role:<name>`, at most 32. Empty means `role:manager` and
            `role:admin`, so a held call is never open to the whole workspace.
          type: array
          maxItems: 32
          items: {type: string}
        self_approval:
          description: Lets the person whose request led to a call approve it.
          type: boolean
        expires_seconds:
          description: How long a held call waits before it is denied. 0 means a day.
          type: integer
          minimum: 0
          maximum: 604800
    CallPolicy:
      description: An agent's call policy. Version 0 is the default of an agent with none stored.
      type: object
      required: [agent, callers, allow, approval, trusted, approvers, self_approval, expires_seconds, version]
      properties:
        agent: {type: string}
        callers: {type: string, enum: [anyone, listed, none]}
        allow:
          type: array
          items: {type: string}
        approval: {type: string, enum: [never, always, unlisted]}
        trusted:
          type: array
          items: {type: string}
        approvers:
          type: array
          items: {type: string}
        self_approval: {type: boolean}
        expires_seconds: {type: integer}
        version: {type: integer}
        updated_by: {type: string}
        updated_by_name:
          description: What whoever last saved it is called, their name, else their handle, never a subject that holds an address. `updated_by` is the subject.
          type: string
        updated_at: {type: string, format: date-time}
    Reach:
      description: Whether one agent may call another.
      type: object
      required: [agent, admits, in_spawn, approval, reason]
      properties:
        agent: {type: string}
        admits:
          description: The callee's call policy accepts calls from the caller.
          type: boolean
        in_spawn:
          description: The caller's spec lists the callee in its spawn allowlist.
          type: boolean
        approval:
          description: Whether a call waits for a person.
          type: string
          enum: [never, required]
        reason: {type: string}
    InboxSource:
      description: What the message is about, as ids a reader can follow.
      type: object
      properties:
        knowledge: {type: string}
        alert: {type: string}
        rule: {type: string}
        run: {type: string}
        thread: {type: string}
        agent: {type: string}
        project: {type: string}
        target:
          description: The agent a question's tool call would call, when it calls one.
          type: string
        thread_title:
          description: What the conversation it is about is called, `thread`'s or else `run`'s, its title or else the start of its first message, for a reader who may read it.
          type: string
    InboxOutcome:
      type: object
      required: [action, by, at]
      properties:
        action: {type: string}
        by:
          description: Who decided, by subject, or `system`.
          type: string
        by_name:
          description: What whoever decided is called, their name, else their handle, never a subject that holds an address.
          type: string
        at: {type: string, format: date-time}
        note: {type: string}
    InboxLimits:
      description: New numbers for a limit. Zero or absent leaves a limit as it is.
      type: object
      properties:
        max_runs: {type: integer}
        max_concurrent: {type: integer}
        spend_limit: {type: integer, format: int64}
        max_tokens: {type: integer, format: int64}
    InboxAlertPart:
      type: object
      required: [id, rule, kind, severity, title]
      properties:
        id: {type: string}
        rule: {type: string}
        kind: {type: string}
        severity: {type: string}
        title: {type: string}
        body: {type: string}
    InboxFailurePart:
      type: object
      required: [run, agent, error, retryable]
      properties:
        run: {type: string}
        agent: {type: string}
        error: {type: string}
        retryable:
          description: Only a turn a person asked can be started again.
          type: boolean
    InboxNoteRef:
      type: object
      required: [id, text]
      properties:
        id: {type: string}
        text: {type: string}
    InboxMemoryPart:
      type: object
      required: [owner, notes]
      properties:
        owner:
          description: |
            Who would remember them, as the memory store names it: an
            agent's name, or `project:<name>` for a project's notes, with
            `project:` alone for the workspace's own.
          type: string
        agent: {type: string}
        project: {type: string}
        notes:
          type: array
          items: {$ref: "#/components/schemas/InboxNoteRef"}
    InboxBudgetPart:
      type: object
      required: [scope_kind, limit, period, version, used, refused, max, current]
      properties:
        scope_kind: {type: string}
        scope_name: {type: string}
        limit: {type: string}
        period: {type: string}
        version: {type: integer}
        used: {type: integer, format: int64}
        refused: {type: boolean}
        max: {type: integer, format: int64}
        current: {$ref: "#/components/schemas/InboxLimits"}
    InboxArtifactPart:
      description: One published version of a file. Open it from the artifacts routes by `id`.
      type: object
      required: [id, title, kind, size, version]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {type: string}
        mime: {type: string}
        size: {type: integer, format: int64}
        version: {type: integer}
        description: {type: string}
        previous:
          description: The id of the version this one replaces, when it is not the first.
          type: string
    InboxQuestionTool:
      type: object
      required: [name]
      properties:
        name: {type: string}
        call_id:
          description: The model's id for the call.
          type: string
        arguments:
          description: What the model asked to call the tool with, as a JSON object.
          type: object
        schema:
          description: The tool's parameter schema. Edited arguments must satisfy it.
          type: object
        acts_for_person:
          description: The call runs with the credential of the person the run acts for, a tool that acts as them. Anyone who may approve it may approve or deny it as asked, but only that person may approve it with edited `arguments`; anyone else's edit is 403, so a surface offers nobody else an edit.
          type: boolean
    InboxQuestionPart:
      description: A question a run is parked on.
      type: object
      required: [run, id, kind, prompt]
      properties:
        run: {type: string}
        id: {type: string}
        kind:
          type: string
          enum: [approval, choice, reply]
        agent: {type: string}
        prompt: {type: string}
        options:
          type: array
          items: {type: string}
        tool: {$ref: "#/components/schemas/InboxQuestionTool"}
        asked_of:
          description: Who the agent asked, as a hint. It admits nobody.
          type: string
        expires_at:
          description: When the question takes its default if nobody answers.
          type: string
          format: date-time
        default:
          description: What the run carries on with if it expires. `deny` for an approval; empty when the agent is told nobody answered.
          type: string
        asked_at: {type: string, format: date-time}
        via:
          description: The run whose stream showed the question, when that is a run waiting on the one that asked.
          type: string
        approvers:
          description: |
            Who may answer this one approval, in place of the agent spec's:
            the callee's call policy's approvers, for a call to an agent.
          type: array
          items: {type: string}
        self_approval:
          description: Goes with `approvers`.
          type: boolean
        steered_for:
          description: |
            The person whose own credentials an answer may reach, when there
            is one: the run, or a run that called it, acts for them and is
            granted a tool that takes their own credential. Only they reply,
            choose, or approve with edited `arguments` or a `note`; anyone
            else approves or denies as asked, and a surface offers them no
            note or edit. Said as it stood when the question was raised;
            answering checks again.
          type: string
        steered_for_name:
          description: What the person in `steered_for` is called, their name, else their handle, never a subject that holds an address. Set with `steered_for`.
          type: string
    InboxDraftPart:
      description: A post an agent wrote for a project, waiting for one of its owners.
      type: object
      required: [project, agent, run, subject]
      properties:
        project:
          description: Where it would be posted. Empty is the root.
          type: string
        agent: {type: string}
        run: {type: string}
        subject: {type: string, maxLength: 150}
        text: {type: string, maxLength: 4000}
    InboxDelivery:
      description: Where one client posted a message.
      type: object
      required: [channel, ts, at]
      properties:
        channel: {type: string}
        ts: {type: string}
        at:
          description: |
            When the client last said the post shows the message as it stands:
            when it was posted, or when it recorded the post again after
            bringing it up to date. A message whose `updated_at` is later has
            changed since.
          type: string
          format: date-time
    InboxDeliveryInput:
      description: Where a client posted a message.
      type: object
      required: [channel, ts]
      properties:
        channel:
          description: Where it was posted, such as a Slack channel id. 1 to 64 characters, no spaces.
          type: string
          minLength: 1
          maxLength: 64
        ts:
          description: The post there, such as a Slack message ts. 1 to 64 characters, no spaces.
          type: string
          minLength: 1
          maxLength: 64
    InboxPart:
      description: |
        One typed part of a message. `type` says which of `text`, `alert`,
        `failure`, `memory`, `budget`, `artifact`, `draft`, `mention` or
        `question` carries the body: `approval`, `choice` and `reply` parts
        carry `question`. A settled question's `outcome` is `approve`,
        `deny`, `choose` (the option in `note`), `reply` (the words in
        `note`), `expired`, `stopped` or `closed`.
      type: object
      required: [id, type, state, actions]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [text, alert, failure, memory, budget, artifact, approval, choice, reply, draft, mention, source, operation]
        state:
          type: string
          enum: [open, resolved, info]
        actions:
          description: What this caller may do with the part now. Empty once it is resolved, or when the caller has no permission for any action.
          type: array
          items:
            type: string
            enum: [acknowledge, retry, keep, discard, raise_limit, approve, deny, choose, reply, done, publish]
        outcome: {$ref: "#/components/schemas/InboxOutcome"}
        source:
          type: object
          required: [name, cause]
          properties:
            name: {type: string}
            cause: {type: string}
        text: {type: string}
        alert: {$ref: "#/components/schemas/InboxAlertPart"}
        failure: {$ref: "#/components/schemas/InboxFailurePart"}
        memory: {$ref: "#/components/schemas/InboxMemoryPart"}
        budget: {$ref: "#/components/schemas/InboxBudgetPart"}
        artifact: {$ref: "#/components/schemas/InboxArtifactPart"}
        question: {$ref: "#/components/schemas/InboxQuestionPart"}
        draft: {$ref: "#/components/schemas/InboxDraftPart"}
        mention: {$ref: "#/components/schemas/InboxMentionPart"}
        operation: {$ref: "#/components/schemas/InboxOperationPart"}
    InboxMentionPart:
      description: A message in a shared thread that tags the reader. `reply` posts the resolution's `text` in the thread as the reader, which the thread's default does not answer (one that tags anyone takes a member of the thread's project); `done` sets it aside. The console and the Slack app offer Reply, and set a mention aside by dismissing its message; `done` is the API's.
      type: object
      required: [thread, message, project, channel, by, excerpt]
      properties:
        thread: {type: string}
        message:
          description: The message's id within the thread, such as `m-3`.
          type: string
        project:
          description: The thread's project. Empty is the workspace itself.
          type: string
        channel: {type: string}
        by:
          description: The handle of the person who posted it. A subject is never given, since one can hold an address.
          type: string
        excerpt:
          description: The start of what they wrote.
          type: string
          maxLength: 300
    InboxMessage:
      description: One message in the inbox.
      type: object
      required: [id, kind, subject, from, at, updated_at, severity, state, unread, source, parts]
      properties:
        id: {type: string}
        to: {type: string}
        kind: {$ref: "#/components/schemas/InboxKind"}
        subject: {type: string}
        from: {$ref: "#/components/schemas/InboxFrom"}
        at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        severity: {$ref: "#/components/schemas/InboxSeverity"}
        state: {$ref: "#/components/schemas/InboxState"}
        snoozed_until: {type: string, format: date-time}
        unread:
          description: |
            Whether this caller has read it. Read state is per person, and
            whoever posted an announcement has read it.
          type: boolean
        hidden:
          description: |
            The caller hid or snoozed this announcement for themselves, so
            `state` is theirs alone and everyone else still has it. Left out
            otherwise. `unhideInboxMessage` brings it back.
          type: boolean
        source: {$ref: "#/components/schemas/InboxSource"}
        parts:
          type: array
          items: {$ref: "#/components/schemas/InboxPart"}
        deliveries:
          description: Where the reading client posted the message, by client id. Shown only to that client's machine.
          type: object
          additionalProperties: {$ref: "#/components/schemas/InboxDelivery"}
    InboxChange:
      description: One thing that happened to a message.
      type: object
      required: [message, at, what]
      properties:
        message: {type: string}
        at: {type: string, format: date-time}
        by: {type: string}
        what:
          type: string
          enum: [raised, read, unread, resolved, dismissed, snoozed, withdrawn, delivered, unhidden]
        part: {type: string}
        action: {type: string}
        note: {type: string}
        until: {type: string, format: date-time}
    Resolution:
      description: What a person decided about a part.
      type: object
      required: [action]
      properties:
        action:
          description: |
            `publish` posts an agent's draft as the announcement it wrote, and
            `discard` drops it; only an owner of the draft's project decides
            one (403 for anyone else who can see it).
          type: string
          enum: [acknowledge, retry, keep, discard, raise_limit, approve, deny, choose, reply, done, publish]
        ids:
          description: The proposed notes to keep, with `keep`.
          type: array
          items: {type: string}
        note:
          description: At most 500 characters. On a denial the model is shown it, so where the answer may reach the credentials of the person the run acts for, only that person may add one.
          type: string
          maxLength: 500
        limits: {$ref: "#/components/schemas/InboxLimits"}
        arguments:
          description: Edited arguments for `approve`, as a JSON object that satisfies the tool's schema. Where the answer may reach the credentials of the person the run acts for, only that person may send them. Left out keeps the model's.
          type: object
        choice:
          description: The option chosen, with `choose`.
          type: string
          maxLength: 4000
        text:
          description: The reply, with `reply`. A reply part also takes its words as `note`.
          type: string
          maxLength: 4000
        act_as: {$ref: "#/components/schemas/ActAs"}
    QuestionAnswer:
      description: An answer to the question a run is waiting on.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, deny, choose, reply]
        arguments:
          description: Edited arguments for `approve`, as a JSON object that satisfies the tool's schema. Where the answer may reach the credentials of the person the run acts for, only that person may send them.
          type: object
        choice:
          type: string
          maxLength: 4000
        text:
          type: string
          maxLength: 4000
        note:
          description: At most 500 characters. On a denial the model is shown it, so where the answer may reach the credentials of the person the run acts for, only that person may add one.
          type: string
          maxLength: 500
        act_as: {$ref: "#/components/schemas/ActAs"}

    ArtifactKind:
      type: string
      enum: [document, spreadsheet, presentation, image, pdf, html, code, data, archive]
    Artifact:
      description: The record of one published file. Its bytes are served by `getArtifactContent`.
      type: object
      required: [id, title, kind, mime, size, sha256, version, run, thread, agent, created_by, created_at]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        mime:
          description: The type the server sniffed from the bytes.
          type: string
        size: {type: integer, format: int64}
        sha256: {type: string}
        version:
          description: Publishing a title again in the same conversation makes the next version.
          type: integer
        run: {type: string}
        thread: {type: string}
        agent: {type: string}
        project: {type: string}
        description: {type: string}
        preview:
          description: The start of a text file.
          type: string
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    StorageShare:
      type: object
      required: [name, bytes, count]
      properties:
        name: {type: string}
        bytes: {type: integer, format: int64}
        count: {type: integer}
    StorageUsage:
      description: What the workspace has published, against what it is allowed.
      type: object
      required: [used_bytes, count, limit_bytes, by_project, by_agent]
      properties:
        used_bytes: {type: integer, format: int64}
        count: {type: integer}
        limit_bytes:
          description: The workspace's storage limit, or null when it has none.
          type: [integer, "null"]
          format: int64
        by_project:
          type: array
          items: {$ref: "#/components/schemas/StorageShare"}
        by_agent:
          type: array
          items: {$ref: "#/components/schemas/StorageShare"}

    AnalyticsGroup:
      type: object
      required: [name, runs, completed, failed, stopped, active, p50_ms, p95_ms, usage]
      properties:
        name: {type: string}
        runs: {type: integer}
        completed: {type: integer}
        failed: {type: integer}
        stopped:
          description: Runs that were stopped. They are neither completed, failed nor active.
          type: integer
        active: {type: integer}
        p50_ms: {type: integer, format: int64}
        p95_ms: {type: integer, format: int64}
        usage: {$ref: "#/components/schemas/AnalyticsUsage"}
    AnalyticsUsage:
      description: |
        What the runs' own model calls used. Each run counts only its own
        calls, so a tree of runs is not counted twice.
      type: object
      required: [model_calls, tokens, spend, unpriced_calls, other_currency_runs]
      properties:
        model_calls: {type: integer}
        tokens:
          description: Prompt and completion tokens.
          type: integer
          format: int64
        spend:
          description: Micro-USD priced in US dollars. A lower bound when `unpriced_calls` or `other_currency_runs` is not zero.
          type: integer
          format: int64
        unpriced_calls:
          description: Calls with no price.
          type: integer
        other_currency_runs:
          description: Runs with costs in a currency other than US dollars, which are not added to `spend`.
          type: integer
    AnalyticsBucket:
      type: object
      required: [start, completed, failed, stopped, active]
      properties:
        start: {type: string, format: date-time}
        completed: {type: integer}
        failed: {type: integer}
        stopped: {type: integer}
        active: {type: integer}
    Summary:
      description: Run statistics over a window.
      type: object
      required: [since, until, bucket_ns, total, buckets, by_agent, by_origin, slowest, delegated]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        bucket_ns:
          description: The width of one bucket, in nanoseconds.
          type: integer
          format: int64
        total: {$ref: "#/components/schemas/AnalyticsGroup"}
        buckets:
          type: array
          items: {$ref: "#/components/schemas/AnalyticsBucket"}
        by_agent:
          description: Each agent's runs the caller may read. A run names the agent that ran it, so this and `slowest` name it even when it lives since in a project the caller may not read.
          type: array
          items: {$ref: "#/components/schemas/AnalyticsGroup"}
        by_origin:
          type: array
          items: {$ref: "#/components/schemas/AnalyticsGroup"}
        slowest:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/Run"}
        delegated: {type: integer}
    JournalEntry:
      description: One event, summarized in a line.
      type: object
      required: [seq, run_id, agent, rev, origin, kind, at]
      properties:
        seq: {type: integer, format: int64}
        run_id: {type: string}
        agent: {type: string}
        rev: {type: integer}
        origin: {type: string}
        kind: {$ref: "#/components/schemas/EventKind"}
        at: {type: string, format: date-time}
        detail: {type: string}
    Span:
      description: One stretch of a run's time, rebuilt from the journal.
      type: object
      required: [run_id, agent, kind, name, start]
      properties:
        run_id: {type: string}
        agent: {type: string}
        kind: {type: string, enum: [run, attempt, tool, output, parked]}
        name: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        error: {type: string}

    AlertKind:
      type: string
      description: |
        `budget` is raised by a billing policy, never by a rule, and a rule
        cannot be created with it.
      enum: [run_failed, failure_rate, slow_run, eval_below, spend, budget]
    AlertSeverity:
      type: string
      enum: [warning, critical]
    AlertRule:
      description: |
        A condition on runs that raises an alert. Every field but `name`,
        `kind` and `severity` is optional, and leaving one out keeps the
        behaviour rules had before it existed: every agent and project,
        enabled, no cooldown, and a message for everyone who may read alerts.
      type: object
      required: [name, kind, severity]
      properties:
        name: {type: string}
        kind: {$ref: "#/components/schemas/AlertKind"}
        description:
          description: What the rule is for, at most 500 characters.
          type: string
          maxLength: 500
        agent:
          description: Only this agent's runs. Empty means every agent.
          type: string
        project:
          description: |
            Only runs filed under this project. Empty means every run, in a
            project or not. With `agent`, both must match. An `eval_below`
            rule cannot name a project.
          type: string
        severity: {$ref: "#/components/schemas/AlertSeverity"}
        threshold:
          description: A percentage for `failure_rate` and `eval_below`, seconds for `slow_run`. Not used by `spend`.
          type: number
        threshold_micros:
          description: For `spend` only, and required by it. The cost, in micro-USD, of the runs in scope over the window at which the rule fires.
          type: integer
          format: int64
          minimum: 1
        window_seconds:
          description: How far back `failure_rate` and `spend` look, up to 30 days.
          type: integer
          minimum: 1
          maximum: 2592000
        min_runs: {type: integer}
        cooldown_seconds:
          description: |
            After the rule raises an alert it raises no other for this long,
            acknowledged or not, up to 30 days. Zero or absent means no
            cooldown. `failure_rate` and `spend` also stay quiet while their
            last alert is open.
          type: integer
          minimum: 0
          maximum: 2592000
        paused:
          description: A paused rule is not evaluated. Absent or false means the rule is enabled.
          type: boolean
        notify:
          description: |
            Who the inbox message about an alert is for: people by subject, as
            agent approvers are written, and roles as `role:<name>`. A reader
            sees the message if their subject is listed or they hold a role
            listed. Empty or absent means everyone who may read alerts. Either
            way only people with `alerts:read` see it, and `GET /api/alerts`
            lists every alert to them. At most 20 entries.
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 254}
        created_by: {type: string}
        created_by_name:
          description: What the person who made it is called, their name, else their handle, never a subject that holds an address. `created_by` is the subject. Sent back with the rule, it is ignored, as `created_by` is.
          type: string
        created_at: {type: string, format: date-time}
        updated_by:
          description: Who last replaced the rule. Absent until it is replaced.
          type: string
        updated_at: {type: string, format: date-time}
    Alert:
      type: object
      required: [id, rule, kind, severity, title, at]
      properties:
        id: {type: string}
        rule: {type: string}
        kind: {$ref: "#/components/schemas/AlertKind"}
        severity: {$ref: "#/components/schemas/AlertSeverity"}
        agent: {type: string}
        project:
          description: The project of the run that raised the alert, if any.
          type: string
        run_id: {type: string}
        suite: {type: string}
        title: {type: string}
        body: {type: string}
        at: {type: string, format: date-time}
        acked_by: {type: string}
        acked_by_name:
          description: What whoever acknowledged it is called, their name, else their handle, never a subject that holds an address. `acked_by` is the subject.
          type: string
        acked_at: {type: string, format: date-time}

    EvalTarget:
      type: string
      enum: [agent, knowledge]
    EvalCheck:
      description: A deterministic check on an agent's output.
      type: object
      required: [kind, value]
      properties:
        kind: {type: string, enum: [contains, not_contains, matches, equals, within_ms]}
        value: {type: string}
    EvalCase:
      type: object
      required: [id, input]
      properties:
        id: {type: string}
        input: {type: string}
        checks:
          type: array
          items: {$ref: "#/components/schemas/EvalCheck"}
        expect:
          description: For a knowledge suite, the titles a search should return.
          type: array
          items: {type: string}
    EvalSuite:
      type: object
      required: [name, target, subject, cases]
      properties:
        name: {type: string}
        description: {type: string}
        target: {$ref: "#/components/schemas/EvalTarget"}
        subject:
          description: The agent or knowledge source the suite tests.
          type: string
        cases:
          type: array
          items: {$ref: "#/components/schemas/EvalCase"}
        k: {type: integer}
        pass_rate: {type: number}
        created_by:
          description: Set by the server.
          type: string
        updated_at:
          description: Set by the server.
          type: string
          format: date-time
    EvalVerdict:
      type: object
      required: [check, passed]
      properties:
        check: {type: string}
        passed: {type: boolean}
        reason: {type: string}
    EvalHit:
      type: object
      required: [title, score, expected]
      properties:
        title: {type: string}
        score: {type: number}
        expected: {type: boolean}
    EvalResult:
      type: object
      required: [case_id, input, passed, duration_ms]
      properties:
        case_id: {type: string}
        input: {type: string}
        passed: {type: boolean}
        output: {type: string}
        verdicts:
          type: array
          items: {$ref: "#/components/schemas/EvalVerdict"}
        hits:
          type: array
          items: {$ref: "#/components/schemas/EvalHit"}
        rank: {type: integer}
        run_id: {type: string}
        duration_ms: {type: integer, format: int64}
        error: {type: string}
    EvalRun:
      type: object
      required: [id, suite, target, subject, status, passed, total, pass_rate, threshold, results, started_at]
      properties:
        id: {type: string}
        suite: {type: string}
        target: {$ref: "#/components/schemas/EvalTarget"}
        subject: {type: string}
        rev: {type: integer}
        status: {type: string, enum: [running, passed, failed, errored]}
        passed: {type: integer}
        total: {type: integer}
        pass_rate: {type: number}
        threshold: {type: number}
        metrics:
          type: object
          additionalProperties: {type: number}
        results:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/EvalResult"}
        error: {type: string}
        started_by: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
    EvalSuiteView:
      description: A suite with its most recent runs, newest first.
      allOf:
        - $ref: "#/components/schemas/EvalSuite"
        - type: object
          required: [runs]
          properties:
            runs:
              type: array
              items: {$ref: "#/components/schemas/EvalRun"}

    KnowledgeVariant:
      description: A saved view of a source, which leaves some documents out.
      type: object
      required: [name, excluded]
      properties:
        name: {type: string}
        excluded:
          type: array
          items: {type: string}
    KnowledgeSource:
      type: object
      required: [name, documents, passages, excluded, variants, updated_at]
      properties:
        lifecycle: {$ref: "#/components/schemas/KnowledgeLifecycle"}
        content_version: {type: integer, format: int64, minimum: 0}
        name: {type: string}
        description: {type: string}
        documents: {type: integer}
        passages: {type: integer}
        excluded:
          description: Documents held but left out of search.
          type: integer
        variants:
          type: array
          items: {$ref: "#/components/schemas/KnowledgeVariant"}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
    SourceLinkSuggestion:
      type: object
      required: [id, client, resource, project, rules, state, automatic, version, created_at, updated_at]
      properties:
        id: {type: string}
        client: {type: string}
        resource: {$ref: "#/components/schemas/SourceLinkResource"}
        project: {type: string}
        channel: {type: string}
        knowledge: {type: string}
        rules: {type: array, maxItems: 200, items: {type: string}}
        state: {type: string, enum: [suggested, linked, ignored]}
        automatic: {type: boolean}
        active: {type: boolean, readOnly: true}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SourceLinkRuleInput:
      type: object
      required: [provider, attribute, pattern, project]
      properties:
        provider: {type: string, enum: [github, slack, drive, notion]}
        attribute: {type: string, maxLength: 64}
        pattern: {type: string, minLength: 1, maxLength: 256}
        project: {type: string, minLength: 1, maxLength: 64}
        channel: {type: string, maxLength: 40}
        mode: {type: string, enum: [suggest, auto_link, off], default: suggest}
    SourceLinkRule:
      allOf:
        - {$ref: "#/components/schemas/SourceLinkRuleInput"}
        - type: object
          required: [id, mode]
          properties:
            id: {type: string}
            mode: {type: string, enum: [suggest, auto_link, off]}
            copied_from: {type: string}
    SourceLinkResource:
      type: object
      required: [provider, id, attributes]
      properties:
        provider: {type: string, maxLength: 64}
        id: {type: string, minLength: 1, maxLength: 256}
        candidate: {$ref: "#/components/schemas/SourceLinkRuleInput"}
        attributes:
          type: object
          maxProperties: 8
          additionalProperties:
            type: array
            maxItems: 50
            items: {type: string, maxLength: 512}
    SourceLinkMatch:
      type: object
      required: [project, mode, rules]
      properties:
        project: {type: string}
        channel: {type: string}
        mode: {type: string, enum: [suggest]}
        rules: {type: array, maxItems: 200, items: {type: string}}
    KnowledgeAttachment:
      type: object
      required: [source, project]
      properties:
        source: {type: string}
        project: {type: string}
        channel: {type: string}
    KnowledgeResource:
      type: object
      required: [id, name, uri, kind, supported]
      properties:
        id: {type: string}
        name: {type: string}
        uri: {type: string}
        kind: {type: string}
        supported: {type: boolean}
        unsupported_reason: {type: string}
    KnowledgeSourceConfig:
      type: object
      required: [mode, provider]
      properties:
        resources: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 128}}
        snapshot: {type: boolean, default: false}
        sync_every_seconds: {type: integer, minimum: 0, maximum: 604800, default: 0}
        mode: {type: string, enum: [indexed, live, hybrid]}
        provider: {type: string}
        origin: {type: string, maxLength: 1024}
        owner: {type: string, maxLength: 256}
        project: {type: string, maxLength: 256}
        stop_after_seconds: {type: integer, minimum: 60, maximum: 2592000, default: 86400}
    KnowledgeLifecycle:
      type: object
      required: [mode, provider, status, stop_after_seconds, attempts, connected_at]
      properties:
        resources: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 128}}
        snapshot: {type: boolean, default: false}
        sync_every_seconds: {type: integer, minimum: 0, maximum: 604800, default: 0}
        connected_at: {type: string, format: date-time}
        mode: {type: string, enum: [indexed, live, hybrid]}
        provider: {type: string}
        origin: {type: string}
        owner: {type: string}
        project: {type: string}
        status: {type: string, enum: [connected, importing, indexing, available, syncing, in_sync, needs_attention]}
        cause: {type: string, enum: [auth_expired, quota, unsupported, unavailable, interrupted, stale]}
        last_good_at: {type: string, format: date-time}
        stop_after_seconds: {type: integer, minimum: 60, maximum: 2592000}
        attempts:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, started_at, status]
            properties:
              id: {type: string}
              started_at: {type: string, format: date-time}
              finished_at: {type: string, format: date-time}
              status: {type: string, enum: [importing, indexing, syncing, succeeded, failed]}
              cause: {type: string}
    KnowledgeDocument:
      type: object
      required: [id, title, bytes, passages, excluded, added_at]
      properties:
        id: {type: string}
        title: {type: string}
        uri: {type: string}
        bytes: {type: integer}
        passages: {type: integer}
        excluded: {type: boolean}
        added_by: {type: string}
        added_at: {type: string, format: date-time}
    KnowledgeHit:
      type: object
      required: [source, document_id, title, index, text, score]
      properties:
        copy_at: {type: string, format: date-time}
        refresh_failed: {type: boolean}
        mode: {type: string, enum: [indexed, live]}
        source: {type: string}
        document_id: {type: string}
        title: {type: string}
        uri: {type: string}
        index: {type: integer}
        text: {type: string}
        score: {type: number}

    PolicyScopeKind:
      type: string
      enum: [tenant, project, agent, client]
    PolicyPeriod:
      type: string
      enum: [day, month]
    PolicyAction:
      description: What happens at a limit. Only `block` is acted on today.
      type: string
      enum: [block, approve]
    PolicyLimit:
      type: string
      enum: [runs, concurrent, spend, lease, tokens]
    PolicyScope:
      type: object
      required: [kind]
      properties:
        kind: {$ref: "#/components/schemas/PolicyScopeKind"}
        name:
          description: The project, agent or client. Absent for the tenant scope.
          type: string
    PolicyInput:
      description: The limits for one scope, as a caller writes them. Zero or absent sets no limit.
      type: object
      required: [scope]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        period: {$ref: "#/components/schemas/PolicyPeriod"}
        max_runs: {type: integer}
        max_concurrent: {type: integer}
        spend_limit:
          description: |
            Micro-USD a period, enforced: a new run is refused once the scope
            has reached it, and a run in flight is stopped when a call takes
            the scope to it. Only money priced in US dollars counts.
          type: integer
          format: int64
        max_lease: {type: integer, format: int64}
        max_tokens:
          description: |
            Model tokens (prompt and completion) a period, enforced like
            `spend_limit`. It counts every call, priced or not, so it bounds
            what a spend limit cannot see.
          type: integer
          format: int64
        max_storage:
          description: Bytes.
          type: integer
          format: int64
        max_clients: {type: integer}
        max_clients_per_surface: {type: integer}
        warn_at:
          description: The percentage of a limit at which a warning is raised. Defaults to 80.
          type: integer
        action:
          description: Defaults to `block`.
          $ref: "#/components/schemas/PolicyAction"
    Policy:
      description: The limits for one scope, at one version.
      type: object
      required: [scope, period, action, version, updated_at]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        period: {$ref: "#/components/schemas/PolicyPeriod"}
        max_runs: {type: integer}
        max_concurrent: {type: integer}
        spend_limit: {type: integer, format: int64}
        max_lease: {type: integer, format: int64}
        max_tokens: {type: integer, format: int64}
        max_storage: {type: integer, format: int64}
        max_clients: {type: integer}
        max_clients_per_surface: {type: integer}
        warn_at: {type: integer}
        action: {$ref: "#/components/schemas/PolicyAction"}
        authority:
          description: Who set it. Absent is an admin, with `billing:write`. `owner` is a tighten-only limit a project's owner set on a project below one they own, never looser than the limits over it.
          type: string
          enum: [admin, owner]
        version: {type: integer}
        updated_by: {type: string}
        updated_by_name:
          description: What whoever last changed it is called, their name, else their handle, never a subject that holds an address. `updated_by` is the subject. Absent on the policies a change holds.
          type: string
        updated_at: {type: string, format: date-time}
    PolicyChange:
      type: object
      required: [scope, by, at]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        by: {type: string}
        by_name:
          description: What whoever made the change is called, their name, else their handle, never a subject that holds an address. `by` is the subject.
          type: string
        at: {type: string, format: date-time}
        before: {$ref: "#/components/schemas/Policy"}
        after: {$ref: "#/components/schemas/Policy"}
    Measure:
      description: One limit and what has been used against it. A limit of zero means the scope sets none.
      type: object
      required: [used, limit]
      properties:
        used: {type: integer, format: int64}
        limit: {type: integer, format: int64}
        projected:
          description: Where `used` ends the period at the pace so far. Absent for a count that does not accumulate.
          type: integer
          format: int64
    SpendMeasure:
      description: |
        Spend against its limit, in micro-USD, enforced. `used` counts only
        what was priced in US dollars, so it is a lower bound whenever
        `unpriced_calls` is not zero or `other_costs` is not empty.
      type: object
      required: [used, limit, metered, unpriced_calls]
      properties:
        used: {type: integer, format: int64}
        limit: {type: integer, format: int64}
        projected: {type: integer, format: int64}
        metered:
          description: True. The runtime prices model calls from saige's catalog.
          type: boolean
        unpriced_calls:
          description: Calls in the period with no price. Their spend is unknown, not zero.
          type: integer
        other_costs:
          description: Money in other currencies, one entry per currency, never converted and never held against the limit.
          type: array
          items: {$ref: "#/components/schemas/PolicyCost"}
    PolicyCost:
      description: An amount in one currency, in millionths of it.
      type: object
      required: [micros, currency]
      properties:
        micros: {type: integer, format: int64}
        currency: {type: string}
    ScopeUsage:
      description: One policy and where its scope stands against it.
      type: object
      required: [scope, period, period_start, period_end, version, warn_at, action, runs, concurrent, spend, tokens, max_lease, state]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        period: {$ref: "#/components/schemas/PolicyPeriod"}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        version: {type: integer}
        warn_at: {type: integer}
        action: {$ref: "#/components/schemas/PolicyAction"}
        runs: {$ref: "#/components/schemas/Measure"}
        concurrent: {$ref: "#/components/schemas/Measure"}
        spend: {$ref: "#/components/schemas/SpendMeasure"}
        tokens: {$ref: "#/components/schemas/Measure"}
        max_lease: {type: integer, format: int64}
        state:
          description: The worst of the enforced limits, spend and tokens included.
          type: string
          enum: [ok, warn, over]
    UsageEntry:
      description: One line of the usage ledger.
      type: object
      required: [kind, tenant, agent, at]
      properties:
        kind:
          description: |
            `halted` is a run in flight stopped at a limit. `spent` (one model
            call) and `settled` (a run's own total at its end) are the ledger's
            record of spend and are not listed as notices.
          type: string
          enum: [admitted, ended, warned, refused, spent, settled, halted]
        tenant: {type: string}
        project: {type: string}
        within:
          description: The run's project's ancestors, nearest first and the workspace left out. The entry counts toward each of them too. Entries from before the tree have none.
          type: array
          maxItems: 3
          items: {type: string}
        agent: {type: string}
        client: {type: string}
        run_id: {type: string}
        at:
          description: When the entry was appended, by the server's clock. It decides the period the entry counts in.
          type: string
          format: date-time
        event_at:
          description: For a `spent` entry, when the runtime said the call happened. It counts nothing.
          type: string
          format: date-time
        scope: {$ref: "#/components/schemas/PolicyScope"}
        version: {type: integer}
        limit: {$ref: "#/components/schemas/PolicyLimit"}
        reason: {type: string}
        key:
          description: What makes a `spent` or `settled` entry count once.
          type: string
        spend: {$ref: "#/components/schemas/UsageSpend"}
    UsageSpend:
      description: What some model calls used. `micros` is US dollars only.
      type: object
      properties:
        micros: {type: integer, format: int64}
        model_calls: {type: integer}
        tokens: {type: integer, format: int64}
        unpriced_calls: {type: integer}
        other_costs:
          type: array
          items: {$ref: "#/components/schemas/PolicyCost"}

    ClientSurface:
      type: string
      enum: [slack, github]
    ClientIdentity:
      description: How a webhook says which client it is for.
      type: object
      properties:
        app_id: {type: string}
        team: {type: string}
        installation: {type: string}
        owners:
          type: array
          items: {type: string}
    SecretRef:
      description: Where one of a client's secrets is. The secret itself is never sent.
      type: object
      required: [set]
      properties:
        set: {type: boolean}
        ref:
          description: "`env:NAME` when the secret lives in the server's environment."
          type: string
    SecretInput:
      description: A secret as a caller writes it, as a value or as an `env:HUMAGEN_*` reference (`env:WARP_*`, the prefix before the rename, still works). Leave both out to keep the one held.
      type: object
      properties:
        value: {type: string}
        ref: {type: string}
    SlackCommand:
      type: object
      required: [name, description]
      properties:
        name: {type: string}
        description: {type: string}
        argument_hint: {type: string}
    SlackOptions:
      type: object
      properties:
        sessions: {type: boolean}
        commands:
          type: array
          items: {$ref: "#/components/schemas/SlackCommand"}
        machine:
          description: The subject of the credential a Slack app signs in to the API with. Only it may act for `people`.
          type: string
        people:
          description: |
            Slack user ids in the client's team, each mapped to the principal it
            is in this workspace, by subject. An answer clicked in Slack by a
            person it maps is that principal's answer; anyone else is refused.
          type: object
          additionalProperties: {type: string}
    GitHubOptions:
      type: object
      properties:
        auto_labels:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        checks: {type: boolean}
        guides: {type: boolean}
        mutations: {type: boolean}
        read_repositories:
          type: array
          items: {type: string}
        login:
          description: The app's own GitHub login, such as `humagen[bot]`. A comment that mentions it and names no agent is addressed to the client and answered by its default (see docs/github.md).
          type: string
    ClientInput:
      description: A client as a caller writes it. The tenant, who manages it and its version are the server's to say.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        surface: {$ref: "#/components/schemas/ClientSurface"}
        identity: {$ref: "#/components/schemas/ClientIdentity"}
        default_agent: {type: string}
        agents:
          description: The agents it may route to besides its default. `*` alone means any.
          type: [array, "null"]
          items: {type: string}
        bots:
          type: [object, "null"]
          additionalProperties: {type: string}
        slack:
          oneOf:
            - $ref: "#/components/schemas/SlackOptions"
            - type: "null"
        github:
          oneOf:
            - $ref: "#/components/schemas/GitHubOptions"
            - type: "null"
        home:
          oneOf:
            - $ref: "#/components/schemas/ClientHome"
            - type: "null"
        enabled:
          description: Defaults to true.
          type: [boolean, "null"]
        credentials:
          type: object
          properties:
            token: {$ref: "#/components/schemas/SecretInput"}
            signing_secret: {$ref: "#/components/schemas/SecretInput"}
    ClientHome:
      description: |
        Where a client files the threads it starts outside a channel bound to
        one: direct messages, the assistant pane, an unbound channel, a GitHub
        issue. Absent, they are filed in the workspace's `general` channel.
        The channel must be one of the project's, not archived.
      type: object
      required: [project]
      properties:
        project:
          description: A project's name, or `~` for the workspace. It must exist.
          type: string
        channel:
          description: A channel of that project. Absent is `general`.
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
    ClientView:
      description: A Slack app or GitHub installation the workspace answers through, and the limits on the runs it raises.
      type: object
      required: [id, name, surface, identity, credentials, enabled, version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        surface: {$ref: "#/components/schemas/ClientSurface"}
        identity: {$ref: "#/components/schemas/ClientIdentity"}
        credentials:
          type: object
          required: [token, signing_secret]
          properties:
            token: {$ref: "#/components/schemas/SecretRef"}
            signing_secret: {$ref: "#/components/schemas/SecretRef"}
        default_agent:
          description: Absent when the client has none, and when it lives in a project the caller may not read.
          type: string
        agents:
          description: |
            The agents it may route to besides its default, leaving out every
            agent that lives in a project the caller may not read, as `bots`
            and `github.auto_labels` do. The machine that hosts the client's
            surface, its `slack.machine`, is shown every agent it names.
          type: array
          items: {type: string}
        bots:
          type: object
          additionalProperties: {type: string}
        slack: {$ref: "#/components/schemas/SlackOptions"}
        github: {$ref: "#/components/schemas/GitHubOptions"}
        home:
          description: Absent when the client has none, and when it is in a project the caller may not read.
          allOf:
            - $ref: "#/components/schemas/ClientHome"
        enabled: {type: boolean}
        managed:
          description: Set on a client the server's configuration owns, which the API cannot change.
          type: string
        version: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        limits:
          description: The client's own policy, if it has one. Set it through `putPolicy` with a `client` scope.
          $ref: "#/components/schemas/Policy"
    ClientCaps:
      type: object
      required: [max, max_per_surface]
      properties:
        max: {type: integer}
        max_per_surface: {type: integer}

    EventKind:
      description: |
        What an event is. Kinds are dotted, so a filter can select a family
        (`delta`) or one member (`delta.citation`). The set is open in the
        runtime: a reader should pass over a kind it does not know. The
        `control.*` kinds here are defined and not published today. The
        `usage.*` kinds report what model calls used: one `usage.call` per
        call as it completes, and a `usage.child` when an attached run's total
        is rolled up into its caller. A request
        addressed to a run, such as `control.stop`, is the runtime's traffic
        and never appears on this API.
      type: string
      enum:
        - delta.text
        - delta.thinking
        - delta.tool.call
        - delta.tool.done
        - delta.citation
        - lifecycle.accepted
        - lifecycle.started
        - lifecycle.parked
        - lifecycle.resumed
        - lifecycle.completed
        - lifecycle.failed
        - lifecycle.child.parked
        - lifecycle.stopped
        - action.taken
        - usage.call
        - usage.child
        - control.created
        - control.revised
        - control.deleted
    TextPayload:
      description: One fragment of the agent's answer, in order. Concatenate fragments.
      type: object
      required: [text]
      properties:
        text: {type: string}
    ThinkingPayload:
      description: One fragment of extended reasoning. Most surfaces do not show it.
      type: object
      required: [text]
      properties:
        text: {type: string}
    ToolCallPayload:
      description: The agent reaching for a tool.
      type: object
      required: [id, name, phase]
      properties:
        id:
          description: Correlates the call with its `delta.tool.done`.
          type: string
        name: {type: string}
        phase:
          description: "`requested` while the model writes the call, `executing` once it runs."
          type: string
          enum: [requested, executing]
        arguments:
          description: The call's arguments as a JSON object. Absent while the model is still writing the call, and when they were too large to carry.
          type: object
          additionalProperties: true
        arguments_bytes:
          description: The size of arguments left out for being too large, so "left out" reads apart from "none".
          type: integer
    ToolDonePayload:
      description: A tool execution finished.
      type: object
      required: [id]
      properties:
        id: {type: string}
        name: {type: string}
        result: {type: string}
        error:
          description: Set when the tool failed. `result` is then the failure text the model was shown.
          type: string
        arguments:
          description: The call's arguments as a JSON object. Absent while the model is still writing the call, and when they were too large to carry.
          type: object
          additionalProperties: true
        arguments_bytes:
          description: The size of arguments left out for being too large, so "left out" reads apart from "none".
          type: integer
    Provenance:
      description: Where a cited passage came from.
      type: object
      properties:
        document_uuid: {type: string}
        document_title: {type: string}
        source_uri: {type: string}
        section_uuid: {type: string}
        section_heading: {type: string}
        section_index: {type: integer}
    RunCitation:
      description: A retained citation. Missing mode is historically unknown; no current configuration is substituted.
      type: object
      required: [id, title]
      properties:
        id: {type: string}
        title: {type: string}
        url: {type: string}
        snippet: {type: string}
        mode: {type: string, enum: [indexed, live]}
        copy_at: {type: string, format: date-time}
        refresh_failed: {type: boolean}
    CitationPayload:
      description: One retrieved passage the turn was grounded in.
      type: object
      required: [label, text, source, index]
      properties:
        mode: {type: string, enum: [indexed, live]}
        copy_at: {type: string, format: date-time}
        refresh_failed: {type: boolean}
        label:
          description: The inline marker, such as `[1]`.
          type: string
        text:
          description: The exact source text.
          type: string
        source: {$ref: "#/components/schemas/Provenance"}
        index: {type: integer}
    LifecyclePayload:
      description: |
        The body of every lifecycle kind. A failed attempt is reported with
        `terminal` false while the run may still be retried. The run's record
        (`getRun`) is the authority on whether it is over.
      type: object
      properties:
        attempt:
          description: The execution attempt that produced the event, from 1.
          type: integer
        rev: {type: integer}
        error:
          description: The failure message, on `lifecycle.failed`.
          type: string
        terminal:
          description: The run will not be retried. Meaningful on `lifecycle.failed`.
          type: boolean
        reason:
          description: What a parked run is waiting for.
          type: string
        text:
          description: The final answer, on `lifecycle.completed`.
          type: string
        usage:
          description: What the run used, on `lifecycle.completed`.
          $ref: "#/components/schemas/RunUsage"
        question:
          description: What the run is waiting on a person for, on `lifecycle.parked`.
          $ref: "#/components/schemas/Question"
        answer:
          description: The answer the run resumed with, on `lifecycle.resumed` after a question.
          $ref: "#/components/schemas/Answer"
    QuestionTool:
      type: object
      required: [name, call_id]
      properties:
        name: {type: string}
        call_id: {type: string}
        arguments:
          description: The arguments the model asked for, as a JSON object.
          type: object
        schema:
          description: The tool's parameter schema.
          type: object
        acts_for_person:
          description: The call runs with the credential of the person the run acts for, a tool that acts as them. Anyone who may approve it may approve or deny it as asked, but only that person may approve it with edited `arguments`; anyone else's edit is 403.
          type: boolean
    Question:
      description: |
        What a run is waiting on a person for: to approve a tool call, to
        choose one of `options`, or to reply. `asked_of` is a routing hint and
        admits nobody. `default` is what applies when it expires.
      type: object
      required: [id, kind, prompt]
      properties:
        id: {type: string}
        kind:
          type: string
          enum: [approval, choice, reply, delegation]
        approvers:
          description: When set on an approval, only these people and `role:<name>` holders may answer it, in place of the agent's own approvers.
          type: array
          items: {type: string}
        self_approval:
          description: With `approvers`, lets the person whose request raised the call approve it.
          type: boolean
        agent: {type: string}
        prompt: {type: string}
        options:
          type: array
          items: {type: string}
        tool: {$ref: "#/components/schemas/QuestionTool"}
        asked_of: {type: string}
        expires_at: {type: string, format: date-time}
        default: {$ref: "#/components/schemas/Answer"}
        at: {type: string, format: date-time}
        child_run_id: {type: string}
    Answer:
      description: An answer to a question, or its default when nobody answered in time (`expired`).
      type: object
      required: [question_id]
      properties:
        question_id: {type: string}
        decision:
          type: string
          enum: [approve, deny]
        arguments:
          type: object
        choice: {type: string}
        text: {type: string}
        note: {type: string}
        by:
          description: Who answered, by subject, as the platform authenticated them.
          type: string
        by_name:
          description: What whoever answered is called, their name, else their handle, never a subject that holds an address. Set on what a route hands out, never in the journal.
          type: string
        at: {type: string, format: date-time}
        expired: {type: boolean}
        run_id: {type: string}
    ChildQuestion:
      description: The body of `lifecycle.child.parked`, a question a run this one waits on asked.
      type: object
      required: [run_id, question]
      properties:
        run_id: {type: string}
        agent: {type: string}
        question: {$ref: "#/components/schemas/Question"}
    StoppedPayload:
      description: |
        The body of `lifecycle.stopped`: the run was asked to stop and wrapped
        its turn up. It is final. `text` is what the agent had said, which may
        be empty.
      type: object
      properties:
        attempt: {type: integer}
        rev: {type: integer}
        reason:
          description: Why it was stopped, in the words of whoever asked.
          type: string
        by:
          description: Who asked, such as a subject or `slack:<user id>`.
          type: string
        text:
          description: The partial answer.
          type: string
        usage:
          description: What the run used before it stopped, the call that was cut short included.
          $ref: "#/components/schemas/RunUsage"
    Cost:
      description: |
        An amount of money in integer millionths of a currency. One US dollar
        is 1,000,000 with currency `USD`. Prices come from saige's catalog
        only, and are never converted between currencies.
      type: object
      required: [micros, currency]
      properties:
        micros: {type: integer, format: int64}
        currency:
          description: An ISO 4217 code.
          type: string
        as_of:
          description: The date the rates were recorded. On a sum, the oldest; empty when any was priced from a card with no date.
          type: string
    Usage:
      description: |
        What some model calls used, summed. `cost` is in the currency of the
        first priced call and is a lower bound whenever `unpriced_calls` is not
        zero; calls priced in another currency are in `other_costs`.
      type: object
      properties:
        model_calls: {type: integer}
        requests:
          description: Billable provider requests. A call answered from saige's response cache made none.
          type: integer
        prompt_tokens:
          description: All input, cached and written to cache included.
          type: integer
        cached_prompt_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        completion_tokens: {type: integer}
        cost: {$ref: "#/components/schemas/Cost"}
        other_costs:
          type: array
          items: {$ref: "#/components/schemas/Cost"}
        unpriced_calls:
          description: Calls whose tokens are counted and that have no price.
          type: integer
    ContextUsage:
      description: How full the run's context was at its latest model call.
      type: object
      properties:
        model: {type: string}
        window:
          description: The model's input token limit from saige's catalog. Absent when the catalog declares none.
          type: integer
        tokens:
          description: The prompt that call sent, in tokens.
          type: integer
    RunUsage:
      description: |
        What a run used. `own` is its own agent's calls, `children` the attached
        runs it rolled up (each once), and `total` the two added: the figure
        held against a limit.
      type: object
      required: [own, total]
      properties:
        own: {$ref: "#/components/schemas/Usage"}
        children: {$ref: "#/components/schemas/Usage"}
        total: {$ref: "#/components/schemas/Usage"}
        context: {$ref: "#/components/schemas/ContextUsage"}
    UsageCallPayload:
      description: One model call, reported as it completes. Count it once by `accounting_id`.
      type: object
      required: [accounting_id]
      properties:
        accounting_id: {type: string}
        saige_accounting_id: {type: string}
        agent: {type: string}
        depth: {type: integer}
        model: {type: string}
        requests: {type: integer}
        prompt_tokens: {type: integer}
        cached_prompt_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        completion_tokens: {type: integer}
        response_cache_hit: {type: boolean}
        cost: {$ref: "#/components/schemas/Cost"}
        context_window: {type: integer}
    UsageChildPayload:
      description: An attached run's whole usage, rolled up into its caller once it ended.
      type: object
      required: [accounting_id, run_id, usage]
      properties:
        accounting_id: {type: string}
        run_id: {type: string}
        agent: {type: string}
        depth: {type: integer}
        usage: {$ref: "#/components/schemas/Usage"}
    ActionPayload:
      description: |
        A tool acted on something: a comment posted, a file published. When
        `name` is `publish_artifact` and there is no `error`, `data` is the
        `Artifact` that was published.
      type: object
      required: [name]
      properties:
        name: {type: string}
        target:
          description: The address URI the action was aimed at.
          type: string
        summary: {type: string}
        address:
          description: The address URI of whatever was created or changed.
          type: string
        data:
          description: The tool's structured result, passed through untouched.
        error: {type: string}
    EventBase:
      description: What every event carries, whatever its kind.
      type: object
      required: [seq, topic, run_id, tenant, agent, rev, origin, at]
      properties:
        seq:
          description: Orders events within one run. It increases and is not contiguous, so compare it, do not count on it. It is the resume cursor.
          type: integer
          format: int64
        topic:
          description: Where the event was published, always `agent:<name>:<run>`.
          type: string
        run_id: {type: string}
        tenant: {type: string}
        agent: {type: string}
        rev: {type: integer}
        origin: {type: string}
        at: {type: string, format: date-time}
    ManifestEventBase:
      type: object
      required: [seq, at]
      properties:
        seq: {type: integer, format: int64}
        at: {type: string, format: date-time}
    RunEvent:
      description: |
        One thing a run produced, as the event stream and `listRunEvents` send
        it. `kind` says which variant it is. `payload` is the kind's body as
        JSON, base64-encoded, because the server marshals a byte slice: decode
        the base64, then parse the JSON. The decoded shape for each kind is the
        schema named in `contentSchema`. A kind may carry no payload.
      oneOf:
        - $ref: "#/components/schemas/TextDeltaEvent"
        - $ref: "#/components/schemas/ThinkingDeltaEvent"
        - $ref: "#/components/schemas/ToolCallEvent"
        - $ref: "#/components/schemas/ToolDoneEvent"
        - $ref: "#/components/schemas/CitationEvent"
        - $ref: "#/components/schemas/RunAcceptedEvent"
        - $ref: "#/components/schemas/RunStartedEvent"
        - $ref: "#/components/schemas/RunParkedEvent"
        - $ref: "#/components/schemas/RunResumedEvent"
        - $ref: "#/components/schemas/RunCompletedEvent"
        - $ref: "#/components/schemas/RunFailedEvent"
        - $ref: "#/components/schemas/ChildParkedEvent"
        - $ref: "#/components/schemas/RunStoppedEvent"
        - $ref: "#/components/schemas/ActionTakenEvent"
        - $ref: "#/components/schemas/UsageCallEvent"
        - $ref: "#/components/schemas/UsageChildEvent"
        - $ref: "#/components/schemas/AgentCreatedEvent"
        - $ref: "#/components/schemas/AgentRevisedEvent"
        - $ref: "#/components/schemas/AgentDeletedEvent"
      discriminator:
        propertyName: kind
        mapping:
          delta.text: "#/components/schemas/TextDeltaEvent"
          delta.thinking: "#/components/schemas/ThinkingDeltaEvent"
          delta.tool.call: "#/components/schemas/ToolCallEvent"
          delta.tool.done: "#/components/schemas/ToolDoneEvent"
          delta.citation: "#/components/schemas/CitationEvent"
          lifecycle.accepted: "#/components/schemas/RunAcceptedEvent"
          lifecycle.started: "#/components/schemas/RunStartedEvent"
          lifecycle.parked: "#/components/schemas/RunParkedEvent"
          lifecycle.resumed: "#/components/schemas/RunResumedEvent"
          lifecycle.completed: "#/components/schemas/RunCompletedEvent"
          lifecycle.failed: "#/components/schemas/RunFailedEvent"
          lifecycle.child.parked: "#/components/schemas/ChildParkedEvent"
          lifecycle.stopped: "#/components/schemas/RunStoppedEvent"
          action.taken: "#/components/schemas/ActionTakenEvent"
          usage.call: "#/components/schemas/UsageCallEvent"
          usage.child: "#/components/schemas/UsageChildEvent"
          control.created: "#/components/schemas/AgentCreatedEvent"
          control.revised: "#/components/schemas/AgentRevisedEvent"
          control.deleted: "#/components/schemas/AgentDeletedEvent"
    TextDeltaEvent:
      description: One fragment of the answer.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.text}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/TextPayload"}
    ThinkingDeltaEvent:
      description: One fragment of reasoning.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.thinking}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ThinkingPayload"}
    ToolCallEvent:
      description: The agent reached for a tool.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.call}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ToolCallPayload"}
    ToolDoneEvent:
      description: A tool finished.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.done}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ToolDonePayload"}
    CitationEvent:
      description: A passage the turn was grounded in.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.citation}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/CitationPayload"}
    RunAcceptedEvent:
      description: The run was accepted.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.accepted}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    RunStartedEvent:
      description: An attempt started.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.started}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    RunParkedEvent:
      description: The run is waiting on something.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.parked}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    ChildParkedEvent:
      description: A run this one is waiting on is waiting on a person. Answer it on that run.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.child.parked}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ChildQuestion"}
    RunResumedEvent:
      description: A parked run carried on.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.resumed}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    RunCompletedEvent:
      description: The run finished, with its answer.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.completed}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    RunFailedEvent:
      description: An attempt failed. Final only when `terminal` is true.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.failed}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
