            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updatePreferences
      tags: [preferences]
      summary: Replace the caller's own preferences
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
