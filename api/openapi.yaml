                  complete: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/manifest:
    get:
      operationId: getRunManifest
      tags: [runs]
      summary: Export everything recorded about a run and the runs under it
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: One document, with every event's body decoded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Manifest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: Page conversations, most recently active first
      description: |
        `next` is the cursor for the page after this one, or null at the end.
        Pass it back as `before`. A cursor is opaque and belongs to the server
        that issued it.
      x-permission: runs:read
      parameters:
        - name: limit
          in: query
          description: Page size. Defaults to 200, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: agent
          in: query
          description: Only conversations this agent took part in.
          schema: {type: string}
        - name: origin
          in: query
          description: Only conversations raised by this trigger, such as `api`, `slack` or `cron`.
          schema: {type: string}
        - name: standing
          in: query
          description: Only conversations with a run in flight, or with a failed run.
          schema: {type: string, enum: [running, failed]}
        - name: project
          in: query
          description: |
            Only conversations filed in this project, its sub-projects' left
            out. `~` is the workspace: conversations filed in no project. A
            project the workspace does not have answers 404.
          schema: {type: string, maxLength: 63}
        - name: within
          in: query
          description: |
            Only conversations filed in this project or in any project below
            it. `~` is the whole workspace. With `project` as well, a
            conversation is kept only when both keep it.
          schema: {type: string, maxLength: 63}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [threads, next]
                properties:
                  threads:
                    type: array
                    items: {$ref: "#/components/schemas/ThreadSummary"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}:
    get:
      operationId: getThread
      tags: [threads]
      summary: Get every turn of a conversation
      description: |
        A conversation's id is the id of the run that started it. Turns are
        runs: `prev` links each to the turn it follows, and two turns with the
        same `prev` are branches.
      x-permission: runs:read
      parameters:
        - {name: id, in: path, required: true, description: The conversation's id., schema: {type: string}}
      responses:
        "200":
          description: The turns, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [turns]
                properties:
                  turns:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Stream the workspace's events as server-sent events
      description: |
        A long-lived `text/event-stream`. Two kinds of message arrive on it:

        - A message with no `event:` field carries one `RunEvent` as JSON.
        - A message with `event: inbox` carries one `InboxNotice` as JSON. It
          names a message and nothing more: fetch it to see what changed. A
          caller is only sent notices for kinds of message they may read.

        A comment line (`: keep-alive`) is sent every 15 seconds. Messages
        carry no `id:` field, so `Last-Event-ID` is not used: to resume, pass
        the last `seq` processed as `from`. `seq` orders events within one
        run, so `from` is only meaningful with a topic that names one run.

        The stream first replays what the bus still holds for the topic, then
        follows it live. The server ends the stream when the consumer falls
        behind, rather than feed it a gap: reconnect and resume. A run's end is
        not the stream's end, and the ledger (`getRun`) decides whether a run
        is over, not silence on the stream.

        There is no topic for one conversation. To follow a conversation,
        subscribe to `agent` and keep the events whose `run_id` is one of its
        turns.

        Note for generators: the schema below describes the JSON carried in
        each message's `data` field, which is how the oag generator reads
        `itemSchema`.
      x-permission: runs:read
      parameters:
        - name: topic
          in: query
          description: |
            What to listen to. `agent` is every agent (the default),
            `agent:<name>` one agent, `agent:<name>:<run>` one run.
          schema: {type: string}
        - name: from
          in: query
          description: Resume after this sequence number within each run.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                  - $ref: "#/components/schemas/RunEvent"
                  - $ref: "#/components/schemas/InboxNotice"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace settings
      x-permission: agents:read
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Replace workspace settings
      description: The first save records the caller as the one who set the workspace up.
      x-permission: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List schedules
      x-permission: schedules:read
      responses:
        "200":
          description: Every schedule, with its next fires and recent runs.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule
      description: The agent, and the project if one is named, must exist now.
      x-permission: schedules:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Schedule"}
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}:
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Change a schedule
      description: |
        Replaces the schedule's expression, agent, text, project and
        description. The name cannot change: a `name` in the body must match
        the path, or be left out. Whether the schedule is paused, who created
        it and the runs it raised are kept. The agent, and the project if one
        is named, must exist now. The whole edit is checked before anything
        changes, so a refused edit leaves the schedule as it was. An edited
        schedule starts afresh from the time of the edit: it does not catch up
        on occurrences of its new expression that fell before it.
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Schedule"}
      responses:
        "200":
          description: The schedule, as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/pause:
    post:
      operationId: pauseSchedule
      tags: [schedules]
      summary: Pause a schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "200":
          description: The schedule, paused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/resume:
    post:
      operationId: resumeSchedule
      tags: [schedules]
      summary: Resume a paused schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "200":
          description: The schedule, running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/run:
    post:
      operationId: runSchedule
      tags: [schedules]
      summary: Fire a schedule once, now
      description: The run is attributed to the caller, not to the clock, and works while the schedule is paused.
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "202":
          description: The run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: Page the caller's inbox, newest first
      description: |
        The route asks only for `runs:read`. What a caller sees, and what they
        may do with each part, is decided per message: a memory proposal needs
        `agents:read`, a failure `runs:read`, an alert or a reached limit
        `alerts:read`. `next` is the cursor for the page after this one, or
        null at the end.
      x-permission: runs:read
      parameters:
        - name: state
          in: query
          description: Defaults to `open`, or to `all` when `alert` is given.
          schema: {type: string, enum: [open, resolved, dismissed, snoozed, all]}
        - name: kind
          in: query
          description: Only messages of this kind. An unknown kind matches nothing.
          schema: {type: string, enum: [alert, failure, memory, budget, approval, clarification, result]}
        - name: unread
          in: query
          description: Only `true` narrows to messages the caller has not read.
          schema: {type: string, enum: ["true"]}
        - name: alert
          in: query
          description: The message about this alert, in any state.
          schema: {type: string}
        - name: limit
          in: query
          description: Page size. Defaults to 50, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: agent
          in: query
          description: |
            Only messages about this agent: raised by it, or asking to call
            it (`source.target`). With `kind=approval` and `state=open`, the
            agent's queue of calls waiting for approval.
          schema: {type: string}
      responses:
        "200":
          description: One page, with the caller's open and unread counts.
          content:
            application/json:
              schema:
                type: object
                required: [messages, next, open, unread]
                properties:
                  messages:
                    type: array
                    items: {$ref: "#/components/schemas/InboxMessage"}
                  next: {type: [string, "null"]}
                  open: {type: integer}
                  unread: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/count:
    get:
      operationId: getInboxCount
      tags: [inbox]
      summary: Count the caller's open and unread messages
      x-permission: runs:read
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [open, unread]
                properties:
                  open: {type: integer}
                  unread: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}:
    get:
      operationId: getInboxMessage
      tags: [inbox]
      summary: Get a message and the record of what was done to it
      description: A message of a kind the caller may not read answers 404.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      responses:
        "200":
          description: The message and its history.
          content:
            application/json:
              schema:
                type: object
                required: [message, history]
                properties:
                  message: {$ref: "#/components/schemas/InboxMessage"}
                  history:
                    type: array
                    items: {$ref: "#/components/schemas/InboxChange"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/read:
    post:
      operationId: markInboxRead
      tags: [inbox]
      summary: Mark a message read or unread, for the caller only
      description: The body is required. `{}` marks the message read.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  description: Defaults to true.
                  type: [boolean, "null"]
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/dismiss:
    post:
      operationId: dismissInboxMessage
      tags: [inbox]
      summary: Set a message aside without resolving it
      description: Needs the write permission for the message's kind, checked per message.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      responses:
        "200":
          description: The message, dismissed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/snooze:
    post:
      operationId: snoozeInboxMessage
      tags: [inbox]
      summary: Hide a message until a time
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: {type: string, format: date-time}
      responses:
        "200":
          description: The message, snoozed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/parts/{part}/resolve:
    post:
      operationId: resolveInboxPart
      tags: [inbox]
      summary: Act on one part of a message
      description: |
        A part lists the actions the caller may take in `actions`. Each needs
        the permission for the thing it does, not the permission to open an
        inbox, and an action the caller lacks the permission for answers 403:

        | Part | Action | Needs |
        |------|--------|-------|
        | `alert` | `acknowledge` | `alerts:write` |
        | `failure` | `retry`, `acknowledge` | `runs:write` |
        | `memory` | `keep` (with `ids`), `discard` | `agents:write` |
        | `budget` | `raise_limit` (with `limits`) | `billing:write` |
        | `budget` | `acknowledge` | `alerts:write` |
        | `approval` | `approve` (optionally with `arguments`), `deny` | `runs:write` |
        | `choice` | `choose` (with `choice`) | `runs:write` |
        | `reply` | `reply` (with `text`) | `runs:write` |

        Answering a question is `answerQuestion` by another route, with the
        same rules: a person the question is not addressed to does not see
        it, and one the runtime refuses is 403. `act_as` answers for a person
        a surface authenticated. Resolving a part that is already resolved
        returns the first outcome. `retry` starts a new run, so it can be
        refused by a limit with 429 or 402.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
        - {name: part, in: path, required: true, description: The part's id within the message., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Resolution"}
      responses:
        "200":
          description: The message after the action.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: Page published files, newest first
      description: The latest version of each. `next` is the cursor for the page after this one, or null at the end.
      x-permission: artifacts:read
      parameters:
        - {name: thread, in: query, description: Only files published in this conversation., schema: {type: string}}
        - {name: run, in: query, description: Only files this run published., schema: {type: string}}
        - {name: agent, in: query, schema: {type: string}}
        - {name: project, in: query, schema: {type: string}}
        - name: kind
          in: query
          schema: {type: string, enum: [document, spreadsheet, presentation, image, pdf, html, code, data, archive]}
        - {name: q, in: query, description: Matches part of a title., schema: {type: string}}
        - name: limit
          in: query
          description: Page size. Defaults to 50, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - {name: before, in: query, description: The `next` cursor of the previous page., schema: {type: string}}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts, next]
                properties:
                  artifacts:
                    type: array
                    items: {$ref: "#/components/schemas/Artifact"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Get a published file's record
      x-permission: artifacts:read
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteArtifact
      tags: [artifacts]
      summary: Delete a published file
      x-permission: artifacts:write
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/artifacts/{id}/versions:
    get:
      operationId: listArtifactVersions
      tags: [artifacts]
      summary: List every version published under the same title in the same conversation
      x-permission: artifacts:read
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/artifacts/{id}/content:
    get:
      operationId: getArtifactContent
      tags: [artifacts]
      summary: Download a published file's bytes
      description: |
        Always an attachment served as `application/octet-stream`, unless
        `inline=1` is asked for and the file is one of the inert types
        (`text/plain`, PNG, JPEG, GIF, WebP, PDF), which is then served inline
        with its own type. HTML and SVG are never served inline. The `ETag` is
        the file's SHA-256.
      x-permission: artifacts:read
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
        - name: inline
          in: query
          description: Ask for the file's own type, inline, when it is an inert type.
          schema: {type: string, enum: ["1"]}
      responses:
        "200":
          description: The bytes.
          headers:
            Content-Disposition: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/storage:
    get:
      operationId: getStorage
      tags: [artifacts]
      summary: Report what the workspace has published against its storage limit
      x-permission: artifacts:read
      responses:
        "200":
          description: Bytes and files stored, in total and by project and agent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorageUsage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/analytics:
    get:
      operationId: getAnalytics
      tags: [observe]
      summary: Summarize runs over a window ending now
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/Window"}
        - name: bucket
          in: query
          description: A Go duration, such as `1m`. Defaults to a sixtieth of the window. At most 240 buckets are returned.
          schema: {type: string}
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Summary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/journal:
    get:
      operationId: queryJournal
      tags: [observe]
      summary: Query what happened, newest first
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/Window"}
        - {name: agent, in: query, schema: {type: string}}
        - {name: run, in: query, schema: {type: string}}
        - {name: kind, in: query, description: "An event kind, or a family such as `delta` or `lifecycle`.", schema: {type: string}}
        - {name: origin, in: query, schema: {type: string}}
        - {name: q, in: query, description: Matches part of an entry's detail., schema: {type: string}}
        - name: limit
          in: query
          description: Defaults to 200, and is capped at 2000. A value that is not a number is read as the default.
          schema: {type: integer}
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: {$ref: "#/components/schemas/JournalEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List fired alerts
      x-permission: alerts:read
      responses:
        "200":
          description: The alerts.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/alerts/{id}/ack:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      summary: Acknowledge an alert
      description: Settles the alert's inbox message too. They are one state.
      x-permission: alerts:write
      parameters:
        - {name: id, in: path, required: true, description: The alert's id., schema: {type: string}}
      responses:
        "200":
          description: The alert, acknowledged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/alert-rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      summary: List alert rules
      x-permission: alerts:read
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: {$ref: "#/components/schemas/AlertRule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createAlertRule
      tags: [alerts]
      summary: Create an alert rule
      description: |
        `created_by` and `created_at` are set by the server, and `updated_by`
        and `updated_at` are cleared, whatever the body says. The agent and
        the project a rule is scoped to must exist now.
      x-permission: alerts:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertRule"}
      responses:
        "201":
          description: The rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/alert-rules/{name}:
    put:
      operationId: updateAlertRule
      tags: [alerts]
      summary: Replace an alert rule
      description: |
        The body is checked exactly as a new rule is. The name cannot change:
        a `name` in the body must match the path, or be left out.
        `created_by` and `created_at` are kept from the rule replaced, and
        `updated_by` and `updated_at` are set by the server. Alerts the rule
        already raised stay, and so does its cooldown.
      x-permission: alerts:write
      parameters:
        - {name: name, in: path, required: true, description: The rule's name., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertRule"}
      responses:
        "200":
          description: The rule, as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      summary: Delete an alert rule
      x-permission: alerts:write
      parameters:
        - {name: name, in: path, required: true, description: The rule's name., schema: {type: string}}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/evals:
