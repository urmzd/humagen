          properties:
            kind: {type: string, const: lifecycle.stopped}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/StoppedPayload"}
    ActionTakenEvent:
      description: A tool acted on something.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: action.taken}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ActionPayload"}
    UsageCallEvent:
      description: One model call and what it used.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: usage.call}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/UsageCallPayload"}
    UsageChildEvent:
      description: An attached run's total, rolled up into this run.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: usage.child}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/UsageChildPayload"}
    AgentCreatedEvent:
      description: An agent was created. Not published today.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.created}
            payload:
              type: string
              contentEncoding: base64
    AgentRevisedEvent:
      description: An agent was revised. Not published today.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.revised}
            payload:
              type: string
              contentEncoding: base64
    AgentDeletedEvent:
      description: An agent was deleted. Not published today.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.deleted}
            payload:
              type: string
              contentEncoding: base64
    ManifestEvent:
      description: |
        One event in a run manifest, with its body already decoded. It is the
        same union as `RunEvent`, without the envelope fields the manifest's
        run already states. `body` is absent when the event carried none.
      oneOf:
        - $ref: "#/components/schemas/ManifestTextDeltaEvent"
        - $ref: "#/components/schemas/ManifestThinkingDeltaEvent"
        - $ref: "#/components/schemas/ManifestToolCallEvent"
        - $ref: "#/components/schemas/ManifestToolDoneEvent"
        - $ref: "#/components/schemas/ManifestCitationEvent"
        - $ref: "#/components/schemas/ManifestRunAcceptedEvent"
        - $ref: "#/components/schemas/ManifestRunStartedEvent"
        - $ref: "#/components/schemas/ManifestRunParkedEvent"
        - $ref: "#/components/schemas/ManifestRunResumedEvent"
        - $ref: "#/components/schemas/ManifestRunCompletedEvent"
        - $ref: "#/components/schemas/ManifestRunFailedEvent"
        - $ref: "#/components/schemas/ManifestChildParkedEvent"
        - $ref: "#/components/schemas/ManifestRunStoppedEvent"
        - $ref: "#/components/schemas/ManifestActionTakenEvent"
        - $ref: "#/components/schemas/ManifestUsageCallEvent"
        - $ref: "#/components/schemas/ManifestUsageChildEvent"
        - $ref: "#/components/schemas/ManifestAgentCreatedEvent"
        - $ref: "#/components/schemas/ManifestAgentRevisedEvent"
        - $ref: "#/components/schemas/ManifestAgentDeletedEvent"
      discriminator:
        propertyName: kind
        mapping:
          delta.text: "#/components/schemas/ManifestTextDeltaEvent"
          delta.thinking: "#/components/schemas/ManifestThinkingDeltaEvent"
          delta.tool.call: "#/components/schemas/ManifestToolCallEvent"
          delta.tool.done: "#/components/schemas/ManifestToolDoneEvent"
          delta.citation: "#/components/schemas/ManifestCitationEvent"
          lifecycle.accepted: "#/components/schemas/ManifestRunAcceptedEvent"
          lifecycle.started: "#/components/schemas/ManifestRunStartedEvent"
          lifecycle.parked: "#/components/schemas/ManifestRunParkedEvent"
          lifecycle.resumed: "#/components/schemas/ManifestRunResumedEvent"
          lifecycle.completed: "#/components/schemas/ManifestRunCompletedEvent"
          lifecycle.failed: "#/components/schemas/ManifestRunFailedEvent"
          lifecycle.child.parked: "#/components/schemas/ManifestChildParkedEvent"
          lifecycle.stopped: "#/components/schemas/ManifestRunStoppedEvent"
          action.taken: "#/components/schemas/ManifestActionTakenEvent"
          usage.call: "#/components/schemas/ManifestUsageCallEvent"
          usage.child: "#/components/schemas/ManifestUsageChildEvent"
          control.created: "#/components/schemas/ManifestAgentCreatedEvent"
          control.revised: "#/components/schemas/ManifestAgentRevisedEvent"
          control.deleted: "#/components/schemas/ManifestAgentDeletedEvent"
    ManifestTextDeltaEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.text}
            body: {$ref: "#/components/schemas/TextPayload"}
    ManifestThinkingDeltaEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.thinking}
            body: {$ref: "#/components/schemas/ThinkingPayload"}
    ManifestToolCallEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.call}
            body: {$ref: "#/components/schemas/ToolCallPayload"}
    ManifestToolDoneEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.done}
            body: {$ref: "#/components/schemas/ToolDonePayload"}
    ManifestCitationEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.citation}
            body: {$ref: "#/components/schemas/CitationPayload"}
    ManifestRunAcceptedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.accepted}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunStartedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.started}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunParkedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.parked}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestChildParkedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.child.parked}
            body: {$ref: "#/components/schemas/ChildQuestion"}
    ManifestRunResumedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.resumed}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunCompletedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.completed}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunFailedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.failed}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunStoppedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.stopped}
            body: {$ref: "#/components/schemas/StoppedPayload"}
    ManifestActionTakenEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: action.taken}
            body: {$ref: "#/components/schemas/ActionPayload"}
    ManifestUsageCallEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: usage.call}
            body: {$ref: "#/components/schemas/UsageCallPayload"}
    ManifestUsageChildEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: usage.child}
            body: {$ref: "#/components/schemas/UsageChildPayload"}
    ManifestAgentCreatedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.created}
            body: {}
    ManifestAgentRevisedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.revised}
            body: {}
    ManifestAgentDeletedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.deleted}
            body: {}
    ManifestRun:
      description: Everything recorded about one run.
      type: object
      required: [run, state, duration_ms, events, complete]
      properties:
        run: {$ref: "#/components/schemas/Run"}
        state:
          type: string
          description: Where the run stands. `stopping` is a run asked to stop that has not ended yet.
          enum: [queued, running, waiting, stopping, failed, stopped, done]
        cause:
          description: Why a failed run failed or a stopped run was stopped, in one line.
          type: string
        definition:
          description: The agent revision the run was pinned to.
          $ref: "#/components/schemas/Revision"
        duration_ms: {type: integer, format: int64}
        events:
          type: array
          items: {$ref: "#/components/schemas/ManifestEvent"}
        complete:
          description: False when the run's first events are no longer held.
          type: boolean
    Manifest:
      description: One document that says everything the platform recorded about a run and every run under the same root.
      type: object
      required: [version, generated_at, root, runs, usage]
      properties:
        version: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        root: {type: string}
        runs:
          type: array
          items: {$ref: "#/components/schemas/ManifestRun"}
        usage:
          type: object
          required: [metered, total]
          properties:
            metered:
              description: True. The runtime reports token counts and cost.
              type: boolean
            total:
              description: Every run's own calls in the tree, once each, attached and delegated runs alike.
              $ref: "#/components/schemas/Usage"
