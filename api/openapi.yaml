          application/json:
            schema: {$ref: "#/components/schemas/EvalSuite"}
      responses:
        "200":
          description: The suite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvalSuite"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteEvalSuite
      tags: [evals]
      summary: Delete an eval suite
      x-permission: evals:write
      parameters:
        - {$ref: "#/components/parameters/SuiteName"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/evals/{name}/run:
    post:
      operationId: runEvalSuite
      tags: [evals]
      summary: Start a run of an eval suite
      description: A suite that is already running answers 409.
      x-permission: evals:write
      parameters:
        - {$ref: "#/components/parameters/SuiteName"}
      responses:
        "202":
          description: The eval run, started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvalRun"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/evals/{name}/runs:
    get:
      operationId: listEvalRuns
      tags: [evals]
      summary: List an eval suite's runs, newest first
      x-permission: evals:read
      parameters:
        - {$ref: "#/components/parameters/SuiteName"}
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/EvalRun"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/knowledge:
    get:
      operationId: listKnowledgeSources
      tags: [knowledge]
      summary: List knowledge sources
      x-permission: knowledge:read
      responses:
        "200":
          description: The sources.
          content:
