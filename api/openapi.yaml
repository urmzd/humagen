      responses:
        "201":
          description: The source.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KnowledgeSource"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/knowledge/search:
    get:
      operationId: searchKnowledge
      tags: [knowledge]
      summary: Search knowledge (lexical, BM25)
      x-permission: knowledge:read
      parameters:
        - {name: q, in: query, required: true, description: The query. An empty one answers 400., schema: {type: string}}
        - name: source
          in: query
          description: Source names, comma-separated. Empty searches every source.
          schema: {type: string}
        - {name: variant, in: query, description: Search a saved view instead of the current one., schema: {type: string}}
      responses:
        "200":
