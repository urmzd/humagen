        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: control.deleted}
            body: {}
    ManifestRun:
      description: Everything recorded about one run.
      type: object
      required: [run, state, duration_ms, events, complete]
      properties:
        run: {$ref: "#/components/schemas/Run"}
        state:
          type: string
          description: Where the run stands. `stopping` is a run asked to stop that has not ended yet.
          enum: [queued, running, waiting, stopping, failed, stopped, done]
        cause:
          description: Why a failed run failed or a stopped run was stopped, in one line.
          type: string
        definition:
          description: The agent revision the run was pinned to.
          $ref: "#/components/schemas/Revision"
        duration_ms: {type: integer, format: int64}
        events:
          type: array
          items: {$ref: "#/components/schemas/ManifestEvent"}
        complete:
          description: False when the run's first events are no longer held.
          type: boolean
    Manifest:
      description: One document that says everything the platform recorded about a run and every run under the same root.
      type: object
      required: [version, generated_at, root, runs, usage]
      properties:
        version: {type: integer, const: 1}
        generated_at: {type: string, format: date-time}
        root: {type: string}
        runs:
          type: array
          items: {$ref: "#/components/schemas/ManifestRun"}
        usage:
          type: object
          required: [metered, total]
          properties:
            metered:
              description: True. The runtime reports token counts and cost.
              type: boolean
            total:
              description: Every run's own calls in the tree, once each, attached and delegated runs alike.
              $ref: "#/components/schemas/Usage"
