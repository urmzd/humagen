    ManifestEvent:
      description: |
        One event in a run manifest, with its body already decoded. It is the
        same union as `RunEvent`, without the envelope fields the manifest's
        run already states. `body` is absent when the event carried none.
      oneOf:
        - $ref: "#/components/schemas/ManifestTextDeltaEvent"
        - $ref: "#/components/schemas/ManifestThinkingDeltaEvent"
        - $ref: "#/components/schemas/ManifestToolCallEvent"
        - $ref: "#/components/schemas/ManifestToolDoneEvent"
        - $ref: "#/components/schemas/ManifestCitationEvent"
        - $ref: "#/components/schemas/ManifestRunAcceptedEvent"
        - $ref: "#/components/schemas/ManifestRunStartedEvent"
        - $ref: "#/components/schemas/ManifestRunParkedEvent"
        - $ref: "#/components/schemas/ManifestRunResumedEvent"
        - $ref: "#/components/schemas/ManifestRunCompletedEvent"
        - $ref: "#/components/schemas/ManifestRunFailedEvent"
        - $ref: "#/components/schemas/ManifestChildParkedEvent"
        - $ref: "#/components/schemas/ManifestRunStoppedEvent"
        - $ref: "#/components/schemas/ManifestActionTakenEvent"
        - $ref: "#/components/schemas/ManifestUsageCallEvent"
        - $ref: "#/components/schemas/ManifestUsageChildEvent"
        - $ref: "#/components/schemas/ManifestAgentCreatedEvent"
        - $ref: "#/components/schemas/ManifestAgentRevisedEvent"
        - $ref: "#/components/schemas/ManifestAgentDeletedEvent"
      discriminator:
        propertyName: kind
        mapping:
          delta.text: "#/components/schemas/ManifestTextDeltaEvent"
          delta.thinking: "#/components/schemas/ManifestThinkingDeltaEvent"
          delta.tool.call: "#/components/schemas/ManifestToolCallEvent"
          delta.tool.done: "#/components/schemas/ManifestToolDoneEvent"
          delta.citation: "#/components/schemas/ManifestCitationEvent"
          lifecycle.accepted: "#/components/schemas/ManifestRunAcceptedEvent"
          lifecycle.started: "#/components/schemas/ManifestRunStartedEvent"
          lifecycle.parked: "#/components/schemas/ManifestRunParkedEvent"
          lifecycle.resumed: "#/components/schemas/ManifestRunResumedEvent"
          lifecycle.completed: "#/components/schemas/ManifestRunCompletedEvent"
          lifecycle.failed: "#/components/schemas/ManifestRunFailedEvent"
          lifecycle.child.parked: "#/components/schemas/ManifestChildParkedEvent"
          lifecycle.stopped: "#/components/schemas/ManifestRunStoppedEvent"
          action.taken: "#/components/schemas/ManifestActionTakenEvent"
          usage.call: "#/components/schemas/ManifestUsageCallEvent"
          usage.child: "#/components/schemas/ManifestUsageChildEvent"
          control.created: "#/components/schemas/ManifestAgentCreatedEvent"
          control.revised: "#/components/schemas/ManifestAgentRevisedEvent"
          control.deleted: "#/components/schemas/ManifestAgentDeletedEvent"
    ManifestTextDeltaEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.text}
            body: {$ref: "#/components/schemas/TextPayload"}
    ManifestThinkingDeltaEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
