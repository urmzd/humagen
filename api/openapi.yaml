          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvalSuite"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/evals/{name}:
    put:
      operationId: updateEvalSuite
      tags: [evals]
      summary: Replace an eval suite
      x-permission: evals:write
      parameters:
        - {$ref: "#/components/parameters/SuiteName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EvalSuite"}
      responses:
        "200":
          description: The suite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvalSuite"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteEvalSuite
      tags: [evals]
      summary: Delete an eval suite
      x-permission: evals:write
      parameters:
        - {$ref: "#/components/parameters/SuiteName"}
      responses:
        "204":
