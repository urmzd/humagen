                name: {type: string}
      responses:
        "201":
          description: The view.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KnowledgeVariant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/knowledge/{name}/variants/{variant}:
    delete:
      operationId: deleteKnowledgeVariant
      tags: [knowledge]
      summary: Delete a saved view
      x-permission: knowledge:write
      parameters:
        - {$ref: "#/components/parameters/SourceName"}
        - {name: variant, in: path, required: true, description: The view's name., schema: {type: string}}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Get the caller's own preferences
      x-permission: authenticated
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updatePreferences
      tags: [preferences]
      summary: Replace the caller's own preferences
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string}
                theme: {$ref: "#/components/schemas/Theme"}
                accent: {type: string}
                onboarded:
                  description: Marks the first-run questions as done. It can be set and never unset.
                  type: boolean
                pinned:
                  description: Replaces the pinned conversations, at most 50. Absent leaves them as they are.
                  type: array
                  maxItems: 50
                  items: {type: string}
                muted:
                  description: |
                    Replaces the projects whose announcements stay out of the
                    caller's own inbox, at most 100, each a project they can
                    see (404 otherwise). They stay in each project's inbox.
                    The workspace (`~`) is never muted (400). Absent leaves
                    them as they are.
                  type: array
                  maxItems: 100
                  items: {type: string, maxLength: 63}
      responses:
        "200":
          description: The preferences as saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/preferences/photo:
    get:
      operationId: getPreferencesPhoto
      tags: [preferences]
      summary: Get the caller's own picture
      description: Served inline with the image type the server determined from the bytes.
      x-permission: authenticated
      responses:
        "200":
          description: The picture.
          content:
            image/*:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: uploadPreferencesPhoto
      tags: [preferences]
      summary: Set the caller's own picture
      description: The body is the image's own bytes, at most 512 KiB. The server decides what it is.
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: The preferences, with the new picture's version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deletePreferencesPhoto
      tags: [preferences]
      summary: Remove the caller's own picture
      x-permission: authenticated
      responses:
        "200":
          description: The preferences, without a picture.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/find-help:
    get:
      operationId: findHelp
      tags: [projects]
      summary: Find a readable project and available agent for a description of work
      x-permission: projects:read
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: At most eight read-confined suggestions. No work is started.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    maxItems: 8
                    items: {$ref: "#/components/schemas/HelpSuggestion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: Page the workspace's projects in tree order, and what is in each
      description: |
        Each project comes before its sub-projects, and siblings are ordered by
        name ignoring case. The workspace itself is not in the list:
        `GET /api/projects/~` reads it. Only the projects the caller has a
        role in are listed, so a members-only project is listed to its
        members alone, and to `projects:govern`. A workspace has at most 500
        projects. Each view says
        the caller's role (`access`) and what they may do (`actions`).
        `next` is the cursor for the page after this one, or null at the
        end; a cursor is where its last row sat in the tree, so a project
        deleted between pages neither breaks nor shifts the paging. A
        client's machine lists one of its people's projects with
        `act_as_client` and `act_as_user`, as the Slack app's Home does: the
        projects that person may see, each with their role, their actions
        and what they may read in it. The person must hold
        `projects:read` themselves. `mine` marks the projects that name the
        caller, which Home lists as theirs.
      x-permission: projects:read
      parameters:
        - name: parent
          in: query
          description: Only the sub-projects of this project. `~` keeps the top level.
          schema: {type: string, maxLength: 63}
        - name: within
          in: query
          description: Only this project and every project below it. `~` keeps them all.
          schema: {type: string, maxLength: 63}
        - name: q
          in: query
          description: Only projects whose name, title, description or customer holds this, ignoring case.
          schema: {type: string, maxLength: 200}
        - name: kind
          in: query
          description: Only projects of this kind, built in or the workspace's own.
          schema: {type: string, maxLength: 32}
        - name: limit
          in: query
          description: Page size, 100 when left out.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - {$ref: "#/components/parameters/ActAsClient"}
        - {$ref: "#/components/parameters/ActAsUser"}
      responses:
        "200":
          description: One page of projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects, next]
                properties:
                  projects:
                    type: array
                    maxItems: 200
                    items: {$ref: "#/components/schemas/ProjectView"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: |
        A project's name is its identity: it is unique in the workspace
        ignoring case, and never changes. The caller must be a member of the
        parent (the workspace when none is named), and is the new project's
        owner when it names no members: everyone is a member of it, or a
        viewer of an account, and no more open than the parent allows. A
        company project needs `projects:govern`, and so does reusing the name
        of a deleted project, which adopts its old conversations. 400 for a
        kind that cannot sit under its parent, a fifth level, or an archived
        parent; 403 for a parent the caller is only a viewer of; 404 for a
        parent the workspace does not have; 409 for a name taken; 429 at the
        workspace's cap of 500 projects or 10 company projects.
      x-permission: projects:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectInput"}
      responses:
        "201":
          description: The project, where it sits, and what is in it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Read a project, the projects above and below it, and the limits that hold it
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateProject
      tags: [projects]
      summary: Change a project's title, description, account, instructions, kind and archiving
      description: |
        It needs ownership of the project. The body replaces title,
        description, account and instructions as a whole: one left out is
        cleared. `kind`, `archived`, `announce` and, on the workspace,
        `kinds` change only when they are given. `version` is the one the
        caller read, so a change made since answers 409 instead of being
        overwritten. A project's `name` is fixed and its `parent` changes by
        moving, so naming either is 400. The workspace and company projects,
        and making a project company, need `projects:govern`. A field the
        platform file sets answers 409, and so does a kind of the workspace's
        that a project still has.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectUpdate"}
      responses:
        "200":
          description: The project as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its shared notes
      description: |
        It needs ownership of the project; archiving is the alternative that
        keeps everything. Refused with 409, naming them, while sub-projects,
        schedules, alert rules or limits point at the project. A delete never drops a limit.
        Its conversations keep its name, and are adopted only if someone
        holding `projects:govern` creates it again. The workspace cannot be
        deleted (400), a company project needs `projects:govern`, and a
        project the platform file declares is removed there (409). A
        workspace remembers at most 1,000 deleted names, and forgets one only
        when nothing is filed under it: when every one it remembers still has
        conversations or files, the delete is refused with 429.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "204":
          description: Deleted.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/agents:
    get:
      operationId: getProjectAgents
      tags: [projects]
      summary: Read which agents a project turns on, which are available there, and who answers untagged messages
      description: |
        Every agent that lives in a project the caller may not read is left
        out of `enable`, `allow` and `default`, as if it were not there.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's agents.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectAgentsView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: setProjectAgents
      tags: [projects]
      summary: Replace which agents a project turns on, narrows to, and answers untagged messages with
      description: |
        The body replaces the three as a whole. `enable` adds platform agents
        here and below (`*` alone is every one); `allow`, when set, is the
        only agents that may run here and below, and a child can only narrow
        it; `default` answers a message that tags no agent, here and below,
        and is an agent or `auto`. Every name is an agent in the workspace
        that the caller may read, a named default is available where it is
        set, and an agent that lives in a project is not enabled (400). An
        agent that lives in a project the caller may not read is refused in
        the words for one that does not exist. The names in `allow` the
        caller is not shown are kept; an `enable` entry or a `default`
        naming one does nothing in a project they may read, and is not
        kept. The workspace's own lists, which
        hold the workspace default, and a company project's need
        `projects:govern`. `version` is the one the caller read (409 if it
        changed), and lists the platform file sets answer 409.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectAgentsInput"}
      responses:
        "200":
          description: The project's agents as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectAgentsView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/history:
    get:
      operationId: listProjectHistory
      tags: [projects]
      summary: Page what changed on a project, newest first
      description: |
        `next` is the cursor for the page after this one, or null at the end.
        Pass it back as `before`. A cursor is opaque. The workspace keeps its
        last 1,000 changes across all its projects. A change names only the
        agents the caller may read, as the project's own lists do.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - name: limit
          in: query
          description: Page size, 50 when left out.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [changes, next]
                properties:
                  changes:
                    type: array
                    maxItems: 200
                    items: {$ref: "#/components/schemas/ProjectChange"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/memory:
    get:
      operationId: listProjectMemory
      tags: [projects]
      summary: List the notes every agent in a project is sent
      description: |
        Every agent answering in the project or below it is sent them. The
        workspace's own (`~`) are sent to every agent answering anywhere in
        it.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's notes, approved and pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: addProjectMemory
      tags: [projects]
      summary: Write or propose a note shared by every agent in a project
      description: |
        An owner writing a note is its approval, except on the workspace
        and company projects, whose notes every agent in a wide part of the
        tree is sent: there it takes `projects:govern` as well. Any other
        member's note, an owner's there without govern included, is a
        proposal: it waits, and the project's owners are asked in their
        inbox to keep or discard it. A viewer is 403.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteInput"}
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/memory/approve:
    post:
      operationId: approveProjectMemory
      tags: [projects]
      summary: Approve notes proposed for a project
      description: It needs ownership of the project, and `projects:govern` as well for the workspace and company projects.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteSelection"}
      responses:
        "200":
          description: How many were approved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approved"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/memory/{id}:
    delete:
      operationId: removeProjectMemory
      tags: [projects]
      summary: Remove a project note
      description: It needs ownership of the project, and `projects:govern` as well for the workspace and company projects.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {name: id, in: path, required: true, description: The note's id., schema: {type: string}}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/projects/{name}/channels:
    get:
      operationId: listChannels
      tags: [projects]
      summary: List a project's channels
      description: |
        `general` first, then the others by name, archived ones included. A
        project has at most 20, and `general` always, even before it is
        first written (version 0). Each says who answers an untagged
        message in it.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    maxItems: 20
                    items: {$ref: "#/components/schemas/ChannelView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createChannel
      tags: [projects]
      summary: Add a channel to a project
      description: |
        A channel's name is lower case letters, digits and dashes, never
        changes, and is unique in the project. A `default` must be able to
        answer in the project (400). It needs ownership of the project, and
        the workspace and company projects need `projects:govern` as well.
        Past 20 channels, 429.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/channels/{channel}:
    put:
      operationId: updateChannel
      tags: [projects]
      summary: Change a channel's title, purpose, default and Slack binding
      description: |
        The body replaces those four as a whole: one left out is cleared,
        except a default the caller was not shown, one naming an agent that
        lives in a project they may not read, which is kept. Naming such an
        agent is 400, in the words for one that does not exist.
        `version` is the one the caller read (`general` reads 0 until it is
        first written), so a change made since answers 409. A field the
        platform file sets answers 409. It needs ownership of the project.
        `slack` binds it to a Slack channel of a Slack client in the
        workspace (400 for anything else); a Slack channel bound elsewhere
        answers 409.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {$ref: "#/components/parameters/ChannelName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelUpdate"}
      responses:
        "200":
          description: The channel as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: archiveChannel
      tags: [projects]
      summary: Archive a channel
      description: |
        The channel and its threads stay, and it takes no new threads.
        `general` cannot be archived (409), nor can a channel the platform
        file declares. It needs ownership of the project.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {$ref: "#/components/parameters/ChannelName"}
      responses:
        "204":
          description: Archived.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/experts:
    get:
      operationId: getProjectExperts
      tags: [projects]
      summary: List who a project names as experts, by topic
      description: |
        Experts are found along the chain: for a topic, the nearest project
        that lists someone for it answers, then the projects above it.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's experts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectExperts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      deprecated: true
      operationId: updateProjectExperts
      tags: [projects]
      summary: Replace a project's experts
      description: |
        At most 50, each a person's subject or `role:<name>` with 1 to 8
        topics. `version` is the project's, as read; a change made since
        answers 409, as does a list the platform file sets. It needs
        ownership of the project, and the workspace and company projects
        need `projects:govern` as well.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectExperts"}
      responses:
        "200":
          description: The experts as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectExperts"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/context:
    get:
      operationId: getProjectContext
      tags: [projects]
      summary: Preview the layers composed for a turn
      description: |
        Uses the live turn composer. Hidden project layers are omitted.
        Source names require knowledge:read. Skills are available choices,
        sent only when a message names them. Budgets are character caps on
        layer content, or item caps for knowledge and skills, not token estimates.
        The agent system prompt is the current revision, sent separately
        by the runtime. A zero budget means no extra composer cap. The
        conversation, retrieved documents and runtime compaction depend on the turn.
        System prompt previews show at most 32,000 characters; source name
        previews show at most 128 names and 16,000 name characters.
        preview_omitted distinguishes display truncation from runtime omissions.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - in: query
          name: agent
          required: true
          schema: {type: string, minLength: 1, maxLength: 63}
        - in: query
          name: channel
          schema: {type: string, maxLength: 63}
      responses:
        "200":
          description: Ordered layers for the selected agent and channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectContext"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/projects/{name}/knowledge:
    get:
      operationId: getProjectKnowledge
      tags: [projects]
      summary: Read the knowledge sources a project names, and what a run filed in it is grounded in
      description: |
        A run filed in a project is grounded in the knowledge sources its
        project names, then each project above it, nearest first, besides
        its agent's own: `given`, each source once, from the nearest project
        that names it, at most 16. A sibling's or a sub-project's are never
        given. They are fixed when the run is accepted, so a later change
        here does not change a run already working. A caller without
        `knowledge:read` is shown no source.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's knowledge sources.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectKnowledge"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: setProjectKnowledge
      tags: [projects]
      summary: Replace the knowledge sources a project names
      description: |
        At most 8, named once, each newly named a knowledge source the
        workspace has (400); one already named may stay after it is deleted,
        and grounds nothing. Every run filed here and below from now on is grounded in
        them; a run already working keeps what it was accepted with. It
        needs ownership of the project and `knowledge:read`
        (403), which reads the sources anyway; the workspace and company
        projects need `projects:govern` as well. `version` is the project's,
        as read; a change made since answers 409, as does a list the
        platform file sets.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectKnowledgeInput"}
      responses:
        "200":
          description: The project's knowledge sources as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectKnowledge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/skills:
    get:
      operationId: getProjectSkills
      tags: [projects]
      summary: Read the skills a project declares, and what a message posted in it can name
      description: |
        A skill is named instructions an agent can be told to use: a person
        writes `$<name>`, or `@skill:<name>`, in a message, and the runs the
        message starts are given the skill's instructions as part of the
        turn. A message posted in a project can name the skills its project
        declares, then each project's above it, nearest first: `offered`,
        each name once, from the nearest project that declares it, at most
        128. A sibling's or a sub-project's are never offered. They are fixed
        when a run is accepted, so a later change here does not change a run
        already working.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's skills.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectSkills"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: setProjectSkills
      tags: [projects]
      summary: Replace the skills a project declares
      description: |
        At most 32, each name once (400). A message posted here and below can
        name them from now on; a run already working keeps what it was
        accepted with. It needs ownership of the project; the workspace and
        company projects need `projects:govern` as well. `version` is the
        project's, as read; a change made since answers 409, as do skills the
        platform file declares.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectSkillsInput"}
      responses:
        "200":
          description: The project's skills as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectSkills"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/members:
    get:
      operationId: getProjectMembers
      tags: [projects]
      summary: Read who holds a role in a project, and who owns it from above
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's members.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectMembers"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: setProjectMembers
      tags: [projects]
      summary: Replace who holds a role in a project
      description: |
        It needs ownership of the project. A list with no `*` entry makes
        the project members only: read by its members alone, and by
        `projects:govern`. A company project keeps one of at least member,
        no project is more open than its parent or less open than a child,
        and a members-only project never sits under one everyone owns (400).
        The workspace and company projects need `projects:govern`; a list
        the platform file sets answers 409.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectMembersInput"}
      responses:
        "200":
          description: The project's members as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectMembers"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/move:
    post:
      operationId: moveProject
      tags: [projects]
      summary: Put a project, and everything under it, under another parent
      description: |
        It needs ownership of the project and membership of the new parent.
        400 for a parent inside the project, past four levels, archived, or
        one that breaks a kind or openness rule; 403 without `billing:write`
        for leaving a project that holds a limit, or for moving one that
        holds (or has below it) a limit an owner set that the caller could
        not change before, since a move never escapes a limit; 409 for a stale version, a parent the platform file
        sets, or anything below it that would lose an agent it is available
        to now: a project's, a channel's or a thread's default, an agent that
        lives there, or a schedule filed there. The error names each. The
        workspace cannot move.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectMove"}
      responses:
        "200":
          description: The project where it now sits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/limits:
    put:
      operationId: setProjectLimit
      tags: [projects]
      summary: Set a tighten-only limit on a project, as an owner of a project above it
      description: |
        For an owner of a project above this one, without `billing:write`.
        The limit is written with `authority: owner`. It only tightens: one
        looser than any limit over it is 400, naming the scope that binds. A
        limit an admin set is 409, and changes with `billing:write` on
        `PUT /api/policies`. The workspace's own limits are 403 here.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectLimitInput"}
      responses:
        "200":
          description: The limit as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteProjectLimit
      tags: [projects]
      summary: Remove a limit an owner of a project above set
      description: A limit an admin set is 409; a project with none is 404.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/projects/{name}/inbox:
    get:
      operationId: getProjectInbox
      tags: [projects]
      summary: Page a project's inbox, newest first
      description: |
        Every inbox message filed in the project (`source.project`), and with
        `children=true` in the projects below it too: alerts, failures,
        questions, results, files, proposed notes, mentions and announcements. Everyone
        who can see the project reads it, so an announcement here reaches
        every reader, member or not; a message addressed to someone in
        particular still reaches only them, and each kind still needs its
        own permission. A client's machine is shown its own client's
        receipts (`deliveries`), and nobody else any, so a Slack app catches
        up here on the announcements it may have missed. `next` is the cursor
        for the page after this one, or null at the end.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - name: kind
          in: query
          description: Only messages of these kinds. Repeat it for several.
          schema:
            type: array
            items: {type: string, enum: [alert, failure, memory, budget, approval, clarification, result, artifact, mention, announcement, source, operation]}
          style: form
          explode: true
        - name: children
          in: query
          description: "`true` takes in the projects below it."
          schema: {type: string, enum: ["true", "false"]}
        - name: state
          in: query
          description: Defaults to `open`.
          schema: {type: string, enum: [open, all]}
        - name: limit
          in: query
          description: Page size, 30 when left out.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [messages, next]
                properties:
                  messages:
                    type: array
                    maxItems: 200
                    items: {$ref: "#/components/schemas/InboxMessage"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/announcements:
    post:
      operationId: postAnnouncement
      tags: [projects]
      summary: Post an announcement in a project's inbox
      description: |
        It needs at least the role the project lets announce (`announce`,
        owner when it names none). It reaches the members of the project and
        of every project below it, read as one message, never a copy per
        person: each reader hides or snoozes only their own copy. Its text is
        plain, and surfaces escape mention syntax before showing it. A
        project posts at most 20 a day and a workspace 200 (429).
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AnnouncementInput"}
      responses:
        "201":
          description: The announcement.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/announcements/{id}:
    delete:
      operationId: withdrawAnnouncement
      tags: [projects]
      summary: Withdraw an announcement for everyone
      description: |
        Its author or an owner of the project withdraws it. An id that is not
        an announcement in this project is 404.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {name: id, in: path, required: true, description: The announcement's id., schema: {type: string}}
      responses:
        "204":
          description: Withdrawn.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/skills:
    get:
      operationId: listSkills
      tags: [projects]
      summary: List the skills a message posted in a project can name
      description: |
        The project's own skills first, then each project's above it, nearest
        first, each name once, at most 128, without their instructions: what
        the console completes after `$`. A project the caller cannot see
        answers 404, as one that does not exist.
      x-permission: projects:read
      parameters:
        - name: project
          in: query
          description: The project a message is posted in; `~`, or left out, for the workspace.
          schema: {type: string, maxLength: 63}
      responses:
        "200":
          description: The skills.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [skills]
                properties:
                  skills:
                    type: array
                    maxItems: 128
                    items: {$ref: "#/components/schemas/ProjectSkillRef"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/mentions:
    get:
      operationId: listMentions
      tags: [projects]
      summary: List the mention kinds, or complete one kind's items
      description: |
        Without `kind`, the kinds of `@<kind>:<name>` a message can use: the
        built-in `sme` (experts) and `skill` (skills) first, then the ones the
        workspace's Platform document declares. With `kind`, the items it
        completes to where a message is posted in `project`, whose name
        starts with `q`, ignoring case, by name, at most 20: the topics the
        project's chain has experts for, the skills it offers, the roles it
        names, or people in the directory, which takes `people:read` as well
        (without it the list is empty). A kind the workspace does not have,
        or a project the caller cannot see, answers 404.
      x-permission: projects:read
      parameters:
        - name: project
          in: query
          description: The project a message is posted in; `~`, or left out, for the workspace.
          schema: {type: string, maxLength: 63}
        - name: kind
          in: query
          description: The kind to complete.
          schema: {type: string, maxLength: 32}
        - name: q
          in: query
          description: What the item's name starts with. Needs `kind`.
          schema: {type: string, maxLength: 100}
      responses:
        "200":
          description: The kinds, or one kind's items.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  kinds:
                    description: The mention kinds, when no kind was asked for.
                    type: array
                    maxItems: 18
                    items: {$ref: "#/components/schemas/MentionKind"}
                  items:
                    description: The kind's items, when a kind was asked for.
                    type: array
                    maxItems: 20
                    items: {$ref: "#/components/schemas/MentionItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: Page the workspace's directory of people, by handle
      description: |
        Everyone who signed in, every person a client maps, and every
        subject the policy grants a role to (unless tenants come from a
        claim, since a grant names no tenant), at most 5,000 a workspace.
        `next` is the cursor for the page after this one, or null at the
        end; pass it back as `before`.
      x-permission: people:read
      parameters:
        - name: q
          in: query
          description: Keeps people whose name or handle holds it, ignoring case. Subjects are not searched.
          schema: {type: string, maxLength: 100}
        - name: limit
          in: query
          description: Page size, 50 when left out.
          schema: {type: integer, minimum: 1, maximum: 50}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [people, next]
                properties:
                  people:
                    type: array
                    maxItems: 50
                    items: {$ref: "#/components/schemas/Person"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/people/{handle}/photo:
    get:
      operationId: getPersonPhoto
      tags: [people]
      summary: The photo a person uploaded for themselves
      description: Served by Humagen, never fetched from elsewhere. 404 for someone with none.
      x-permission: people:read
      parameters:
        - {$ref: "#/components/parameters/PersonHandle"}
      responses:
        "200":
          description: The picture, as the type Humagen found its bytes to be.
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/policies:
    get:
      operationId: listPolicies
      tags: [billing]
      summary: List the workspace's limits
      description: |
        A limit on an agent or a project the caller may not read is left
        out, as if it did not exist.
      x-permission: billing:read
      responses:
        "200":
          description: One policy per scope that has one.
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items: {$ref: "#/components/schemas/Policy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: putPolicy
      tags: [billing]
      summary: Set the limits for one scope
      description: |
        Creates the scope's policy or writes its next version. The project,
        agent or client the scope names must exist. A narrower scope can only
        tighten what a wider one allows.
      x-permission: billing:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PolicyInput"}
      responses:
        "200":
          description: The policy as saved, with its new version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deletePolicy
      tags: [billing]
      summary: Remove the limits for one scope
      description: The scope is named in the query, not in a body.
      x-permission: billing:write
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [tenant, project, agent, client]}
        - name: name
          in: query
          description: The project, agent or client. Empty for the tenant scope.
          schema: {type: string}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/policies/history:
    get:
      operationId: listPolicyHistory
      tags: [billing]
      summary: List every change made to the workspace's limits
      description: |
        Changes to a limit on an agent or a project the caller may not read
        are left out.
      x-permission: billing:read
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: {$ref: "#/components/schemas/PolicyChange"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/usage:
    get:
      operationId: getUsage
      tags: [billing]
      summary: Report usage against every limit, for the current period
      description: |
        One entry per policy the caller may read: a limit on an agent or a
        project they may not read is left out. A workspace with no policies
        has no entries.
        `state` is the worst of the enforced limits (runs and concurrency).
        Spend is recorded and not enforced, and `spend.metered` is false,
        because the runtime reports no cost.
      x-permission: billing:read
      responses:
        "200":
          description: Where each scope stands.
          content:
            application/json:
              schema:
                type: object
                required: [scopes]
                properties:
                  scopes:
                    type: array
                    items: {$ref: "#/components/schemas/ScopeUsage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/usage/notices:
    get:
      operationId: listUsageNotices
      tags: [billing]
      summary: List recent refusals and warnings from the usage ledger
      description: |
        Of the 200 most recent, those the caller may read: a notice about a
        run filed in a project they may not read, an agent they may not
        read, or a limit on either, is left out.
      x-permission: billing:read
      responses:
        "200":
          description: The notices.
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items: {$ref: "#/components/schemas/UsageEntry"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List the workspace's clients and how many it may have
      x-permission: clients:read
      responses:
        "200":
          description: The clients. No response ever carries a secret.
          content:
            application/json:
              schema:
                type: object
                required: [clients, caps]
                properties:
                  clients:
                    type: array
                    items: {$ref: "#/components/schemas/ClientView"}
                  caps: {$ref: "#/components/schemas/ClientCaps"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      description: |
        A workspace at its cap of clients answers 429 with a plain error
        body. Every agent the client names, as its default, in its list, for
        a bot or for an auto-label, is an agent that exists and that the
        caller may read; any other is 400, in the same words whether it does
        not exist or lives in a project the caller may not read.
      x-permission: clients:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInput"}
      responses:
        "201":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooMany"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/clients/{id}/bindings:
    get:
      operationId: listClientBindings
      tags: [clients]
      summary: List the Slack channels a client is bound to
      description: |
        Each Slack channel and the channel it is bound to here, by Slack
        channel, at most 200. A binding in a project the caller may not read
        is left out.
      x-permission: clients:read
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "200":
          description: The bindings.
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    maxItems: 200
                    items: {$ref: "#/components/schemas/ClientBinding"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      x-permission: clients:read
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateClient
      tags: [clients]
      summary: Replace a client's record
      description: |
        A secret left out is kept, and so is a home in a project the caller
        may not read, which they are not shown: naming none keeps it, and
        naming one they may read replaces it. The agents it names that the
        caller is not shown are kept the same way: its default unless they
        name another, its list unless they write `*`, its bots and its
        auto-labels unless they map the same bot or label, and an agent it
        routed to stays one it routes to. Every other agent named is one that
        exists and that the caller may read, or one the record already holds
        (400 otherwise, as on create). A client the server's configuration
        owns cannot be changed here and answers 409.
      x-permission: clients:write
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInput"}
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      x-permission: clients:write
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}

