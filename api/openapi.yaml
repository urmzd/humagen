        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: removeKnowledgeDocument
      tags: [knowledge]
      summary: Remove a document from a source
      x-permission: knowledge:write
      parameters:
        - {$ref: "#/components/parameters/SourceName"}
        - {$ref: "#/components/parameters/DocumentID"}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/knowledge/{name}/variants:
    post:
      operationId: saveKnowledgeVariant
      tags: [knowledge]
      summary: Save the source's current exclusions as a named view
      x-permission: knowledge:write
      parameters:
        - {$ref: "#/components/parameters/SourceName"}
