        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.call}
            body: {$ref: "#/components/schemas/ToolCallPayload"}
    ManifestToolDoneEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.done}
