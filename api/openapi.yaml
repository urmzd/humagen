        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.completed}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunFailedEvent:
      allOf:
        - $ref: "#/components/schemas/ManifestEventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.failed}
            body: {$ref: "#/components/schemas/LifecyclePayload"}
    ManifestRunStoppedEvent:
