openapi: 3.2.0
info:
  title: Warp API
  version: 0.1.0
  summary: The HTTP contract of the warp agent platform.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The JSON API, the event stream and the sign-in routes served by
    `internal/httpapi`. This file is the contract every surface codes against.
    `internal/httpapi/openapi_test.go` fails when it and the server disagree,
    and `packages/client` is generated from it. See `docs/api.md`.

    ## Rules that hold for every `/api` route

    - The tenant comes from the caller's credential. No request names one, and
      another tenant's object answers 404, never 403.
    - Every route checks one permission, recorded here as `x-permission`.
      `authenticated` means any signed-in caller. `public` means no credential.
    - A request body is JSON, at most 1 MiB, and must not carry a field the
      route does not know: an unknown field answers 400.
    - An error is `{"error": "..."}` with the status saying what kind. A run a
      limit refused answers 429 or 402 with a larger body, see `Refusal`.
    - A state-changing request that a browser sends from another origin is
      refused with a plain-text 403 before it reaches a handler. Bearer
      callers are not browsers and are unaffected.

    ## Not part of this contract

    `POST /connectors/github`, `POST /connectors/slack` and
    `POST /connectors/slack/commands` are signed webhook ingress. Slack and
    GitHub call them, authenticated by a client's signing secret, and no API
    client should. They are described in `docs/clients.md`.
servers:
  - url: http://127.0.0.1:8080
    description: A local server started with `make dev`.
tags:
  - name: health
    description: Liveness.
  - name: auth
    description: Browser sign-in and sign-out.
  - name: session
    description: Who the caller is.
  - name: agents
    description: Agent definitions, their revisions and what they remember.
  - name: runs
    description: Runs, the calls between them, and what each recorded.
  - name: threads
    description: Conversations, which are trees of runs.
  - name: events
    description: The live event stream.
  - name: inbox
    description: Messages that want a person's attention, and resolving them.
  - name: schedules
    description: Cron schedules that raise runs.
  - name: projects
    description: |
      The workspace's tree of projects. The workspace itself is the root,
      written `~` in a path, and every other project sits under it, at most
      four levels down. A project files conversations, schedules, alert rules
      and limits under its name, and carries instructions and shared memory
      every agent answering in it or below it is sent. Its limits hold
      everything below it.
  - name: people
    description: |
      The directory: who is in the workspace, by name, handle, picture and
      roles, from sign-ins, the Slack people a client maps and the policy's
      subject grants. No email address is shown: a subject that holds one
      is left out, and subjects are not searched.
  - name: settings
    description: Workspace settings.
  - name: preferences
    description: The caller's own settings and picture.
  - name: artifacts
    description: Files agents published, and how much is stored.
  - name: observe
    description: Analytics and the journal.
  - name: alerts
    description: Alert rules and the alerts they fired.
  - name: evals
    description: Deterministic eval suites and their runs.
  - name: knowledge
    description: Knowledge sources, documents and search.
  - name: billing
    description: Limits (policies) and usage against them.
  - name: clients
    description: The Slack apps and GitHub installations a workspace answers through.
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      x-permission: public
      security: []
      responses:
        "200":
          description: The server is up. The body is the text `ok`.
          content:
            text/plain:
              schema: {type: string}

  /auth/login:
    get:
      operationId: startLogin
      tags: [auth]
      summary: Start a browser sign-in
      description: |
        Redirects to the identity provider (authorization code flow with
        PKCE) and sets a short-lived `warp_login` cookie. Under
        development auth it redirects straight to `/`. A browser navigates
        here; a script has no use for it.
      x-permission: public
      security: []
      parameters:
        - name: return_to
          in: query
          description: A local path to land on after sign-in. Anything else becomes `/`.
          schema: {type: string}
      responses:
        "302":
          description: Redirect to the identity provider.
  /auth/callback:
    get:
      operationId: finishLogin
      tags: [auth]
      summary: Finish a browser sign-in
      description: |
        The identity provider redirects here. On success it sets the
        `warp_session` cookie (`__Host-warp_session` over https),
        HttpOnly, SameSite=Lax, valid for 8 hours, and redirects to the
        `return_to` path. Errors are plain text, not JSON.
      x-permission: public
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302":
          description: Signed in. Redirect to where sign-in started.
        "400":
          description: The sign-in was not started from this browser, or expired.
          content:
            text/plain:
              schema: {type: string}
        "403":
          description: The identity provider refused, or the sign-in could not be verified.
          content:
            text/plain:
              schema: {type: string}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the browser session
      description: Forgets the session and clears the cookie. Succeeds without a session too.
      x-permission: public
      security: []
      responses:
        "204":
          description: Signed out.

  /api/me:
    get:
      operationId: getMe
      tags: [session]
      summary: The caller and what they may do
      x-permission: authenticated
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/access/explain:
    get:
      operationId: explainAccess
      tags: [session]
      summary: Why the caller may or may not do one thing
      description: >-
        Decides one permission for the caller and says why: the rule that
        decided, the role it reached them through, and the grant that gave
        that role when the sign-in kept it. It is only ever about the caller;
        there is no way to name another person.
      x-permission: authenticated
      parameters:
        - {name: permission, in: query, required: true, description: "The permission to explain, one of Permission, such as runs:read.", schema: {type: string}}
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccessDecision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      description: The latest revision of every agent in the workspace. Not paged.
      x-permission: agents:read
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents, builtin, homes, enabled_in]
                properties:
                  agents:
                    type: array
                    items: {$ref: "#/components/schemas/Revision"}
                  builtin:
                    description: Names of the agents the platform provides, which cannot be edited.
                    type: array
                    items: {type: string}
                  homes:
                    description: |
                      Where each agent that lives in a project lives, by agent.
                      Such an agent is available there and below, and nowhere
                      else. An agent not listed is a platform agent.
                    type: object
                    additionalProperties: {type: string}
                  enabled_in:
                    description: |
                      Which projects enable each agent, by agent: those whose
                      enable list names it, or holds `*` for a platform agent.
                      `~` is the workspace.
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent
      description: |
        A tag names an agent or a person, so an agent cannot take a name a
        person in the workspace goes by ("a person goes by @dana"), nor
        `auto` or `sme`: each is 409.
      x-permission: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentSpec"}
      responses:
        "201":
          description: The agent's first revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}:
    put:
      operationId: reviseAgent
      tags: [agents]
      summary: Revise an agent
      description: |
        Writes a new revision. `expected_rev` is the revision the caller
        edited from: if someone else revised the agent since, the answer is 409.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec, expected_rev]
              properties:
                spec: {$ref: "#/components/schemas/AgentSpec"}
                expected_rev: {type: integer}
      responses:
        "200":
          description: The new revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/home:
    put:
      operationId: setAgentHome
      tags: [agents]
      summary: Make an agent live in a project
      description: |
        An agent that lives in a project is available there and in every
        project below it, and nowhere else: `*` never reaches it, and it is
        not available in the workspace itself. An empty `project`, or `~`,
        makes it a platform agent again, available wherever it is enabled.

        Refused with 409, naming them, while something outside the new home
        would lose the agent: a project's default, enable or allow list, a
        schedule filed elsewhere, an alert rule watching it elsewhere, or a
        client that routes to it. Homing an agent into or out of a company
        project needs `projects:govern`. The platform's own agents live
        nowhere (400).
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  description: The project it lives in. Empty or `~` for none.
                  type: string
                  maxLength: 63
      responses:
        "200":
          description: Where the agent now lives, and which projects enable it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentHome"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/history:
    get:
      operationId: listAgentRevisions
      tags: [agents]
      summary: List an agent's revisions, newest first
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: Every revision.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: {$ref: "#/components/schemas/Revision"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/call-policy:
    get:
      operationId: getCallPolicy
      tags: [agents]
      summary: Read which agents may call an agent
      description: |
        The agent's stored call policy, or the default an agent with none has
        (`version` 0): any caller its own spec allows, without approval. 404
        for an agent that does not exist in the caller's workspace.
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: The call policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallPolicy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: putCallPolicy
      tags: [agents]
      summary: Set which agents may call an agent, and which calls a person approves
      description: |
        Replaces the agent's call policy. The callee decides: a caller also
        needs the callee in its own spawn allowlist, so a policy can only
        narrow what callers' specs allow. An unknown mode, an agent name that
        does not exist, more than 100 callers or 32 approvers, or a field that does not
        apply to the chosen mode is 400.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CallPolicyInput"}
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallPolicy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/reachable:
    get:
      operationId: listReachableAgents
      tags: [agents]
      summary: List which agents an agent may call, and why
      description: |
        For the agent in the path as a caller, every other agent in the
        workspace: whether its call policy admits the caller, whether the
        caller's spec lists it, and whether a call needs a person's approval.
        At most 500 agents; `truncated` says there are more.
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: One entry per other agent.
          content:
            application/json:
              schema:
                type: object
                required: [agents, truncated]
                properties:
                  agents:
                    type: array
                    items: {$ref: "#/components/schemas/Reach"}
                  truncated: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/memory:
    get:
      operationId: listAgentMemory
      tags: [agents]
      summary: List what an agent remembers
      description: |
        An agent's own notes. A project's are read and changed through its
        own routes (`listProjectMemory`), so a name that is no agent's, a
        project's memory owner such as `project:News` among them, is 404 here
        and on every agent memory route.
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: The agent's notes, approved and pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: addAgentMemory
      tags: [agents]
      summary: Write a note an agent is sent with every turn
      description: A note a person writes is approved at once. A note carrying personal data is refused with 400.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteInput"}
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/memory/approve:
    post:
      operationId: approveAgentMemory
      tags: [agents]
      summary: Approve proposed notes
      description: Keeps the proposals named. The rest stay pending.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteSelection"}
      responses:
        "200":
          description: How many were approved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approved"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/memory/{id}:
    delete:
      operationId: removeAgentMemory
      tags: [agents]
      summary: Remove a note
      description: An agent that does not exist, or a note that is not its own, is 404.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
        - {name: id, in: path, required: true, description: The note's id., schema: {type: string}}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/memory/pending:
    get:
      operationId: listPendingMemory
      tags: [agents]
      summary: List every proposed note waiting for approval
      x-permission: agents:read
      responses:
        "200":
          description: The proposals. Each is for an agent or for a project.
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: {$ref: "#/components/schemas/MemoryProposal"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/pick:
    get:
      operationId: pickAgent
      tags: [agents]
      summary: Preview which agent @auto would pick for a message
      description: |
        `@auto` picks among the agents available in the project by the words
        of the message. With no match it hands the message to the nearest
        default on the project's chain that names an agent, and with none it
        answers 409, "no agent fits; tag one". Nothing is started.
      x-permission: agents:read
      parameters:
        - {name: q, in: query, required: true, description: The message., schema: {type: string}}
        - name: project
          in: query
          description: Where the message is posted. Empty or `~` is the workspace itself.
          schema: {type: string, maxLength: 63}
      responses:
        "200":
          description: The agent and why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Choice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List recent runs
      description: The 200 most recent runs in the workspace, newest first. Not paged.
      x-permission: runs:read
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createRun
      tags: [runs]
      summary: Send a message and start the run that answers it
      description: |
        Starts a conversation, or continues one when `after` names a turn.
        The run is accepted, not finished: follow it on the event stream at
        topic `agent:<agent>:<id>`, or poll `getRun`.

        Send `Idempotency-Key` to make a retry safe. The run's `tag_id` is
        then `api-<length of subject in bytes>-<subject>-<key>`, its `id` is
        derived from that and the workspace (`r` and 32 hex digits, as
        fiber's `runtime.RunID`), and a second request with the same key
        from the same caller joins the run the first one started instead of
        starting another. Without it the ids are random.

        A conversation filed in a project that was deleted since is read,
        not continued: its next turn answers 409, since nothing says any more
        which projects above it the run would count toward.

        The body takes no metadata: an unknown field answers 400.

        Nothing routes on its own. With `agent` left out, the default the
        conversation's place inherits answers, the first set of: the
        thread's (`updateThread`), the acting client's when `act_as` names
        one, the channel's (a new conversation is in `general` of its
        project), then the project's, each ancestor's nearest first, and the
        workspace's. With none set it is 409, "tag an agent". `auto` is
        `@auto`, which for a person a client acts for picks only among the
        agents that client may route to. An agent not available in the
        conversation's project, or a default that has stopped being
        available there, is 403.

        A follow-up is filed in its conversation's channel. When it follows
        a turn in a shared thread people have posted in, it is sent the room
        up to that turn, people's messages by name and agents' answers by
        theirs, and it is part of the room the agents answering the next
        message are sent.
      x-permission: runs:write
      parameters:
        - name: Idempotency-Key
          in: header
          description: A caller-chosen key. The same key from the same caller joins the same run.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRunRequest"}
      responses:
        "202":
          description: The run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/tree:
    get:
      operationId: getRunTree
      tags: [runs]
      summary: Get a run and every run under the same root
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The tree, flattened. `parent` and `depth` give its shape.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/calls:
    post:
      operationId: createCall
      tags: [runs]
      summary: Call another agent from a run
      description: |
        Starts a child run of the run in the path. The caller's agent must be
        allowed to spawn the target, and depth, fan-out and lease limits apply.
        `key` is the call's idempotency key within the run.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateCallRequest"}
      responses:
        "202":
          description: The child run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "402": {$ref: "#/components/responses/Refused"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/stop:
    post:
      operationId: stopRun
      tags: [runs]
      summary: Ask a run, and everything attached to it, to stop
      description: |
        The request goes to the runtime, which cancels the model call in
        flight and ends the run with `lifecycle.stopped`. Runs attached to it
        are asked too. Runs it delegated keep going.

        It does not wait for the run. From the moment it is asked, the run is
        `stopping` and starts no further calls. It then ends `stopped`, with
        `answer` holding what it had said and `cause` why, or `completed` or
        `failed` if its turn finished before the request took effect. A run is
        never reported stopped and then completed.

        Asking a run that has ended changes nothing and answers 200 with the
        run as it stands, so asking twice is safe. Another workspace's run
        answers 404.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The run has ended, and is returned as it stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: The run was asked to stop and has not ended yet. `stopping` is true.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503":
          description: |
            The runtime cannot interrupt a run. The run is still marked
            `stopping`, so it starts nothing more, and it ends as its own
            events say.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
  /api/runs/{id}/questions/{question}/answer:
    post:
      operationId: answerQuestion
      tags: [runs]
      summary: Answer the question a run is waiting on
      description: |
        A run parks on a person to approve a tool call (`approve` or `deny`,
        optionally with edited `arguments` for an approval), to choose one of
        some options (`choose` with `choice`), or to reply in words (`reply`
        with `text`). The question is on the run as `question`, on its stream
        as `lifecycle.parked`, and in the inbox as a message addressed to the
        people who may answer it. Answering here is the same as resolving that
        message's part, and returns the message.

        Who may answer is decided from the run's pinned revision: the spec's
        `approvers` or `answerers` when it names them, else anyone in the
        workspace, and never the person whose request raised a call they are
        asked to approve, unless the spec sets `self_approval`. Anyone else is
        403 and nothing changes. A surface that authenticated a person itself
        answers for them with `act_as`: only the credential its client names,
        and only for a person its client maps.

        The first answer recorded is the answer. An answer after it, or after
        the question expired or its run was stopped, answers 200 with the
        message showing what was recorded. Another workspace's run is 404.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/RunID"}
        - {name: question, in: path, required: true, description: "The question's id: `question.id` on the run.", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionAnswer"}
      responses:
        "200":
          description: The question's message, settled with the answer that was recorded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/trace:
    get:
      operationId: getRunTrace
      tags: [runs]
      summary: Get a run's tree with the spans inside each run
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The runs and their spans, rebuilt from the journal.
          content:
            application/json:
              schema:
                type: object
                required: [runs, spans]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
                  spans:
                    type: array
                    items: {$ref: "#/components/schemas/Span"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/events:
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: List a run's events as they were published
      description: |
        Oldest first, in the same shape the event stream sends, for showing a
        run that is no longer streaming. `complete` is false when the journal
        no longer holds the run's first event.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The events the journal still holds.
          content:
            application/json:
              schema:
                type: object
                required: [events, complete]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/RunEvent"}
                  complete: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/manifest:
    get:
      operationId: getRunManifest
      tags: [runs]
      summary: Export everything recorded about a run and the runs under it
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: One document, with every event's body decoded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Manifest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: Page conversations, most recently active first
      description: |
        `next` is the cursor for the page after this one, or null at the end.
        Pass it back as `before`. A cursor is opaque and belongs to the server
        that issued it.
      x-permission: runs:read
      parameters:
        - name: limit
          in: query
          description: Page size. Defaults to 200, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: agent
          in: query
          description: Only conversations this agent took part in.
          schema: {type: string}
        - name: origin
          in: query
          description: Only conversations raised by this trigger, such as `api`, `slack` or `cron`.
          schema: {type: string}
        - name: standing
          in: query
          description: Only conversations with a run in flight, or with a failed run.
          schema: {type: string, enum: [running, failed]}
        - name: project
          in: query
          description: |
            Only conversations filed in this project, its sub-projects' left
            out. `~` is the workspace: conversations filed in no project. A
            project the workspace does not have answers 404.
          schema: {type: string, maxLength: 63}
        - name: within
          in: query
          description: |
            Only conversations filed in this project or in any project below
            it. `~` is the whole workspace. With `project` as well, a
            conversation is kept only when both keep it.
          schema: {type: string, maxLength: 63}
        - name: channel
          in: query
          description: |
            Only conversations in this channel of their project. A
            conversation from before threads is in `general`.
          schema: {type: string, maxLength: 40}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [threads, next]
                properties:
                  threads:
                    type: array
                    items: {$ref: "#/components/schemas/ThreadSummary"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: startThread
      tags: [threads]
      summary: Start a shared thread in a project's channel, with its first message
      description: |
        The message is posted as the caller, or as the person `act_as` names
        through a client that maps them; no field names an author, and a
        credential acting for nobody is refused (403). What the message
        starts follows the tag rules: the agents it tags answer, at most 3;
        tagging only people or experts notifies them; posted only, nothing
        answers; otherwise the default the thread inherits answers. A
        `private` thread is refused (409) until reads are confined. A
        `default` must be able to answer in the project (400).

        A workspace holds at most 10,000 threads and a project 2,000, a
        conversation from before threads counting once its record is written
        (429). A person posts at most 30 messages a minute, here and in
        `postThreadMessage`, and a project takes at most 120 (429). One
        message notifies at most 20 people and roles; a tag it reaches nobody
        for is in `refused`.
      x-permission: runs:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadInput"}
      responses:
        "201":
          description: The thread, its first message and what it started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadPosted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}:
    get:
      operationId: getThread
      tags: [threads]
      summary: Read a thread and one page of its turns
      description: |
        A thread's turns are its people's messages and its agents' runs, in
        the order they were made, oldest first. A run that answers a message
        names it in `message`; runs answering one message answer it side by
        side and are not branches. A conversation from before threads reads
        as shared, in `general` of its project, at version 0, and its id is
        the id of the run that started it.

        The first page is the newest 200 turns, or `limit`. `next` is the
        cursor for the turns before them, or null at the start: pass it back
        as `before`. `answers` is who answers an untagged message here.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: limit
          in: query
          description: Page size. Defaults to 200, and is at most 200.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: The thread and one page of its turns.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateThread
      tags: [threads]
      summary: Change a thread's title, visibility and default
      description: |
        The body replaces those three as a whole: one left out is cleared.
        `version` is the one the caller read (0 for a conversation from
        before threads, whose record this writes), so a change made since
        answers 409. `private` is refused (409) until reads are confined. A
        `default` must be able to answer in the thread's project (400).
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadUpdate"}
      responses:
        "200":
          description: The thread as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Thread"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}/messages:
    post:
      operationId: postThreadMessage
      tags: [threads]
      summary: Post a message in a thread
      description: |
        Posted as the caller, or as the person `act_as` names through a
        client that maps them, as for `startThread`. `after` is the turn it
        follows: a message of the thread, a run answering one, or in a
        conversation from before threads one of its runs; left out, it
        follows the latest. `answers` records the message as a question's
        answer, which resumes the run parked on it; who may answer is
        checked as on every other path, and a refused answer posts nothing.
        An answer, like a reply, starts no run. A thread holds at most 5,000
        messages: past that, 409 "start a new thread". The rates and caps of
        `startThread` hold here too (429).
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadMessageInput"}
      responses:
        "201":
          description: The message and what it started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadPosted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}/participants:
    put:
      operationId: updateThreadParticipants
      tags: [threads]
      summary: Add and remove a thread's people and agents
      description: |
        At most 50 added and removed together, and a thread has at most 50
        participants. An agent added must be available in the thread's
        project, and a person, named by handle, must be in the workspace's
        directory (400). The person who started the thread stays in it. `version` is the one
        the caller read.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadParticipantsUpdate"}
      responses:
        "200":
          description: The thread as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Thread"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Stream the workspace's events as server-sent events
      description: |
        A long-lived `text/event-stream`. Two kinds of message arrive on it:

        - A message with no `event:` field carries one `RunEvent` as JSON.
        - A message with `event: inbox` carries one `InboxNotice` as JSON. It
          names a message and nothing more: fetch it to see what changed. A
          caller is only sent notices for kinds of message they may read.
        - A message with `event: thread` carries one `ThreadNotice` as JSON:
          a message was posted or settled in a thread, or its record changed.
          Fetch the thread to see it. Every thread is shared, so a caller who
          may read conversations is sent each.

        A comment line (`: keep-alive`) is sent every 15 seconds. Messages
        carry no `id:` field, so `Last-Event-ID` is not used: to resume, pass
        the last `seq` processed as `from`. `seq` orders events within one
        run, so `from` is only meaningful with a topic that names one run.

        The stream first replays what the bus still holds for the topic, then
        follows it live. The server ends the stream when the consumer falls
        behind, rather than feed it a gap: reconnect and resume. A run's end is
        not the stream's end, and the ledger (`getRun`) decides whether a run
        is over, not silence on the stream.

        There is no topic for one conversation. To follow a conversation,
        subscribe to `agent` and keep the events whose `run_id` is one of its
        turns.

        Note for generators: the schema below describes the JSON carried in
        each message's `data` field, which is how the oag generator reads
        `itemSchema`.
      x-permission: runs:read
      parameters:
        - name: topic
          in: query
          description: |
            What to listen to. `agent` is every agent (the default),
            `agent:<name>` one agent, `agent:<name>:<run>` one run.
          schema: {type: string}
        - name: from
          in: query
          description: Resume after this sequence number within each run.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                  - $ref: "#/components/schemas/RunEvent"
                  - $ref: "#/components/schemas/InboxNotice"
                  - $ref: "#/components/schemas/ThreadNotice"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace settings
      x-permission: agents:read
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Replace workspace settings
      description: |
        The first save records the caller as the one who set the workspace
        up. `baseline` is gone: the workspace default is the root's
        `default` (`PUT /api/projects/~/agents`), and a body that names it
        is 400.
      x-permission: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List schedules
      x-permission: schedules:read
      responses:
        "200":
          description: Every schedule, with its next fires and recent runs.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule
      description: The agent, and the project if one is named, must exist now.
      x-permission: schedules:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Schedule"}
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}:
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Change a schedule
      description: |
        Replaces the schedule's expression, agent, text, project and
        description. The name cannot change: a `name` in the body must match
        the path, or be left out. Whether the schedule is paused, who created
        it and the runs it raised are kept. The agent, and the project if one
        is named, must exist now. The whole edit is checked before anything
        changes, so a refused edit leaves the schedule as it was. An edited
        schedule starts afresh from the time of the edit: it does not catch up
        on occurrences of its new expression that fell before it.
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Schedule"}
      responses:
        "200":
          description: The schedule, as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/pause:
    post:
      operationId: pauseSchedule
      tags: [schedules]
      summary: Pause a schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "200":
          description: The schedule, paused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/resume:
    post:
      operationId: resumeSchedule
      tags: [schedules]
      summary: Resume a paused schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "200":
          description: The schedule, running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/run:
    post:
      operationId: runSchedule
      tags: [schedules]
      summary: Fire a schedule once, now
      description: The run is attributed to the caller, not to the clock, and works while the schedule is paused.
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "202":
          description: The run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: Page the caller's inbox, newest first
      description: |
        The route asks only for `runs:read`. What a caller sees, and what they
        may do with each part, is decided per message: a memory proposal needs
        `agents:read`, a failure `runs:read`, an alert or a reached limit
        `alerts:read`. `next` is the cursor for the page after this one, or
        null at the end.
      x-permission: runs:read
      parameters:
        - name: state
          in: query
          description: Defaults to `open`, or to `all` when `alert` is given.
          schema: {type: string, enum: [open, resolved, dismissed, snoozed, all]}
        - name: kind
          in: query
          description: Only messages of this kind. An unknown kind matches nothing.
          schema: {type: string, enum: [alert, failure, memory, budget, artifact, approval, clarification, result, mention]}
        - name: unread
          in: query
          description: Only `true` narrows to messages the caller has not read.
          schema: {type: string, enum: ["true"]}
        - name: alert
          in: query
          description: The message about this alert, in any state.
          schema: {type: string}
        - name: limit
          in: query
          description: Page size. Defaults to 50, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: agent
          in: query
          description: |
            Only messages about this agent: raised by it, or asking to call
            it (`source.target`). With `kind=approval` and `state=open`, the
            agent's queue of calls waiting for approval.
          schema: {type: string}
      responses:
        "200":
          description: One page, with the caller's open and unread counts.
          content:
            application/json:
              schema:
                type: object
                required: [messages, next, open, unread]
                properties:
                  messages:
                    type: array
                    items: {$ref: "#/components/schemas/InboxMessage"}
                  next: {type: [string, "null"]}
                  open: {type: integer}
                  unread: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/count:
    get:
      operationId: getInboxCount
      tags: [inbox]
      summary: Count the caller's open and unread messages
      x-permission: runs:read
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [open, unread]
                properties:
                  open: {type: integer}
                  unread: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}:
    get:
      operationId: getInboxMessage
      tags: [inbox]
      summary: Get a message and the record of what was done to it
      description: A message of a kind the caller may not read answers 404.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      responses:
        "200":
          description: The message and its history.
          content:
            application/json:
              schema:
                type: object
                required: [message, history]
                properties:
                  message: {$ref: "#/components/schemas/InboxMessage"}
                  history:
                    type: array
                    items: {$ref: "#/components/schemas/InboxChange"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/read:
    post:
      operationId: markInboxRead
      tags: [inbox]
      summary: Mark a message read or unread, for the caller only
      description: The body is required. `{}` marks the message read.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  description: Defaults to true.
                  type: [boolean, "null"]
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/dismiss:
    post:
      operationId: dismissInboxMessage
      tags: [inbox]
      summary: Set a message aside without resolving it
      description: Needs the write permission for the message's kind, checked per message.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      responses:
        "200":
          description: The message, dismissed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/snooze:
    post:
      operationId: snoozeInboxMessage
      tags: [inbox]
      summary: Hide a message until a time
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: {type: string, format: date-time}
      responses:
        "200":
          description: The message, snoozed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/parts/{part}/resolve:
    post:
      operationId: resolveInboxPart
      tags: [inbox]
      summary: Act on one part of a message
      description: |
        A part lists the actions the caller may take in `actions`. Each needs
        the permission for the thing it does, not the permission to open an
        inbox, and an action the caller lacks the permission for answers 403:

        | Part | Action | Needs |
        |------|--------|-------|
        | `alert` | `acknowledge` | `alerts:write` |
        | `failure` | `retry`, `acknowledge` | `runs:write` |
        | `memory` | `keep` (with `ids`), `discard` | `agents:write` for an agent's notes; for a project's `projects:write`, and `projects:govern` as well for the workspace's and a company project's |
        | `budget` | `raise_limit` (with `limits`) | `billing:write` |
        | `budget` | `acknowledge` | `alerts:write` |
        | `approval` | `approve` (optionally with `arguments`), `deny` | `runs:write` |
        | `choice` | `choose` (with `choice`) | `runs:write` |
        | `reply` | `reply` (with `text`) | `runs:write` |
        | `mention` | `reply` (with `text`), `done` | `runs:write` |

        A mention's `reply` posts the words in its thread as the reader,
        which starts no run, and `done` sets it aside.

        Answering a question is `answerQuestion` by another route, with the
        same rules: a person the question is not addressed to does not see
        it, and one the runtime refuses is 403. `act_as` answers for a person
        a surface authenticated. Resolving a part that is already resolved
        returns the first outcome. `retry` starts a new run, so it can be
        refused by a limit with 429 or 402, and with 409 when the turn's
        project was deleted since.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
        - {name: part, in: path, required: true, description: The part's id within the message., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Resolution"}
      responses:
        "200":
          description: The message after the action.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: Page published files, newest first
      description: The latest version of each. `next` is the cursor for the page after this one, or null at the end.
      x-permission: artifacts:read
      parameters:
        - {name: thread, in: query, description: Only files published in this conversation., schema: {type: string}}
        - {name: run, in: query, description: Only files this run published., schema: {type: string}}
        - {name: agent, in: query, schema: {type: string}}
        - {name: project, in: query, schema: {type: string}}
        - name: kind
          in: query
          schema: {type: string, enum: [document, spreadsheet, presentation, image, pdf, html, code, data, archive]}
        - {name: q, in: query, description: Matches part of a title., schema: {type: string}}
        - name: limit
          in: query
          description: Page size. Defaults to 50, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - {name: before, in: query, description: The `next` cursor of the previous page., schema: {type: string}}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [artifacts, next]
                properties:
                  artifacts:
                    type: array
                    items: {$ref: "#/components/schemas/Artifact"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Get a published file's record
      x-permission: artifacts:read
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteArtifact
      tags: [artifacts]
      summary: Delete a published file
      x-permission: artifacts:write
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/artifacts/{id}/versions:
    get:
      operationId: listArtifactVersions
      tags: [artifacts]
      summary: List every version published under the same title in the same conversation
      x-permission: artifacts:read
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/artifacts/{id}/content:
    get:
      operationId: getArtifactContent
      tags: [artifacts]
      summary: Download a published file's bytes
      description: |
        Always an attachment served as `application/octet-stream`, unless
        `inline=1` is asked for and the file is one of the inert types
        (`text/plain`, PNG, JPEG, GIF, WebP, PDF), which is then served inline
        with its own type. HTML and SVG are never served inline. The `ETag` is
        the file's SHA-256.
      x-permission: artifacts:read
      parameters:
        - {$ref: "#/components/parameters/ArtifactID"}
        - name: inline
          in: query
          description: Ask for the file's own type, inline, when it is an inert type.
          schema: {type: string, enum: ["1"]}
      responses:
        "200":
          description: The bytes.
          headers:
            Content-Disposition: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/storage:
    get:
      operationId: getStorage
      tags: [artifacts]
      summary: Report what the workspace has published against its storage limit
      x-permission: artifacts:read
      responses:
        "200":
          description: Bytes and files stored, in total and by project and agent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorageUsage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/analytics:
    get:
      operationId: getAnalytics
      tags: [observe]
      summary: Summarize runs over a window ending now
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/Window"}
        - name: bucket
          in: query
          description: A Go duration, such as `1m`. Defaults to a sixtieth of the window. At most 240 buckets are returned.
          schema: {type: string}
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Summary"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/journal:
    get:
      operationId: queryJournal
      tags: [observe]
      summary: Query what happened, newest first
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/Window"}
        - {name: agent, in: query, schema: {type: string}}
        - {name: run, in: query, schema: {type: string}}
        - {name: kind, in: query, description: "An event kind, or a family such as `delta` or `lifecycle`.", schema: {type: string}}
        - {name: origin, in: query, schema: {type: string}}
        - {name: q, in: query, description: Matches part of an entry's detail., schema: {type: string}}
        - name: limit
          in: query
          description: Defaults to 200, and is capped at 2000. A value that is not a number is read as the default.
          schema: {type: integer}
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: {$ref: "#/components/schemas/JournalEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List fired alerts
      x-permission: alerts:read
      responses:
        "200":
          description: The alerts.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/alerts/{id}/ack:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      summary: Acknowledge an alert
      description: Settles the alert's inbox message too. They are one state.
      x-permission: alerts:write
      parameters:
        - {name: id, in: path, required: true, description: The alert's id., schema: {type: string}}
      responses:
        "200":
          description: The alert, acknowledged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/alert-rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      summary: List alert rules
      x-permission: alerts:read
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: {$ref: "#/components/schemas/AlertRule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createAlertRule
      tags: [alerts]
      summary: Create an alert rule
      description: |
        `created_by` and `created_at` are set by the server, and `updated_by`
        and `updated_at` are cleared, whatever the body says. The agent and
        the project a rule is scoped to must exist now.
      x-permission: alerts:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertRule"}
      responses:
        "201":
          description: The rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/alert-rules/{name}:
    put:
      operationId: updateAlertRule
      tags: [alerts]
      summary: Replace an alert rule
      description: |
        The body is checked exactly as a new rule is. The name cannot change:
        a `name` in the body must match the path, or be left out.
        `created_by` and `created_at` are kept from the rule replaced, and
        `updated_by` and `updated_at` are set by the server. Alerts the rule
        already raised stay, and so does its cooldown.
      x-permission: alerts:write
      parameters:
        - {name: name, in: path, required: true, description: The rule's name., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertRule"}
      responses:
        "200":
          description: The rule, as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      summary: Delete an alert rule
      x-permission: alerts:write
      parameters:
        - {name: name, in: path, required: true, description: The rule's name., schema: {type: string}}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

