openapi: 3.2.0
info:
  title: Humagen API
  version: 0.1.0
  summary: The HTTP contract of the Humagen agent platform.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The JSON API, the event stream and the sign-in routes served by
    `internal/httpapi`. This file is the contract every surface codes against.
    `internal/httpapi/openapi_test.go` fails when it and the server disagree,
    and `packages/client` is generated from it. See `docs/api.md`.

    ## Rules that hold for every `/api` route

    - The tenant comes from the caller's credential. No request names one, and
      another tenant's object answers 404, never 403.
    - Every route checks one permission, recorded here as `x-permission`.
      `authenticated` means any signed-in caller. `public` means no credential.
    - A request body is JSON, at most 1 MiB, and must not carry a field the
      route does not know: an unknown field answers 400.
    - An error is `{"error": "..."}` with the status saying what kind. A run a
      limit refused answers 429 or 402 with a larger body, see `Refusal`.
    - A state-changing request that a browser sends from another origin is
      refused with a plain-text 403 before it reaches a handler. Bearer
      callers are not browsers and are unaffected.

    ## Not part of this contract

    `POST /connectors/github`, `POST /connectors/slack` and
    `POST /connectors/slack/commands` are signed webhook ingress. Slack and
    GitHub call them, authenticated by a client's signing secret, and no API
    client should. They are described in `docs/clients.md`.
servers:
  - url: http://127.0.0.1:8080
    description: A local server started with `make dev`.
tags:
  - name: health
    description: Liveness.
  - name: auth
    description: Browser sign-in and sign-out.
  - name: session
    description: Who the caller is.
  - name: credentials
    description: |
      The caller's own credentials for the tools that act as them: MCP tool
      providers whose credential scope is `person`. A run reaches such a
      tool with the credential of the person it acts for, and with nothing
      when they have none. A credential is a reference, of which only the
      name is stored, or, where the workspace allows it, a value, which is
      stored in the secrets store client secrets are kept in and never
      answered back. Every route acts on the caller and takes no subject.
  - name: agents
    description: Agent definitions, their revisions and what they remember.
  - name: runs
    description: Runs, the calls between them, and what each recorded.
  - name: threads
    description: Conversations, which are trees of runs.
  - name: events
    description: The live event stream.
  - name: inbox
    description: Messages that want a person's attention, and resolving them.
  - name: schedules
    description: Cron schedules that raise runs.
  - name: projects
    description: |
      The workspace's tree of projects. The workspace itself is the root,
      written `~` in a path, and every other project sits under it, at most
      four levels down. A project files conversations, schedules, alert rules
      and limits under its name, and carries instructions and shared memory
      every agent answering in it or below it is sent. Its limits hold
      everything below it.
  - name: people
    description: |
      The directory: who is in the workspace, by name, handle, picture and
      roles, from sign-ins, the Slack people a client maps and the policy's
      subject grants. No email address is shown: a subject that holds one
      is left out, and subjects are not searched.
  - name: settings
    description: Workspace settings.
  - name: preferences
    description: The caller's own settings and picture.
  - name: artifacts
    description: Files agents published, and how much is stored.
  - name: observe
    description: Analytics and the journal.
  - name: alerts
    description: Alert rules and the alerts they fired.
  - name: evals
    description: Deterministic eval suites and their runs.
  - name: knowledge
    description: Knowledge sources, documents and search.
  - name: billing
    description: Limits (policies) and usage against them.
  - name: clients
    description: The Slack apps and GitHub installations a workspace answers through.
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /api/read-audit:
    get:
      operationId: listReadAudit
      tags: [projects]
      summary: List recorded break-glass reads
      description: Workspace administrators read at most 500 records from a window of at most 31 days. The end defaults to now and the start to 24 hours before the end.
      x-permission: projects:govern
      parameters:
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Newest reads first
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    maxItems: 500
                    items:
                      type: object
                      required: [subject, project, route, at]
                      properties:
                        subject: {type: string}
                        project: {type: string}
                        thread: {type: string}
                        route: {type: string}
                        at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      x-permission: public
      security: []
      responses:
        "200":
          description: The server is up. The body is the text `ok`.
          content:
            text/plain:
              schema: {type: string}

  /auth/login:
    get:
      operationId: startLogin
      tags: [auth]
      summary: Start a browser sign-in
      description: |
        Redirects to the identity provider (authorization code flow with
        PKCE) and sets a short-lived `humagen_login` cookie. Under
        development auth it redirects straight to `/`. A browser navigates
        here; a script has no use for it.
      x-permission: public
      security: []
      parameters:
        - name: return_to
          in: query
          description: A local path to land on after sign-in. Anything else becomes `/`.
          schema: {type: string}
      responses:
        "302":
          description: Redirect to the identity provider.
  /auth/callback:
    get:
      operationId: finishLogin
      tags: [auth]
      summary: Finish a browser sign-in
      description: |
        The identity provider redirects here. On success it sets the
        `humagen_session` cookie (`__Host-humagen_session` over https),
        HttpOnly, SameSite=Lax, valid for 8 hours, and redirects to the
        `return_to` path. Errors are plain text, not JSON.
      x-permission: public
      security: []
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302":
          description: Signed in. Redirect to where sign-in started.
        "400":
          description: The sign-in was not started from this browser, or expired.
          content:
            text/plain:
              schema: {type: string}
        "403":
          description: The identity provider refused, or the sign-in could not be verified.
          content:
            text/plain:
              schema: {type: string}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the browser session
      description: Forgets the session and clears the cookie. Succeeds without a session too.
      x-permission: public
      security: []
      responses:
        "204":
          description: Signed out.

  /api/me:
    get:
      operationId: getMe
      tags: [session]
      summary: The caller and what they may do
      x-permission: authenticated
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/access/explain:
    get:
      operationId: explainAccess
      tags: [session]
      summary: Why the caller may or may not do one thing
      description: >-
        Decides one permission for the caller and says why: the rule that
        decided, the role it reached them through, and the grant that gave
        that role when the sign-in kept it. It is only ever about the caller;
        there is no way to name another person.
      x-permission: authenticated
      parameters:
        - {name: permission, in: query, required: true, description: "The permission to explain, one of Permission, such as runs:read.", schema: {type: string}}
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccessDecision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/me/credentials:
    get:
      operationId: listToolCredentials
      tags: [credentials]
      summary: The caller or mapped person's tool connections
      description: >-
        Lists the workspace's person-scoped tool providers, at most 64, with
        whether the caller has connected a credential for each and how it is
        held. A value is never shown. A machine holds no credentials, so it
        sees every provider unconnected.
      x-permission: runs:read
      parameters:
        - name: act_as_client
          in: query
          schema: {type: string}
          description: Client whose machine is acting for a mapped Slack person.
        - name: act_as_user
          in: query
          schema: {type: string}
          description: Slack user of that client. Both identity parameters are required together.
      responses:
        "200":
          description: The providers and what the workspace lets people give.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ToolCredentials"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/me/credentials/{provider}:
    put:
      operationId: putToolCredential
      tags: [credentials]
      summary: Connect the caller's own credential for a tool
      description: >-
        Sets the caller's credential for a person-scoped provider, in place
        of the one they had. A reference must start with one of the starts
        the operator listed for the workspace, and is not read here; any
        reason it cannot be used is answered with one message. A value is
        accepted only where the workspace keeps them (403 otherwise), and is
        stored; a reference that replaces a value forgets it. A provider the
        workspace reaches with its own credential is 400, and a machine is
        403: each person connects their own.
      x-permission: runs:write
      parameters:
        - name: act_as_client
          in: query
          schema: {type: string}
          description: Client whose machine is acting for a mapped Slack person.
        - name: act_as_user
          in: query
          schema: {type: string}
          description: Slack user of that client. Both identity parameters are required together.
        - $ref: "#/components/parameters/ProviderName"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ToolCredentialInput"}
      responses:
        "200":
          description: The provider, as the caller now stands with it. The value, if one was given, is not in it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ToolCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteToolCredential
      tags: [credentials]
      summary: Remove the caller's own credential for a tool
      description: Removes it, and the value if it was one. The caller's runs then get no tools from the provider.
      x-permission: runs:write
      parameters:
        - name: act_as_client
          in: query
          schema: {type: string}
          description: Client whose machine is acting for a mapped Slack person.
        - name: act_as_user
          in: query
          schema: {type: string}
          description: Slack user of that client. Both identity parameters are required together.
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "204": {description: Removed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/agent-hues:
    get:
      operationId: getAgentHues
      x-permission: runs:read
      tags: [agents]
      summary: Resolve hues for explicitly named readable agents
      description: Requires runs:read. Hidden and missing agents are both omitted. Never enumerates names.
      parameters:
        - name: names
          in: query
          required: true
          description: At most 100 comma-separated names, each at most 200 characters.
          schema: {type: string, maxLength: 20099}
      responses:
        "200":
          description: Stable reservations for the readable agents requested.
          content:
            application/json:
              schema:
                type: object
                required: [hues]
                properties:
                  hues:
                    type: object
                    additionalProperties: {type: number, minimum: 0, exclusiveMaximum: 360}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/project-agent-hues:
    get:
      operationId: getProjectAgentHues
      x-permission: projects:read
      tags: [agents]
      summary: Resolve hues for explicitly named readable agents
      description: Requires projects:read. Hidden and missing agents are both omitted. Never enumerates names.
      parameters:
        - name: names
          in: query
          required: true
          description: At most 100 comma-separated names, each at most 200 characters.
          schema: {type: string, maxLength: 20099}
      responses:
        "200":
          description: Stable reservations for the readable agents requested.
          content:
            application/json:
              schema:
                type: object
                required: [hues]
                properties:
                  hues:
                    type: object
                    additionalProperties: {type: number, minimum: 0, exclusiveMaximum: 360}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      description: |
        The latest revision of every agent in the workspace the caller may
        read: one that lives in a project they may not read is left out, and
        so is every agent it names in another's spec. Not paged.
      x-permission: agents:read
      responses:
        "200":
          description: The agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents, builtin, homes, enabled_in, hues]
                properties:
                  agents:
                    type: array
                    items: {$ref: "#/components/schemas/Revision"}
                  builtin:
                    description: Names of the agents the platform provides, which cannot be edited.
                    type: array
                    items: {type: string}
                  hues:
                    description: Permanently reserved hues for readable agents in this workspace.
                    type: object
                    additionalProperties: {type: number, minimum: 0, exclusiveMaximum: 360}
                  homes:
                    description: |
                      Where each agent that lives in a project lives, by agent.
                      Such an agent is available there and below, and nowhere
                      else. An agent not listed is a platform agent.
                    type: object
                    additionalProperties: {type: string}
                  enabled_in:
                    description: |
                      Which projects enable each agent, by agent: those whose
                      enable list names it, or holds `*` for a platform agent.
                      `~` is the workspace.
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent
      description: |
        A tag names an agent or a person, so an agent cannot take a name a
        person in the workspace goes by ("a person goes by @dana"), nor
        `auto` or `sme`: each is 409. Every agent `access.spawn` names must
        exist and be one the caller may read (400).
      x-permission: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentSpec"}
      responses:
        "201":
          description: The agent's first revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}:
    put:
      operationId: reviseAgent
      tags: [agents]
      summary: Revise an agent
      description: |
        Writes a new revision. `expected_rev` is the revision the caller
        edited from: if someone else revised the agent since, the answer is 409.
        Every agent `access.spawn` names must exist and be one the caller may
        read, or one it already names that they are shown (400); the agents
        they were not shown, and the approvals of calls to them, are kept.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec, expected_rev]
              properties:
                spec: {$ref: "#/components/schemas/AgentSpec"}
                expected_rev: {type: integer}
      responses:
        "200":
          description: The new revision.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Revision"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/home:
    put:
      operationId: setAgentHome
      tags: [agents]
      summary: Make an agent live in a project
      description: |
        An agent that lives in a project is available there and in every
        project below it, and nowhere else: `*` never reaches it, and it is
        not available in the workspace itself. An empty `project`, or `~`,
        makes it a platform agent again, available wherever it is enabled.

        Refused with 409, naming them, while something outside the new home
        would lose the agent: a project's default, enable or allow list, a
        channel's default (an archived channel's aside), a schedule filed
        elsewhere, an alert rule watching it elsewhere, or a client that
        routes to it. Homing an agent into or out of a company
        project needs `projects:govern`. The platform's own agents live
        nowhere (400).
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  description: The project it lives in. Empty or `~` for none.
                  type: string
                  maxLength: 63
      responses:
        "200":
          description: Where the agent now lives, and which projects enable it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentHome"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/history:
    get:
      operationId: listAgentRevisions
      tags: [agents]
      summary: List an agent's revisions, newest first
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: Every revision.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: {$ref: "#/components/schemas/Revision"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/call-policy:
    get:
      operationId: getCallPolicy
      tags: [agents]
      summary: Read which agents may call an agent
      description: |
        The agent's stored call policy, or the default an agent with none has
        (`version` 0): any caller its own spec allows, without approval. 404
        for an agent that does not exist in the caller's workspace. An agent
        that lives in a project the caller may not read is left out of
        `allow` and `trusted`.
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: The call policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallPolicy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: putCallPolicy
      tags: [agents]
      summary: Set which agents may call an agent, and which calls a person approves
      description: |
        Replaces the agent's call policy. The callee decides: a caller also
        needs the callee in its own spawn allowlist, so a policy can only
        narrow what callers' specs allow. An unknown mode, an agent name that
        does not exist or lives in a project the caller may not read, more
        than 100 callers or 32 approvers, or a field that does not apply to
        the chosen mode is 400. The callers the caller was not shown are kept
        in `allow` while `callers` is `listed`, and in `trusted` while
        `approval` is `unlisted`. An agent that lives in a project is that
        project's to change: without owning its home it is 403.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CallPolicyInput"}
      responses:
        "200":
          description: The stored policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallPolicy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/reachable:
    get:
      operationId: listReachableAgents
      tags: [agents]
      summary: List which agents an agent may call, and why
      description: |
        For the agent in the path as a caller, every other agent in the
        workspace: whether its call policy admits the caller, whether the
        caller's spec lists it, and whether a call needs a person's approval.
        At most 500 agents; `truncated` says there are more.
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: One entry per other agent.
          content:
            application/json:
              schema:
                type: object
                required: [agents, truncated]
                properties:
                  agents:
                    type: array
                    items: {$ref: "#/components/schemas/Reach"}
                  truncated: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/memory:
    get:
      operationId: listAgentMemory
      tags: [agents]
      summary: List what an agent remembers
      description: |
        An agent's own notes. A project's are read and changed through its
        own routes (`listProjectMemory`), so a name that is no agent's, a
        project's memory owner such as `project:News` among them, is 404 here
        and on every agent memory route.
      x-permission: agents:read
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      responses:
        "200":
          description: The agent's notes, approved and pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: addAgentMemory
      tags: [agents]
      summary: Write a note an agent is sent with every turn
      description: |
        A note a person writes is approved at once. A note carrying personal
        data is refused with 400. An agent that lives in a project is that
        project's to change: without owning its home it is 403, here and on
        approving and removing its notes. A name that is a project's memory
        owner is no agent's, and answers 404.
      x-permission: agents:write
      parameters:
        - {$ref: "#/components/parameters/AgentName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteInput"}
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/agents/{name}/memory/approve:
    post:
      operationId: approveAgentMemory
      tags: [agents]
