  /api/pick:
    get:
      operationId: pickAgent
      tags: [agents]
      summary: Preview which agent @auto would pick for a message
      description: |
        `@auto` picks among the agents available in the project by the words
        of the message. With no match it hands the message to the nearest
        default on the project's chain that names an agent, and with none it
        answers 409, "no agent fits; tag one". Nothing is started.
      x-permission: agents:read
      parameters:
        - {name: q, in: query, required: true, description: The message., schema: {type: string}}
        - name: project
          in: query
          description: Where the message is posted. Empty or `~` is the workspace itself.
          schema: {type: string, maxLength: 63}
      responses:
        "200":
          description: The agent and why.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Choice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List recent runs
      description: The 200 most recent runs in the workspace, newest first. Not paged.
      x-permission: runs:read
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createRun
      tags: [runs]
      summary: Send a message and start the run that answers it
      description: |
        Starts a conversation, or continues one when `after` names a turn.
        The run is accepted, not finished: follow it on the event stream at
        topic `agent:<agent>:<id>`, or poll `getRun`.

        Send `Idempotency-Key` to make a retry safe. The run's `tag_id` is
        then `api-<length of subject in bytes>-<subject>-<key>`, its `id` is
        derived from that and the workspace (`r` and 32 hex digits, as
        fiber's `runtime.RunID`), and a second request with the same key
        from the same caller joins the run the first one started instead of
        starting another. Without it the ids are random.

        A conversation filed in a project that was deleted since is read,
        not continued: its next turn answers 409, since nothing says any more
        which projects above it the run would count toward.

        The body takes no metadata: an unknown field answers 400.

        Nothing routes on its own. With `agent` left out, the default the
        conversation's place inherits answers, the first set of: the
        thread's (`updateThread`), the acting client's when `act_as` names
        one, the channel's (a new conversation is in `general` of its
        project), then the project's, each ancestor's nearest first, and the
        workspace's. With none set it is 409, "tag an agent". `auto` is
        `@auto`, which for a person a client acts for picks only among the
        agents that client may route to. An agent not available in the
        conversation's project, or a default that has stopped being
        available there, is 403. So is a conversation in a project where the
        caller, or the person `act_as` names, is only a viewer: starting work
        in a project, or adding a turn to work filed there, needs a member.
        The person `act_as` names must hold `runs:write` themselves, as for
        posting and answering for them, or it is 403: the credential's own is
        not enough.

        A follow-up is filed in its conversation's channel. When it follows
        a turn in a shared thread people have posted in, it is sent the room
        up to that turn, one turn a line after who took it: people's
        messages and earlier follow-ups by the name and handle of who wrote
        or asked them, or as acting for nobody, and agents' answers by
        theirs. The room is fenced off from the follow-up's own words, which
        follow with who asks them, and the follow-up is part of the room the
        agents answering the next message are sent.
      x-permission: runs:write
      parameters:
        - name: Idempotency-Key
          in: header
          description: A caller-chosen key. The same key from the same caller joins the same run.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRunRequest"}
      responses:
        "202":
          description: The run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run
      x-permission: runs:read
      parameters:
        - name: act_as_client
          in: query
          schema: {type: string}
          description: Client whose machine is reading for a mapped Slack person.
        - name: act_as_user
          in: query
          schema: {type: string}
          description: Slack user of that client. Both parameters go together.
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/feedback:
    put:
      operationId: saveRunFeedback
      tags: [runs]
      summary: Save a rating and optional reason and comment linked to a run
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating]
              properties:
                rating: {type: string, enum: [up, down]}
                reason: {type: string, maxLength: 80}
                comment: {type: string, maxLength: 4000}
                act_as: {$ref: "#/components/schemas/ActAs"}
      responses:
        "200":
          description: The caller's feedback. Retrieve context through the referenced run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunFeedback"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    get:
      operationId: listRunFeedback
      tags: [runs]
      summary: Collect feedback for a visible run, at most 200 records per page
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
        - name: after
          in: query
          schema: {type: string, pattern: "^[1-9][0-9]{0,18}$"}
          description: The `next` cursor of the previous page, a positive number. It is not a subject.
      responses:
        "200":
          description: Feedback in the order it was first given (ratings kept before feedback was numbered come first, in the order they were last rated), and a cursor for the next page, empty at the end.
          content:
            application/json:
              schema:
                type: object
                required: [feedback, next]
                properties:
                  feedback:
                    type: array
                    items: {$ref: "#/components/schemas/RunFeedback"}
                  next: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/tree:
    get:
      operationId: getRunTree
      tags: [runs]
