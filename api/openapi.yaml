      responses:
        "200":
          description: The tree, flattened. `parent` and `depth` give its shape.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/calls:
    post:
      operationId: createCall
      tags: [runs]
      summary: Call another agent from a run
      description: |
        Starts a child run of the run in the path. The caller's agent must be
        allowed to spawn the target, and depth, fan-out and lease limits apply.
        A target that lives in a project the caller may not read is refused as
        one the spawn allowlist does not name (403).
        `key` is the call's idempotency key within the run. The call is a turn
        of the run's conversation, filed where it lives, so the caller must be
        a member of the run's project, and in a private thread a participant
        (403); a viewer starts nothing.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateCallRequest"}
      responses:
        "202":
          description: The child run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "402": {$ref: "#/components/responses/Refused"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/stop:
    post:
      operationId: stopRun
      tags: [runs]
      summary: Ask a run, and everything attached to it, to stop
      description: |
        The request goes to the runtime, which cancels the model call in
        flight and ends the run with `lifecycle.stopped`. Runs attached to it
        are asked too. Runs it delegated keep going.

        It does not wait for the run. From the moment it is asked, the run is
        `stopping` and starts no further calls. It then ends `stopped`, with
        `answer` holding what it had said and `cause` why, or `completed` or
        `failed` if its turn finished before the request took effect. A run is
        never reported stopped and then completed.

        Asking a run that has ended changes nothing and answers 200 with the
        run as it stands, so asking twice is safe. Another workspace's run
        answers 404.

        It takes whoever asked for the run, the machine of the client that
        raised it, or a member of the run's project (in a private thread a
        participant). A viewer of the project stops nobody else's run (403).
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The run has ended, and is returned as it stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: The run was asked to stop and has not ended yet. `stopping` is true.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
        "503":
          description: |
            The runtime cannot interrupt a run. The run is still marked
            `stopping`, so it starts nothing more, and it ends as its own
            events say.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
  /api/runs/{id}/questions/{question}/answer:
    post:
      operationId: answerQuestion
      tags: [runs]
      summary: Answer the question a run is waiting on
      description: |
        A run parks on a person to approve a tool call (`approve` or `deny`,
        optionally with edited `arguments` for an approval), to choose one of
        some options (`choose` with `choice`), or to reply in words (`reply`
        with `text`). The question is on the run as `question`, on its stream
        as `lifecycle.parked`, and in the inbox as a message addressed to the
        people who may answer it. Answering here is the same as resolving that
        message's part, and returns the message.

        Who may answer is decided from the run's pinned revision: the spec's
        `approvers` or `answerers` when it names them, else anyone in the
        workspace, and never the person whose request raised a call they are
        asked to approve, unless the spec sets `self_approval`. Anyone else is
        403 and nothing changes. A call that acts as a person
        (`question.tool.acts_for_person`) is approved with edited `arguments`
        only by that person: anyone else's edit is 403, and they may approve
        or deny it as asked. Where an answer may reach the credentials of the
        person a run acts for (the run, or a run that called it, acts for a
        person and its revision is granted a person-scoped tool provider), a
        choice or a reply is answered only by that person, and an approval
        carries edited `arguments` or a `note` only from them, whatever the
        call: anyone else is 403. So is a question such a run asks of the
        project's experts (`asked_of: sme:<topic>`), which is addressed to
        that person and not to the experts. A surface that authenticated a
        person itself answers for them with `act_as`: only the credential its
        client names, and only for a person its client maps.

        The first answer recorded is the answer. An answer after it, or after
        the question expired or its run was stopped, answers 200 with the
        message showing what was recorded. Another workspace's run is 404.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/RunID"}
        - {name: question, in: path, required: true, description: "The question's id: `question.id` on the run.", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionAnswer"}
      responses:
        "200":
          description: The question's message, settled with the answer that was recorded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/trace:
    get:
      operationId: getRunTrace
      tags: [runs]
      summary: Get a run's tree with the spans inside each run
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The runs and their spans, rebuilt from the journal.
          content:
            application/json:
              schema:
                type: object
                required: [runs, spans]
                properties:
                  runs:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
                  spans:
                    type: array
                    items: {$ref: "#/components/schemas/Span"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/events:
    get:
      operationId: listRunEvents
      tags: [runs]
      summary: List a run's events as they were published
      description: |
        Oldest first, in the same shape the event stream sends, for showing a
        run that is no longer streaming. `complete` is false when the journal
        no longer holds the run's first event.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: The events the journal still holds.
          content:
            application/json:
              schema:
                type: object
                required: [events, complete]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/RunEvent"}
                  complete: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/runs/{id}/manifest:
    get:
      operationId: getRunManifest
      tags: [runs]
      summary: Export everything recorded about a run and the runs under it
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/RunID"}
      responses:
        "200":
          description: One document, with every event's body decoded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Manifest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: Page conversations, most recently active first
      description: |
        `next` is the cursor for the page after this one, or null at the end.
        Pass it back as `before`. A cursor is opaque and belongs to the server
        that issued it.
      x-permission: runs:read
      parameters:
        - name: limit
          in: query
          description: Page size. Defaults to 200, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: agent
          in: query
          description: Only conversations this agent took part in.
          schema: {type: string}
        - name: origin
          in: query
          description: Only conversations raised by this trigger, such as `api`, `slack` or `cron`.
          schema: {type: string}
        - name: standing
          in: query
          description: Only conversations with a run in flight, or with a failed run.
          schema: {type: string, enum: [running, failed]}
        - name: project
          in: query
          description: |
            Only conversations filed in this project, its sub-projects' left
            out. `~` is the workspace: conversations filed in no project. A
            project the workspace does not have answers 404.
          schema: {type: string, maxLength: 63}
        - name: within
          in: query
          description: |
            Only conversations filed in this project or in any project below
            it. `~` is the whole workspace. With `project` as well, a
            conversation is kept only when both keep it.
          schema: {type: string, maxLength: 63}
        - name: channel
          in: query
          description: |
            Only conversations in this channel of their project. A
            conversation from before threads is in `general`.
          schema: {type: string, maxLength: 40}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [threads, next]
                properties:
                  threads:
                    type: array
                    items: {$ref: "#/components/schemas/ThreadSummary"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: startThread
      tags: [threads]
      summary: Start a conversation in a project's channel, with its first message
      description: |
        The message is posted as the caller, or as the person `act_as` names
        through a client that maps them; no field names an author, and a
        credential acting for nobody is refused (403). What the message
        starts follows the tag rules: the agents it tags answer, at most 3,
        and a `$skill` with no agent tagged goes to `@auto`; tagging only
        people or experts notifies them; posted only, nothing answers. A
        message a person posts as themselves, as the console does, that tags
        no agent in a thread with selected agents (`agents`, `mode`) is
        answered by them (rule `routed`): the best fit among them, or each
        of them; a `$skill` with no agent goes to them too. With none
        selected, such a message runs only the agents it tags: untagged, it
        starts nothing (rule `untagged`), whatever the thread's, channel's
        or project's default. Otherwise,
        for a message a client posts, the default the thread inherits
        answers. `visibility` left out, by a person posting as themselves,
        is `private`: the conversation is its starter's alone until they
        share it (`shareThread`). A client posting with `act_as` and no
        `surface` names it (400). Each run
        it starts acts for the person the message is posted as, never for
        anyone else in the thread, so a tool that acts as a person uses that
        person's own credential; the run is sent the room up to the message,
        what others said there, ahead of it. A `private` thread is read by
        its participants alone, the person who starts it first; tagging a
        person in it invites them. A `default` must be able to answer in the
        project (400). Starting a thread takes a member of the project: the
        caller, or the person `act_as` names, as their own role there says;
        a viewer is 403.

        A workspace holds at most 10,000 threads and a project 2,000, a
        conversation from before threads counting once its record is written
        (429). A person posts at most 30 messages a minute, here and in
        `postThreadMessage`, and a project takes at most 120 (429). One
        message notifies at most 20 people and roles; a tag it reaches nobody
        for is in `refused`.

        With `surface`, a client's machine posts a person's message from a
        Slack thread: into the thread that surface already is, or into a new
        one the platform files from the binding (see SurfaceRef). Posting
        the same message ts again changes nothing. To any other caller the
        client is not found (404); a client's home that is gone is 404 too.
        An agent the client may not route to is refused, never swapped.

        A Slack thread under an announcement the client posted, at the
        channel and ts its receipt records (`recordInboxDelivery`), is that
        announcement's: the new thread names it in `announcement` and its
        turns start with it, from whoever posted it, ahead of the reply,
        which is the person's own message. It is seeded only where the
        Slack channel's binding files it in the announcement's project, and
        there a reply to one that was withdrawn, or to a draft, starts
        nothing (410). Filed anywhere else, after the Slack channel was bound
        to another project or unbound, it starts as any other thread.
      x-permission: runs:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadInput"}
      responses:
        "201":
          description: The thread, its first message and what it started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadPosted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410":
          description: The surface's thread is under an announcement that was withdrawn, or under a draft, in the project its Slack channel is bound to, so a reply there starts nothing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorBody"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}:
    get:
      operationId: getThread
      tags: [threads]
      summary: Read a thread and one page of its turns
      description: |
        A thread's turns are its people's messages and its agents' runs, in
        the order they were made, oldest first. A run that answers a message
        names it in `message`; runs answering one message answer it side by
        side and are not branches. A thread started from an announcement
        starts with it, as it stands when it is read. A conversation from
        before threads reads as shared, in `general` of its project, at
        version 0, and its id is the id of the run that started it.

        The first page is the newest 200 turns, or `limit`. `next` is the
        cursor for the turns before them, or null at the start: pass it back
        as `before`. `answers` is who answers an untagged message a client
        posts here, from Slack or GitHub; a message a person posts as
        themselves, as the console does, runs only the agents it tags. A run
        turn whose run is parked on a question a person answers carries
        `ask`: whether the reader may answer it, and whom it is for, so a
        surface offers the answer only to the people it is for.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: limit
          in: query
          description: Page size. Defaults to 200, and is at most 200.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: The thread and one page of its turns.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateThread
      tags: [threads]
      summary: Change a thread's title, visibility and default
      description: |
        The body replaces those three as a whole: one left out is cleared.
        `version` is the one the caller read (0 for a conversation from
        before threads, whose record this writes), so a change made since
        answers 409. Made `private`, the thread is read by its participants
        alone. A `default` must be able to answer in the thread's project
        (400). Whoever started the thread, while a member of its project, or
        an owner of its project, changes it (403 for anyone else, and for a
        starter who is now only a viewer, since its default answers
        everyone's untagged messages there); a conversation from before
        threads that no person asked in is changed first by a member, who
        then owns it.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadUpdate"}
      responses:
        "200":
          description: The thread as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Thread"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}/messages:
    post:
      operationId: postThreadMessage
      tags: [threads]
      summary: Post a message in a thread
      description: |
        Posted as the caller, or as the person `act_as` names through a
        client that maps them, as for `startThread`, and each run it starts
        acts for that person. What it starts follows the tag rules of
        `startThread`: posted as the caller themselves, as the console
        does, it runs the agents it tags, else the thread's selected agents,
        and with none selected, untagged, it starts nothing; each run is
        sent the conversation up to it. `after` is the
        turn it follows: a message of
        the thread, a run answering one, or in a conversation from before
        threads one of its runs; left out, it follows the latest. `answers`
        records the message as a question's answer, which resumes the run
        parked on it; who may answer is checked as on every other path, and
        a refused answer posts nothing. An answer, like a reply, is not
        answered by the thread's default; the agents it tags answer it, as
        for any message. An answer is posted only when it is the one the run
        was given: a question already answered, or whose run stopped, is 409
        and posts nothing. Posting takes a member of the thread's project,
        and in a private thread a participant, as starting a thread does,
        except an answer or a reply that tags no one: a viewer may answer
        what a run asked them, or reply to a message that tagged them, but
        tagging an agent, a person or `@sme` takes a member (403 for
        anything else). A thread holds at most 5,000 messages: past that,
        409 "start a new thread". The rates and caps of `startThread` hold
        here too (429).
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadMessageInput"}
      responses:
        "201":
          description: The message and what it started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadPosted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/threads/{id}/participants:
    put:
      operationId: updateThreadParticipants
      tags: [threads]
      summary: Add and remove a thread's people and agents
      description: |
        At most 50 added and removed together, and a change that adds leaves
        at most 50 participants, counting the ones the caller is shown: an
        agent they were not shown is kept, and counts toward neither. People
        who post and agents who answer join on their own past 50, and a
        thread holds at most 100 in all. An agent added must be available in the thread's
        project, and a person, named by handle, must be in the workspace's
        directory (400). The person who started the thread stays in it.
        Adding takes posting there: a member of the thread's project, and in
        a private thread a participant. Removing anyone but oneself takes
        whoever started the thread or an owner of its project (403).
        `version` is the one the caller read.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadParticipantsUpdate"}
      responses:
        "200":
          description: The thread as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Thread"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/threads/{id}/placement:
    get:
      operationId: previewThreadPlacement
      tags: [threads]
      summary: Review the audience and contents before moving completed work
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
        - {name: project, in: query, required: true, schema: {type: string, maxLength: 63}}
        - {name: channel, in: query, schema: {type: string, maxLength: 40}}
      responses:
        "200":
          description: A versioned preview to confirm before publication.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlacementPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/threads/{id}/publication:
    post:
      operationId: publishThreadSummary
      tags: [threads]
      summary: Publish only explicitly reviewed text as a new shared conversation
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project, summary, placement_token]
              properties:
                project: {type: string, maxLength: 63}
                channel: {type: string, maxLength: 40}
                summary: {type: string, minLength: 1, maxLength: 16000}
                placement_token: {type: string, maxLength: 64}
      responses:
        "201":
          description: A new shared conversation with only the reviewed summary. The source remains private.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Thread"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/threads/{id}/share:
    post:
      operationId: shareThread
      tags: [threads]
      summary: Share a conversation in a project's channel
      description: |
        Makes the conversation shared in `channel` of `project`, read by
        everyone who can see that project, and adds the people `add` names,
        by handle, as participants (400 for a handle nobody goes by). `project`
        left out keeps the thread's own, `~` is the workspace; `channel` left
        out keeps the thread's own in its own project and is `general` in
        another. Only a participant shares (403). Making a private
        conversation shared, or moving one, also takes whoever started it,
        while a member of its project, or an owner of its project (403), so
        someone tagged into a private conversation does not publish it; it
        goes only into a project the caller is a member of (403; one they
        cannot see is 404), to a channel it has (404) that is not archived
        (400). On a
        thread shared already where it is, any participant who may post
        there adds people. The thread moves only while no run has been filed
        in it: a conversation that has runs stays in its project and its
        channel (409). A default it names that cannot answer where it moves
        is cleared. A thread on a Slack or GitHub surface stays where and as
        it was started (400). `version` is not taken: a change made to the
        thread while this one is decided is 409. Shared to private again is
        not offered. Answers the thread as `getThread` reads it, with
        `not_added`: the people `add` named who were not added, each with
        why. A person who cannot read the project it is shared in is not
        added ("they cannot read this project, so they were not added"), as
        a tag does not reach them. Each person added is told in their inbox,
        once: a mention of the conversation's latest message, "Ana added you
        to Renewal plan in Globex #general", read where the conversation is.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/ThreadID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ThreadShare"}
      responses:
        "200":
          description: The thread as it now stands, and the newest page of its turns.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ThreadShared"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/events:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Stream the workspace's events as server-sent events
      description: |
        A long-lived `text/event-stream`. Two kinds of message arrive on it:

        - A message with no `event:` field carries one `RunEvent` as JSON.
        - A message with `event: inbox` carries one `InboxNotice` as JSON. It
          names a message and nothing more: fetch it to see what changed. A
          caller is only sent notices for kinds of message they may read.
        - A message with `event: thread` carries one `ThreadNotice` as JSON:
          a message was posted or settled in a thread, or its record changed.
          Fetch the thread to see it. A caller is sent the notices of the
          threads they may read.

        A comment line (`: keep-alive`) is sent every 15 seconds. Messages
        carry no `id:` field, so `Last-Event-ID` is not used: to resume, pass
        the last `seq` processed as `from`. `seq` orders events within one
        run, so `from` is only meaningful with a topic that names one run.

        The stream first replays what the bus still holds for the topic, then
        follows it live. The server ends the stream when the consumer falls
        behind, rather than feed it a gap: reconnect and resume. A run's end is
        not the stream's end, and the ledger (`getRun`) decides whether a run
        is over, not silence on the stream.

        There is no topic for one conversation. To follow a conversation,
        subscribe to `agent` and keep the events whose `run_id` is one of its
        turns.

        Note for generators: the schema below describes the JSON carried in
        each message's `data` field, which is how the oag generator reads
        `itemSchema`.
      x-permission: runs:read
      parameters:
        - name: topic
          in: query
          description: |
            What to listen to. `agent` is every agent (the default),
            `agent:<name>` one agent, `agent:<name>:<run>` one run.
          schema: {type: string}
        - name: from
          in: query
          description: Resume after this sequence number within each run.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              itemSchema:
                oneOf:
                  - $ref: "#/components/schemas/RunEvent"
                  - $ref: "#/components/schemas/InboxNotice"
                  - $ref: "#/components/schemas/ThreadNotice"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace settings
      description: |
        A title or memory agent that lives in a project the caller may not
        read is left out, as if none were set.
      x-permission: agents:read
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Replace workspace settings
      description: |
        The first save records the caller as the one who set the workspace
        up. `baseline` is gone: the workspace default is the root's
        `default` (`PUT /api/projects/~/agents`), and a body that names it
        is 400. A title or memory agent is an agent the caller may read: one
        that lives in a project they may not read is 400, in the words for
        one that does not exist. One they are not shown is kept when they
        name none in its place.
      x-permission: agents:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List schedules
      x-permission: schedules:read
      responses:
        "200":
          description: Every schedule, with its next fires and recent runs.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule
      description: |
        The agent, and the project if one is named, must exist now. Filing a
        schedule in a project needs a member of it, as starting a
        conversation there does: a viewer is 403. So does changing, pausing,
        resuming, running or deleting one filed there.
      x-permission: schedules:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Schedule"}
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}:
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Change a schedule
      description: |
        Replaces the schedule's expression, agent, text, project and
        description. A schedule filed in a project, or moved into one, is
        changed by a member of it. The name cannot change: a `name` in the body must match
        the path, or be left out. Whether the schedule is paused, who created
        it and the runs it raised are kept. The agent, and the project if one
        is named, must exist now. The whole edit is checked before anything
        changes, so a refused edit leaves the schedule as it was. An edited
        schedule starts afresh from the time of the edit: it does not catch up
        on occurrences of its new expression that fell before it. A schedule
        the platform file declares (`managed: file`) is changed in the file:
        here it answers 409.
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Schedule"}
      responses:
        "200":
          description: The schedule, as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      description: A schedule the platform file declares is removed from the file, not here (409).
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/pause:
    post:
      operationId: pauseSchedule
      tags: [schedules]
      summary: Pause a schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "200":
          description: The schedule, paused.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/resume:
    post:
      operationId: resumeSchedule
      tags: [schedules]
      summary: Resume a paused schedule
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "200":
          description: The schedule, running.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/schedules/{name}/run:
    post:
      operationId: runSchedule
      tags: [schedules]
      summary: Fire a schedule once, now
      description: |
        The run is attributed to the caller, not to the clock, and works while
        the schedule is paused. A schedule filed in a project is run by a
        member of it. It acts for the caller only when they wrote what it
        runs: whoever last changed its text, or its creator while nobody has,
        unless someone else has since chosen its agent or its project, whose
        instructions and notes go ahead of its text. Saving a schedule
        without changing its text writes none of it. Anyone else's press acts
        for nobody, as the schedule's own clock does, since anyone with
        `schedules:write` may change its words.
      x-permission: schedules:write
      parameters:
        - {$ref: "#/components/parameters/ScheduleName"}
      responses:
        "202":
          description: The run, accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: Page the caller's inbox, newest first
      description: |
        The route asks only for `runs:read`. What a caller sees, and what they
        may do with each part, is decided per message: a memory proposal needs
        `agents:read`, a failure `runs:read`, an alert or a reached limit
        `alerts:read`. `next` is the cursor for the page after this one, or
        null at the end. A client's machine reads one of its people's inbox
        with `act_as_client` and `act_as_user`, as the Slack app's Home does.
      x-permission: runs:read
      parameters:
        - name: state
          in: query
          description: Defaults to `open`, or to `all` when `alert` is given.
          schema: {type: string, enum: [open, resolved, dismissed, snoozed, all]}
        - name: kind
          in: query
          description: Only messages of this kind. An unknown kind matches nothing.
          schema: {type: string, enum: [alert, failure, memory, budget, approval, clarification, result, artifact, mention, announcement, source, operation]}
        - name: unread
          in: query
          description: Only `true` narrows to messages the caller has not read.
          schema: {type: string, enum: ["true"]}
        - name: alert
          in: query
          description: The message about this alert, in any state.
          schema: {type: string}
        - name: limit
          in: query
          description: Page size. Defaults to 50, and is capped at 200.
          schema: {type: integer, minimum: 1}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
        - name: agent
          in: query
          description: |
            Only messages about this agent: raised by it, or asking to call
            it (`source.target`). With `kind=approval` and `state=open`, the
            agent's queue of calls waiting for approval.
          schema: {type: string}
        - name: project
          in: query
          description: |
            Only what the caller's own inbox holds about this project
            (`source.project`), `~` for the workspace. A project the caller
            cannot see is 404.
          schema: {type: string, maxLength: 63}
        - {$ref: "#/components/parameters/ActAsClient"}
        - {$ref: "#/components/parameters/ActAsUser"}
        - name: needs
          in: query
          description: |
            Only `true` narrows to what may need the caller, which `open`
            counts: a posted announcement, which counts only in `updates`, is
            left out before the page is cut, and an agent's draft waiting on
            its owners is kept. The Slack app's Home reads what needs a person
            this way.
          schema: {type: string, enum: ["true"]}
        - name: news
          in: query
          description: |
            Only `true` narrows to posted announcements, which `updates`
            counts: an agent's draft, which shares their kind, is left out
            before the page is cut. Home reads What's new this way.
          schema: {type: string, enum: ["true"]}
      responses:
        "200":
          description: One page, with the caller's counts.
          content:
            application/json:
              schema:
                type: object
                required: [messages, next, open, unread, updates]
                properties:
                  messages:
                    type: array
                    items: {$ref: "#/components/schemas/InboxMessage"}
                  next: {type: [string, "null"]}
                  open: {type: integer}
                  unread: {type: integer}
                  updates:
                    description: Announcements the caller has not read. They never count in `open` or `unread`.
                    type: integer
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/count:
    get:
      operationId: getInboxCount
      tags: [inbox]
      summary: Count the caller's open and unread messages, and the announcements they have not read
      description: |
        Announcements count only in `updates`, so the badge, which counts
        `open`, never grows from them. A client's machine counts for one of
        its people with `act_as_client` and `act_as_user`.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/ActAsClient"}
        - {$ref: "#/components/parameters/ActAsUser"}
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxCounts"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}:
    get:
      operationId: getInboxMessage
      tags: [inbox]
      summary: Get a message and the record of what was done to it
      description: |
        A message of a kind the caller may not read answers 404. An
        announcement in the inbox of a project the caller can see is theirs
        to read, mark, snooze and hide, member or not, muted or not, as the
        project's inbox shows it. A client's machine reads one for a person
        it maps with `act_as_client` and `act_as_user`.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
        - {$ref: "#/components/parameters/ActAsClient"}
        - {$ref: "#/components/parameters/ActAsUser"}
      responses:
        "200":
          description: The message and its history.
          content:
            application/json:
              schema:
                type: object
                required: [message, history]
                properties:
                  message: {$ref: "#/components/schemas/InboxMessage"}
                  history:
                    description: |
                      What changed the message, oldest first: at most 100
                      changes, the newest kept. What changed it for everyone,
                      and the caller's own marks; another reader's reads, and
                      their hiding or snoozing of an announcement, are theirs
                      alone and left out. A client's receipt (`delivered`,
                      by the client's id) is shown only to that client's
                      machine.
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/InboxChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/read:
    post:
      operationId: markInboxRead
      tags: [inbox]
      summary: Mark a message read or unread, for the caller only
      description: The body is required. `{}` marks the message read.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  description: Defaults to true.
                  type: [boolean, "null"]
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/dismiss:
    post:
      operationId: dismissInboxMessage
      tags: [inbox]
      summary: Set a message aside without resolving it
      description: Needs the write permission for the message's kind, checked per message.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      responses:
        "200":
          description: The message, dismissed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/snooze:
    post:
      operationId: snoozeInboxMessage
      tags: [inbox]
      summary: Hide a message until a time
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: {type: string, format: date-time}
      responses:
        "200":
          description: The message, snoozed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/unhide:
    post:
      operationId: unhideInboxMessage
      tags: [inbox]
      summary: Bring back an announcement the caller hid for themselves
      description: |
        An announcement the caller hid or snoozed (`hidden`) is open for them
        again, as everyone else has it. Only their own copy changes, so it
        needs what hiding it needs. One they never set aside, or one withdrawn
        for everyone, is answered as it is. Any other message is set aside for
        everyone, and is not brought back this way (400).
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
      responses:
        "200":
          description: The message, as the caller now has it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/parts/{part}/resolve:
    post:
      operationId: resolveInboxPart
      tags: [inbox]
      summary: Act on one part of a message
      description: |
        A part lists the actions the caller may take in `actions`. Each needs
        the permission for the thing it does, not the permission to open an
        inbox, and an action the caller lacks the permission for answers 403:

        | Part | Action | Needs |
        |------|--------|-------|
        | `alert` | `acknowledge` | `alerts:write` |
        | `failure` | `retry`, `acknowledge` | `runs:write` |
        | `memory` | `keep` (with `ids`), `discard` | `agents:write` for an agent's notes; for a project's `projects:write`, and `projects:govern` as well for the workspace's and a company project's |
        | `budget` | `raise_limit` (with `limits`) | `billing:write` |
        | `budget` | `acknowledge` | `alerts:write` |
        | `approval` | `approve` (optionally with `arguments`), `deny` | `runs:write` |
        | `choice` | `choose` (with `choice`) | `runs:write` |
        | `reply` | `reply` (with `text`) | `runs:write` |
        | `mention` | `reply` (with `text`), `done` | `runs:write` |

        A mention's `reply` posts the words in its thread as the reader,
        which the thread's default does not answer, and `done` sets it
        aside. A reply that tags anyone takes a member of the thread's
        project (403), since its tags still start the agents and tell the
        people they name; a viewer replies without tagging.

        Answering a question is `answerQuestion` by another route, with the
        same rules: a person the question is not addressed to does not see
        it, and one the runtime refuses is 403. `act_as` answers for a person
        a surface authenticated, and settles a mention of them (`reply` posts
        in the thread as them, through the client); they must hold
        `runs:write` themselves. A reply in the thread, from anywhere,
        settles the mention too. Resolving a part that is already resolved
        returns the first outcome. `retry` starts a new run, so it can be
        refused by a limit with 429 or 402, and with 409 when the turn's
        project was deleted since. The run acts for whoever the failed turn
        acted for: a turn that acted for a person is retried only by that
        person, signed in as themselves, and anyone else is 403; a turn that
        acted for nobody is retried for nobody. A failed answer to a message
        in a shared thread is asked again as an answer to the same message,
        for the person who posted it. Each person's retry is a run of its
        own, and pressing it again returns the same one.
      x-permission: runs:read
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
        - {name: part, in: path, required: true, description: The part's id within the message., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Resolution"}
      responses:
        "200":
          description: The message after the action.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InboxMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "402": {$ref: "#/components/responses/Refused"}
        "429": {$ref: "#/components/responses/Refused"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/inbox/{id}/deliveries/{client}:
    put:
      operationId: recordInboxDelivery
      tags: [inbox]
      summary: Record where a client posted a message
      description: |
        A Slack app records the channel and the ts of a message it posted,
        such as an announcement, so that after a restart, an edit or a
        withdrawal it updates that post instead of posting again. Only the
        credential the client names as `slack.machine` may record one: for
        anyone else, and for a message of a kind the caller may not read, the
        answer is 404. Recording the same post again after the message
        changed (its `updated_at` is after the receipt's `at`) says the post
        now shows it as it stands, and moves the receipt's `at` on; otherwise
        it changes nothing. The receipt shows in the message's `deliveries`,
        to that machine only, wherever the message is read.
      x-permission: runs:write
      parameters:
        - {$ref: "#/components/parameters/MessageID"}
        - {name: client, in: path, required: true, description: The id of the client that posted it., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InboxDeliveryInput"}
      responses:
        "204":
          description: Recorded.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
