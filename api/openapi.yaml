  /api/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the workspace's projects in tree order, and what is in each
      description: |
        Each project comes before its sub-projects, and siblings are ordered by
        name ignoring case. The workspace itself is not in the list:
        `GET /api/projects/~` reads it. A workspace has at most 100 projects.
      x-permission: projects:read
      parameters:
        - name: parent
          in: query
          description: Only the sub-projects of this project. `~` keeps the top level.
          schema: {type: string, maxLength: 63}
        - name: within
          in: query
          description: Only this project and every project below it. `~` keeps them all.
          schema: {type: string, maxLength: 63}
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/ProjectView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: |
        A project's name is its identity: it is unique in the workspace
        ignoring case, and never changes. Its parent is fixed too. A company
        project needs `projects:govern`, and so does reusing the name of a
        deleted project, which adopts its old conversations. 400 for a kind
        that cannot sit under its parent or a fifth level; 404 for a parent
        the workspace does not have; 409 for a name taken; 429 at the
        workspace's cap of 100 projects or 10 company projects.
      x-permission: projects:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectInput"}
      responses:
        "201":
          description: The project, where it sits, and what is in it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Read a project, the projects above and below it, and the limits that hold it
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateProject
      tags: [projects]
      summary: Change a project's title, description, account and instructions
      description: |
        The body replaces those four as a whole: one left out is cleared.
        `version` is the one the caller read, so a change made since answers
        409 instead of being overwritten. A project's `name`, `kind` and
        `parent` are fixed when it is created, and naming any of them is 400.
        The workspace and company projects need `projects:govern`. A field
        the platform file sets answers 409.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectUpdate"}
      responses:
        "200":
          description: The project as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its shared notes
      description: |
        Refused with 409, naming them, while sub-projects, schedules, alert
        rules or limits point at the project. A delete never drops a limit.
        Its conversations keep its name, and are adopted only if someone
        holding `projects:govern` creates it again. The workspace cannot be
        deleted (400), a company project needs `projects:govern`, and a
        project the platform file declares is removed there (409). A
        workspace remembers at most 1,000 deleted names, and forgets one only
        when nothing is filed under it: when every one it remembers still has
        conversations or files, the delete is refused with 429.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "204":
          description: Deleted.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/agents:
    get:
      operationId: getProjectAgents
      tags: [projects]
      summary: Read which agents a project turns on, which are available there, and who answers untagged messages
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's agents.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectAgentsView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: setProjectAgents
      tags: [projects]
      summary: Replace which agents a project turns on, narrows to, and answers untagged messages with
      description: |
        The body replaces the three as a whole. `enable` adds platform agents
        here and below (`*` alone is every one); `allow`, when set, is the
        only agents that may run here and below, and a child can only narrow
        it; `default` answers a message that tags no agent, here and below,
        and is an agent or `auto`. Every name is an agent in the workspace, a
        named default is available where it is set, and an agent that lives
        in a project is not enabled (400). The workspace's own lists, which
        hold the workspace default, and a company project's need
        `projects:govern`. `version` is the one the caller read (409 if it
        changed), and lists the platform file sets answer 409.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectAgentsInput"}
      responses:
        "200":
          description: The project's agents as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectAgentsView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/history:
    get:
      operationId: listProjectHistory
      tags: [projects]
      summary: Page what changed on a project, newest first
      description: |
        `next` is the cursor for the page after this one, or null at the end.
        Pass it back as `before`. A cursor is opaque. The workspace keeps its
        last 1,000 changes across all its projects.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - name: limit
          in: query
          description: Page size, 50 when left out.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [changes, next]
                properties:
                  changes:
                    type: array
                    maxItems: 200
                    items: {$ref: "#/components/schemas/ProjectChange"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/memory:
    get:
      operationId: listProjectMemory
      tags: [projects]
      summary: List the notes every agent in a project is sent
      description: |
        Every agent answering in the project or below it is sent them. The
        workspace's own (`~`) are sent to every agent answering anywhere in
        it.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's notes, approved and pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: addProjectMemory
      tags: [projects]
      summary: Write a note shared by every agent in a project
      description: |
        A person writing a note is its approval. The notes of the workspace
        and of company projects are changed with `projects:govern` as well.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteInput"}
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/memory/approve:
    post:
      operationId: approveProjectMemory
      tags: [projects]
      summary: Approve notes proposed for a project
      description: The notes of the workspace and of company projects are changed with `projects:govern` as well.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteSelection"}
      responses:
        "200":
          description: How many were approved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Approved"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/memory/{id}:
    delete:
      operationId: removeProjectMemory
      tags: [projects]
      summary: Remove a project note
      description: The notes of the workspace and of company projects are changed with `projects:govern` as well.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {name: id, in: path, required: true, description: The note's id., schema: {type: string}}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/projects/{name}/channels:
    get:
      operationId: listChannels
      tags: [projects]
      summary: List a project's channels
      description: |
        `general` first, then the others by name, archived ones included. A
        project has at most 20, and `general` always, even before it is
        first written (version 0). Each says who answers an untagged
        message in it.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    maxItems: 20
                    items: {$ref: "#/components/schemas/ChannelView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createChannel
      tags: [projects]
      summary: Add a channel to a project
      description: |
        A channel's name is lower case letters, digits and dashes, never
        changes, and is unique in the project. A `default` must be able to
        answer in the project (400). The workspace and company projects need
        `projects:govern`. Past 20 channels, 429.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "429": {$ref: "#/components/responses/TooMany"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/channels/{channel}:
    put:
      operationId: updateChannel
      tags: [projects]
      summary: Change a channel's title, purpose and default
      description: |
        The body replaces those three as a whole: one left out is cleared.
        `version` is the one the caller read (`general` reads 0 until it is
        first written), so a change made since answers 409. A field the
        platform file sets answers 409.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {$ref: "#/components/parameters/ChannelName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelUpdate"}
      responses:
        "200":
          description: The channel as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: archiveChannel
      tags: [projects]
      summary: Archive a channel
      description: |
        The channel and its threads stay, and it takes no new threads.
        `general` cannot be archived (409), nor can a channel the platform
        file declares.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
        - {$ref: "#/components/parameters/ChannelName"}
      responses:
        "204":
          description: Archived.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/projects/{name}/experts:
    get:
      operationId: getProjectExperts
      tags: [projects]
      summary: List who a project names as experts, by topic
      description: |
        Experts are found along the chain: for a topic, the nearest project
        that lists someone for it answers, then the projects above it.
      x-permission: projects:read
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      responses:
        "200":
          description: The project's experts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectExperts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateProjectExperts
      tags: [projects]
      summary: Replace a project's experts
      description: |
        At most 50, each a person's subject or `role:<name>` with 1 to 8
        topics. `version` is the project's, as read; a change made since
        answers 409, as does a list the platform file sets. The workspace
        and company projects need `projects:govern`.
      x-permission: projects:write
      parameters:
        - {$ref: "#/components/parameters/ProjectName"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectExperts"}
      responses:
        "200":
          description: The experts as they now stand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectExperts"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: Page the workspace's directory of people, by handle
      description: |
        Everyone who signed in, every person a client maps, and every
        subject the policy grants a role to (unless tenants come from a
        claim, since a grant names no tenant), at most 5,000 a workspace.
        `next` is the cursor for the page after this one, or null at the
        end; pass it back as `before`.
      x-permission: people:read
      parameters:
        - name: q
          in: query
          description: Keeps people whose name or handle holds it, ignoring case. Subjects are not searched.
          schema: {type: string, maxLength: 100}
        - name: limit
          in: query
          description: Page size, 50 when left out.
          schema: {type: integer, minimum: 1, maximum: 50}
        - name: before
          in: query
          description: The `next` cursor of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [people, next]
                properties:
                  people:
                    type: array
                    maxItems: 50
                    items: {$ref: "#/components/schemas/Person"}
                  next: {type: [string, "null"]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/people/{handle}/photo:
    get:
      operationId: getPersonPhoto
      tags: [people]
      summary: The photo a person uploaded for themselves
      description: Served by warp, never fetched from elsewhere. 404 for someone with none.
      x-permission: people:read
      parameters:
        - {$ref: "#/components/parameters/PersonHandle"}
      responses:
        "200":
          description: The picture, as the type warp found its bytes to be.
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/policies:
    get:
      operationId: listPolicies
      tags: [billing]
      summary: List the workspace's limits
      x-permission: billing:read
      responses:
        "200":
          description: One policy per scope that has one.
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items: {$ref: "#/components/schemas/Policy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: putPolicy
      tags: [billing]
      summary: Set the limits for one scope
      description: |
        Creates the scope's policy or writes its next version. The project,
        agent or client the scope names must exist. A narrower scope can only
        tighten what a wider one allows.
      x-permission: billing:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PolicyInput"}
      responses:
        "200":
          description: The policy as saved, with its new version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Policy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deletePolicy
      tags: [billing]
      summary: Remove the limits for one scope
      description: The scope is named in the query, not in a body.
      x-permission: billing:write
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [tenant, project, agent, client]}
        - name: name
          in: query
          description: The project, agent or client. Empty for the tenant scope.
          schema: {type: string}
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/policies/history:
    get:
      operationId: listPolicyHistory
      tags: [billing]
      summary: List every change made to the workspace's limits
      x-permission: billing:read
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: {$ref: "#/components/schemas/PolicyChange"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/usage:
    get:
      operationId: getUsage
      tags: [billing]
      summary: Report usage against every limit, for the current period
      description: |
        One entry per policy. A workspace with no policies has no entries.
        `state` is the worst of the enforced limits (runs and concurrency).
        Spend is recorded and not enforced, and `spend.metered` is false,
        because the runtime reports no cost.
      x-permission: billing:read
      responses:
        "200":
          description: Where each scope stands.
          content:
            application/json:
              schema:
                type: object
                required: [scopes]
                properties:
                  scopes:
                    type: array
                    items: {$ref: "#/components/schemas/ScopeUsage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/usage/notices:
    get:
      operationId: listUsageNotices
      tags: [billing]
      summary: List recent refusals and warnings from the usage ledger
      description: The 200 most recent.
      x-permission: billing:read
      responses:
        "200":
          description: The notices.
          content:
            application/json:
              schema:
                type: object
                required: [notices]
                properties:
                  notices:
                    type: array
                    items: {$ref: "#/components/schemas/UsageEntry"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}

  /api/clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List the workspace's clients and how many it may have
      x-permission: clients:read
      responses:
        "200":
          description: The clients. No response ever carries a secret.
          content:
            application/json:
              schema:
                type: object
                required: [clients, caps]
                properties:
                  clients:
                    type: array
                    items: {$ref: "#/components/schemas/ClientView"}
                  caps: {$ref: "#/components/schemas/ClientCaps"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      description: A workspace at its cap of clients answers 429 with a plain error body.
      x-permission: clients:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInput"}
      responses:
        "201":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooMany"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      x-permission: clients:read
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientView"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: updateClient
      tags: [clients]
      summary: Replace a client's record
      description: |
        A secret left out is kept. A client the server's configuration owns
        cannot be changed here and answers 409.
      x-permission: clients:write
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientInput"}
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      x-permission: clients:write
      parameters:
        - {$ref: "#/components/parameters/ClientID"}
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/ServerError"}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OIDC access token issued for the API audience, sent as
        `Authorization: Bearer <token>`. A machine uses a client-credentials
        token and is granted exactly the scopes on it that are named
        `warp:<permission>`, for example `warp:runs:write`. A person
        using a CLI sends an access token too, and gets roles from its groups
        claim. An ID token is not an API credential and is refused. There is
        no revocation check beyond expiry.
    sessionCookie:
      type: apiKey
      in: cookie
      name: warp_session
      description: |
        The opaque, HttpOnly cookie a browser is given by `/auth/callback`. It
        is named `__Host-warp_session` when the server is reached over
        https. A browser never holds a token. Under development auth
        (`-auth=dev`, loopback only) every request is the same admin and no
        credential is needed.
  parameters:
    AgentName:
      name: name
      in: path
      required: true
      description: The agent's name.
      schema: {type: string}
    RunID:
      name: id
      in: path
      required: true
      description: The run's id, as the platform returned it. It is derived from the workspace and the trigger's id, `r` and 32 hex digits, and is not the trigger's id.
      schema: {type: string}
    ScheduleName:
      name: name
      in: path
      required: true
      description: The schedule's name.
      schema: {type: string}
    MessageID:
      name: id
      in: path
      required: true
      description: The inbox message's id.
      schema: {type: string}
    ArtifactID:
      name: id
      in: path
      required: true
      description: The artifact's id.
      schema: {type: string}
    SuiteName:
      name: name
      in: path
      required: true
      description: The eval suite's name.
      schema: {type: string}
    SourceName:
      name: name
      in: path
      required: true
      description: The knowledge source's name.
      schema: {type: string}
    DocumentID:
      name: id
      in: path
      required: true
      description: The document's id.
      schema: {type: string}
    ProjectName:
      name: name
      in: path
      required: true
      description: The project's name, or `~` for the workspace itself. A name never starts with `~`.
      schema: {type: string, maxLength: 63}
    ChannelName:
      name: channel
      in: path
      required: true
      description: The channel's name within its project.
      schema: {type: string, maxLength: 40}
    ThreadID:
      name: id
      in: path
      required: true
      description: The thread's id, `th-` and 16 hex digits, or for a conversation from before threads the id of the run that started it.
      schema: {type: string}
    PersonHandle:
      name: handle
      in: path
      required: true
      description: The person's handle, as the directory lists it.
      schema: {type: string, maxLength: 32}
    ClientID:
      name: id
      in: path
      required: true
      description: The client's id.
      schema: {type: string}
    Window:
      name: window
      in: query
      description: How far back to look, as a Go duration up to `720h`, such as `1h` or `24h`. Defaults to `1h`.
      schema: {type: string}
  responses:
    ServerError:
      description: An error on the server's side. It is logged and reported without detail.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    TooLarge:
      description: The request body is over 1 MiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    BadRequest:
      description: The request is not valid. The message says why.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Unauthorized:
      description: No credential, or one that does not verify.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Forbidden:
      description: The caller lacks the permission, or a rule refuses the action. The message names what is needed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    NotFound:
      description: No such object in the caller's workspace. Another workspace's object answers the same.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Conflict:
      description: The object already exists, was changed by someone else, is busy, or is managed by the server.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    TooMany:
      description: A cap on how many may exist, or on how fast they may be made, was reached.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorBody"}
    Refused:
      description: |
        A limit refused the run. 429 for a count limit (runs in the period,
        runs in flight, or tokens in the period), 402 for a money limit (spend
        in the period, which is enforced, or a call's lease). A scope whose
        spend has reached its limit, to the micro-dollar, refuses every new
        run. The body names the limit, what was left, the policy and its
        version that set it, and when the count starts again.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Refusal"}
  schemas:
    ErrorBody:
      description: What every failure answers with.
      type: object
      required: [error]
      properties:
        error:
          description: What went wrong, in words a person can be shown.
          type: string
    Refusal:
      description: Why a limit refused a run.
      type: object
      required: [error, limit, remaining]
      properties:
        error: {type: string}
        limit: {$ref: "#/components/schemas/PolicyLimit"}
        remaining:
          description: What was left of the limit when the run was refused.
          type: integer
          format: int64
        policy:
          description: The policy that refused, when one did.
          type: object
          required: [scope, version, period]
          properties:
            scope: {$ref: "#/components/schemas/PolicyScope"}
            version: {type: integer}
            period: {$ref: "#/components/schemas/PolicyPeriod"}
        resets_at:
          description: When the count starts again. Present for the `runs`, `spend` and `tokens` limits, which count over a period.
          type: string
          format: date-time

    Permission:
      type: string
      enum:
        - agents:read
        - agents:write
        - runs:read
        - runs:write
        - schedules:read
        - schedules:write
        - alerts:read
        - alerts:write
        - knowledge:read
        - knowledge:write
        - evals:read
        - evals:write
        - billing:read
        - billing:write
        - artifacts:read
        - artifacts:write
        - clients:read
        - clients:write
        - projects:read
        - projects:write
        - projects:govern
        - people:read
    Principal:
      description: An authenticated caller. The tenant is the workspace everything they touch is confined to.
      type: object
      required: [subject, tenant, kind]
      properties:
        subject: {type: string}
        tenant: {type: string}
        kind: {type: string, enum: [user, machine]}
        name: {type: string}
        email: {type: string}
        roles:
          type: array
          items: {type: string, enum: [viewer, operator, manager, admin]}
        scopes:
          description: A machine's permissions, from its token.
          type: array
          items: {$ref: "#/components/schemas/Permission"}
    AccessDecision:
      description: Why the caller may or may not do one thing.
      type: object
      required: [permission, allowed, outcome, held]
      properties:
        permission: {$ref: "#/components/schemas/Permission"}
        allowed: {type: boolean}
        outcome:
          description: >-
            allowed; denied, when a rule denies it, which beats every allow;
            no match, when no rule in the roles held mentions it and the
            default is deny; scope, when a machine's token scope decided.
          type: string
          enum: [allowed, denied, no match, scope]
        role:
          description: The held role the deciding rule reached the caller through.
          type: string
        path:
          description: From role to the role that declares the rule.
          type: array
          items: {type: string}
        rule:
          description: The deciding rule, as the policy writes it.
          type: string
        grant:
          description: The grant that gave the role, when the sign-in kept it.
          type: string
        held:
          description: Every role the decision considered.
          type: array
          items: {$ref: "#/components/schemas/AccessHeldRole"}
        unknown:
          description: Roles the caller holds that the policy does not declare. They grant nothing.
          type: array
          items: {type: string}
    AccessHeldRole:
      type: object
      required: [role]
      properties:
        role: {type: string}
        grant:
          description: The grant that gave the role, as the policy writes it, when known.
          type: string
        group:
          description: The group the grant names, when it names one.
          type: string
    Me:
      type: object
      required: [principal, permissions, first_admin]
      properties:
        principal: {$ref: "#/components/schemas/Principal"}
        permissions:
          description: Everything the caller may do. Null, not an empty list, for a caller with no permission at all.
          type: [array, "null"]
          items: {$ref: "#/components/schemas/Permission"}
        first_admin:
          description: The caller is an admin in a workspace nobody has set up yet.
          type: boolean

    AgentSource:
      type: object
      required: [name, uri]
      properties:
        name: {type: string}
        uri: {type: string}
        options:
          type: object
          additionalProperties: {type: string}
    AgentAccess:
      type: object
      properties:
        spawn:
          description: The agents this one may call.
          type: array
          items: {type: string}
        workspace_areas:
          type: array
          items: {type: string}
    AgentSpec:
      description: An agent's definition.
      type: object
      required: [name, model, provider, system_prompt]
      properties:
        name: {type: string}
        description: {type: string}
        model: {type: string}
        provider:
          description: A model provider, or `policy` to run on the workspace model policy named by `model`.
          type: string
        fallbacks:
          description: |
            Models tried in order when the primary fails with an error another
            model could get past (an outage, a rate limit, an exhausted retry).
            An invalid request or a cancellation is not retried elsewhere. At
            most 4, none repeating the primary or each other.
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/ModelRef"}
        fallback_on:
          description: When a call moves to the next fallback. Empty means any error another model could get past. Needs at least one fallback.
          type: array
          items: {$ref: "#/components/schemas/FallbackCondition"}
        system_prompt: {type: string}
        tools:
          type: array
          items: {type: string}
        sources:
          type: array
          items: {$ref: "#/components/schemas/AgentSource"}
        access: {$ref: "#/components/schemas/AgentAccess"}
        approvals:
          description: |
            Tools whose every call waits for a person to approve it. Each is a
            tool the agent is granted. `ask_person` in `tools` lets the agent
            ask a person to choose or reply.
          type: array
          items: {type: string}
        approvers:
          description: |
            When set, the only people who may answer an approval: principals by
            subject, or this workspace's roles as `role:<name>`. Empty lets
            anyone in the workspace approve, except the person who asked.
          type: array
          items: {type: string}
        self_approval:
          description: Lets the person whose request raised a call approve it. Off by default.
          type: boolean
        answerers:
          description: When set, the only people who may answer a choice or a reply, named as approvers are.
          type: array
          items: {type: string}
    FallbackCondition:
      description: A class of model error that moves a call on to the next model. `any` cannot be combined with another.
      type: string
      enum: [any, unavailable, rate_limit, transient, auth, context_length, content_filter]
    ModelPolicy:
      description: A workspace's named, ordered list of models. The first answers; the rest are fallbacks.
      type: object
      required: [name, models]
      properties:
        name: {type: string}
        description: {type: string}
        models:
          type: array
          minItems: 1
          maxItems: 5
          items: {$ref: "#/components/schemas/ModelRef"}
        fallback_on:
          description: When a call moves to the next model. Empty means any error another model could get past.
          type: array
          items: {$ref: "#/components/schemas/FallbackCondition"}
    ModelRef:
      description: One model, named by its provider.
      type: object
      required: [provider, model]
      properties:
        provider: {type: string}
        model: {type: string}
    Revision:
      description: One immutable revision of an agent.
      type: object
      required: [spec, rev, hash, created_at, created_by]
      properties:
        spec: {$ref: "#/components/schemas/AgentSpec"}
        rev: {type: integer}
        hash: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
    Choice:
      description: Which agent @auto would pick for a message, and why.
      type: object
      required: [agent, reason]
      properties:
        agent: {type: string}
        reason:
          description: 'A sentence a person reads, such as "Picked by @auto: matched billing."'
          type: string
        matched:
          type: array
          items: {type: string}

    Note:
      description: One thing an agent or a project remembers.
      type: object
      required: [id, text, source, status, at]
      properties:
        id: {type: string}
        text: {type: string}
        source: {type: string, enum: [person, consolidated]}
        status:
          description: A pending note is a proposal, not used until a person approves it.
          type: string
          enum: [approved, pending]
        by: {type: string}
        at: {type: string, format: date-time}
    NoteList:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items: {$ref: "#/components/schemas/Note"}
    NoteInput:
      type: object
      required: [text]
      properties:
        text: {type: string}
    NoteSelection:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: {type: string}
    Approved:
      type: object
      required: [approved]
      properties:
        approved: {type: integer}
    MemoryProposal:
      description: A proposed note, for an agent or for a project.
      type: object
      required: [note]
      properties:
        agent: {type: string}
        project:
          description: The project the note is for, `~` for the workspace's own.
          type: string
        note: {$ref: "#/components/schemas/Note"}

    Actor:
      description: The person or system that raised a run.
      type: object
      required: [id]
      properties:
        id: {type: string}
        display: {type: string}
        bot: {type: boolean}
        user:
          description: The person's own account in the product that sent the request, next to the connector's id for them.
          type: string
    RunStatus:
      description: Where a run stands. `completed`, `failed` and `stopped` are final.
      type: string
      enum: [accepted, running, parked, completed, failed, stopped]
    CallMode:
      description: How one agent calls another. A subagent is attached to its caller. A handoff or a delegate is independent.
      type: string
      enum: [subagent, handoff, delegate]
    Run:
      description: One run and its place in the call tree and in its conversation.
      type: object
      required: [id, tag_id, tenant, agent, rev, origin, text, root, depth, thread, lease, granted, spent, calls, status, created_at, updated_at]
      properties:
        id:
          description: The run's id, `r` and 32 hex digits, derived from the workspace and the trigger's id.
          type: string
        tag_id:
          description: |
            The trigger's id the run was accepted with: an event id, or for a
            run started through the API with an `Idempotency-Key`,
            `api-<length of subject in bytes>-<subject>-<key>`, which is
            unambiguous. A run started without a key has `api-r-<random>`.
            The run's `id` is derived from it and the workspace, and cannot be
            turned back into it.
          type: string
        tenant: {type: string}
        agent: {type: string}
        rev:
          description: The agent revision the run is pinned to.
          type: integer
        origin:
          description: The trigger that raised the run, such as `api`, `slack`, `github`, `cron`, `manual`, `agent` or `system`.
          type: string
        text:
          description: What the run was asked.
          type: string
        input: {$ref: "#/components/schemas/PreparedCallInput"}
        actor: {$ref: "#/components/schemas/Actor"}
        root:
          description: The run at the top of the call tree. A run nobody called is its own root.
          type: string
        parent: {type: string}
        depth: {type: integer}
        mode: {$ref: "#/components/schemas/CallMode"}
        lifecycle:
          description: Set on a run another run called. An attached run ends with its caller. A delegated one does not.
          type: string
          enum: [attached, delegated]
        schedule:
          description: The schedule that raised the run, if one did.
          type: string
        thread:
          description: The conversation the run belongs to. A run that starts a conversation is its own thread.
          type: string
        prev:
          description: The turn this one follows. Two runs with the same `prev` are branches.
          type: string
        picked:
          description: Why the agent was chosen, when the caller left it to the platform.
          type: string
        project: {type: string}
        within:
          description: |
            The project's ancestors, nearest first and the workspace left out,
            pinned when the run was admitted: what it counts toward besides
            its project. A run an agent called has its root's.
          type: array
          maxItems: 3
          items: {type: string}
        client:
          description: The Slack app or GitHub installation that raised the run.
          type: string
        channel:
          description: The project's channel the conversation is in. Absent is `general`. A called run has its root's.
          type: string
        message:
          description: |
            The person's message in a shared thread that the run answers, such
            as `m-3`. Runs that answer one message answer it side by side and
            are not branches.
          type: string
        lease:
          description: The run's budget in micro-USD. Zero means unmetered.
          type: integer
          format: int64
        granted:
          description: |
            The budget the run has leased to calls that have not ended, in
            micro-USD. When a call ends its lease is released here and what it
            spent is added to `spent`.
          type: integer
          format: int64
        spent:
          description: |
            What the run has spent, in micro-USD priced in US dollars: its own
            model calls as they are reported, and the whole spend of each call
            it made once that call has ended. Its lease is held against this
            plus `granted`. Calls with no price, or priced in another currency,
            add nothing here; `usage` counts them.
          type: integer
          format: int64
        usage:
          description: |
            What the run used, as the runtime counts it: its own model calls,
            the attached runs it rolled up, and how full its context was at its
            latest model call. While the run works it is the calls reported so
            far; once it has ended it is the runtime's record. Absent until the
            first model call. A delegated run is not in its caller's usage.
          $ref: "#/components/schemas/RunUsage"
        calls: {type: integer}
        status: {$ref: "#/components/schemas/RunStatus"}
        answer:
          description: |
            The final text of a completed run. On a stopped run it is the
            partial answer, what the agent had said when it stopped, which may
            be empty. It is never the whole answer when `status` is `stopped`.
          type: string
        error: {type: string}
        reason:
          description: What a parked run is waiting for.
          type: string
        question:
          description: What a parked run is waiting on a person for. Absent once it resumes or ends.
          $ref: "#/components/schemas/Question"
        cause:
          description: Why a stopped run was stopped, as the runtime reported it, such as `Stopped by ada`.
          type: string
        stopping:
          description: The run was asked to stop and has not ended yet. It starts no further calls. Absent once the run has ended, however it ended.
          type: boolean
        stop_requested_at:
          description: When the run was first asked to stop. Absent once the run has ended.
          type: string
          format: date-time
        finishing:
          description: The run has its answer and is held open by attached runs still working.
          type: boolean
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {$ref: "#/components/schemas/Run"}
    CreateRunRequest:
      type: object
      required: [text]
      properties:
        agent:
          description: |
            Who should answer: an agent, or `auto` for `@auto`, which picks
            among the agents available where the conversation is filed. Left
            out, the default the conversation's place inherits answers: the
            thread's, the acting client's, the channel's, then the project
            chain's and the workspace's.
          type: string
        text:
          description: The message. It must not be blank.
          type: string
        after:
          description: |
            The id of the turn this message follows. Empty starts a
            conversation. Naming a turn that already has a reply starts a
            branch from that point.
          type: string
        project:
          description: Files a new conversation under a project. A follow-up keeps its conversation's project.
          type: string
        act_as:
          description: |
            The person a surface asks for, such as a Slack user its client
            maps. The run's actor is that person, so they do not approve its
            calls. Only the credential the client names may send it.
          $ref: "#/components/schemas/ActAs"
    ActAs:
      description: A person a surface authenticated itself, named by the surface's client and the surface's own user id.
      type: object
      required: [client, user]
      properties:
        client: {type: string}
        user: {type: string}
    AgentCallInput:
      description: Explicit helper context and its return contract. Agent rules remain pinned.
      type: object
      required: [messages, response_format]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/AgentCallMessage"}
        response_format: {$ref: "#/components/schemas/AgentCallResponseFormat"}
    AgentCallMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: "#/components/schemas/AgentCallPart"}
    AgentCallPart:
      description: Inline text or a reference resolved within the caller's workspace.
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: {type: string, enum: [text]}
            text: {type: string}
        - type: object
          required: [type, thread, from, through]
          properties:
            type: {type: string, enum: [conversation_range]}
            thread: {type: string}
            from: {type: string}
            through: {type: string}
        - type: object
          required: [type, id, version]
          properties:
            type: {type: string, enum: [artifact]}
            id: {type: string}
            version: {type: integer}
        - type: object
          required: [type, run]
          properties:
            type: {type: string, enum: [run_result]}
            run: {type: string}
    AgentCallResponseFormat:
      description: Validated helper output, independent of delivery and permissions.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [text]}
            max_chars: {type: integer, minimum: 0, maximum: 64000}
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [summary]}
            max_words: {type: integer, minimum: 0, maximum: 2000}
        - type: object
          required: [type, schema]
          properties:
            type: {type: string, enum: [json_schema]}
            schema:
              description: A JSON Schema object or boolean schema.
              oneOf:
                - {type: object, additionalProperties: true}
                - {type: boolean}
    PreparedCallInput:
      description: Original references plus the exact resolved messages used on replay.
      type: object
      required: [input, messages]
      properties:
        input: {$ref: "#/components/schemas/AgentCallInput"}
        messages:
          type: array
          items:
            type: object
            required: [role, text]
            properties:
              role: {type: string, enum: [user, assistant]}
              text: {type: string}
    CreateCallRequest:
      type: object
      required: [key, agent, mode]
      properties:
        key:
          description: Identifies the call within the caller's run. The same key joins the child it already started.
          type: string
        agent: {type: string}
        text:
          description: Plain text shorthand. Supply text or input, never both.
          type: string
        input: {$ref: "#/components/schemas/AgentCallInput"}
        mode: {$ref: "#/components/schemas/CallMode"}
        lease:
          description: The budget granted to the child, in micro-USD.
          type: integer
          format: int64
    ThreadSummary:
      description: |
        One conversation: what its runs say, with what its record adds. A
        thread people started that no agent has answered yet is one too.
      type: object
      required: [id, title, named, origin, channel, agents, people, turns, branches, active, failed, created_at, updated_at, visibility, messages]
      properties:
        id: {type: string}
        title: {type: string}
        named:
          description: The title is a name, not just the first message.
          type: boolean
        origin: {type: string}
        project: {type: string}
        channel:
          description: The project's channel it is in, `general` when its runs name none.
          type: string
        agents:
          type: array
          items: {type: string}
        people:
          description: The people who asked or posted in it, by handle. Someone the directory cannot name, and whose subject holds an address, is left out.
          type: array
          items: {type: string}
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        messages:
          description: How many messages people have posted in it.
          type: integer
        turns: {type: integer}
        branches: {type: integer}
        active:
          description: How many of its runs are in flight.
          type: integer
        failed: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ThreadVisibility:
      description: |
        Who reads a thread. `shared` is everyone who can see its project.
        `private`, its participants only, is refused until every read path
        is confined.
      type: string
      enum: [shared, private]
    ThreadParticipant:
      description: |
        A person or an agent taking part in a thread. A thread names a
        person by their handle, and is sent one by handle: a subject, the key
        a person signs in with, can hold an address and is never shown. A
        person with no handle, whose subject holds no address, is named by
        their subject; one with neither reads as empty.
      type: object
      required: [kind, name, at]
      properties:
        kind: {type: string, enum: [person, agent]}
        name:
          description: A person's handle or an agent's name.
          type: string
          maxLength: 200
        owner:
          description: The person who started the thread.
          type: boolean
        added_by:
          description: The handle of the person who added them.
          type: string
        at: {type: string, format: date-time}
    Thread:
      description: |
        A shared thread's record: the channel it is in, who takes part, its
        visibility and an optional default agent. Its turns are its people's
        messages and its agents' runs.
      type: object
      required: [id, project, channel, visibility, participants, version, created_by, created_at, updated_at]
      properties:
        id:
          description: "`th-` and 16 hex digits, or for a conversation from before threads the id of the run that started it."
          type: string
        project:
          description: The project it is filed in. Empty is the workspace itself.
          type: string
        channel: {type: string}
        title: {type: string, maxLength: 200}
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        participants:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ThreadParticipant"}
        default:
          description: Answers an untagged message here, an agent or `auto`. Absent inherits from the channel.
          type: string
        version:
          description: Counts edits to the record, from 1. A conversation from before threads reads 0 until its record is written.
          type: integer
        created_by:
          description: The handle of the person who started it, the first person to ask or post in it.
          type: string
        created_at: {type: string, format: date-time}
        updated_at:
          description: When anything last happened in it.
          type: string
          format: date-time
    ThreadMention:
      description: One tag in a message, and what it came to.
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [agent, person, sme]}
        name:
          description: The agent (`auto` for @auto), the person's handle (as written, when nobody goes by it), or the experts' topic (empty for every expert).
          type: string
        run:
          description: The run an agent's tag started.
          type: string
        refused:
          description: Why the tag started or notified nothing.
          type: string
    ThreadAnswerRef:
      description: The question a message answers.
      type: object
      additionalProperties: false
      required: [run, question]
      properties:
        run: {type: string}
        question: {type: string}
    ThreadMessage:
      description: A person's turn in a thread. It starts no run of its own. Its author is always a person.
      type: object
      required: [id, thread, by, name, text, mentions, via, at]
      properties:
        id:
          description: "`m-` and its place in the thread, from 1."
          type: string
        thread: {type: string}
        prev:
          description: The turn it follows. Absent for the first.
          type: string
        by:
          description: The handle of the person who posted it.
          type: string
        name:
          description: What they are called, their name in the directory or else their handle. Never an address.
          type: string
        text: {type: string, maxLength: 8000}
        mentions:
          type: array
          maxItems: 10
          items: {$ref: "#/components/schemas/ThreadMention"}
        answers: {$ref: "#/components/schemas/ThreadAnswerRef"}
        via:
          description: "`console`, or the id of the client it came through."
          type: string
        surface_id: {type: string}
        at: {type: string, format: date-time}
    ThreadTurn:
      description: One turn of a thread, a person's message or an agent's run.
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [message, run]}
        message: {$ref: "#/components/schemas/ThreadMessage"}
        run: {$ref: "#/components/schemas/Run"}
    ThreadAnswers:
      description: |
        Who answers an untagged message in a place, and where that is set:
        `thread`, `client`, `channel`, or `project:<name>` (`project:~` for
        the workspace). An empty agent is nobody. `unavailable` says why the
        default cannot answer, when it has stopped being available.
      type: object
      required: [agent, from]
      properties:
        agent: {type: string}
        from: {type: string}
        unavailable: {type: string}
    ThreadPage:
      description: A thread and one page of its turns, oldest first.
      type: object
      required: [thread, turns, next, answers]
      properties:
        thread: {$ref: "#/components/schemas/Thread"}
        turns:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/ThreadTurn"}
        next:
          description: The cursor for the turns before these, null at the start.
          type: [string, "null"]
        answers: {$ref: "#/components/schemas/ThreadAnswers"}
    ThreadInput:
      description: A new shared thread and its first message.
      type: object
      additionalProperties: false
      required: [visibility, text]
      properties:
        project:
          description: Where it is filed. Empty or `~` is the workspace itself.
          type: string
          maxLength: 63
        channel:
          description: The project's channel. Empty is `general`.
          type: string
          maxLength: 40
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        title: {type: string, maxLength: 200}
        default:
          description: Answers untagged messages in the thread, an agent available in the project or `auto`.
          type: string
        text: {type: string, maxLength: 8000}
        post_only:
          description: Post without any agent answering, unless the message tags one.
          type: boolean
        act_as: {$ref: "#/components/schemas/ActAs"}
    ThreadMessageInput:
      description: A message posted in a thread.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, maxLength: 8000}
        after:
          description: The turn it follows. Empty follows the latest.
          type: string
        post_only: {type: boolean}
        answers: {$ref: "#/components/schemas/ThreadAnswerRef"}
        act_as: {$ref: "#/components/schemas/ActAs"}
    ThreadUpdate:
      description: A thread's title, visibility and default, as a whole.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer}
        title: {type: string, maxLength: 200}
        visibility: {$ref: "#/components/schemas/ThreadVisibility"}
        default: {type: string}
    ThreadParticipantsUpdate:
      description: People and agents to add to a thread and to remove from it.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer}
        add:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ThreadParticipant"}
        remove:
          description: People by handle and agents by name, which no person and agent share.
          type: array
          maxItems: 50
          items: {type: string}
    ThreadRule:
      description: |
        The rule that decided what a message starts, the first that applies:
        `tagged` (the agents it tags answer), `people` (it tags only people
        or experts), `reply` (it answers a question or replies to a
        mention), `post_only`, or `default` (the inherited default answers,
        if there is one).
      type: string
      enum: [tagged, people, reply, post_only, default]
    ThreadPosted:
      description: What posting a message did.
      type: object
      required: [thread, message, runs, notified, refused, rule]
      properties:
        thread: {$ref: "#/components/schemas/Thread"}
        message: {$ref: "#/components/schemas/ThreadMessage"}
        runs:
          description: The runs it started, at most 3.
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/Run"}
        notified:
          description: Who it was sent to, people and experts by handle and the experts a role names as `role:<name>`.
          type: array
          items: {type: string}
        refused:
          description: Its tags that started or notified nothing, each saying why.
          type: array
          items: {$ref: "#/components/schemas/ThreadMention"}
        rule: {$ref: "#/components/schemas/ThreadRule"}
        reason:
          description: Why no agent answers, when none does.
          type: string
    ThreadNotice:
      description: Says that something happened in a thread, and nothing about what. Fetch the thread to see it.
      type: object
      required: [id, at]
      properties:
        id: {type: string}
        message:
          description: The message posted or settled, if one was.
          type: string
        at: {type: string, format: date-time}
    Channel:
      description: |
        One place in a project where threads live. Its name is its identity
        in the project and never changes. A channel has its project's
        visibility. `general` is in every project and reads as version 0
        until it is first written.
      type: object
      required: [project, name, version, created_at, updated_at]
      properties:
        project:
          description: The project it is in. Empty is the workspace itself.
          type: string
        name: {type: string, maxLength: 40}
        title: {type: string, maxLength: 80}
        purpose:
          description: Sent to every agent answering in the channel.
          type: string
          maxLength: 200
        default:
          description: Answers untagged messages here, an agent or `auto`. Absent inherits from the project.
          type: string
        archived:
          description: It and its threads stay, and it takes no new threads.
          type: boolean
        managed:
          description: "`file` when the platform file declares the channel."
          type: string
        version: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    ChannelView:
      description: A channel, and who answers an untagged message in it.
      allOf:
        - {$ref: "#/components/schemas/Channel"}
        - type: object
          required: [answers]
          properties:
            answers: {$ref: "#/components/schemas/ThreadAnswers"}
    ChannelInput:
      description: A new channel.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: Lower case letters, digits and dashes, at most 40. It cannot change later.
          type: string
          maxLength: 40
        title: {type: string, maxLength: 80}
        purpose: {type: string, maxLength: 200}
        default: {type: string}
    ChannelUpdate:
      description: A channel's title, purpose and default, as a whole.
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer}
        title: {type: string, maxLength: 80}
        purpose: {type: string, maxLength: 200}
        default: {type: string}
    ProjectExpert:
      description: Who answers for some topics in a project, a person by subject or `role:<name>`.
      type: object
      additionalProperties: false
      required: [who, topics]
      properties:
        who: {type: string, maxLength: 200}
        topics:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: string, maxLength: 32}
    ProjectExperts:
      description: The experts a project lists, at the project's version.
      type: object
      additionalProperties: false
      required: [version, experts]
      properties:
        version: {type: integer}
        experts:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ProjectExpert"}

    ProjectKind:
      description: |
        What a project is for. `company` is company-wide: it sits under the
        workspace or another company project, and is created and changed only
        with `projects:govern`; a workspace has at most 10. `team` is the
        default and sits anywhere. `account` is a customer account, never
        under another account. The workspace itself is `company`.
      type: string
      enum: [company, team, account]
    ProjectAccount:
      description: What an account project records about its customer.
      type: object
      properties:
        customer: {type: string, maxLength: 120}
        external_id:
          description: The customer's id in another system, such as a CRM.
          type: string
          maxLength: 120
        url:
          description: An https link to the customer's record.
          type: string
          maxLength: 500
    Project:
      description: |
        One place in the tree. `name` is the identity: unique ignoring case,
        never changed. The workspace itself is the project named `""` (`~` in
        a path), which has no title, parent or account: show the workspace's
        name for it. It reads as version 0 until it is first changed.
      type: object
      required: [name, kind, experts, agents, version, created_at, updated_at]
      properties:
        name: {type: string, maxLength: 63}
        title:
          description: What people see. Shown instead of the name when set.
          type: string
          maxLength: 80
        description: {type: string, maxLength: 500}
        kind: {$ref: "#/components/schemas/ProjectKind"}
        parent:
          description: The project it sits under, fixed when it was created. Absent for the top level.
          type: string
          maxLength: 63
        account: {$ref: "#/components/schemas/ProjectAccount"}
        instructions:
          description: |
            Sent to every agent answering here and below, after the
            instructions of the projects above. The agent's own instructions
            win over them.
          type: string
          maxLength: 4000
        experts:
          description: Who answers for some topics here and below. Set with `PUT /api/projects/{name}/experts`.
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ProjectExpert"}
        agents: {$ref: "#/components/schemas/ProjectAgents"}
        managed:
          description: "`file` when the platform file declares the project, and absent otherwise. The fields the file sets answer 409 here, and the project cannot be deleted here."
          type: string
        version:
          description: Counts writes, from 1. A change names the version it read.
          type: integer
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_by: {type: string}
        updated_at:
          description: When the record last changed. What happened in it is `active_at` on a view.
          type: string
          format: date-time
    ProjectStep:
      description: One project on the way down to another.
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        title: {type: string}
        kind: {$ref: "#/components/schemas/ProjectKind"}
    ProjectView:
      description: A project, where it sits, and what is in it.
      allOf:
        - {$ref: "#/components/schemas/Project"}
        - type: object
          required: [depth, path, children, conversations, active, schedules, notes, proposed]
          properties:
            depth:
              description: How many levels below the workspace it sits, 1 to 4. The workspace itself is 0.
              type: integer
              minimum: 0
              maximum: 4
            path:
              description: The projects from the top level down to this one, the workspace left out, so it is as long as `depth`.
              type: array
              maxItems: 4
              items: {$ref: "#/components/schemas/ProjectStep"}
            children:
              description: How many sub-projects it has.
              type: integer
            conversations:
              description: How many conversations are filed in it, its sub-projects' not counted.
              type: integer
            active:
              description: How many runs in those conversations are in flight.
              type: integer
            active_at:
              description: When a run in one of them last changed. Absent when nothing has been filed in it.
              type: string
              format: date-time
            schedules:
              description: How many schedules file their runs in it.
              type: integer
            notes:
              description: How many shared notes are in use.
              type: integer
            proposed:
              description: How many notes wait for someone to approve them.
              type: integer
    ProjectLimit:
      description: |
        A limit a run filed in the project falls under for being there, and
        the project it is set on. What the limit allows is read from
        `GET /api/policies`, which needs `billing:read`.
      type: object
      required: [scope, from]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        from:
          description: The project the limit is set on, this one or one above it, or `""` for the workspace's own.
          type: string
    ProjectDetail:
      description: One project, the projects above and below it, and the limits that hold it.
      type: object
      required: [project, ancestors, children, limits]
      properties:
        project: {$ref: "#/components/schemas/ProjectView"}
        ancestors:
          description: The projects above it, the workspace first, so they read as a breadcrumb. Empty for the workspace.
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/ProjectView"}
        children:
          description: Its sub-projects, by name ignoring case.
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/ProjectView"}
        limits:
          description: Its own limit, each ancestor's nearest first, then the workspace's. The strictest of them refuses a run.
          type: array
          maxItems: 5
          items: {$ref: "#/components/schemas/ProjectLimit"}
    ProjectInput:
      description: A new project. `kind` defaults to `team` and `parent` to the top level.
      type: object
      required: [name]
      properties:
        name:
          description: The identity, never changed. Letters, digits, spaces, dashes and underscores, starting with a letter or digit.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{0,62}$"
          maxLength: 63
        title: {type: string, maxLength: 80}
        description: {type: string, maxLength: 500}
        kind: {$ref: "#/components/schemas/ProjectKind"}
        parent:
          description: The project to put it under. Empty or `~` is the top level. At most four levels.
          type: string
          maxLength: 63
        account: {$ref: "#/components/schemas/ProjectAccount"}
        instructions: {type: string, maxLength: 4000}
    ProjectUpdate:
      description: What a person may change on a project, as a whole. A field left out is cleared.
      type: object
      required: [version]
      properties:
        version:
          description: The version the caller read.
          type: integer
        title: {type: string, maxLength: 80}
        description: {type: string, maxLength: 500}
        account: {$ref: "#/components/schemas/ProjectAccount"}
        instructions: {type: string, maxLength: 4000}
    ProjectChange:
      description: One entry of the record of what changed on a project.
      type: object
      required: [seq, at, by, project, what]
      properties:
        seq:
          type: integer
          format: int64
        at: {type: string, format: date-time}
        by:
          description: Who made the change. `migration` for projects moved out of settings.
          type: string
        project: {type: string}
        what:
          description: |
            `managed` is the platform file taking the project over or letting
            it go. `agents` is a change to what the project turns on. `home`
            is an agent coming to live in the project, or leaving it: `agent`
            names it and `note` says which. `experts` is a change to who the
            project names as experts, and `channel` to one of its channels,
            which `channel` holds before and after.
          type: string
          enum: [created, updated, deleted, managed, agents, home, experts, channel]
        agent:
          description: The agent a home change is about.
          type: string
        note:
          description: Says more, such as that a project created under a deleted name adopts its old conversations.
          type: string
        before: {$ref: "#/components/schemas/Project"}
        after: {$ref: "#/components/schemas/Project"}
        channel:
          description: The channel before and after, on a change to one of the project's channels.
          type: object
          properties:
            before: {$ref: "#/components/schemas/Channel"}
            after: {$ref: "#/components/schemas/Channel"}
    ProjectAgents:
      description: |
        What a project turns on. An agent is available in a project when
        something on its chain offers it (an `enable` list, `*` for every
        platform agent, or the agent living there or above) and every `allow`
        list on the chain permits it. The zero value adds nothing.
      type: object
      required: [enable]
      properties:
        enable:
          description: Platform agents available here and below. `*` alone is every platform agent.
          type: array
          maxItems: 64
          items: {type: string}
        allow:
          description: When set, the only agents that may run here and below. Absent narrows nothing.
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string}
        default:
          description: Answers a message that tags no agent, here and below. An agent or `auto`. Absent inherits.
          type: string
    AgentAvailability:
      description: Which agents may run in a project.
      type: object
      required: [all, names]
      properties:
        all:
          description: Every platform agent, because `*` is enabled on the chain and no allow list narrows it.
          type: boolean
        names:
          description: With `all`, the agents living on the chain, which `*` never reaches; without, every agent available.
          type: array
          items: {type: string}
    AgentOffer:
      description: One agent available in a project, and where it comes from.
      type: object
      required: [agent, from]
      properties:
        agent:
          description: The agent, or `*` for every platform agent.
          type: string
        from:
          description: The nearest project on the chain that enables it, or the one it lives in. `~` is the workspace.
          type: string
        home:
          description: Set when the agent lives in `from`.
          type: boolean
    DefaultResolved:
      description: Who answers a message that tags no agent, and where that default is set.
      type: object
      required: [agent, from]
      properties:
        agent:
          description: An agent, or `auto`.
          type: string
        from:
          description: "`project:<name>`, or `project:~` for the workspace."
          type: string
    ProjectAgentsView:
      description: A project's agents as a person reads them.
      type: object
      required: [version, enable, available, offers, homes, default_resolved]
      properties:
        version:
          description: The project's version, which a change names.
          type: integer
        enable:
          type: array
          maxItems: 64
          items: {type: string}
        allow:
          type: array
          maxItems: 64
          items: {type: string}
        default: {type: string}
        available: {$ref: "#/components/schemas/AgentAvailability"}
        offers:
          description: Each available agent and where it comes from, `*` first when every platform agent is.
          type: array
          items: {$ref: "#/components/schemas/AgentOffer"}
        homes:
          description: The agents that live here.
          type: array
          items: {type: string}
        default_resolved:
          description: Who answers an untagged message here, or null when nothing does.
          oneOf:
            - {$ref: "#/components/schemas/DefaultResolved"}
            - {type: "null"}
    ProjectAgentsInput:
      description: What a project turns on, as a whole. A list left out is cleared.
      type: object
      required: [version]
      properties:
        version:
          description: The version the caller read.
          type: integer
        enable:
          type: array
          maxItems: 64
          items: {type: string}
        allow:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string}
        default: {type: string}
    AgentPlace:
      description: Where an agent lives and which projects enable it.
      type: object
      required: [enabled_in]
      properties:
        home:
          description: The project it lives in. Absent for a platform agent.
          type: string
        enabled_in:
          description: The projects whose enable list names it, or holds `*` for a platform agent. `~` is the workspace.
          type: array
          items: {type: string}
    AgentHome:
      description: Where an agent now lives.
      allOf:
        - type: object
          required: [agent]
          properties:
            agent: {type: string}
        - {$ref: "#/components/schemas/AgentPlace"}
    Person:
      description: |
        One person in the directory. No email address is shown: a subject
        that holds one, as a Tailscale login does, is left out.
      type: object
      required: [handle, roles, picture]
      properties:
        subject:
          description: |
            Who they are to the identity provider, which member entries and
            grants name. Absent when it holds an email address.
          type: string
        name:
          description: The name they chose for themselves, or signed in with. Absent until one is known.
          type: string
        handle:
          description: How they are tagged, unique in the workspace across people and agents.
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,31}$"
        roles:
          description: The workspace roles they held when last seen.
          type: array
          items: {type: string}
        picture:
          description: Where their own photo is served, or null without one.
          type: [string, "null"]
        seen_at:
          description: When they last signed in. Absent for someone who never has.
          type: string
          format: date-time
    Settings:
      description: |
        Workspace settings. The workspace default agent, which answers a
        message that tags none, is the root's `default`
        (`GET /api/projects/~/agents`).
      type: object
      required: [history, history_limit, title_agent, memory_agent, memory_auto_approve, workspace_name, model_policies]
      properties:
        history:
          description: Whether an agent is sent the conversation so far.
          type: string
          enum: [recent, none]
        history_limit: {type: integer}
        title_agent: {type: string}
        memory_agent: {type: string}
        memory_auto_approve: {type: boolean}
        workspace_name: {type: string}
        model_policies:
          description: |
            Named, ordered lists of models with the errors that move a call from
            one to the next. An agent runs on one by naming the provider
            `policy` and the policy's name as its model; the policy is read as
            it stands when each call starts. A policy an agent still runs on
            cannot be removed (409).
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/ModelPolicy"}
        setup_at:
          description: Set once by the server when an admin first saves settings.
          type: string
          format: date-time
        setup_by: {type: string}
    Theme:
      type: string
      enum: [system, light, dark]
    Preferences:
      description: A person's own settings.
      type: object
      required: [display_name, theme, accent, has_photo, photo_version, pinned]
      properties:
        display_name: {type: string}
        theme: {$ref: "#/components/schemas/Theme"}
        accent: {type: string}
        has_photo: {type: boolean}
        photo_version: {type: integer}
        onboarded_at:
          description: When the person finished or skipped the first-run questions.
          type: string
          format: date-time
        pinned:
          description: Conversations kept at the top of the person's sidebar, most recently pinned first.
          type: array
          items: {type: string}

    Schedule:
      description: A cron schedule as a caller writes it.
      type: object
      required: [name, expression, agent, text]
      properties:
        name: {type: string}
        expression:
          description: A cron expression.
          type: string
        agent: {type: string}
        text: {type: string}
        project:
          description: Files every run the schedule raises under a project.
          type: string
        description:
          description: What the schedule is for, at most 500 characters. The agent is not shown it.
          type: string
          maxLength: 500
    ScheduleView:
      description: A schedule with whether it is running, when it fires next, and how its recent occurrences went.
      type: object
      required: [name, expression, agent, text, paused, next, recent]
      properties:
        name: {type: string}
        expression: {type: string}
        agent: {type: string}
        text: {type: string}
        project: {type: string}
        description: {type: string}
        paused: {type: boolean}
        created_by: {type: string}
        updated_by:
          description: Who last changed the schedule. Absent until it is changed.
          type: string
        updated_at: {type: string, format: date-time}
        next:
          description: The next three fires. Empty while paused.
          type: array
          items: {type: string, format: date-time}
        recent:
          description: Up to 20 recent runs.
          type: array
          items: {$ref: "#/components/schemas/Run"}

    InboxKind:
      description: |
        What a message is about. `approval` and `clarification` are questions
        a run is waiting on. `result` is the answer of a run nobody was
        waiting on, and `artifact` a file that was published or revised.
        `mention` is a message in a shared thread that tags the reader.
      type: string
      enum: [alert, failure, memory, budget, approval, clarification, result, artifact, mention]
    InboxState:
      type: string
      enum: [open, resolved, dismissed, snoozed]
    InboxSeverity:
      type: string
      enum: [info, warning, critical]
    InboxNotice:
      description: Says that an inbox message changed, and nothing about what is in it.
      type: object
      required: [id, kind, state, updated_at]
      properties:
        id: {type: string}
        kind: {$ref: "#/components/schemas/InboxKind"}
        state: {$ref: "#/components/schemas/InboxState"}
        updated_at: {type: string, format: date-time}
    InboxFrom:
      type: object
      required: [kind, name]
      properties:
        kind:
          description: What sent the message, such as `agent`, `rule` or `system`.
          type: string
        name: {type: string}
    CallPolicyInput:
      description: Which agents may call an agent, and which of those calls a person approves.
      type: object
      additionalProperties: false
      required: [callers, approval]
      properties:
        callers:
          description: "`anyone` its spec allows, only the `listed` agents in `allow`, or `none`."
          type: string
          enum: [anyone, listed, none]
        allow:
          description: The callers admitted when `callers` is `listed`.
          type: array
          maxItems: 100
          items: {type: string}
        approval:
          description: "`never`, `always`, or for every caller not in `trusted` when `unlisted`."
          type: string
          enum: [never, always, unlisted]
        trusted:
          description: Callers whose calls skip approval when `approval` is `unlisted`.
          type: array
          maxItems: 100
          items: {type: string}
        approvers:
          description: |
            Who may approve a held call: subjects, and this workspace's roles
            as `role:<name>`, at most 32. Empty means `role:manager` and
            `role:admin`, so a held call is never open to the whole workspace.
          type: array
          maxItems: 32
          items: {type: string}
        self_approval:
          description: Lets the person whose request led to a call approve it.
          type: boolean
        expires_seconds:
          description: How long a held call waits before it is denied. 0 means a day.
          type: integer
          minimum: 0
          maximum: 604800
    CallPolicy:
      description: An agent's call policy. Version 0 is the default of an agent with none stored.
      type: object
      required: [agent, callers, allow, approval, trusted, approvers, self_approval, expires_seconds, version]
      properties:
        agent: {type: string}
        callers: {type: string, enum: [anyone, listed, none]}
        allow:
          type: array
          items: {type: string}
        approval: {type: string, enum: [never, always, unlisted]}
        trusted:
          type: array
          items: {type: string}
        approvers:
          type: array
          items: {type: string}
        self_approval: {type: boolean}
        expires_seconds: {type: integer}
        version: {type: integer}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    Reach:
      description: Whether one agent may call another.
      type: object
      required: [agent, admits, in_spawn, approval, reason]
      properties:
        agent: {type: string}
        admits:
          description: The callee's call policy accepts calls from the caller.
          type: boolean
        in_spawn:
          description: The caller's spec lists the callee in its spawn allowlist.
          type: boolean
        approval:
          description: Whether a call waits for a person.
          type: string
          enum: [never, required]
        reason: {type: string}
    InboxSource:
      description: What the message is about, as ids a reader can follow.
      type: object
      properties:
        alert: {type: string}
        rule: {type: string}
        run: {type: string}
        thread: {type: string}
        agent: {type: string}
        project: {type: string}
        target:
          description: The agent a question's tool call would call, when it calls one.
          type: string
    InboxOutcome:
      type: object
      required: [action, by, at]
      properties:
        action: {type: string}
        by: {type: string}
        at: {type: string, format: date-time}
        note: {type: string}
    InboxLimits:
      description: New numbers for a limit. Zero or absent leaves a limit as it is.
      type: object
      properties:
        max_runs: {type: integer}
        max_concurrent: {type: integer}
        spend_limit: {type: integer, format: int64}
        max_tokens: {type: integer, format: int64}
    InboxAlertPart:
      type: object
      required: [id, rule, kind, severity, title]
      properties:
        id: {type: string}
        rule: {type: string}
        kind: {type: string}
        severity: {type: string}
        title: {type: string}
        body: {type: string}
    InboxFailurePart:
      type: object
      required: [run, agent, error, retryable]
      properties:
        run: {type: string}
        agent: {type: string}
        error: {type: string}
        retryable:
          description: Only a turn a person asked can be started again.
          type: boolean
    InboxNoteRef:
      type: object
      required: [id, text]
      properties:
        id: {type: string}
        text: {type: string}
    InboxMemoryPart:
      type: object
      required: [owner, notes]
      properties:
        owner:
          description: |
            Who would remember them, as the memory store names it: an
            agent's name, or `project:<name>` for a project's notes, with
            `project:` alone for the workspace's own.
          type: string
        agent: {type: string}
        project: {type: string}
        notes:
          type: array
          items: {$ref: "#/components/schemas/InboxNoteRef"}
    InboxBudgetPart:
      type: object
      required: [scope_kind, limit, period, version, used, refused, max, current]
      properties:
        scope_kind: {type: string}
        scope_name: {type: string}
        limit: {type: string}
        period: {type: string}
        version: {type: integer}
        used: {type: integer, format: int64}
        refused: {type: boolean}
        max: {type: integer, format: int64}
        current: {$ref: "#/components/schemas/InboxLimits"}
    InboxArtifactPart:
      description: One published version of a file. Open it from the artifacts routes by `id`.
      type: object
      required: [id, title, kind, size, version]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {type: string}
        mime: {type: string}
        size: {type: integer, format: int64}
        version: {type: integer}
        description: {type: string}
        previous:
          description: The id of the version this one replaces, when it is not the first.
          type: string
    InboxQuestionTool:
      type: object
      required: [name]
      properties:
        name: {type: string}
        call_id:
          description: The model's id for the call.
          type: string
        arguments:
          description: What the model asked to call the tool with, as a JSON object.
          type: object
        schema:
          description: The tool's parameter schema. Edited arguments must satisfy it.
          type: object
    InboxQuestionPart:
      description: A question a run is parked on.
      type: object
      required: [run, id, kind, prompt]
      properties:
        run: {type: string}
        id: {type: string}
        kind:
          type: string
          enum: [approval, choice, reply]
        agent: {type: string}
        prompt: {type: string}
        options:
          type: array
          items: {type: string}
        tool: {$ref: "#/components/schemas/InboxQuestionTool"}
        asked_of:
          description: Who the agent asked, as a hint. It admits nobody.
          type: string
        expires_at:
          description: When the question takes its default if nobody answers.
          type: string
          format: date-time
        default:
          description: What the run carries on with if it expires. `deny` for an approval; empty when the agent is told nobody answered.
          type: string
        asked_at: {type: string, format: date-time}
        via:
          description: The run whose stream showed the question, when that is a run waiting on the one that asked.
          type: string
        approvers:
          description: |
            Who may answer this one approval, in place of the agent spec's:
            the callee's call policy's approvers, for a call to an agent.
          type: array
          items: {type: string}
        self_approval:
          description: Goes with `approvers`.
          type: boolean
    InboxPart:
      description: |
        One typed part of a message. `type` says which of `text`, `alert`,
        `failure`, `memory`, `budget`, `artifact`, `mention` or `question`
        carries the body: `approval`, `choice` and `reply` parts carry
        `question`. A settled question's `outcome` is `approve`, `deny`,
        `choose` (the option in `note`), `reply` (the words in `note`),
        `expired`, `stopped` or `closed`.
      type: object
      required: [id, type, state, actions]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [text, alert, failure, memory, budget, artifact, approval, choice, reply, mention]
        state:
          type: string
          enum: [open, resolved, info]
        actions:
          description: What this caller may do with the part now. Empty once it is resolved, or when the caller has no permission for any action.
          type: array
          items:
            type: string
            enum: [acknowledge, retry, keep, discard, raise_limit, approve, deny, choose, reply, done]
        outcome: {$ref: "#/components/schemas/InboxOutcome"}
        text: {type: string}
        alert: {$ref: "#/components/schemas/InboxAlertPart"}
        failure: {$ref: "#/components/schemas/InboxFailurePart"}
        memory: {$ref: "#/components/schemas/InboxMemoryPart"}
        budget: {$ref: "#/components/schemas/InboxBudgetPart"}
        artifact: {$ref: "#/components/schemas/InboxArtifactPart"}
        question: {$ref: "#/components/schemas/InboxQuestionPart"}
        mention: {$ref: "#/components/schemas/InboxMentionPart"}
    InboxMentionPart:
      description: A message in a shared thread that tags the reader. `reply` posts the resolution's `text` in the thread as the reader, which starts no run; `done` sets it aside. The console and the Slack app offer Reply, and set a mention aside by dismissing its message; `done` is the API's.
      type: object
      required: [thread, message, project, channel, by, excerpt]
      properties:
        thread: {type: string}
        message:
          description: The message's id within the thread, such as `m-3`.
          type: string
        project:
          description: The thread's project. Empty is the workspace itself.
          type: string
        channel: {type: string}
        by:
          description: The handle of the person who posted it. A subject is never given, since one can hold an address.
          type: string
        excerpt:
          description: The start of what they wrote.
          type: string
          maxLength: 300
    InboxMessage:
      description: One message in the inbox.
      type: object
      required: [id, kind, subject, from, at, updated_at, severity, state, unread, source, parts]
      properties:
        id: {type: string}
        to: {type: string}
        kind: {$ref: "#/components/schemas/InboxKind"}
        subject: {type: string}
        from: {$ref: "#/components/schemas/InboxFrom"}
        at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        severity: {$ref: "#/components/schemas/InboxSeverity"}
        state: {$ref: "#/components/schemas/InboxState"}
        snoozed_until: {type: string, format: date-time}
        unread:
          description: Whether this caller has read it. Read state is per person.
          type: boolean
        source: {$ref: "#/components/schemas/InboxSource"}
        parts:
          type: array
          items: {$ref: "#/components/schemas/InboxPart"}
    InboxChange:
      description: One thing that happened to a message.
      type: object
      required: [message, at, what]
      properties:
        message: {type: string}
        at: {type: string, format: date-time}
        by: {type: string}
        what:
          type: string
          enum: [raised, read, unread, resolved, dismissed, snoozed, withdrawn]
        part: {type: string}
        action: {type: string}
        note: {type: string}
        until: {type: string, format: date-time}
    Resolution:
      description: What a person decided about a part.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [acknowledge, retry, keep, discard, raise_limit, approve, deny, choose, reply, done]
        ids:
          description: The proposed notes to keep, with `keep`.
          type: array
          items: {type: string}
        note:
          description: At most 500 characters. On a denial the model is shown it.
          type: string
          maxLength: 500
        limits: {$ref: "#/components/schemas/InboxLimits"}
        arguments:
          description: Edited arguments for `approve`, as a JSON object that satisfies the tool's schema. Left out keeps the model's.
          type: object
        choice:
          description: The option chosen, with `choose`.
          type: string
          maxLength: 4000
        text:
          description: The reply, with `reply`. A reply part also takes its words as `note`.
          type: string
          maxLength: 4000
        act_as: {$ref: "#/components/schemas/ActAs"}
    QuestionAnswer:
      description: An answer to the question a run is waiting on.
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, deny, choose, reply]
        arguments:
          description: Edited arguments for `approve`, as a JSON object that satisfies the tool's schema.
          type: object
        choice:
          type: string
          maxLength: 4000
        text:
          type: string
          maxLength: 4000
        note:
          description: At most 500 characters. On a denial the model is shown it.
          type: string
          maxLength: 500
        act_as: {$ref: "#/components/schemas/ActAs"}

    ArtifactKind:
      type: string
      enum: [document, spreadsheet, presentation, image, pdf, html, code, data, archive]
    Artifact:
      description: The record of one published file. Its bytes are served by `getArtifactContent`.
      type: object
      required: [id, title, kind, mime, size, sha256, version, run, thread, agent, created_by, created_at]
      properties:
        id: {type: string}
        title: {type: string}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        mime:
          description: The type the server sniffed from the bytes.
          type: string
        size: {type: integer, format: int64}
        sha256: {type: string}
        version:
          description: Publishing a title again in the same conversation makes the next version.
          type: integer
        run: {type: string}
        thread: {type: string}
        agent: {type: string}
        project: {type: string}
        description: {type: string}
        preview:
          description: The start of a text file.
          type: string
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    StorageShare:
      type: object
      required: [name, bytes, count]
      properties:
        name: {type: string}
        bytes: {type: integer, format: int64}
        count: {type: integer}
    StorageUsage:
      description: What the workspace has published, against what it is allowed.
      type: object
      required: [used_bytes, count, limit_bytes, by_project, by_agent]
      properties:
        used_bytes: {type: integer, format: int64}
        count: {type: integer}
        limit_bytes:
          description: The workspace's storage limit, or null when it has none.
          type: [integer, "null"]
          format: int64
        by_project:
          type: array
          items: {$ref: "#/components/schemas/StorageShare"}
        by_agent:
          type: array
          items: {$ref: "#/components/schemas/StorageShare"}

    AnalyticsGroup:
      type: object
      required: [name, runs, completed, failed, stopped, active, p50_ms, p95_ms, usage]
      properties:
        name: {type: string}
        runs: {type: integer}
        completed: {type: integer}
        failed: {type: integer}
        stopped:
          description: Runs that were stopped. They are neither completed, failed nor active.
          type: integer
        active: {type: integer}
        p50_ms: {type: integer, format: int64}
        p95_ms: {type: integer, format: int64}
        usage: {$ref: "#/components/schemas/AnalyticsUsage"}
    AnalyticsUsage:
      description: |
        What the runs' own model calls used. Each run counts only its own
        calls, so a tree of runs is not counted twice.
      type: object
      required: [model_calls, tokens, spend, unpriced_calls, other_currency_runs]
      properties:
        model_calls: {type: integer}
        tokens:
          description: Prompt and completion tokens.
          type: integer
          format: int64
        spend:
          description: Micro-USD priced in US dollars. A lower bound when `unpriced_calls` or `other_currency_runs` is not zero.
          type: integer
          format: int64
        unpriced_calls:
          description: Calls with no price.
          type: integer
        other_currency_runs:
          description: Runs with costs in a currency other than US dollars, which are not added to `spend`.
          type: integer
    AnalyticsBucket:
      type: object
      required: [start, completed, failed, stopped, active]
      properties:
        start: {type: string, format: date-time}
        completed: {type: integer}
        failed: {type: integer}
        stopped: {type: integer}
        active: {type: integer}
    Summary:
      description: Run statistics over a window.
      type: object
      required: [since, until, bucket_ns, total, buckets, by_agent, by_origin, slowest, delegated]
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        bucket_ns:
          description: The width of one bucket, in nanoseconds.
          type: integer
          format: int64
        total: {$ref: "#/components/schemas/AnalyticsGroup"}
        buckets:
          type: array
          items: {$ref: "#/components/schemas/AnalyticsBucket"}
        by_agent:
          type: array
          items: {$ref: "#/components/schemas/AnalyticsGroup"}
        by_origin:
          type: array
          items: {$ref: "#/components/schemas/AnalyticsGroup"}
        slowest:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/Run"}
        delegated: {type: integer}
    JournalEntry:
      description: One event, summarized in a line.
      type: object
      required: [seq, run_id, agent, rev, origin, kind, at]
      properties:
        seq: {type: integer, format: int64}
        run_id: {type: string}
        agent: {type: string}
        rev: {type: integer}
        origin: {type: string}
        kind: {$ref: "#/components/schemas/EventKind"}
        at: {type: string, format: date-time}
        detail: {type: string}
    Span:
      description: One stretch of a run's time, rebuilt from the journal.
      type: object
      required: [run_id, agent, kind, name, start]
      properties:
        run_id: {type: string}
        agent: {type: string}
        kind: {type: string, enum: [run, attempt, tool, output, parked]}
        name: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        error: {type: string}

    AlertKind:
      type: string
      description: |
        `budget` is raised by a billing policy, never by a rule, and a rule
        cannot be created with it.
      enum: [run_failed, failure_rate, slow_run, eval_below, spend, budget]
    AlertSeverity:
      type: string
      enum: [warning, critical]
    AlertRule:
      description: |
        A condition on runs that raises an alert. Every field but `name`,
        `kind` and `severity` is optional, and leaving one out keeps the
        behaviour rules had before it existed: every agent and project,
        enabled, no cooldown, and a message for everyone who may read alerts.
      type: object
      required: [name, kind, severity]
      properties:
        name: {type: string}
        kind: {$ref: "#/components/schemas/AlertKind"}
        description:
          description: What the rule is for, at most 500 characters.
          type: string
          maxLength: 500
        agent:
          description: Only this agent's runs. Empty means every agent.
          type: string
        project:
          description: |
            Only runs filed under this project. Empty means every run, in a
            project or not. With `agent`, both must match. An `eval_below`
            rule cannot name a project.
          type: string
        severity: {$ref: "#/components/schemas/AlertSeverity"}
        threshold:
          description: A percentage for `failure_rate` and `eval_below`, seconds for `slow_run`. Not used by `spend`.
          type: number
        threshold_micros:
          description: For `spend` only, and required by it. The cost, in micro-USD, of the runs in scope over the window at which the rule fires.
          type: integer
          format: int64
          minimum: 1
        window_seconds:
          description: How far back `failure_rate` and `spend` look, up to 30 days.
          type: integer
          minimum: 1
          maximum: 2592000
        min_runs: {type: integer}
        cooldown_seconds:
          description: |
            After the rule raises an alert it raises no other for this long,
            acknowledged or not, up to 30 days. Zero or absent means no
            cooldown. `failure_rate` and `spend` also stay quiet while their
            last alert is open.
          type: integer
          minimum: 0
          maximum: 2592000
        paused:
          description: A paused rule is not evaluated. Absent or false means the rule is enabled.
          type: boolean
        notify:
          description: |
            Who the inbox message about an alert is for: people by subject, as
            agent approvers are written, and roles as `role:<name>`. A reader
            sees the message if their subject is listed or they hold a role
            listed. Empty or absent means everyone who may read alerts. Either
            way only people with `alerts:read` see it, and `GET /api/alerts`
            lists every alert to them. At most 20 entries.
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 254}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_by:
          description: Who last replaced the rule. Absent until it is replaced.
          type: string
        updated_at: {type: string, format: date-time}
    Alert:
      type: object
      required: [id, rule, kind, severity, title, at]
      properties:
        id: {type: string}
        rule: {type: string}
        kind: {$ref: "#/components/schemas/AlertKind"}
        severity: {$ref: "#/components/schemas/AlertSeverity"}
        agent: {type: string}
        project:
          description: The project of the run that raised the alert, if any.
          type: string
        run_id: {type: string}
        suite: {type: string}
        title: {type: string}
        body: {type: string}
        at: {type: string, format: date-time}
        acked_by: {type: string}
        acked_at: {type: string, format: date-time}

    EvalTarget:
      type: string
      enum: [agent, knowledge]
    EvalCheck:
      description: A deterministic check on an agent's output.
      type: object
      required: [kind, value]
      properties:
        kind: {type: string, enum: [contains, not_contains, matches, equals, within_ms]}
        value: {type: string}
    EvalCase:
      type: object
      required: [id, input]
      properties:
        id: {type: string}
        input: {type: string}
        checks:
          type: array
          items: {$ref: "#/components/schemas/EvalCheck"}
        expect:
          description: For a knowledge suite, the titles a search should return.
          type: array
          items: {type: string}
    EvalSuite:
      type: object
      required: [name, target, subject, cases]
      properties:
        name: {type: string}
        description: {type: string}
        target: {$ref: "#/components/schemas/EvalTarget"}
        subject:
          description: The agent or knowledge source the suite tests.
          type: string
        cases:
          type: array
          items: {$ref: "#/components/schemas/EvalCase"}
        k: {type: integer}
        pass_rate: {type: number}
        created_by:
          description: Set by the server.
          type: string
        updated_at:
          description: Set by the server.
          type: string
          format: date-time
    EvalVerdict:
      type: object
      required: [check, passed]
      properties:
        check: {type: string}
        passed: {type: boolean}
        reason: {type: string}
    EvalHit:
      type: object
      required: [title, score, expected]
      properties:
        title: {type: string}
        score: {type: number}
        expected: {type: boolean}
    EvalResult:
      type: object
      required: [case_id, input, passed, duration_ms]
      properties:
        case_id: {type: string}
        input: {type: string}
        passed: {type: boolean}
        output: {type: string}
        verdicts:
          type: array
          items: {$ref: "#/components/schemas/EvalVerdict"}
        hits:
          type: array
          items: {$ref: "#/components/schemas/EvalHit"}
        rank: {type: integer}
        run_id: {type: string}
        duration_ms: {type: integer, format: int64}
        error: {type: string}
    EvalRun:
      type: object
      required: [id, suite, target, subject, status, passed, total, pass_rate, threshold, results, started_at]
      properties:
        id: {type: string}
        suite: {type: string}
        target: {$ref: "#/components/schemas/EvalTarget"}
        subject: {type: string}
        rev: {type: integer}
        status: {type: string, enum: [running, passed, failed, errored]}
        passed: {type: integer}
        total: {type: integer}
        pass_rate: {type: number}
        threshold: {type: number}
        metrics:
          type: object
          additionalProperties: {type: number}
        results:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/EvalResult"}
        error: {type: string}
        started_by: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
    EvalSuiteView:
      description: A suite with its most recent runs, newest first.
      allOf:
        - $ref: "#/components/schemas/EvalSuite"
        - type: object
          required: [runs]
          properties:
            runs:
              type: array
              items: {$ref: "#/components/schemas/EvalRun"}

    KnowledgeVariant:
      description: A saved view of a source, which leaves some documents out.
      type: object
      required: [name, excluded]
      properties:
        name: {type: string}
        excluded:
          type: array
          items: {type: string}
    KnowledgeSource:
      type: object
      required: [name, documents, passages, excluded, variants, updated_at]
      properties:
        name: {type: string}
        description: {type: string}
        documents: {type: integer}
        passages: {type: integer}
        excluded:
          description: Documents held but left out of search.
          type: integer
        variants:
          type: array
          items: {$ref: "#/components/schemas/KnowledgeVariant"}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
    KnowledgeDocument:
      type: object
      required: [id, title, bytes, passages, excluded, added_at]
      properties:
        id: {type: string}
        title: {type: string}
        uri: {type: string}
        bytes: {type: integer}
        passages: {type: integer}
        excluded: {type: boolean}
        added_by: {type: string}
        added_at: {type: string, format: date-time}
    KnowledgeHit:
      type: object
      required: [source, document_id, title, index, text, score]
      properties:
        source: {type: string}
        document_id: {type: string}
        title: {type: string}
        uri: {type: string}
        index: {type: integer}
        text: {type: string}
        score: {type: number}

    PolicyScopeKind:
      type: string
      enum: [tenant, project, agent, client]
    PolicyPeriod:
      type: string
      enum: [day, month]
    PolicyAction:
      description: What happens at a limit. Only `block` is acted on today.
      type: string
      enum: [block, approve]
    PolicyLimit:
      type: string
      enum: [runs, concurrent, spend, lease, tokens]
    PolicyScope:
      type: object
      required: [kind]
      properties:
        kind: {$ref: "#/components/schemas/PolicyScopeKind"}
        name:
          description: The project, agent or client. Absent for the tenant scope.
          type: string
    PolicyInput:
      description: The limits for one scope, as a caller writes them. Zero or absent sets no limit.
      type: object
      required: [scope]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        period: {$ref: "#/components/schemas/PolicyPeriod"}
        max_runs: {type: integer}
        max_concurrent: {type: integer}
        spend_limit:
          description: |
            Micro-USD a period, enforced: a new run is refused once the scope
            has reached it, and a run in flight is stopped when a call takes
            the scope to it. Only money priced in US dollars counts.
          type: integer
          format: int64
        max_lease: {type: integer, format: int64}
        max_tokens:
          description: |
            Model tokens (prompt and completion) a period, enforced like
            `spend_limit`. It counts every call, priced or not, so it bounds
            what a spend limit cannot see.
          type: integer
          format: int64
        max_storage:
          description: Bytes.
          type: integer
          format: int64
        max_clients: {type: integer}
        max_clients_per_surface: {type: integer}
        warn_at:
          description: The percentage of a limit at which a warning is raised. Defaults to 80.
          type: integer
        action:
          description: Defaults to `block`.
          $ref: "#/components/schemas/PolicyAction"
    Policy:
      description: The limits for one scope, at one version.
      type: object
      required: [scope, period, action, version, updated_at]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        period: {$ref: "#/components/schemas/PolicyPeriod"}
        max_runs: {type: integer}
        max_concurrent: {type: integer}
        spend_limit: {type: integer, format: int64}
        max_lease: {type: integer, format: int64}
        max_tokens: {type: integer, format: int64}
        max_storage: {type: integer, format: int64}
        max_clients: {type: integer}
        max_clients_per_surface: {type: integer}
        warn_at: {type: integer}
        action: {$ref: "#/components/schemas/PolicyAction"}
        version: {type: integer}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    PolicyChange:
      type: object
      required: [scope, by, at]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        by: {type: string}
        at: {type: string, format: date-time}
        before: {$ref: "#/components/schemas/Policy"}
        after: {$ref: "#/components/schemas/Policy"}
    Measure:
      description: One limit and what has been used against it. A limit of zero means the scope sets none.
      type: object
      required: [used, limit]
      properties:
        used: {type: integer, format: int64}
        limit: {type: integer, format: int64}
        projected:
          description: Where `used` ends the period at the pace so far. Absent for a count that does not accumulate.
          type: integer
          format: int64
    SpendMeasure:
      description: |
        Spend against its limit, in micro-USD, enforced. `used` counts only
        what was priced in US dollars, so it is a lower bound whenever
        `unpriced_calls` is not zero or `other_costs` is not empty.
      type: object
      required: [used, limit, metered, unpriced_calls]
      properties:
        used: {type: integer, format: int64}
        limit: {type: integer, format: int64}
        projected: {type: integer, format: int64}
        metered:
          description: True. The runtime prices model calls from saige's catalog.
          type: boolean
        unpriced_calls:
          description: Calls in the period with no price. Their spend is unknown, not zero.
          type: integer
        other_costs:
          description: Money in other currencies, one entry per currency, never converted and never held against the limit.
          type: array
          items: {$ref: "#/components/schemas/PolicyCost"}
    PolicyCost:
      description: An amount in one currency, in millionths of it.
      type: object
      required: [micros, currency]
      properties:
        micros: {type: integer, format: int64}
        currency: {type: string}
    ScopeUsage:
      description: One policy and where its scope stands against it.
      type: object
      required: [scope, period, period_start, period_end, version, warn_at, action, runs, concurrent, spend, tokens, max_lease, state]
      properties:
        scope: {$ref: "#/components/schemas/PolicyScope"}
        period: {$ref: "#/components/schemas/PolicyPeriod"}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        version: {type: integer}
        warn_at: {type: integer}
        action: {$ref: "#/components/schemas/PolicyAction"}
        runs: {$ref: "#/components/schemas/Measure"}
        concurrent: {$ref: "#/components/schemas/Measure"}
        spend: {$ref: "#/components/schemas/SpendMeasure"}
        tokens: {$ref: "#/components/schemas/Measure"}
        max_lease: {type: integer, format: int64}
        state:
          description: The worst of the enforced limits, spend and tokens included.
          type: string
          enum: [ok, warn, over]
    UsageEntry:
      description: One line of the usage ledger.
      type: object
      required: [kind, tenant, agent, at]
      properties:
        kind:
          description: |
            `halted` is a run in flight stopped at a limit. `spent` (one model
            call) and `settled` (a run's own total at its end) are the ledger's
            record of spend and are not listed as notices.
          type: string
          enum: [admitted, ended, warned, refused, spent, settled, halted]
        tenant: {type: string}
        project: {type: string}
        within:
          description: The run's project's ancestors, nearest first and the workspace left out. The entry counts toward each of them too. Entries from before the tree have none.
          type: array
          maxItems: 3
          items: {type: string}
        agent: {type: string}
        client: {type: string}
        run_id: {type: string}
        at:
          description: When the entry was appended, by the server's clock. It decides the period the entry counts in.
          type: string
          format: date-time
        event_at:
          description: For a `spent` entry, when the runtime said the call happened. It counts nothing.
          type: string
          format: date-time
        scope: {$ref: "#/components/schemas/PolicyScope"}
        version: {type: integer}
        limit: {$ref: "#/components/schemas/PolicyLimit"}
        reason: {type: string}
        key:
          description: What makes a `spent` or `settled` entry count once.
          type: string
        spend: {$ref: "#/components/schemas/UsageSpend"}
    UsageSpend:
      description: What some model calls used. `micros` is US dollars only.
      type: object
      properties:
        micros: {type: integer, format: int64}
        model_calls: {type: integer}
        tokens: {type: integer, format: int64}
        unpriced_calls: {type: integer}
        other_costs:
          type: array
          items: {$ref: "#/components/schemas/PolicyCost"}

    ClientSurface:
      type: string
      enum: [slack, github]
    ClientIdentity:
      description: How a webhook says which client it is for.
      type: object
      properties:
        app_id: {type: string}
        team: {type: string}
        installation: {type: string}
        owners:
          type: array
          items: {type: string}
    SecretRef:
      description: Where one of a client's secrets is. The secret itself is never sent.
      type: object
      required: [set]
      properties:
        set: {type: boolean}
        ref:
          description: "`env:NAME` when the secret lives in the server's environment."
          type: string
    SecretInput:
      description: A secret as a caller writes it, as a value or as an `env:WARP_*` reference. Leave both out to keep the one held.
      type: object
      properties:
        value: {type: string}
        ref: {type: string}
    SlackCommand:
      type: object
      required: [name, description]
      properties:
        name: {type: string}
        description: {type: string}
        argument_hint: {type: string}
    SlackOptions:
      type: object
      properties:
        sessions: {type: boolean}
        commands:
          type: array
          items: {$ref: "#/components/schemas/SlackCommand"}
        machine:
          description: The subject of the credential a Slack app signs in to the API with. Only it may act for `people`.
          type: string
        people:
          description: |
            Slack user ids in the client's team, each mapped to the principal it
            is in this workspace, by subject. An answer clicked in Slack by a
            person it maps is that principal's answer; anyone else is refused.
          type: object
          additionalProperties: {type: string}
    GitHubOptions:
      type: object
      properties:
        auto_labels:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        checks: {type: boolean}
        guides: {type: boolean}
        mutations: {type: boolean}
        read_repositories:
          type: array
          items: {type: string}
    ClientInput:
      description: A client as a caller writes it. The tenant, who manages it and its version are the server's to say.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        surface: {$ref: "#/components/schemas/ClientSurface"}
        identity: {$ref: "#/components/schemas/ClientIdentity"}
        default_agent: {type: string}
        agents:
          description: The agents it may route to besides its default. `*` alone means any.
          type: [array, "null"]
          items: {type: string}
        bots:
          type: [object, "null"]
          additionalProperties: {type: string}
        slack:
          oneOf:
            - $ref: "#/components/schemas/SlackOptions"
            - type: "null"
        github:
          oneOf:
            - $ref: "#/components/schemas/GitHubOptions"
            - type: "null"
        enabled:
          description: Defaults to true.
          type: [boolean, "null"]
        credentials:
          type: object
          properties:
            token: {$ref: "#/components/schemas/SecretInput"}
            signing_secret: {$ref: "#/components/schemas/SecretInput"}
    ClientView:
      description: A Slack app or GitHub installation the workspace answers through, and the limits on the runs it raises.
      type: object
      required: [id, name, surface, identity, credentials, enabled, version, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        surface: {$ref: "#/components/schemas/ClientSurface"}
        identity: {$ref: "#/components/schemas/ClientIdentity"}
        credentials:
          type: object
          required: [token, signing_secret]
          properties:
            token: {$ref: "#/components/schemas/SecretRef"}
            signing_secret: {$ref: "#/components/schemas/SecretRef"}
        default_agent: {type: string}
        agents:
          type: array
          items: {type: string}
        bots:
          type: object
          additionalProperties: {type: string}
        slack: {$ref: "#/components/schemas/SlackOptions"}
        github: {$ref: "#/components/schemas/GitHubOptions"}
        enabled: {type: boolean}
        managed:
          description: Set on a client the server's configuration owns, which the API cannot change.
          type: string
        version: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        limits:
          description: The client's own policy, if it has one. Set it through `putPolicy` with a `client` scope.
          $ref: "#/components/schemas/Policy"
    ClientCaps:
      type: object
      required: [max, max_per_surface]
      properties:
        max: {type: integer}
        max_per_surface: {type: integer}

    EventKind:
      description: |
        What an event is. Kinds are dotted, so a filter can select a family
        (`delta`) or one member (`delta.citation`). The set is open in the
        runtime: a reader should pass over a kind it does not know. The
        `control.*` kinds here are defined and not published today. The
        `usage.*` kinds report what model calls used: one `usage.call` per
        call as it completes, and a `usage.child` when an attached run's total
        is rolled up into its caller. A request
        addressed to a run, such as `control.stop`, is the runtime's traffic
        and never appears on this API.
      type: string
      enum:
        - delta.text
        - delta.thinking
        - delta.tool.call
        - delta.tool.done
        - delta.citation
        - lifecycle.accepted
        - lifecycle.started
        - lifecycle.parked
        - lifecycle.resumed
        - lifecycle.completed
        - lifecycle.failed
        - lifecycle.child.parked
        - lifecycle.stopped
        - action.taken
        - usage.call
        - usage.child
        - control.created
        - control.revised
        - control.deleted
    TextPayload:
      description: One fragment of the agent's answer, in order. Concatenate fragments.
      type: object
      required: [text]
      properties:
        text: {type: string}
    ThinkingPayload:
      description: One fragment of extended reasoning. Most surfaces do not show it.
      type: object
      required: [text]
      properties:
        text: {type: string}
    ToolCallPayload:
      description: The agent reaching for a tool.
      type: object
      required: [id, name, phase]
      properties:
        id:
          description: Correlates the call with its `delta.tool.done`.
          type: string
        name: {type: string}
        phase:
          description: "`requested` while the model writes the call, `executing` once it runs."
          type: string
          enum: [requested, executing]
        arguments:
          description: The call's arguments as a JSON object. Absent while the model is still writing the call, and when they were too large to carry.
          type: object
          additionalProperties: true
        arguments_bytes:
          description: The size of arguments left out for being too large, so "left out" reads apart from "none".
          type: integer
    ToolDonePayload:
      description: A tool execution finished.
      type: object
      required: [id]
      properties:
        id: {type: string}
        name: {type: string}
        result: {type: string}
        error:
          description: Set when the tool failed. `result` is then the failure text the model was shown.
          type: string
        arguments:
          description: The call's arguments as a JSON object. Absent while the model is still writing the call, and when they were too large to carry.
          type: object
          additionalProperties: true
        arguments_bytes:
          description: The size of arguments left out for being too large, so "left out" reads apart from "none".
          type: integer
    Provenance:
      description: Where a cited passage came from.
      type: object
      properties:
        document_uuid: {type: string}
        document_title: {type: string}
        source_uri: {type: string}
        section_uuid: {type: string}
        section_heading: {type: string}
        section_index: {type: integer}
    CitationPayload:
      description: One retrieved passage the turn was grounded in.
      type: object
      required: [label, text, source, index]
      properties:
        label:
          description: The inline marker, such as `[1]`.
          type: string
        text:
          description: The exact source text.
          type: string
        source: {$ref: "#/components/schemas/Provenance"}
        index: {type: integer}
    LifecyclePayload:
      description: |
        The body of every lifecycle kind. A failed attempt is reported with
        `terminal` false while the run may still be retried. The run's record
        (`getRun`) is the authority on whether it is over.
      type: object
      properties:
        attempt:
          description: The execution attempt that produced the event, from 1.
          type: integer
        rev: {type: integer}
        error:
          description: The failure message, on `lifecycle.failed`.
          type: string
        terminal:
          description: The run will not be retried. Meaningful on `lifecycle.failed`.
          type: boolean
        reason:
          description: What a parked run is waiting for.
          type: string
        text:
          description: The final answer, on `lifecycle.completed`.
          type: string
        usage:
          description: What the run used, on `lifecycle.completed`.
          $ref: "#/components/schemas/RunUsage"
        question:
          description: What the run is waiting on a person for, on `lifecycle.parked`.
          $ref: "#/components/schemas/Question"
        answer:
          description: The answer the run resumed with, on `lifecycle.resumed` after a question.
          $ref: "#/components/schemas/Answer"
    QuestionTool:
      type: object
      required: [name, call_id]
      properties:
        name: {type: string}
        call_id: {type: string}
        arguments:
          description: The arguments the model asked for, as a JSON object.
          type: object
        schema:
          description: The tool's parameter schema.
          type: object
    Question:
      description: |
        What a run is waiting on a person for: to approve a tool call, to
        choose one of `options`, or to reply. `asked_of` is a routing hint and
        admits nobody. `default` is what applies when it expires.
      type: object
      required: [id, kind, prompt]
      properties:
        id: {type: string}
        kind:
          type: string
          enum: [approval, choice, reply, delegation]
        approvers:
          description: When set on an approval, only these people and `role:<name>` holders may answer it, in place of the agent's own approvers.
          type: array
          items: {type: string}
        self_approval:
          description: With `approvers`, lets the person whose request raised the call approve it.
          type: boolean
        agent: {type: string}
        prompt: {type: string}
        options:
          type: array
          items: {type: string}
        tool: {$ref: "#/components/schemas/QuestionTool"}
        asked_of: {type: string}
        expires_at: {type: string, format: date-time}
        default: {$ref: "#/components/schemas/Answer"}
        at: {type: string, format: date-time}
        child_run_id: {type: string}
    Answer:
      description: An answer to a question, or its default when nobody answered in time (`expired`).
      type: object
      required: [question_id]
      properties:
        question_id: {type: string}
        decision:
          type: string
          enum: [approve, deny]
        arguments:
          type: object
        choice: {type: string}
        text: {type: string}
        note: {type: string}
        by:
          description: Who answered.
          type: string
        at: {type: string, format: date-time}
        expired: {type: boolean}
        run_id: {type: string}
    ChildQuestion:
      description: The body of `lifecycle.child.parked`, a question a run this one waits on asked.
      type: object
      required: [run_id, question]
      properties:
        run_id: {type: string}
        agent: {type: string}
        question: {$ref: "#/components/schemas/Question"}
    StoppedPayload:
      description: |
        The body of `lifecycle.stopped`: the run was asked to stop and wrapped
        its turn up. It is final. `text` is what the agent had said, which may
        be empty.
      type: object
      properties:
        attempt: {type: integer}
        rev: {type: integer}
        reason:
          description: Why it was stopped, in the words of whoever asked.
          type: string
        by:
          description: Who asked, such as a subject or `slack:<user id>`.
          type: string
        text:
          description: The partial answer.
          type: string
        usage:
          description: What the run used before it stopped, the call that was cut short included.
          $ref: "#/components/schemas/RunUsage"
    Cost:
      description: |
        An amount of money in integer millionths of a currency. One US dollar
        is 1,000,000 with currency `USD`. Prices come from saige's catalog
        only, and are never converted between currencies.
      type: object
      required: [micros, currency]
      properties:
        micros: {type: integer, format: int64}
        currency:
          description: An ISO 4217 code.
          type: string
        as_of:
          description: The date the rates were recorded. On a sum, the oldest; empty when any was priced from a card with no date.
          type: string
    Usage:
      description: |
        What some model calls used, summed. `cost` is in the currency of the
        first priced call and is a lower bound whenever `unpriced_calls` is not
        zero; calls priced in another currency are in `other_costs`.
      type: object
      properties:
        model_calls: {type: integer}
        requests:
          description: Billable provider requests. A call answered from saige's response cache made none.
          type: integer
        prompt_tokens:
          description: All input, cached and written to cache included.
          type: integer
        cached_prompt_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        completion_tokens: {type: integer}
        cost: {$ref: "#/components/schemas/Cost"}
        other_costs:
          type: array
          items: {$ref: "#/components/schemas/Cost"}
        unpriced_calls:
          description: Calls whose tokens are counted and that have no price.
          type: integer
    ContextUsage:
      description: How full the run's context was at its latest model call.
      type: object
      properties:
        model: {type: string}
        window:
          description: The model's input token limit from saige's catalog. Absent when the catalog declares none.
          type: integer
        tokens:
          description: The prompt that call sent, in tokens.
          type: integer
    RunUsage:
      description: |
        What a run used. `own` is its own agent's calls, `children` the attached
        runs it rolled up (each once), and `total` the two added: the figure
        held against a limit.
      type: object
      required: [own, total]
      properties:
        own: {$ref: "#/components/schemas/Usage"}
        children: {$ref: "#/components/schemas/Usage"}
        total: {$ref: "#/components/schemas/Usage"}
        context: {$ref: "#/components/schemas/ContextUsage"}
    UsageCallPayload:
      description: One model call, reported as it completes. Count it once by `accounting_id`.
      type: object
      required: [accounting_id]
      properties:
        accounting_id: {type: string}
        saige_accounting_id: {type: string}
        agent: {type: string}
        depth: {type: integer}
        model: {type: string}
        requests: {type: integer}
        prompt_tokens: {type: integer}
        cached_prompt_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        completion_tokens: {type: integer}
        response_cache_hit: {type: boolean}
        cost: {$ref: "#/components/schemas/Cost"}
        context_window: {type: integer}
    UsageChildPayload:
      description: An attached run's whole usage, rolled up into its caller once it ended.
      type: object
      required: [accounting_id, run_id, usage]
      properties:
        accounting_id: {type: string}
        run_id: {type: string}
        agent: {type: string}
        depth: {type: integer}
        usage: {$ref: "#/components/schemas/Usage"}
    ActionPayload:
      description: |
        A tool acted on something: a comment posted, a file published. When
        `name` is `publish_artifact` and there is no `error`, `data` is the
        `Artifact` that was published.
      type: object
      required: [name]
      properties:
        name: {type: string}
        target:
          description: The address URI the action was aimed at.
          type: string
        summary: {type: string}
        address:
          description: The address URI of whatever was created or changed.
          type: string
        data:
          description: The tool's structured result, passed through untouched.
        error: {type: string}
    EventBase:
      description: What every event carries, whatever its kind.
      type: object
      required: [seq, topic, run_id, tenant, agent, rev, origin, at]
      properties:
        seq:
          description: Orders events within one run. It increases and is not contiguous, so compare it, do not count on it. It is the resume cursor.
          type: integer
          format: int64
        topic:
          description: Where the event was published, always `agent:<name>:<run>`.
          type: string
        run_id: {type: string}
        tenant: {type: string}
        agent: {type: string}
        rev: {type: integer}
        origin: {type: string}
        at: {type: string, format: date-time}
    ManifestEventBase:
      type: object
      required: [seq, at]
      properties:
        seq: {type: integer, format: int64}
        at: {type: string, format: date-time}
    RunEvent:
      description: |
        One thing a run produced, as the event stream and `listRunEvents` send
        it. `kind` says which variant it is. `payload` is the kind's body as
        JSON, base64-encoded, because the server marshals a byte slice: decode
        the base64, then parse the JSON. The decoded shape for each kind is the
        schema named in `contentSchema`. A kind may carry no payload.
      oneOf:
        - $ref: "#/components/schemas/TextDeltaEvent"
        - $ref: "#/components/schemas/ThinkingDeltaEvent"
        - $ref: "#/components/schemas/ToolCallEvent"
        - $ref: "#/components/schemas/ToolDoneEvent"
        - $ref: "#/components/schemas/CitationEvent"
        - $ref: "#/components/schemas/RunAcceptedEvent"
        - $ref: "#/components/schemas/RunStartedEvent"
        - $ref: "#/components/schemas/RunParkedEvent"
        - $ref: "#/components/schemas/RunResumedEvent"
        - $ref: "#/components/schemas/RunCompletedEvent"
        - $ref: "#/components/schemas/RunFailedEvent"
        - $ref: "#/components/schemas/ChildParkedEvent"
        - $ref: "#/components/schemas/RunStoppedEvent"
        - $ref: "#/components/schemas/ActionTakenEvent"
        - $ref: "#/components/schemas/UsageCallEvent"
        - $ref: "#/components/schemas/UsageChildEvent"
        - $ref: "#/components/schemas/AgentCreatedEvent"
        - $ref: "#/components/schemas/AgentRevisedEvent"
        - $ref: "#/components/schemas/AgentDeletedEvent"
      discriminator:
        propertyName: kind
        mapping:
          delta.text: "#/components/schemas/TextDeltaEvent"
          delta.thinking: "#/components/schemas/ThinkingDeltaEvent"
          delta.tool.call: "#/components/schemas/ToolCallEvent"
          delta.tool.done: "#/components/schemas/ToolDoneEvent"
          delta.citation: "#/components/schemas/CitationEvent"
          lifecycle.accepted: "#/components/schemas/RunAcceptedEvent"
          lifecycle.started: "#/components/schemas/RunStartedEvent"
          lifecycle.parked: "#/components/schemas/RunParkedEvent"
          lifecycle.resumed: "#/components/schemas/RunResumedEvent"
          lifecycle.completed: "#/components/schemas/RunCompletedEvent"
          lifecycle.failed: "#/components/schemas/RunFailedEvent"
          lifecycle.child.parked: "#/components/schemas/ChildParkedEvent"
          lifecycle.stopped: "#/components/schemas/RunStoppedEvent"
          action.taken: "#/components/schemas/ActionTakenEvent"
          usage.call: "#/components/schemas/UsageCallEvent"
          usage.child: "#/components/schemas/UsageChildEvent"
          control.created: "#/components/schemas/AgentCreatedEvent"
          control.revised: "#/components/schemas/AgentRevisedEvent"
          control.deleted: "#/components/schemas/AgentDeletedEvent"
    TextDeltaEvent:
      description: One fragment of the answer.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.text}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/TextPayload"}
    ThinkingDeltaEvent:
      description: One fragment of reasoning.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.thinking}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ThinkingPayload"}
    ToolCallEvent:
      description: The agent reached for a tool.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.call}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ToolCallPayload"}
    ToolDoneEvent:
      description: A tool finished.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.tool.done}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/ToolDonePayload"}
    CitationEvent:
      description: A passage the turn was grounded in.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: delta.citation}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/CitationPayload"}
    RunAcceptedEvent:
      description: The run was accepted.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.accepted}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    RunStartedEvent:
      description: An attempt started.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.started}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    RunParkedEvent:
      description: The run is waiting on something.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: lifecycle.parked}
            payload:
              type: string
              contentEncoding: base64
              contentMediaType: application/json
              contentSchema: {$ref: "#/components/schemas/LifecyclePayload"}
    ChildParkedEvent:
