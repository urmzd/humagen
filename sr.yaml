git:
  tag_prefix: "v"
  floating_tag: true
  v0_protection: true

commit:
  types:
    minor: [feat]
    patch: [fix, perf, refactor]
    none: [docs, revert, chore, ci, test, build, style]

changelog:
  file: CHANGELOG.md

packages:
  - path: .
    version_files_strict: true
    version_files:
      - package.json
      - packages/components/package.json
      - packages/core/package.json
      - packages/primitives/package.json
      - packages/render-slack/package.json
      - packages/render-web/package.json
      - packages/slack-host/package.json
      - packages/web/package.json
      - apps/slack-sandbox/package.json
      - apps/storybook/package.json
    stage_files:
      - pnpm-lock.yaml
