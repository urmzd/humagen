git:
  tag_prefix: "v"
  floating_tag: true
  v0_protection: true

commit:
  types:
    minor: [feat]
    patch: [fix, perf, refactor]
    none:  [docs, revert, chore, ci, test, build, style]

changelog:
  file: CHANGELOG.md
  groups:
    - { name: breaking, content: [breaking] }
    - { name: features, content: [feat] }
    - { name: bug-fixes, content: [fix] }
    - { name: performance, content: [perf] }
    - { name: misc, content: [chore, ci, test, build, style] }

channels:
  default: stable
  branch: main
  content:
    - name: stable

packages:
  - path: .
    version_files_strict: true
    version_files:
      - package.json
      - packages/adapter/package.json
      - packages/client/package.json
      - packages/components/package.json
      - packages/core/package.json
      - packages/primitives/package.json
      - packages/render-slack/package.json
      - packages/render-web/package.json
      - packages/slack-host/package.json
      - packages/web/package.json
      - apps/slack/package.json
      - apps/slack-sandbox/package.json
      - apps/storybook/package.json
      - apps/web/package.json
      - examples/ui/basic/package.json
      - scripts/screens/package.json
    stage_files:
      - pnpm-lock.yaml
    publish:
      type: go
